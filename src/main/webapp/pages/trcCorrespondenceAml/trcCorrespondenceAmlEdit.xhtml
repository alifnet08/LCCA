					</div>

					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic2" class="control-label tl-label"><h:outputText
									value="#{msg.formTrcCorrespondenceAmlPic2}" /> </label>
							<h:inputText id="inputPic2" styleClass="form-control"
								alt="#{trcCorrespondenceAmlEditBean.trcCorrespondence.userNameTemp2}"
								title="#{trcCorrespondenceAmlEditBean.trcCorrespondence.userNameTemp2}"
								value="#{trcCorrespondenceAmlEditBean.trcCorrespondence.userNameTemp2}"
								readonly="true" />

								readonly="true" />

								pattern="#{trcCorrespondenceAmlEditBean.inputDateFormat}"

								disabled="true"></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="emailDate" class="control-label tl-label"><h:outputText

										<f:convertDateTime

											locale="#{trcCorrespondenceAmlEditBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
							</p:dataTable>

									<p:ajax event="rowSelectCheckbox" process="@this" />

										<h:inputText id="emailCc3#{statIndex}"

											styleClass="form-control" value="#{vo.emailCcTemp3}"

								</p:dataTable>

						</div>

					<h:outputText value="&#160;" />

						<div class="col-lg-12">
							<div class="form-group">
								<p:remoteCommand name="onCompleteUpload" update="evidenceList"></p:remoteCommand>
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcCorrespondenceAmlRmdPicConfirmationEvidence}" />
									<br/>
									<h:outputText style="color: #dd4b39" value="#{trcCorrespondenceAmlEditBean.textWarningUpload}"/>

									mode="advanced" auto="true" dragDropSupport="false"

									sizeLimit="#{trcCorrespondenceAmlEditBean.standardAttachmentSize}"

									rendered="#{trcCorrespondenceAmlEditBean.viewOnly eq 'N'}" />
								<p:dataList
									value="#{trcCorrespondenceAmlEditBean.uploadedFilesEvidence}"

											<td style="width: 80%"><p:commandLink
