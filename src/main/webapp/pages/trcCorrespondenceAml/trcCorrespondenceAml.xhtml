
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">
	<ui:define name="head">
		<style>
.ui-calendar input {
	display: block !important;
	width: 100% !important;
	padding: 10px 12px !important;
	background-color: #F7F8F8 !important;
	background-image: none !important;
	border-radius: 5px !important;
	box-shadow: none;
	transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s
		!important;
	border: 0 !important;
	height: inherit;
}

.ui-inputfield.ui-state-focus {
	box-shadow: none;
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcCorrespondenceAmlTitle}" />
	</ui:define>


	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{trcCorrespondenceAmlBean.tableCorrespondenceAml}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{trcCorrespondenceAmlBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;" width="100"
									headerText="#{msg.formAction}">
									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{trcCorrespondenceAmlBean.getNavigateEdit()}"
										type="submit" ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.correspondenceId}" />
									</p:commandLink>
								</p:column>

								<p:column headerText="#{msg.formTrcCorrespondenceAmlLetterNo}"
									width="300">
									<h:outputLabel value="#{vo.letterNo}" title="#{vo.letterNo}" />
								</p:column>

								<p:column headerText="#{msg.formTrcCorrespondenceAmlSenderLetter}"
									width="150">
									<h:outputLabel value="#{vo.senderName}"
										title="#{vo.senderName}" />
								</p:column>

								<p:column
									headerText="#{msg.formTrcCorrespondenceAmlLetterReceivedDate}"
									width="140">
									<h:outputText value="#{vo.letterReceivedDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceAmlBean.inputDateFormat}"
											locale="#{trcCorrespondenceAmlBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column
									headerText="#{msg.formTrcCorrespondenceAmlSubmissionConfPic}"
									width="150">
									<h:outputText value="#{vo.picName1}" title="#{vo.picName1}" />
									<br />
									<h:outputText value="#{vo.picName2}" title="#{vo.picName2}" />
									<br />
									<h:outputText value="#{vo.picName3}" title="#{vo.picName3}" />
								</p:column>

								<p:column headerText="#{msg.formTrcCorrespondenceAmlTargetDate}"
									width="140">
									<h:outputText value="#{vo.targetDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceAmlBean.inputDateFormat}"
											locale="#{trcCorrespondenceAmlBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column
									headerText="#{msg.formTrcCorrespondenceAmlFollowupStatus}"
									width="100" style="text-align:center;">

									<h:outputText styleClass="label label-warning"
										value="#{vo.followupStatusName}" />

								</p:column>

								<p:column
									headerText="#{msg.formTrcCorrespondenceAmlComplianceCheckerNote}"
									width="150">
									<h:outputText value="#{vo.complianceNote}"
										title="#{vo.complianceNote}" />
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputLabel value="#{msg.formTmpCorrespondenceConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputLabel value="#{msg.formTmpCorrespondenceDelete}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputLabel value="#{msg.formTmpCorrespondenceConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
