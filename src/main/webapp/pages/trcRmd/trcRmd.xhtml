
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcRmdTitle}" />
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<h:panelGroup id="panelSearch">
				
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpRmdReportType}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{trcRmdBean.searchReportType}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{trcRmdBean.reportTypeList}" />
							</h:selectOneMenu>
						</div>
					</div>
				
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdReportName}" /></label>
								<p:inputText styleClass="form-control"
									value="#{trcRmdBean.searchReportName}"></p:inputText>
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdTargetDate}" /></label>
								<p:calendar id="trcRmdTargetDate" autocomplete="off" maxlength="11"
										placeholder="#{msg.formTmpRmdTargetDate}" styleClass="form-control-datepicker-wrap"
										value="#{trcRmdBean.searchTargetDate}"
										pattern="#{trcRmdBean.inputDateFormat}"
										locale="#{trcRmdBean.inputDateLocale}" />
							</div>
						</div>
						
						
						<!-- <div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdStatus}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{trcRmdBean.searchStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{trcRmdBean.statusList}" />
								</h:selectOneMenu>
							</div>
						</div> -->
						
						 <div class="col-lg-12">
							<div class="col-lg-6">
								<div class="filter-tools">
									<ul class="no-margin no-padding">
										<li><p:commandButton value="#{msg.buttonSearch}"
												ajax="true"
												update="tableSearch"
												styleClass="btn btn-success tl-label"
												actionListener="#{trcRmdBean.search}"></p:commandButton></li>
										<li><p:commandButton value="#{msg.buttonReset}"
												ajax="true" 
												update="tableSearch panelSearch"
												styleClass="btn btn-default btn-flat tl-label"
												actionListener="#{trcRmdBean.reset}"></p:commandButton></li>
									</ul>
								</div>
							</div>
						</div>
					</h:panelGroup>
					
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{trcRmdBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{trcRmdBean.paging}"
								rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;" width="100"
									headerText="#{msg.formAction}">
									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{trcRmdBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.rmdPicFollowupId}" />
									</p:commandLink>
								</p:column>

								<p:column headerText="#{msg.formTmpRmdReportName}" width="250">
									<h:outputLabel value="#{vo.reportName}" title="#{vo.reportName}"/>
								</p:column>

								<p:column headerText="#{msg.formTmpRmdReportType}" width="150">
									<h:outputLabel value="#{vo.reportTypeName}" title="#{vo.reportTypeName}" />
								</p:column>
								
								<p:column headerText="#{msg.formTmpRmdTargetDate}" width="150">
									<h:outputText value="#{vo.targetDate}">
										<f:convertDateTime
											pattern="#{trcRmdBean.inputDateFormat}"
											locale="#{trcRmdBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column headerText="#{msg.formTmpRmdPic}" width="150">
									<h:outputText value="#{vo.picName1}" title="#{vo.picName1}"/> <br />
									<h:outputText value="#{vo.picName2}" title="#{vo.picName2}"/> <br />
									<h:outputText value="#{vo.picName3}" title="#{vo.picName3}"/> 
								</p:column>

								<p:column headerText="#{msg.formTmpRmdPICStatus}" width="100"
									style="text-align:center;">
									<h:outputText styleClass="label label-warning" value="#{vo.followupStatusName}"/>
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formTrcRmdConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p> <h:outputText value="#{msg.formTrcRmdDelete}" /> </p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
								<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i> 
								<h:outputText value="#{msg.formTrcRmdConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
