<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

	<f:event listener="#{trcRmdEditBean.redirectCurrentPage}" type="preRenderView" />

		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    -webkit-box-shadow: none;
			    box-shadow: none;
			}
			.form-control[disabled]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			.ui-state-disabled{
			    opacity: .50;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
    			font-family: 'Montserrat';
			}
		</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcRmdTitle}" />
	</ui:define>

								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{trcRmdEditBean.reportTypeList}" />
								<p:ajax event="change" update="form:tableDueDateDetail"
									listener="#{trcRmdEditBean.onChangeReportType}"
									onclick="onChangeReportType();" />
							</h:selectOneMenu>
							<p:remoteCommand action="#{trcRmdEditBean.onChangeReportType}"
								name="onChangeReportType" update="form"></p:remoteCommand>

					</div>

						<div class="form-group ">
							<label class="tl-label"><h:outputText

					</div>

						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpRmdReportName}" />&#160;&#160;<span
								class="label label-warning">
									<h:outputLabel value="#{msg.english}"/>

							<h:inputText styleClass="form-control" alt="#{trcRmdEditBean.trcRmd.reportNameEn}"
								title="#{trcRmdEditBean.trcRmd.reportNameEn}"
								value="#{trcRmdEditBean.trcRmd.reportNameEn}" disabled="true" />
						</div>
					</div> -->

						<div class="form-group">

												<i class="fa fa-trash"></i>

						</div>
					</div>

					<h3>
						<h:outputText value="#{msg.formTmpRmdSupportingUnit}" />

					<div class="col-lg-12">
						<div id="mp-supporting-unit">

								&nbsp;

												onclick="onAddNewTmpRmdSupportingUnit();console.log('msk add');">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowTmpRmdSupportingUnit();console.log('msk delete');">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4> -->

								<p:dataTable id="tableSupportingUnitDetail" var="vo"

									rowIndexVar="statIndex" style="width:100%;"
									selection="#{trcRmdEditBean.selectedRmdSupportingUnitData}"
									rowKey="#{vo.sequence}">
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column headerText="#{msg.formTmpRmdDivision}"
										style="width:200px;">
										<div class="form-group" style="margin-top:15px;">
											<h:selectOneMenu
												styleClass="form-control s2 divisionCc#{statIndex}"
												value="#{vo.divisionId}" disabled="true">
												<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
												<f:selectItems value="#{trcRmdEditBean.divisionList}" />
											</h:selectOneMenu>
										</div>
									</p:column>
									<p:column headerText="#{msg.formTmpRmdEmailCc1}"

										<h:inputText id="emailCc1#{statIndex}" alt="#{vo.emailCcTemp1}" title="#{vo.emailCcTemp1}"
											styleClass="form-control" value="#{vo.emailCcTemp1}"
											disabled="true" />
									</p:column>
									<p:column headerText="#{msg.formTmpRmdEmailCc2}"

										<h:inputText id="emailCc2#{statIndex}" alt="#{vo.emailCcTemp2}" title="#{vo.emailCcTemp2}"
											styleClass="form-control" value="#{vo.emailCcTemp2}"

										<h:inputText id="emailCc3#{statIndex}" alt="#{vo.emailCcTemp3}" title="#{vo.emailCcTemp3}"
											styleClass="form-control" value="#{vo.emailCcTemp3}"
											disabled="true" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>

					<h:outputText value="&#160;" />
					<h3>
						<h:outputText value="#{msg.formTmpRmdRegulation}" />

						<div id="mp-regulation">

								&nbsp;

												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowTmpRmdRegulation();console.log('msk delete');">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4> -->

								<p:dataTable id="tableRegulationDetail" var="vo"
									value="#{trcRmdEditBean.tableRmdRegulationModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{trcRmdEditBean.selectedRmdRegulationData}"
									rowKey="#{vo.sequence}">
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column headerText="#{msg.formTmpRmdRegulationTitleLink}"
										style="width:300px;">
										<h:inputText styleClass="form-control" alt="#{vo.regulationMst.nameTemp}" title="#{vo.regulationMst.nameTemp}"
											value="#{vo.regulationMst.nameTemp}" disabled="true" />
									</p:column>
									<p:column headerText="#{msg.formTmpRmdRegulationNo}"
										style="width:300px;">
										<div class="form-group" style="margin-top:15px;">
											<h:inputText styleClass="form-control" alt="#{vo.regulationMst.documentNo}" title="#{vo.regulationMst.documentNo}"

											<div class="input-group">
												<p:dataList value="#{vo.regulationMst.regulationAttachments}" 
													emptyMessage=""
													var="dtl">
													<p:commandLink title="#{dtl.fileSizeKB} KB" ajax="false" immediate="true"
														actionListener="#{trcRmdEditBean.downloadFile(dtl.fileId,dtl.attachmentFile,null)}"
														target="_blank">#{dtl.attachmentFile}</p:commandLink>
												</p:dataList>

											<p:dataList value="#{vo.regulationMst.regulationTrackRecords}"
												emptyMessage=""
												var="dtl2" >#{dtl2.trackNote}</p:dataList>
										</div>
									</p:column>
									<p:column headerText="#{msg.formTmpRmdDocumentCategory}"
										style="width:300px;">
										<div class="form-group" style="margin-top:15px;">
											<p:inputText styleClass="form-control"
												value="#{vo.regulationMst.documentCategory.documentCategory}" 
												disabled="true" />

									</p:column>

								<p:dataTable id="tableCorrespondenceDetail" var="vo"

									rowIndexVar="statIndex" style="width:100%;"
									selection="#{trcRmdEditBean.selectedRmdCorrespondenceData}"
									rowKey="#{vo.sequence}">
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column headerText="#{msg.formTmpRmdCorrespondenceLetterNo}"

												<p:dataList value="#{vo.trcCorrespondence.trcCorrespondenceDocuments}"

								title="#{trcRmdEditBean.trcRmd.note}"
								value="#{trcRmdEditBean.trcRmd.note}" disabled="true"/>

					<div class="col-lg-12">
						<div class="form-group">
							<p:remoteCommand name="onCompleteUpload" update="evidenceList"></p:remoteCommand>
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpRmdPicConfirmationEvidence}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{trcRmdEditBean.textWarningUpload}"/>
