<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formReportSocializationRekapTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="message" rendered="true" />

		<div class="box box-solid">

			<div class="box-body">
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="col-lg-4">
							<div class="form-group">
								<label><h:outputText
										value="#{msg.formReportSocializationRekapCreationDate}" /></label>
								<div class="input-group">

									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										required="true"
										requiredMessage="#{msg.formReportSocializationRekapCreationDate} #{msg.from} #{msg.validateRequired}"
										value="#{reportSocializationRekapBean.searchCreationDateFrom}"
										autocomplete="off"
										pattern="#{reportSocializationRekapBean.inputDateFormat}"
										locale="#{reportSocializationRekapBean.inputDateLocale}"></p:calendar>
									<span class="input-group-addon plain">-</span>

									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										required="true"
										requiredMessage="#{msg.formReportSocializationRekapCreationDate} #{msg.to} #{msg.validateRequired}"
										value="#{reportSocializationRekapBean.searchCreationDateTo}"
										autocomplete="off"
										pattern="#{reportSocializationRekapBean.inputDateFormat}"
										locale="#{reportSocializationRekapBean.inputDateLocale}"></p:calendar>
								</div>
							</div>
						</div>

						<div class="col-lg-4">
							<h:panelGroup id="panelProvType">
								<div class="form-group">
									<label class="tl-label" tl=""><h:outputText
											value="#{msg.formReportSocializationRekapProvType}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{reportSocializationRekapBean.searchProvType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{reportSocializationRekapBean.provTypes}" />
										<p:ajax event="change"
											update="form:panelDocType"
											listener="#{reportSocializationRekapBean.onChangeProvType}" />
									</h:selectOneMenu>
								</div>
							</h:panelGroup>
						</div>

						<div class="col-lg-4">
							<h:panelGroup id="panelDocType">
								<div class="form-group">
									<label class="tl-label size-font" tl="document-type"><h:outputText
											value="#{msg.formReportSocializationRekapDocType}" /></label>
									<h:selectOneMenu id="docType" styleClass="form-control s2"
										value="#{reportSocializationRekapBean.searchDocType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{reportSocializationRekapBean.docTypes}" />
									</h:selectOneMenu>
								</div>
							</h:panelGroup>
						</div>
					</h:panelGroup>
				</div>

				<div class="row">

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonPrint}" ajax="true"
										update="reportSocializationRekap panelSearch message "
										styleClass="btn btn-success tl-label"
										oncomplete="reInitSelect2();"
										actionListener="#{reportSocializationRekapBean.generateExcelInBackgroundJob}">
									</p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="panelSearch"
										oncomplete="reInitSelect2();"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{reportSocializationRekapBean.reset}">
									</p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<li><p:commandButton value="#{msg.buttonRefresh}"
										ajax="true" update="reportSocializationRekap"
										styleClass="btn btn-success tl-label"
										immediate="true"
										actionListener="#{reportSocializationRekapBean.search}">
									</p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonDelete}"
										ajax="true" update="reportSocializationRekap"
										styleClass="btn btn-default btn-flat tl-label"
										process="@this"
										actionListener="#{reportSocializationRekapBean.delete}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="reportSocializationRekap" paginator="true"
								var="vo" value="#{reportSocializationRekapBean.tableModel}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{reportSocializationRekapBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								selection="#{reportSocializationRekapBean.selectedReportGen}"
								rowKey="#{vo.reportGenId}" rowSelectMode="checkbox"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								>

								<p:ajax event="rowSelectCheckbox" process="@this" />
								<p:ajax event="rowUnselectCheckbox" process="@this" />
								<p:ajax event="toggleSelect" process="@this" />

								<p:column selectionMode="multiple"
									style="text-align:center; width:40px;" />

								<p:column headerText="#{msg.formReportGenReportId}">
									<h:outputLabel value="#{vo.reportGenId}"
										title="#{vo.reportGenId}" />
								</p:column>

								<p:column headerText="#{msg.formReportGenReportName}">
									<h:outputLabel value="#{vo.reportGenReportName}"
										title="#{vo.reportGenReportName}" />
								</p:column>

								<p:column headerText="#{msg.formReportGenReportExecuteDate}"
									style="text-align:center;">
									<h:outputLabel value="#{vo.creationDate}"
										title="#{vo.creationDate}" />
								</p:column>

								<p:column headerText="#{msg.formReportGenReportStatus}"
									style="text-align:center;">
									<h:outputText styleClass="label label-warning"
										value="#{vo.reportGenStatus}" title="#{vo.reportGenStatus}"></h:outputText>
								</p:column>

								<p:column>
									<p:outputPanel rendered="#{vo.statusIsCompleted}">
										<p:commandLink ajax="false" value="#{msg.textDownload}"
											immediate="true"
											actionListener="#{reportSocializationRekapBean.downloadFile(
												vo.reportGenFileId, 
												vo.reportGenReportFileName,
												null
											)}"
											target="_blank" />
									</p:outputPanel>
								</p:column>

							</p:dataTable>
						</div>
					</div>

				</div>

			</div>
		</div>
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
	</ui:define>
</ui:composition>
