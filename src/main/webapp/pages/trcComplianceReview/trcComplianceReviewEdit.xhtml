<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">
	
	<f:event listener="#{trcComplianceReviewEditBean.redirectCurrentPage}" type="preRenderView" />
	<ui:define name="head">
		<style>
			.form-control[readonly] {
				font-family: 'Montserrat';
				color: #444444;
			    margin: -4px 0px 0px;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-state-disabled, .ui-widget-content .ui-state-disabled, .ui-widget-header .ui-state-disabled {
			    opacity: 0.8;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
		    	box-shadow: none;
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcComplianceReviewTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:messages id="messagesView" showDetail="summary" 
			rendered="#{trcComplianceReviewEditBean.viewOnly eq 'Y'}"/>
			
		<p:growl id="msgs" rendered="true"></p:growl>
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formTrcComplianceReviewTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formTmpComplianceReviewReviewCategory}" for="trcComplianceReviewReviewCategory"/></label>
							<h:selectOneMenu id="trcComplianceReviewReviewCategory" disabled="true"
								styleClass="form-control s2"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.reviewCategory.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{trcComplianceReviewEditBean.reviewCategoryList}"/>
							</h:selectOneMenu>
						</div>
					</div>
					
					<p:outputPanel id="outputPanelReviewedBranch">
						<h:panelGroup id="panelGroupReviewedBranch" rendered="#{trcComplianceReviewEditBean.trcComplianceReview.reviewCategory.parameterDtlCode eq 'BRANCH_REVIEW'}">
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel for="trcComplianceReviewReviewedBranch"
											value="#{msg.formTmpComplianceReviewReviewedBranch}" /></label>
									<h:inputText id="trcComplianceReviewReviewedBranch" 
										styleClass="form-control" disabled="true"
										title="#{trcComplianceReviewEditBean.trcComplianceReview.reviewedBranch}"
										value="#{trcComplianceReviewEditBean.trcComplianceReview.reviewedBranch}"/>
								</div>
							</div>
						</h:panelGroup>
					</p:outputPanel>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel for="trcComplianceReviewAssessmentDocumentNumber"
									value="#{msg.formTmpComplianceReviewAssessmentDocumentNumber}" /></label>
							<h:inputText id="trcComplianceReviewAssessmentDocumentNumber" disabled="true"
							styleClass="form-control"
							title="#{trcComplianceReviewEditBean.trcComplianceReview.documentNo}"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.documentNo}"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label for="date" class="control-label tl-label"><p:outputLabel
									for="trcComplianceReviewDateofAssessmentDocument"
									value="#{msg.formTmpComplianceReviewDateofAssessmentDocument}" /></label>
							<p:calendar id="trcComplianceReviewDateofAssessmentDocument"
								disabled="true"
								styleClass="form-control-datepicker-wrap"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.documentDate}"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<p:outputLabel for="trcComplianceReviewPerihalIn"
									value="#{msg.formTmpComplianceReviewPerihal}" />
							</label>
							<h:inputText id="trcComplianceReviewPerihalIn" 
								disabled="true"
								styleClass="form-control"
								title="#{trcComplianceReviewEditBean.trcComplianceReview.perihalIn}"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.perihalIn}"/>
						</div>
					</div>
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel for="trcComplianceReviewPerihalEn"
									value="#{msg.formTmpComplianceReviewPerihal}" />&#160;&#160;<span
								class="label label-warning">
									<h:outputText value="#{msg.english}"/>
								</span></label>
							<h:inputText id="trcComplianceReviewPerihalEn" 
								disabled="true"
								styleClass="form-control"
								title="#{trcComplianceReviewEditBean.trcComplianceReview.perihalEn}"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.perihalEn}"/>
						</div>
					</div> -->
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel 
									value="#{msg.formTmpComplianceReviewAttachment}" />
							</label>
							<p:dataList value="#{trcComplianceReviewEditBean.uploadedFilesDocument}" 
								emptyMessage=""
								var="vo" id="documentList" rowIndexVar="index">
								<table>
							    	<tr>
							    	<td style="width:80%">
							        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcComplianceReviewEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							        </td>
						        	</tr>
						        </table>
							</p:dataList>
						</div>
					</div>
					
					<h:panelGroup id="panelFollowupPoints">
						<h3>
							<h:outputText
								value="#{msg.formTmpComplianceReviewFollowUpPoints}" />
						</h3>
						<div class="col-lg-12">
							<div id="mp-pic-compliance">
								<div class="top-scroller">
								    <div class="div-wrapper">
								    </div>
								</div>
								<div class="table-wrapper table-responsive linked-to-top-scroller">
									<p:dataTable id="dataTableFollowupPoints" var="data"
										value="#{trcComplianceReviewEditBean.tableModelFollowupPoints}"
										rowIndexVar="statIndex">
										
										<p:column headerText="#{msg.formTmpRmdRegulationTitleLink}"
											style="width:300px;vertical-align:top;">
											<p:dataTable id="dataTableRegulation" var="dare"
												value="#{data.trcComplianceReviewPicFollowupRegulations}"
												rowKey="#{dare.seq}" rowIndexVar="statIndexRegulation" rowSelectMode="checkbox">
												<p:column>
													<table>
														<tr>
															<td style="width: 80%">
																<h:inputText styleClass="form-control" title="#{dare.regulationMst.documentNo}"
																	value="#{dare.regulationMst.documentNo}" disabled="true" />
															</td>
														</tr>
													</table>
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewAreaReview}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTableAreaReview" var="dar"
												value="#{data.trcComplianceReviewPicFollowupReviews}"
												rowKey="#{dar.seq}" rowIndexVar="statIndexAreaReview" rowSelectMode="checkbox" >
												<p:column>
													<h:inputTextarea styleClass="form-control" style="" disabled="true"
														value="#{dar.areaReview}" title="#{dar.areaReview}" />
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewFinding}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTableFindings" var="dar"
												value="#{data.trcComplianceReviewPicFollowupFindings}"
												rowKey="#{dar.seq}" rowIndexVar="statFindings" rowSelectMode="checkbox" >
												
												<p:column>
													<h:inputTextarea styleClass="form-control" style="" disabled="true"
														value="#{dar.findings}" title="#{dar.findings}"/>
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewFollowUpPoints}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTablePointsPoint" var="dar"
												value="#{data.trcComplianceReviewPicFollowupPoints}"
												rowKey="#{dar.seq}" rowIndexVar="statFollowUpPoints">
												
												<p:column>
													<h:inputTextarea styleClass="form-control" style="" disabled="true"
														value="#{dar.followupPoints}" title="#{dar.followupPoints}"/>
												</p:column>
												
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewAttachmentFollowup}" width="300" style="vertical-align:top;">
											<p:dataTable id="dataTablePointsPointFollowupEvidence" var="daf"
												value="#{data.trcComplianceReviewPicFollowupPoints}"
												rowKey="#{daf.seq}" rowIndexVar="statAttachmentFollowup">
												
												<p:column>
													<h:outputText style="color: #dd4b39" value="#{trcComplianceReviewEditBean.textWarningUpload}"/>
													<p:fileUpload 
														fileUploadListener="#{trcComplianceReviewEditBean.handleFileUploadEvidence}" 
														mode="advanced" 
														dragDropSupport="false" 
														multiple="true"
				                   						update=":form:msgs" 
				                   						sizeLimit="#{trcComplianceReviewEditBean.maxAttachmentSize}" 
				                   						auto="true" 
				                   						rendered="#{trcComplianceReviewEditBean.viewOnly eq 'N'}"  
				                   					>
				                   						<f:attribute name="idxFollowup" value="#{statAttachmentFollowup}" />
				                   					</p:fileUpload>
				                   					<p:dataList value="#{daf.uploadedFilesEvidence}" 
										            	emptyMessage=""
										            	var="vo" id="evidenceList" rowIndexVar="index">
													        <table>
														    	<tr>
														    	<td>
														        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcComplianceReviewEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
														        </td>
														        <td>
														        	<p:commandLink  immediate="true" actionListener="#{trcComplianceReviewEditBean.deleteAttachment(vo.fileId, index, statAttachmentFollowup)}" rendered="#{trcComplianceReviewEditBean.viewOnly eq 'N'}">#{msg.buttonDelete}</p:commandLink>
														        </td>
													        	</tr>
													        </table>
													</p:dataList>
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTrcComplianceReviewFollowupDate}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTablePointsPointFollowupFulfillmentDate" var="dar"
												value="#{data.trcComplianceReviewPicFollowupPoints}"
												rowKey="#{dar.seq}" rowIndexVar="statFollowupDate">
												
												<p:column>
													<p:calendar id ="folllowupDate" styleClass="form-control-datepicker-wrap"
														value="#{dar.followupDate}"
														autocomplete="off" disabled="#{trcComplianceReviewEditBean.viewOnly eq 'Y'}"
														pattern="dd-MMM-yyyy" maxlength="11"
														locale="en"></p:calendar>
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewInformation}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTablePointsPointFollowupInformation" var="dar"
												value="#{data.trcComplianceReviewPicFollowupPoints}"
												rowKey="#{dar.seq}" rowIndexVar="statInformation">
												
												<p:column>
													<p:inputTextarea styleClass="form-control" autocomplete="off"
														disabled="#{trcComplianceReviewEditBean.viewOnly eq 'Y'}"
														maxlength="1000" title="#{dar.followupNote}"
														value="#{dar.followupNote}"></p:inputTextarea>
												</p:column>
											</p:dataTable>
										</p:column>
									</p:dataTable>
								</div>
							</div>
						</div>
					</h:panelGroup>
					
					<h3>
						<h:outputText
							value="#{msg.formTmpComplianceReviewPICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableCompliance" var="data"
									value="#{trcComplianceReviewEditBean.tableModelCompliance}"
									rowIndexVar="statIndex">

									<p:column headerText="#{msg.formTmpComplianceReviewNIK}"
										width="150">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" alt="#{data.user.nik}" title="#{data.user.nik}"
														value="#{data.user.nik}" readonly="true" /></td>
											</tr>
										</table>

									</p:column>

									<p:column headerText="#{msg.formTmpComplianceReviewName}"
										width="200">
										<h:inputText styleClass="form-control" alt="#{data.user.name}" title="#{data.user.name}"
											value="#{data.user.name}" readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formTmpComplianceReviewEmail}"
										width="150">
										<h:inputText styleClass="form-control" alt="#{data.user.email}" title="#{data.user.email}"
											value="#{data.user.email}" readonly="true" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
			
					<div class="col-lg-12">
						<div class="form-group">
							<label for="followUp" class="control-label tl-label" tl=""><p:outputLabel
									for="trcComplianceReviewApprovalFollowup"
									value="#{msg.formTmpComplianceReviewApprovalFollowup}" /></label>
							<h:selectOneMenu id="trcComplianceReviewApprovalFollowup"
								styleClass="form-control s2"
								disabled="true"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.followUp}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{trcComplianceReviewEditBean.followUps}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" tl=""><h:outputText
									value="#{msg.formTmpComplianceReviewNote}" /></label>
							<h:inputTextarea styleClass="form-control"
								title="#{trcComplianceReviewEditBean.trcComplianceReview.notes}" disabled="true"
								value="#{trcComplianceReviewEditBean.trcComplianceReview.notes}" readonly="true"/>
						</div>
					</div>
					
					
					<h:panelGroup id="panelReminder">
					<div class="col-lg-12" style="margin-top:15px;">
						<div class="form-group">
							<label class="control-label tl-label" tl=""><p:outputLabel
									for="trcComplianceReviewReminder"
									value="#{msg.formTmpComplianceReviewReminderType}" /></label>
							<h:selectOneMenu id="trcComplianceReviewReminder"
								disabled="true" 
								styleClass="form-control s2"
								value="#{trcComplianceReviewEditBean.counterTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{trcComplianceReviewEditBean.counterTypes}" />
							</h:selectOneMenu>
						</div>
					</div>
					</h:panelGroup>
					
					<h3>
						<h:outputText
							value="#{msg.formTmpComplianceReviewStatusConfirmation}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-confirmation-status">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableConfirmationStatus" var="vo"
									value="#{trcComplianceReviewEditBean.confirmationTableList}"
									rowIndexVar="statIndex">

									<p:column
										headerText="#{msg.formTmpComplianceReviewComplianceCheckStatus}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceStatus.name}"/>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpComplianceReviewComplianceCheckNote}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceNote}"/>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpComplianceReviewComplianceDate}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceDate}" >
													<f:convertDateTime
														pattern="dd-MMM-yyyy"
														locale="en">
													</f:convertDateTime>
												</h:outputText>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpComplianceReviewPICCompliance}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceBy.name}"  />
											</div>
										</div>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
					
				</div>
			</div>
			<div class="box-footer">
			
				<p:commandButton value="#{msg.buttonSave}"
					rendered="#{trcComplianceReviewEditBean.viewOnly eq 'N'}"
					actionListener="#{trcComplianceReviewEditBean.save}"
					update="msgs" styleClass="btn btn-success pull-left tl-label"></p:commandButton>

				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{trcComplianceReviewEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>

			</div>
		</div>

		

	</ui:define>


</ui:composition>
