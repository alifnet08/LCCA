
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">
	
	<ui:define name="head">
		<style>
			.ui-calendar input {
				display: block !important;
				width: 100% !important;
				padding: 10px 12px !important;
				background-color: #F7F8F8 !important;
				background-image: none !important;
				border-radius: 5px !important;
				box-shadow: none;
				transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s
					!important;
				border: 0 !important;
				height: inherit;
			}
			
			.ui-inputfield.ui-state-focus {
				box-shadow: none;
			}
			/* .ui-widget {
			    font-size: inherit;
			} */
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTmpFineTitle}" />
	</ui:define>
	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink
					action="#{tmpFineBean.getNavigateEdit()}" type="submit"
					process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">
		<p:growl id="deletedMessage" globalOnly="true" />
		<div class="box box-solid">
			<div class="box-body">

					<h:panelGroup id="panelSearch">
					<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineSender}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{tmpFineBean.searchPengirim}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{tmpFineBean.selectSender}" />
								</h:selectOneMenu>
							</div>
						</div>
						<div class="col-lg-9">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineLetterReceiveDate}" /></label>
								<div class="input-group">
									<p:calendar id="tglTerimaSuratFrom" autocomplete="off" maxlength="11"
										placeholder="#{msg.from}" styleClass="form-control-datepicker-wrap"
										value="#{tmpFineBean.searchTanggalTerimaSuratFrom}"
										pattern="#{tmpFineBean.inputDateFormat}"
										locale="#{tmpFineBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tglTerimaSuratTo" autocomplete="off" maxlength="11"
										placeholder="#{msg.to}" styleClass="form-control-datepicker-wrap"
										value="#{tmpFineBean.searchTanggalTerimaSuratTo}"
										pattern="#{tmpFineBean.inputDateFormat}"
										locale="#{tmpFineBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						</div>
						
						<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineLetterNo}" /></label>
								<h:inputText styleClass="form-control"
									value="#{tmpFineBean.searchNoSurat}" />
							</div>
						</div>
						<div class="col-lg-9">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineLetterDate}" /></label>
								<div class="input-group">
									<p:calendar id="tglSuratFrom" autocomplete="off" maxlength="11"
										placeholder="#{msg.from}" styleClass="form-control-datepicker-wrap"
										value="#{tmpFineBean.searchTanggalSuratFrom}"
										pattern="#{tmpFineBean.inputDateFormat}"
										locale="#{tmpFineBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tglSuratTo" autocomplete="off" placeholder="#{msg.to}"
										styleClass="form-control-datepicker-wrap" maxlength="11"
										value="#{tmpFineBean.searchTanggalSuratTo}"
										pattern="#{tmpFineBean.inputDateFormat}"
										locale="#{tmpFineBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						</div>
						
						<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineAbout}" /></label>
								<h:inputText styleClass="form-control"
									value="#{tmpFineBean.searchPerihal}" />
							</div>
						</div>
						<div class="col-lg-7">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineTargetDate}" /></label>
								<div class="input-group">
									<p:calendar id="targetDateFrom" autocomplete="off" maxlength="11"
										placeholder="#{msg.from}" styleClass="form-control-datepicker-wrap"
										value="#{tmpFineBean.searchTargetDateFrom}"
										pattern="#{tmpFineBean.inputDateFormat}"
										locale="#{tmpFineBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="targetDateTo" autocomplete="off" maxlength="11"
										placeholder="#{msg.to}" styleClass="form-control-datepicker-wrap"
										value="#{tmpFineBean.searchTargetDateTo}"
										pattern="#{tmpFineBean.inputDateFormat}"
										locale="#{tmpFineBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						<div class="col-lg-2">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpFineSearchStatus}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{tmpFineBean.searchStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{tmpFineBean.statusList}" />
								</h:selectOneMenu>
							</div>
						</div>
						</div>
					</h:panelGroup>
					<div class="row">
					<div class="col-lg-12">
						<div class="col-lg-12">
							<div class="filter-tools">
								<ul class="no-margin no-padding">
									<li><p:commandButton value="#{msg.buttonSearch}"
											ajax="true" update="Fine"
											styleClass="btn btn-success tl-label"
											actionListener="#{tmpFineBean.search}"></p:commandButton></li>
									<li><p:commandButton value="#{msg.buttonReset}"
											ajax="true"
											update="Fine panelSearch"
											styleClass="btn btn-default btn-flat tl-label"
											actionListener="#{tmpFineBean.reset}"></p:commandButton></li>
								</ul>
								<ul class="no-margin no-padding pull-right">
									<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
									<li><h:commandLink styleClass="btn btn-warning tl-label" onclick="onclickDownload(); PF('statusDialog').hide();">
										<i class="fa fa-table"></i> &nbsp;
		        							<h:outputText
											value="#{msg.formTmpFineExportExcel}" />

										<p:dataExporter type="xls" target="Fine"
											fileName="Fine" pageOnly="true"
											postProcessor="#{tmpFineBean.postProcessXLS}" />
									</h:commandLink></li>
								</ul>
							</div>
						</div>
						<div class="col-lg-6">
							<div class="filter-tools" style="text-align: right;">
								<ul class="no-margin no-padding" style="float: right;">
									<li></li>
								</ul>
							</div>
						</div>

					</div>

					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
						    <div class="div-wrapper">
						    </div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="Fine" paginator="true" var="vo"
								value="#{tmpFineBean.tableFine}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{tmpFineBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;" exportable="false" width="120"
									headerText="#{msg.formAction}">

									<h:outputLabel value="#{msg.formWaitingForApproval}"
										rendered="#{vo.statusCode eq 'DATA_NEW'}" />								
									
									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										rendered="#{vo.statusCode ne 'DATA_NEW'}"
										action="#{tmpFineBean.getNavigateEdit()}"
										type="submit" ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.fineId}" />
									</p:commandLink>

									<h:outputText style=" padding-left:4px; color:grey;'"
										value=" | "
										rendered="#{vo.followupStatusCode eq null and vo.statusCode ne 'DATA_NEW'}" />
									<h:outputLabel value="&#160;"
										rendered="#{vo.followupStatusCode eq null and vo.statusCode ne 'DATA_NEW'}" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										rendered="#{vo.followupStatusCode eq null and vo.statusCode ne 'DATA_NEW'}"
										styleClass="tl-label" update="Fine form:deletedMessage"
										action="#{tmpFineBean.delete(vo.fineId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>

								</p:column>

								
								
								<p:column headerText="#{msg.formTmpFineLetterNo}" width="250">
									<h:outputLabel value="#{vo.letterNo}" title="#{vo.letterNo}"/>
								</p:column>
								
								<p:column width="140"
									headerText="#{msg.formTmpFineLetterDate}">
									<h:outputText value="#{vo.letterDate}">
										<f:convertDateTime
											pattern="#{tmpFineBean.inputDateFormat}"
											locale="#{tmpFineBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column headerText="#{msg.formTmpFineSenderLetter}" width="200">
									<h:outputLabel value="#{vo.senderName}"  title="#{vo.senderName}"/>
								</p:column>

								<p:column width="140"
									headerText="#{msg.formTmpFineLetterReceivedDate}">
									<h:outputText value="#{vo.letterReceivedDate}">
										<f:convertDateTime
											pattern="#{tmpFineBean.inputDateFormat}"
											locale="#{tmpFineBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
								
								<!-- <p:column headerText="#{msg.formTmpFineAbout}">
									<h:outputLabel value="#{vo.perihalName}" />
								</p:column> -->
								
								<p:column headerText="#{msg.formTmpFineSearchStatus}"
									style="text-align:center;" width="100">
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_ACTIVE'}">
										<span class="label label-success"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_INACTIVE'}">
										<span class="label label-danger"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_NEW'}">
										<span class="label label-info"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_REVISE'}">
										<span class="label label-warning"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
								</p:column>
								
								<p:column
									headerText="#{msg.formTmpFineFollowupStatusOfPIC}"
									style="text-align:center" width="100">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >#{dtl.followupStatus.name}
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTmpFinePICName}" width="150">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.userId1.name}" title="#{dtl.userId1.name}" />, <br />
										<h:outputText value="#{dtl.userId2.name}" title="#{dtl.userId2.name}"/>,  <br />
										<h:outputText value="#{dtl.userId3.name}" title="#{dtl.userId3.name}"/> 
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTmpFineConfirmationDate}" width="140">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.confirmationDate}">
										<f:convertDateTime
											pattern="#{tmpFineBean.inputDateFormat}"
											locale="#{tmpFineBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
									</p:dataList>
									
								</p:column>

								<p:column headerText="#{msg.formTmpFineFollowupDate}" width="140">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.followupDate}">
										<f:convertDateTime
											pattern="#{tmpFineBean.inputDateFormat}"
											locale="#{tmpFineBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
									</p:dataList>
								</p:column>

								<p:column headerText="#{msg.formTmpFineInformation}" width="150">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >#{dtl.followupNote}
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTmpFineFollowupFulfillmentDate}" width="140">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.complianceDate}">
										<f:convertDateTime
											pattern="#{tmpFineBean.inputDateFormat}"
											locale="#{tmpFineBean.inputDateLocale}">
										</f:convertDateTime>
										</h:outputText>
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTmpFineComplianceCheckStatus}" width="100"
									style="text-align:center;">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >#{dtl.complianceStatus.name}
									</p:dataList>
								</p:column>
								
								
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formTmpFineConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formTmpFineDelete}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formTmpFineConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
