<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
		.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}	
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    -webkit-box-shadow: none;
			    box-shadow: none;
			}
			.form-control[disabled]{
			    font-size: 13px;
			    font-family: 'Montserrat';
			    color: #444444;
			}
			.input-group {
			    margin-top: 15px;
			}
			.ui-widget-content .ui-inputfield {
			    font-family: 'Montserrat';
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formAnnouncementTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-cpsa">
					<h:outputText value="#{msg.formAnnouncementAddTitle}" />
				</h3>
			</div>
			
			<div class="box-body">
				<p:growl id="messages" rendered="true" severity="error"/>
				<div class="row">
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="announcementTitle">
								<p:outputLabel value="#{msg.formAnnouncementAnnounTitle}" for="announcementTitle" />
							</label>
							<p:inputText autocomplete="off" style="width:100%"
								styleClass="form-control" id="announcementTitle"
								value="#{announcementEditBean.announcement.announcementTitle}"
								required="true"
								requiredMessage="#{msg.formAnnouncementAnnounTitle} #{msg.validateRequired}" />
							<p:message for="announcementTitle"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="period">
								<p:outputLabel value="#{msg.formAnnouncementPeriod}" />
							</label>
							<div class="input-group">
								<p:calendar id="periodeFrom" styleClass="form-control-datepicker-wrap"
									value="#{announcementEditBean.announcement.periodStart}"
									placeholder="#{msg.from}"
									required="true"
									requiredMessage="#{msg.formAnnouncementPeriodStart} #{validateRequired}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
								</p:calendar>
								<span class="input-group-addon plain">
									<h:outputText value=" - "/>
								</span>
								<p:calendar styleClass="form-control-datepicker-wrap"
									id="periodeTo"
									placeholder="#{msg.to}"
									required="true"
									requiredMessage="#{msg.formAnnouncementPeriodEnd} #{validateRequired}"
									value="#{announcementEditBean.announcement.periodEnd}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
								</p:calendar>
							</div>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="announcementContent">
								<p:outputLabel value="#{msg.formAnnouncementContent}" for="announcementContent" />
							</label>
							<p:inputTextarea id="announcementContent" styleClass="form-control"
								required="true" maxlength="4000"
								requiredMessage="#{msg.formAnnouncementContent} #{validateRequired}"
								value="#{announcementEditBean.announcement.announcementContent}" />
							<p:message for="announcementContent" />
						</div>
					</div>
					
				</div>
				
				<div class="box-footer">
					<h:commandButton value="#{msg.buttonSave}" type="submit"
						styleClass="btn btn-primary pull-left"
						actionListener="#{announcementEditBean.save()}">
					</h:commandButton>
					<h:commandLink value="#{msg.buttonCancel}"
						actionListener="#{announcementEditBean.cancel()}" immediate="true"
						styleClass="btn btn-default pull-right tl-label">
					</h:commandLink>
				</div>
				
			</div>			
		</div>
	</ui:define>
</ui:composition>
