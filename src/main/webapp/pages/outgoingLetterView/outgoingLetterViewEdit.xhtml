<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			 td.optionDisabled .ui-chkbox{
				display: none;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formOutgoingLetterViewTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formOutgoingLetterViewTitle}" />
				</h3>
			</div>
			
			<div class="box-body">
				<div class="row">
				
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label">
								<p:outputLabel
									value="#{msg.formOutgoingLetterPurpose}" />
							</label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" disabled="true" maxlength="100"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.letterPurposeIn}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.letterPurposeIn}"/>
						</div>
					</div>
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									value="#{msg.formOutgoingLetterPurpose}" />&#160;&#160;<span class="label label-warning">
                					<h:outputLabel value="#{msg.english}"/>
                					</span></label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" maxlength="100" disabled="true"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.letterPurposeEn}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.letterPurposeEn}"/>
						</div>
					</div> -->
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									value="#{msg.formOutgoingLetterNo}" /></label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" disabled="true" maxlength="100"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.letterNo}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.letterNo}"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									value="#{msg.formOutgoingLetterDate}" /></label>
							<p:calendar disabled="true" 
								styleClass="form-control-datepicker-wrap" maxlength="11"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.letterDate}"
								autocomplete="off"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label">
								<p:outputLabel
									value="#{msg.formOutgoingLetterPerihal}" />
							</label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" disabled="true" maxlength="1000"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.perihalIn}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.perihalIn}"/>
						</div>
					</div>
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									value="#{msg.formOutgoingLetterPerihal}" />&#160;&#160;<span class="label label-warning">
                					<h:outputLabel value="#{msg.english}"/>
                					</span></label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" maxlength="1000" disabled="true"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.perihalEn}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.perihalEn}"/>
						</div>
					</div> -->
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									value="#{msg.formOutgoingLetterDeliveredTo}" /></label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" disabled="true" maxlength="1000"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.deliveredTo}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.deliveredTo}"/>
						</div>
					</div> -->
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									value="#{msg.formOutgoingLetterCarbonCopyNatation}" /></label>
							<h:inputText styleClass="form-control" 
								autocomplete="off" disabled="true" maxlength="1000"
								title="#{outgoingLetterViewEditBean.outgoingLetterView.tembusan}"
								value="#{outgoingLetterViewEditBean.outgoingLetterView.tembusan}"/>
						</div>
					</div>
					
					<h3>
						<h:outputText
							value="#{msg.formOutgoingLetterTitleLetterTitle}" />
					</h3>
					
					<div class="col-lg-12">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUpload" update="outgoingLetterDocument"></p:remoteCommand>
							<label class="tl-label"><h:outputText
								value="#{msg.formOutgoingLetterSubTitle}"/></label>
							<p:dataList value="#{outgoingLetterViewEditBean.uploadFilesOutgoingLetters}" 
								emptyMessage=""
								var="vo" id="outgoingLetterDocument">
								<p:commandLink title="#{vo.fileSize} KB" ajax="false" actionListener="#{outgoingLetterViewEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							</p:dataList>
	
						</div>		
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUploadReceipt" update="outgoingLetterDocumentReceipt"></p:remoteCommand>
							<label class="tl-label"><h:outputText
								value="#{msg.formOutgoingLetterReceipt}"/></label>
							<p:dataList value="#{outgoingLetterViewEditBean.uploadFilesReceipt}" 
								emptyMessage=""
								var="vo" id="outgoingLetterDocumentReceipt">
								<p:commandLink title="#{vo.fileSize} KB" ajax="false" actionListener="#{outgoingLetterViewEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							</p:dataList>
	
						</div>		
					</div>
					
					<div class="box-footer">
						<h:commandLink value="#{msg.buttonCancel}"
							actionListener="#{outgoingLetterViewEditBean.cancel()}"
							styleClass="btn btn-default pull-right tl-label"></h:commandLink>
					
					</div>
					
				</div>
			</div>
			
		</div>
	</ui:define>
</ui:composition>
