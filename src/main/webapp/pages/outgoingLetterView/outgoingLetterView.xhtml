<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			 td.optionDisabled .ui-chkbox{
				display: none;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formOutgoingLetterViewTitle}" />
	</ui:define>
	
	<ui:define name="content">
		<p:growl id="messages" />
		<div class="box box-solid">
			<div class="box-body">
			
				<h:panelGroup id="panelSearch">
					
					<div class="row">
					
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formOutgoingLetterPurpose}" /></label>
								<h:inputText styleClass="form-control"
									value="#{outgoingLetterViewBean.tujuanSurat}" />
							</div>
						</div>
						
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formOutgoingLetterNo}" /></label>
								<h:inputText styleClass="form-control"
									value="#{outgoingLetterViewBean.nomorSurat}" />
							</div>
						</div>
						
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formOutgoingLetterPerihal}" /></label>
								<h:inputText styleClass="form-control"
									value="#{outgoingLetterViewBean.perihal}" />
							</div>
						</div>
						
						<!-- <div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formOutgoingLetterDeliveredTo}" /></label>
								<h:inputText styleClass="form-control"
									value="#{outgoingLetterViewBean.sampaikanKepada}" />
							</div>
						</div> -->
						
						<div class="col-lg-6">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceLetterDate}" /></label>
								<div class="input-group">
									<p:calendar id="tanggalSuratFrom" autocomplete="off"
										maxlength="11" placeholder="#{msg.from}"
										styleClass="form-control-datepicker-wrap"
										value="#{outgoingLetterViewBean.tanggalSuratFrom}"
										pattern="#{outgoingLetterViewBean.inputDateFormat}"
										locale="#{outgoingLetterViewBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tanggalSuratTo" autocomplete="off"
										maxlength="11" placeholder="#{msg.to}"
										styleClass="form-control-datepicker-wrap"
										value="#{outgoingLetterViewBean.tanggalSuratTo}"
										pattern="#{outgoingLetterViewBean.inputDateFormat}"
										locale="#{outgoingLetterViewBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						
						<div class="col-lg-6">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formOutgoingLetterCarbonCopyNatation}" /></label>
								<h:inputText styleClass="form-control"
									value="#{outgoingLetterViewBean.tembusanSurat}" />
							</div>
						</div>
						
					</div>
				</h:panelGroup>
				
				<div class="row">
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="OutgoingLetter"
										styleClass="btn btn-success tl-label"
										actionListener="#{outgoingLetterViewBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="OutgoingLetter panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{outgoingLetterViewBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
				</div>
				
				<div class="col-lg-12">&nbsp;</div>
				
				<div class="col-lg-12">
					<div class="top-scroller">
					    <div class="div-wrapper">
					    </div>
					</div>
					<div class="table-responsive linked-to-top-scroller">
						<p:dataTable id="OutgoingLetter" paginator="true" var="vo"
							value="#{outgoingLetterViewBean.tableModel}" dynamic="true"
							lazy="true" emptyMessage="#{msg.textNodata}"
							rows="#{outgoingLetterViewBean.paging}" rowIndexVar="statIndex"
							rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							>
							
							<p:column style="text-align:center;" exportable="false"
								width="120" headerText="#{msg.formAction}">
									<p:commandLink id="view" value="#{msg.buttonView}"
										action="#{outgoingLetterViewBean.getNavigateEdit()}"
										type="submit" ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.outgoingLetterId}" />
									</p:commandLink>
							</p:column>
							
							<p:column headerText="#{msg.formOutgoingLetterPurpose}"
								width="250">
								<h:outputLabel value="#{vo.letterPursposeName}"
									title="#{vo.letterPursposeName}" />
							</p:column>

							<p:column headerText="#{msg.formOutgoingLetterNo}" width="250">
								<h:outputLabel value="#{vo.letterNo}" title="#{vo.letterNo}" />
							</p:column>
							
							<p:column headerText="#{msg.formOutgoingLetterDate}" width="250">
								<h:outputLabel value="#{vo.letterDateStr}" title="#{vo.letterDateStr}" />
							</p:column>
							
							<p:column headerText="#{msg.formOutgoingLetterAttachment}"
									width="250">
									<p:dataList value="#{vo.outgoingLetterAttachmentView}" emptyMessage=""
										var="dtl">
										<p:commandLink title="#{dtl.fileSize} KB" ajax="false"
											actionListener="#{outgoingLetterViewBean.downloadFile(dtl.fileId,dtl.attachmentFile,null)}"
											target="_blank">#{dtl.attachmentFile}</p:commandLink>
									</p:dataList>
								</p:column>
							
							

							<p:column headerText="#{msg.formOutgoingLetterPerihal}"
								width="250">
								<h:outputLabel value="#{vo.perihalIn}"
									title="#{vo.perihalIn}" />
							</p:column>

							<!-- <p:column headerText="#{msg.formOutgoingLetterDeliveredTo}"
								width="250">
								<h:outputLabel value="#{vo.deliveredTo}"
									title="#{vo.deliveredTo}" />
							</p:column> -->

							<p:column
								headerText="#{msg.formOutgoingLetterCarbonCopyNatation}"
								width="250">
								<h:outputLabel value="#{vo.tembusan}" title="#{vo.tembusan}" />
							</p:column>
							
						</p:dataTable>
					</div>
				</div>
			</div>
		</div>
		
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
		
		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formCounterTypeConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formCounterTypeDeleteCounterType}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formCounterTypeConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>
		
	</ui:define>
</ui:composition>
