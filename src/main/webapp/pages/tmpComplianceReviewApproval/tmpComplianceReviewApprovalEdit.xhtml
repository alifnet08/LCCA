<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly] {;
				font-family: 'Montserrat';
				color: #444444;
			    margin: -4px 0px 0px;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';W
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTmpComplianceReviewApprovalTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true"></p:growl>
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formTmpComplianceReviewApprovalTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formTmpComplianceReviewApprovalReviewCategory}" for="tmpComplianceReviewApprovalReviewCategory"/></label>
							<h:selectOneMenu id="tmpComplianceReviewApprovalReviewCategory" disabled="true"
								styleClass="form-control s2"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.reviewCategory.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{tmpComplianceReviewApprovalEditBean.reviewCategoryList}"/>
							</h:selectOneMenu>
						</div>
					</div>
					
					<p:outputPanel id="outputPanelReviewedBranch">
						<h:panelGroup id="panelGroupReviewedBranch" rendered="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.reviewCategory.parameterDtlCode eq 'BRANCH_REVIEW'}">
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel for="tmpComplianceReviewApprovalReviewedBranch"
											value="#{msg.formTmpComplianceReviewApprovalReviewedBranch}" /></label>
									<h:inputText id="tmpComplianceReviewApprovalReviewedBranch" 
										styleClass="form-control" disabled="true" 
										title="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.reviewedBranch}"
										alt="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.reviewedBranch}"
										value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.reviewedBranch}"/>
								</div>
							</div>
						</h:panelGroup>
					</p:outputPanel>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel for="tmpComplianceReviewApprovalAssessmentDocumentNumber"
									value="#{msg.formTmpComplianceReviewApprovalAssessmentDocumentNumber}" /></label>
							<h:inputText id="tmpComplianceReviewApprovalAssessmentDocumentNumber" disabled="true"
							styleClass="form-control" title="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.documentNo}"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.documentNo}"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label for="date" class="control-label tl-label"><p:outputLabel
									for="tmpComplianceReviewApprovalDateofAssessmentDocument"
									value="#{msg.formTmpComplianceReviewApprovalDateofAssessmentDocument}" /></label>
							<p:calendar id="tmpComplianceReviewApprovalDateofAssessmentDocument"
								disabled="true"
								styleClass="form-control-datepicker-wrap"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.documentDate}"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<p:outputLabel for="tmpComplianceReviewApprovalPerihalIn"
									value="#{msg.formTmpComplianceReviewApprovalPerihal}" />
							</label>
							<h:inputText id="tmpComplianceReviewApprovalPerihalIn" 
								disabled="true"
								styleClass="form-control"
								title="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.perihalIn}"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.perihalIn}"/>
						</div>
					</div>
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel for="tmpComplianceReviewApprovalPerihalEn"
									value="#{msg.formTmpComplianceReviewApprovalPerihal}" />&#160;&#160;<span
								class="label label-warning">
									<h:outputText value="#{msg.english}"/>
								</span></label>
							<h:inputText id="tmpComplianceReviewApprovalPerihalEn" 
								disabled="true"
								styleClass="form-control"
								title="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.perihalEn}"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.perihalEn}"/>
						</div>
					</div> -->
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel 
									value="#{msg.formTmpComplianceReviewApprovalAttachment}" />
							</label>
							<p:dataList value="#{tmpComplianceReviewApprovalEditBean.uploadedFilesDocument}" 
								emptyMessage=""
								var="vo" id="documentList" rowIndexVar="index">
								<table>
							    	<tr>
							    	<td style="width:80%">
							        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{tmpComplianceReviewApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							        </td>
						        	</tr>
						        </table>
							</p:dataList>
						</div>
					</div>
					
					<h3>
						<h:outputText
							value="#{msg.formTmpComplianceReviewApprovalPICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableCompliance" var="data"
									value="#{tmpComplianceReviewApprovalEditBean.tableModelCompliance}"
									rowIndexVar="statIndex">

									<p:column headerText="#{msg.formTmpComplianceReviewApprovalNIK}"
										width="150">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" alt="#{data.user.nik}" title="#{data.user.nik}"
														value="#{data.user.nik}" readonly="true" /></td>
											</tr>
										</table>

									</p:column>

									<p:column headerText="#{msg.formTmpComplianceReviewApprovalName}"
										width="200">
										<h:inputText styleClass="form-control" alt="#{data.user.name}" title="#{data.user.name}"
											value="#{data.user.name}" readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formTmpComplianceReviewApprovalEmail}"
										width="150">
										<h:inputText styleClass="form-control" alt="#{data.user.email}" title="#{data.user.email}"
											value="#{data.user.email}" readonly="true" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
			
					<div class="col-lg-12">
						<div class="form-group">
							<label for="followUp" class="control-label tl-label" tl=""><p:outputLabel
									for="tmpComplianceReviewApprovalFollowup"
									value="#{msg.formTmpComplianceReviewApprovalFollowup}" /></label>
							<h:selectOneMenu id="tmpComplianceReviewApprovalFollowup"
								styleClass="form-control s2"
								disabled="true"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.followUp}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{tmpComplianceReviewApprovalEditBean.followUps}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" tl=""><h:outputText
									value="#{msg.formTmpComplianceReviewApprovalNote}" /></label>
							<h:inputTextarea styleClass="form-control" title="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.notes}"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.notes}" readonly="true"/>
						</div>
					</div>
					
					<h:panelGroup id="panelFollowupPoints">
						<h3>
							<h:outputText
								value="#{msg.formTmpComplianceReviewFollowUpPoints}" />
						</h3>
						<div class="col-lg-12">
							<div id="mp-pic-compliance">
								<div class="top-scroller">
								    <div class="div-wrapper">
								    </div>
								</div>
								<div class="table-wrapper table-responsive linked-to-top-scroller">
									<p:dataTable id="dataTableFollowupPoints" var="data"
										value="#{tmpComplianceReviewApprovalEditBean.tableModelFollowupPoints}"
										selection="#{tmpComplianceReviewApprovalEditBean.selectedDataFollowupPoints}"
										rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox" >
										
										<p:ajax event="rowSelectCheckbox" process="@this" />
										<p:ajax event="rowUnselectCheckbox" process="@this" />
										<p:ajax event="toggleSelect" process="@this" />
										
										<p:column headerText="#{msg.formTmpRmdRegulationTitleLink}"
											style="width:300px;vertical-align:top;">
											<p:dataTable id="dataTableRegulation" var="dare"
												value="#{data.tmpComplianceReviewPicFollowupRegulationsList}"
												rowKey="#{dare.seq}" rowIndexVar="statIndexRegulation" rowSelectMode="checkbox">
												
												<p:ajax event="rowSelectCheckbox" process="@this dataTableRegulation" />
												<p:ajax event="rowUnselectCheckbox" process="@this dataTableRegulation" />
												<p:ajax event="toggleSelect" process="@this dataTableRegulation" />
												
												<p:column>
													<table>
														<tr>
															<td style="width: 80%">
																<h:inputText styleClass="form-control" title="#{dare.regulationMst.documentNo}"
																	value="#{dare.regulationMst.documentNo}" disabled="true" />
															</td>
														</tr>
													</table>
												</p:column>
											</p:dataTable>
										</p:column>
	
										<p:column headerText="#{msg.formTmpComplianceReviewAreaReview}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTableAreaReview" var="dar"
												value="#{data.tmpComplianceReviewPicFollowupReviewsList}"
												selection="#{tmpComplianceReviewApprovalEditBean.selectedTmpComplianceReviewPicFollowupReview}"
												rowKey="#{dar.seq}" rowIndexVar="statIndexAreaReview" rowSelectMode="checkbox" >
												<p:ajax event="rowSelectCheckbox" process="@this dataTableAreaReview" />
												<p:ajax event="rowUnselectCheckbox" process="@this dataTableAreaReview" />
												<p:ajax event="toggleSelect" process="@this dataTableAreaReview" />
												
												
												<p:column>
													<h:inputTextarea styleClass="form-control" style="" disabled="true"
														value="#{dar.areaReview}" title="#{dar.areaReview}" />
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewFinding}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTableFindings" var="dar"
												value="#{data.tmpComplianceReviewPicFollowupFindingList}"
												selection="#{tmpComplianceReviewApprovalEditBean.selectedTmpComplianceReviewPicFollowupFindings}"
												rowKey="#{dar.seq}" rowIndexVar="statFindings" rowSelectMode="checkbox" >
												<p:ajax event="rowSelectCheckbox" process="@this dataTableFindings" />
												<p:ajax event="rowUnselectCheckbox" process="@this dataTableFindings" />
												<p:ajax event="toggleSelect" process="@this dataTableFindings" />
												
												
												<p:column>
													<h:inputTextarea styleClass="form-control" style="" disabled="true"
														value="#{dar.findings}" title="#{dar.findings}" />
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewFollowUpPoints}"
											width="200" style="vertical-align:top;">
											<p:dataTable id="dataTablePointsPoint" var="dar"
												value="#{data.tmpComplianceReviewPicFollowupPointsList}"
												selection="#{tmpComplianceReviewApprovalEditBean.selectedTmpComplianceReviewPicFollowupPoints}"
												rowKey="#{dar.seq}" rowIndexVar="statFindings" rowSelectMode="checkbox" >
												<p:ajax event="rowSelectCheckbox" process="@this dataTablePointsPoint" />
												<p:ajax event="rowUnselectCheckbox" process="@this dataTablePointsPoint" />
												<p:ajax event="toggleSelect" process="@this dataTablePointsPoint" />
												
												
												<p:column>
													<h:inputTextarea styleClass="form-control" style="" disabled="true"
														value="#{dar.followupPoints}" title="#{dar.followupPoints}" />
												</p:column>
											</p:dataTable>
										</p:column>
										
										<p:column headerText="#{msg.formTmpComplianceReviewPICFollowup}"
											width="400">
											<table>
												<tr>
													<td style="width: 100%">
														<h:selectOneMenu styleClass="form-control s2 divisionCc#{statIndex}"
															disabled="true"
															value="#{data.divisionId}">
															<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
															<f:selectItems
																value="#{tmpComplianceReviewApprovalEditBean.divisions}" />
															<p:ajax event="change" update="form:panelFollowupPoints"
																listener="#{tmpComplianceReviewApprovalEditBean.onChangeDivision(statIndex)}"
																 />
														</h:selectOneMenu>
													</td>
												</tr>
												<tr>
													<td style="width: 100%">
														<h:inputText
															styleClass="form-control user1#{statIndex}"
															id="userName1#{statIndex}" value="#{data.user1.name}"
															readonly="true" title="#{data.user1.name}" />
													</td>
												</tr>
												<tr>
													<td style="width: 100%"><h:inputText
															styleClass="form-control user2#{statIndex}"
															id="userName2#{statIndex}" value="#{data.user2.name}"
															readonly="true" title="#{data.user2.name}" /></td>
												</tr>
												<tr>
													<td style="width: 100%"><h:inputText
															styleClass="form-control user3#{statIndex}"
															id="userName3#{statIndex}" value="#{data.user3.name}"
															readonly="true" title="#{data.user3.name}"/></td>
												</tr>
											</table>
										</p:column>
										
										<p:column style="vertical-align:top;"
											headerText="#{msg.formTmpComplianceReviewTargetDate}"
											width="150">
											<p:calendar maxlength="11" style="width:100px;" value="#{data.targetDate}" 
												styleClass="form-control-datepicker-wrap" disabled="true"
												pattern="dd MMM yyyy" locale="en" >
												<p:ajax event="dateSelect" />
											</p:calendar>
										</p:column>
										
										<p:column
											headerText="#{msg.formTmpComplianceReviewEmailDate}"
											width="150">
											<p:dataList value="#{data.tmpComplianceReviewPicFollowupEmails}"
												emptyMessage=""
												var="dtl">#{dtl.emailDate!=null?tmpComplianceReviewApprovalEditBean.sdf.format(dtl.emailDate):''}</p:dataList>
										</p:column>
	
									</p:dataTable>
								</div>
							</div>
						</div>
					</h:panelGroup>
					
					<h:panelGroup id="panelReminder">
					<div class="col-lg-12" style="margin-top:15px;">
						<div class="form-group">
							<label class="control-label tl-label" tl=""><p:outputLabel
									for="tmpComplianceReviewApprovalReminder"
									value="#{msg.formTmpComplianceReviewApprovalReminderType}" /></label>
							<h:selectOneMenu id="tmpComplianceReviewApprovalReminder"
								disabled="true" 
								styleClass="form-control s2"
								value="#{tmpComplianceReviewApprovalEditBean.counterTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{tmpComplianceReviewApprovalEditBean.counterTypes}" />
							</h:selectOneMenu>
						</div>
					</div>
					</h:panelGroup>

					<div class="col-lg-12">
						<div class="form-group" style="margin-top:15px;">
							<label class="tl-label" tl=""><h:outputText
									value="#{msg.formTmpComplianceReviewApprovalReminderStatus}" /></label>
							<h:selectOneRadio disabled="true"
								value="#{tmpComplianceReviewApprovalEditBean.tmpComplianceReview.reminderStatus.parameterDtlCode}"
								>
								<f:selectItems
									value="#{tmpComplianceReviewApprovalEditBean.reminderStatusList}"
									 />
							</h:selectOneRadio>
						</div>
					</div>
					
					<div class="col-lg-12">
		             <div class="form-group required">
		             	<label class="tl-label"><h:outputText value="#{msg.textApprovalStatus}" /></label>
			          	<h:selectOneMenu styleClass="form-control s2" value="#{tmpComplianceReviewApprovalEditBean.approvalStat}">
			                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
						    <f:selectItems value="#{tmpComplianceReviewApprovalEditBean.approvalStatus}" />
			            </h:selectOneMenu>
		             </div>
		           </div>
		           
					<div class="col-lg-12">
						<h3> <h:outputText value="#{msg.formTmpComplianceReviewNote}"/></h3>
						<div class="form-group">
							<p:inputTextarea styleClass="form-control"
								value="#{tmpComplianceReviewApprovalEditBean.note}"></p:inputTextarea>

						</div>
					</div>
				</div>
			</div>
			<div class="box-footer">
				<p:commandButton value="#{msg.buttonSave}"
					actionListener="#{tmpComplianceReviewApprovalEditBean.save}"
					styleClass="btn btn-success pull-left tl-label" update="msgs"></p:commandButton>
				
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{tmpComplianceReviewApprovalEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>

			</div>
		</div>

		

	</ui:define>


</ui:composition>
