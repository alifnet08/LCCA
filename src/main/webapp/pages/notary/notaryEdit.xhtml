<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
			.ui-widget-content .ui-inputfield {
			    font-weight: normal;
			    height: 38px;
			    margin-left: 200px;
    			margin-top: -37px;
			}
			
			
			/* .ui-widget-content .ui-inputfield {
			    margin-right: 110px;
			} */
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formNotaryTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-notary">
					<h:outputText value="#{msg.formNotaryTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
				
				<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="category"><p:outputLabel
									value="#{msg.formNotaryCategory}" for="category" /></label>								
							<h:selectOneMenu id="category" required="true" requiredMessage="#{msg.formNotaryCategory} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{notaryEditBean.notary.notaryCategory.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{notaryEditBean.categoryList}"/>
							</h:selectOneMenu>
							<p:message for="category"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="area"><p:outputLabel
									value="#{msg.formNotaryArea}" for="area" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="area" value="#{notaryEditBean.notary.area}"  required="true" requiredMessage="#{msg.formNotaryArea} #{msg.validateRequired}"/>
							<p:message for="area"/>
						</div>
					</div>
					
					
					
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="notaryName"><p:outputLabel
									value="#{msg.formNotaryNotarisName}" for="notaryName" /></label>								
							<p:inputText id="notaryName" styleClass="form-control" required="true" requiredMessage="#{msg.formNotaryNotarisName} #{msg.validateRequired}"
							value="#{notaryEditBean.notary.notaryName}" />
							<p:message for="notaryName"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="address"><p:outputLabel
									value="#{msg.formNotaryOfficeAddr}" for="address" /></label>								
							<p:inputTextarea id="address" styleClass="form-control" required="true" requiredMessage="#{msg.formNotaryOfficeAddr} #{msg.validateRequired}"
							value="#{notaryEditBean.notary.address}" />
							<p:message for="address"/>
						</div>
					</div>
				
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="areaCode"><p:outputLabel
									value="#{msg.formNotaryAreaCode}" for="areaCode" /></label>								
							<p:inputText id="areaCode" styleClass="form-control" required="true" requiredMessage="#{msg.formNotaryAreaCode} #{msg.validateRequired}"
							value="#{notaryEditBean.notary.areaCode}" />
							<p:message for="areaCode"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="telpNo"><p:outputLabel
									value="#{msg.formNotaryTelpNo}" for="telpNo" /></label>								
							<p:inputText id="telpNo" maxlength="20" styleClass="form-control" required="true" requiredMessage="#{msg.formNotaryTelpNo} #{msg.validateRequired}"
							value="#{notaryEditBean.notary.phoneNo}" />
							<p:message for="telpNo"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="faxNo"><p:outputLabel
									value="#{msg.formNotaryFaxNo}" for="faxNo" /></label>								
							<p:inputText id="faxNo" styleClass="form-control" 
							value="#{notaryEditBean.notary.faxNo}" />
							<p:message for="faxNo"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="email"><p:outputLabel
									value="#{msg.formNotaryEmail}" for="email" /></label>								
							<p:inputText id="email" styleClass="form-control" 
							value="#{notaryEditBean.notary.email}" />
							<p:message for="email"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="mobileNo"><p:outputLabel
									value="#{msg.formNotaryHPNo}" for="mobileNo" /></label>								
							<p:inputText id="mobileNo" styleClass="form-control" maxlength="20" 
							value="#{notaryEditBean.notary.mobileNo}" />
							<p:message for="mobileNo"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="workArea"><p:outputLabel
									value="#{msg.formNotaryWorkingArea}" for="workArea" /></label>								
							<p:inputText id="workArea" styleClass="form-control" 
							value="#{notaryEditBean.notary.workArea}" />
							<p:message for="workArea"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="note"><p:outputLabel
									value="#{msg.formNotaryNote}" for="note" /></label>								
							<p:inputTextarea id="note" styleClass="form-control" 
							value="#{notaryEditBean.notary.note}" />
							<p:message for="note"/>
						</div>
					</div>
					
				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{notaryEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{notaryEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>

			</div>
		</div>
	</ui:define>
</ui:composition>
