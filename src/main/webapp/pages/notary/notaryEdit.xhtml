<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
			.ui-widget-content .ui-inputfield {
			    font-weight: normal;
			    height: 38px;
			    margin-left: 200px;
    			margin-top: -37px;
			}
			.notary-upload-panel .wo-fileupload-wrap {
			    display: block;
			    margin-top: 6px;
			    margin-bottom: 12px;
			    clear: both;
			    position: relative;
			}
			.notary-upload-panel .ui-fileupload-choose input {
			    margin-left: 0;
			    margin-top: 0;
			}
		</style>
		<script type="text/javascript">
		//<![CDATA[
		function notaryShowTab(tab) {
			var ids = {
				form: 'notaryFormPanel',
				lampiran: 'notaryLampiranPanel',
				perpanjangan: 'notaryPerpanjanganPanel'
			};
			for (var key in ids) {
				if (!ids.hasOwnProperty(key)) {
					continue;
				}
				var el = document.getElementById('form:' + ids[key]);
				if (!el) {
					continue;
				}
				el.style.display = (key === tab) ? 'block' : 'none';
			}
		}
		//]]>
		</script>
		<style>
			
			
			/* .ui-widget-content .ui-inputfield {
			    margin-right: 110px;
			} */
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formNotaryTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-notary">
					<h:outputText value="#{msg.formNotaryTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
					<h:panelGroup id="notaryTabButtons" layout="block" styleClass="col-lg-12" style="margin-bottom:10px;">
						<p:commandButton value="Form" process="notaryFormPanel" update="notaryTabButtons"
							actionListener="#{notaryEditBean.openFormTab}"
							oncomplete="notaryShowTab('form')"
							styleClass="#{(not notaryEditBean.showLampiranTab and not notaryEditBean.showLampiranPerpanjanganTab) ? 'btn btn-primary' : 'btn btn-default'}" />
						<p:commandButton value="Lampiran" process="notaryFormPanel" update="notaryTabButtons"
							actionListener="#{notaryEditBean.openLampiranTab}"
							oncomplete="notaryShowTab('lampiran')"
							styleClass="#{notaryEditBean.showLampiranTab ? 'btn btn-primary' : 'btn btn-default'}" />
						<p:commandButton value="Lampiran Perpanjangan" process="notaryFormPanel" update="notaryTabButtons"
							rendered="#{not notaryEditBean.pengajuanNotarisBaru}"
							actionListener="#{notaryEditBean.openLampiranPerpanjanganTab}"
							oncomplete="notaryShowTab('perpanjangan')"
							styleClass="#{notaryEditBean.showLampiranPerpanjanganTab ? 'btn btn-primary' : 'btn btn-default'}" />
					</h:panelGroup>
				</div>
				<p:outputPanel id="notaryTabContent">
				<div class="row" rendered="true">
				<h:panelGroup id="notaryFormPanel" layout="block" style="#{(notaryEditBean.showLampiranTab or notaryEditBean.showLampiranPerpanjanganTab) ? 'display:none' : 'display:block'}">
				
				<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="category"><p:outputLabel
									value="#{msg.formNotaryCategory}" for="category" /></label>								
							<h:selectOneMenu id="category" disabled="#{notaryEditBean.perpanjanganReadOnly}"
								styleClass="form-control s2"
								value="#{notaryEditBean.notary.notaryCategory.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{notaryEditBean.categoryList}"/>
							</h:selectOneMenu>
							<p:message for="category"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="area"><p:outputLabel
									value="#{msg.formNotaryArea}" for="area" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="area" value="#{notaryEditBean.notary.area}" readonly="#{notaryEditBean.perpanjanganReadOnly}"/>
							<p:message for="area"/>
						</div>
					</div>
					
					
					
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="notaryName"><p:outputLabel
									value="#{msg.formNotaryNotarisName}" for="notaryName" /></label>								
							<p:inputText id="notaryName" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.notaryName}" />
							<p:message for="notaryName"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="address"><p:outputLabel
									value="#{msg.formNotaryOfficeAddr}" for="address" /></label>								
							<p:inputTextarea id="address" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.address}" />
							<p:message for="address"/>
						</div>
					</div>
				
					<h:panelGroup layout="block" styleClass="col-lg-12" rendered="#{not notaryEditBean.pengajuanNotarisBaru}">
						<div class="form-group">
							<label class="tl-label" tl="areaCode"><p:outputLabel
									value="#{msg.formNotaryAreaCode}" for="areaCode" /></label>								
							<p:inputText id="areaCode" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.areaCode}" />
							<p:message for="areaCode"/>
						</div>
					</h:panelGroup>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="telpNo"><p:outputLabel
									value="#{msg.formNotaryTelpNo}" for="telpNo" /></label>								
							<p:inputText id="telpNo" maxlength="20" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.phoneNo}" />
							<p:message for="telpNo"/>
						</div>
					</div>
					
					<h:panelGroup layout="block" styleClass="col-lg-12" rendered="#{not notaryEditBean.pengajuanNotarisBaru}">
						<div class="form-group">
							<label class="tl-label" tl="faxNo"><p:outputLabel
									value="#{msg.formNotaryFaxNo}" for="faxNo" /></label>								
							<p:inputText id="faxNo" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.faxNo}" />
							<p:message for="faxNo"/>
						</div>
					</h:panelGroup>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="email"><p:outputLabel
									value="#{msg.formNotaryEmail}" for="email" /></label>								
							<p:inputText id="email" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.email}" />
							<p:message for="email"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="mobileNo"><p:outputLabel
									value="#{msg.formNotaryHPNo}" for="mobileNo" /></label>								
							<p:inputText id="mobileNo" styleClass="form-control" maxlength="20" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.mobileNo}" />
							<p:message for="mobileNo"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="workArea"><p:outputLabel
									value="#{msg.formNotaryWorkingArea}" for="workArea" /></label>								
							<p:inputText id="workArea" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.workArea}" />
							<p:message for="workArea"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="note"><p:outputLabel
									value="#{msg.formNotaryNote}" for="note" /></label>								
							<p:inputTextarea id="note" styleClass="form-control" readonly="#{notaryEditBean.perpanjanganReadOnly}"
							value="#{notaryEditBean.notary.note}" />
							<p:message for="note"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="tanggalPensiun"><p:outputLabel
									value="Tanggal Pensiun" for="tanggalPensiun" /></label>
							<p:calendar id="tanggalPensiun" styleClass="form-control-datepicker-wrap" maxlength="11"
								value="#{notaryEditBean.notary.tanggalPensiun}" autocomplete="off"
								pattern="#{notaryEditBean.inputDateFormat}"
								locale="#{notaryEditBean.inputDateLocale}"
								disabled="#{notaryEditBean.perpanjanganReadOnly}" />
							<p:message for="tanggalPensiun"/>
							<div class="help-block">Diisi berdasarkan tanggal pensiun pada SK PPAT</div>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="tanggalBerakhirPks"><p:outputLabel
									value="Tanggal Berakhir Kerjasama" for="tanggalBerakhirPks" /></label>
							<p:calendar id="tanggalBerakhirPks" styleClass="form-control-datepicker-wrap" maxlength="11"
								value="#{notaryEditBean.notary.tanggalBerakhirPks}" autocomplete="off"
								pattern="#{notaryEditBean.inputDateFormat}"
								locale="#{notaryEditBean.inputDateLocale}" />
							<p:message for="tanggalBerakhirPks"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="noPengajuan"><p:outputLabel
									value="No Pengajuan" for="noPengajuan" /></label>
							<p:inputText id="noPengajuan" styleClass="form-control" readonly="true"
							value="#{notaryEditBean.notary.notaryNo}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="userPengaju"><p:outputLabel
									value="User Pengaju" for="userPengaju" /></label>
							<p:inputText id="userPengaju" styleClass="form-control" readonly="true"
							value="#{notaryEditBean.notary.userPengaju}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="tanggalPengajuan"><p:outputLabel
									value="Tanggal Pengajuan" for="tanggalPengajuan" /></label>
							<p:inputText id="tanggalPengajuan" styleClass="form-control" readonly="true"
							value="#{notaryEditBean.notary.tanggalPengajuan}">
								<f:convertDateTime pattern="dd-MMM-yyyy" locale="en" />
							</p:inputText>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="jenisPengajuan"><p:outputLabel
									value="Jenis Pengajuan" for="jenisPengajuan" /></label>
							<p:inputText id="jenisPengajuan" styleClass="form-control" readonly="true"
							value="#{notaryEditBean.notary.jenisPengajuan}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="status"><p:outputLabel
									value="Status" for="status" /></label>
							<p:inputText id="status" styleClass="form-control" readonly="true"
							value="#{notaryEditBean.notary.status}" />
						</div>
					</div>
					
				</h:panelGroup>
				<h:panelGroup id="notaryLampiranPanel" layout="block" style="#{notaryEditBean.showLampiranTab ? 'display:block' : 'display:none'}">
					<p:remoteCommand name="onCompleteUploadLampiran" update="notaryLampiranList"></p:remoteCommand>
					<p:dataTable id="lampiranUploadTable" var="doc"
						value="#{notaryEditBean.lampiranList}"
						rowKey="#{doc.attachmentType}"
						emptyMessage=""
						paginator="false">
						<p:column headerText="Lampiran">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText value="#{doc.attachmentType}" />
								</label>
								<p:fileUpload
    rendered="#{!notaryEditBean.pengajuanPerpanjangan}"
    fileUploadListener="#{notaryEditBean.handleLampiranFileUpload}"
    oncomplete="onCompleteUploadLampiran()"
    mode="advanced"
    auto="true"
    dragDropSupport="false"
    multiple="false"
    sizeLimit="#{notaryEditBean.standardAttachmentSize}">
    <f:attribute name="attachmentType" value="#{doc.attachmentType}" />
</p:fileUpload>
							</div>
						</p:column>
					</p:dataTable>
					<div class="col-lg-12">
						<p:dataList value="#{notaryEditBean.lampiranList}" var="vo"
							id="notaryLampiranList" emptyMessage="" rowIndexVar="index">
							<table>
								<tr>
									<td style="width:70%; padding-right: 10px;">
										<h:outputText value="#{vo.attachmentType}" />
										<h:outputText value=" : " />
										<p:commandLink rendered="#{not empty vo.fileId}"
											title="#{vo.attachmentFile}" ajax="false" immediate="true"
											actionListener="#{notaryEditBean.downloadFile(vo.fileId,vo.attachmentFile,null)}"
											target="_blank">#{vo.attachmentFile}</p:commandLink>
										<h:outputText rendered="#{empty vo.fileId}" value="-" />
									</td>
									<td>
										<p:commandLink rendered="#{not empty vo.fileId and !notaryEditBean.pengajuanPerpanjangan}" immediate="true"
											actionListener="#{notaryEditBean.deleteLampiranAttachment(vo.fileId, vo.attachmentType)}"
											update="notaryLampiranList">#{msg.buttonDelete}</p:commandLink>
									</td>
								</tr>
							</table>
						</p:dataList>
					</div>
				</h:panelGroup>
				<h:panelGroup id="notaryPerpanjanganPanel" layout="block" styleClass="notary-upload-panel"
					rendered="#{not notaryEditBean.pengajuanNotarisBaru}"
					style="#{notaryEditBean.showLampiranPerpanjanganTab ? 'display:block' : 'display:none'}">
					<p:remoteCommand name="onCompleteUploadLampiranPerpanjangan" update="notaryLampiranPerpanjanganList"></p:remoteCommand>
					<div class="col-lg-12" style="margin-bottom:10px;">
						<h4 class="tl-label">Kelengkapan Dokumen Rekanan Notaris/PPAT</h4>
						<p>Dokumen berikut wajib diupload pada jenis pengajuan Perpanjangan. Pada jenis pengajuan lain tab ini hanya dapat dilihat.</p>
					</div>
					<div class="col-lg-12">
						<p:outputPanel id="perpSlot1" styleClass="form-group">
							<label class="tl-label">1. Perjanjian Kerjasama (PKS)</label>
							<p:fileUpload id="perpUpload1" label="Upload" styleClass="wo-fileupload-wrap"
								rendered="#{notaryEditBean.perpanjanganUploadEnabled}"
								fileUploadListener="#{notaryEditBean.handleLampiranPerpanjanganFileUpload}"
								mode="advanced" auto="true" dragDropSupport="false" multiple="false"
								sizeLimit="10485760" update="perpSlot1 notaryLampiranPerpanjanganList msgs">
								<f:attribute name="attachmentType" value="Perjanjian Kerjasama (PKS)" />
							</p:fileUpload>
							<h:outputText value="Read only" rendered="#{not notaryEditBean.perpanjanganUploadEnabled}" />
							<h:outputText value="#{notaryEditBean.lampiranPerpanjanganList[0].attachmentFile}"
								rendered="#{not empty notaryEditBean.lampiranPerpanjanganList[0].fileId}" />
						</p:outputPanel>
						<p:outputPanel id="perpSlot2" styleClass="form-group">
							<label class="tl-label">2. Lampiran 1-Surat Pernyataan</label>
							<p:fileUpload id="perpUpload2" label="Upload" styleClass="wo-fileupload-wrap"
								rendered="#{notaryEditBean.perpanjanganUploadEnabled}"
								fileUploadListener="#{notaryEditBean.handleLampiranPerpanjanganFileUpload}"
								mode="advanced" auto="true" dragDropSupport="false" multiple="false"
								sizeLimit="10485760" update="perpSlot2 notaryLampiranPerpanjanganList msgs">
								<f:attribute name="attachmentType" value="Lampiran 1-Surat Pernyataan" />
							</p:fileUpload>
							<h:outputText value="Read only" rendered="#{not notaryEditBean.perpanjanganUploadEnabled}" />
							<h:outputText value="#{notaryEditBean.lampiranPerpanjanganList[1].attachmentFile}"
								rendered="#{not empty notaryEditBean.lampiranPerpanjanganList[1].fileId}" />
						</p:outputPanel>
						<p:outputPanel id="perpSlot4" styleClass="form-group">
							<label class="tl-label">4. Formulir Penilaian Notaris</label>
							<p:fileUpload id="perpUpload4" label="Upload" styleClass="wo-fileupload-wrap"
								rendered="#{notaryEditBean.perpanjanganUploadEnabled}"
								fileUploadListener="#{notaryEditBean.handleLampiranPerpanjanganFileUpload}"
								mode="advanced" auto="true" dragDropSupport="false" multiple="false"
								sizeLimit="10485760" update="perpSlot4 notaryLampiranPerpanjanganList msgs">
								<f:attribute name="attachmentType" value="Formulir Penilaian Notaris" />
							</p:fileUpload>
							<h:outputText value="Read only" rendered="#{not notaryEditBean.perpanjanganUploadEnabled}" />
							<h:outputText value="#{notaryEditBean.lampiranPerpanjanganList[2].attachmentFile}"
								rendered="#{not empty notaryEditBean.lampiranPerpanjanganList[2].fileId}" />
						</p:outputPanel>
						<p:outputPanel id="perpSlot5" styleClass="form-group">
							<label class="tl-label">5. Formulir AP Assessment</label>
							<p:fileUpload id="perpUpload5" label="Upload" styleClass="wo-fileupload-wrap"
								rendered="#{notaryEditBean.perpanjanganUploadEnabled}"
								fileUploadListener="#{notaryEditBean.handleLampiranPerpanjanganFileUpload}"
								mode="advanced" auto="true" dragDropSupport="false" multiple="false"
								sizeLimit="10485760" update="perpSlot5 notaryLampiranPerpanjanganList msgs">
								<f:attribute name="attachmentType" value="Formulir AP Assessment" />
							</p:fileUpload>
							<h:outputText value="Read only" rendered="#{not notaryEditBean.perpanjanganUploadEnabled}" />
							<h:outputText value="#{notaryEditBean.lampiranPerpanjanganList[3].attachmentFile}"
								rendered="#{not empty notaryEditBean.lampiranPerpanjanganList[3].fileId}" />
						</p:outputPanel>
						<p:outputPanel id="perpSlot6" styleClass="form-group">
							<label class="tl-label">6. Formulir Third Party Assessment Checklist (aspek PDP)</label>
							<p:fileUpload id="perpUpload6" label="Upload" styleClass="wo-fileupload-wrap"
								rendered="#{notaryEditBean.perpanjanganUploadEnabled}"
								fileUploadListener="#{notaryEditBean.handleLampiranPerpanjanganFileUpload}"
								mode="advanced" auto="true" dragDropSupport="false" multiple="false"
								sizeLimit="10485760" update="perpSlot6 notaryLampiranPerpanjanganList msgs">
								<f:attribute name="attachmentType" value="Formulir Third Party Assessment Checklist (aspek PDP)" />
							</p:fileUpload>
							<h:outputText value="Read only" rendered="#{not notaryEditBean.perpanjanganUploadEnabled}" />
							<h:outputText value="#{notaryEditBean.lampiranPerpanjanganList[4].attachmentFile}"
								rendered="#{not empty notaryEditBean.lampiranPerpanjanganList[4].fileId}" />
						</p:outputPanel>
						<p:outputPanel id="perpSlot7" styleClass="form-group">
							<label class="tl-label">7. Hasil SLIK 1 (satu) bulan terakhir sebelum tanggal pengajuan dengan hasil kolektibilitas lancar</label>
							<p:fileUpload id="perpUpload7" label="Upload" styleClass="wo-fileupload-wrap"
								rendered="#{notaryEditBean.perpanjanganUploadEnabled}"
								fileUploadListener="#{notaryEditBean.handleLampiranPerpanjanganFileUpload}"
								mode="advanced" auto="true" dragDropSupport="false" multiple="false"
								sizeLimit="10485760" update="perpSlot7 notaryLampiranPerpanjanganList msgs">
								<f:attribute name="attachmentType" value="Hasil SLIK 1 (satu) bulan terakhir sebelum tanggal pengajuan dengan hasil kolektibilitas lancar" />
							</p:fileUpload>
							<h:outputText value="Read only" rendered="#{not notaryEditBean.perpanjanganUploadEnabled}" />
							<h:outputText value="#{notaryEditBean.lampiranPerpanjanganList[5].attachmentFile}"
								rendered="#{not empty notaryEditBean.lampiranPerpanjanganList[5].fileId}" />
						</p:outputPanel>
					</div>
					<div class="col-lg-12">
						<p:dataList value="#{notaryEditBean.lampiranPerpanjanganList}" var="vo"
							id="notaryLampiranPerpanjanganList" emptyMessage="" rowIndexVar="index">
							<table>
								<tr>
									<td style="width:40px; text-align:center;">
										<h:outputText value="#{vo.documentNo}" />
									</td>
									<td style="width:70%; padding-right: 10px;">
										<h:outputText value="#{vo.attachmentType}" />
										<h:outputText value=" : " />
										<p:commandLink rendered="#{not empty vo.fileId}"
											title="#{vo.attachmentFile}" ajax="false" immediate="true"
											actionListener="#{notaryEditBean.downloadFile(vo.fileId,vo.attachmentFile,null)}"
											target="_blank">#{vo.attachmentFile}</p:commandLink>
										<h:outputText rendered="#{empty vo.fileId}" value="-" />
									</td>
									<td>
										<p:commandLink rendered="#{not empty vo.fileId and notaryEditBean.perpanjanganUploadEnabled}"
											immediate="true"
											actionListener="#{notaryEditBean.deleteLampiranPerpanjanganAttachment(vo.fileId, vo.attachmentType)}"
											update="notaryLampiranPerpanjanganList">#{msg.buttonDelete}</p:commandLink>
									</td>
								</tr>
							</table>
						</p:dataList>
					</div>
				</h:panelGroup>
				</div>
				</p:outputPanel>
			</div>

			<div class="box-footer">
				<h:commandButton value="Submit" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{notaryEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{notaryEditBean.cancel()}" immediate="true"
