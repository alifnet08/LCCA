
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formNotaryTitle}" />
	</ui:define>
	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><p:commandLink process="@this" ajax="true" styleClass="tl-label"
					onclick="PF('dlgJenisPengajuan').show(); return false;">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</p:commandLink></li>
		</ul>
	</ui:define>


	<ui:define name="ajaxLoading">
		<p:ajaxStatus onstart="PF('statusDialog').show()"
			onsuccess="PF('statusDialog').hide();"
			oncomplete="PF('statusDialog').hide();"
			onerror="PF('statusDialog').hide();" />
	</ui:define>

	<ui:define name="content">
		 <div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">

					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formNotaryArea}" /></label>
							<p:inputText id="area" styleClass="form-control"
								autocomplete="off" value="#{notaryBean.area}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formNotaryNotarisName}" /></label>
							<p:inputText id="notarisName" styleClass="form-control"
								autocomplete="off" value="#{notaryBean.notaryName}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formNotaryAreaCode}" /></label>
							<p:inputText id="areaCode" styleClass="form-control"
								autocomplete="off" value="#{notaryBean.areaCode}"></p:inputText>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{notaryBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{notaryBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<li><p:outputPanel id="outputPanelError">
								      <h:commandLink id="errorLink" styleClass="btn btn-warning tl-label" rendered="#{notaryBean.flagError}">
									      <i class="fa fa-table"></i> &nbsp;
		        						  <h:outputText value="Error List" />
										  <p:fileDownload value="#{notaryBean.dataError}" />	
									  </h:commandLink>
									</p:outputPanel>   
								</li>
								<li>								
							    <p:fileUpload
										fileUploadListener="#{notaryBean.handleFileUpload}"
										value="#{notaryBean.uploadedFiles}"
										mode="advanced" auto="true" adragDropSupport="false"
										multiple="false" update="deletedMessage"
										 />
							    </li>
								<p:remoteCommand name="onclickDownload" update="@form form:outputPanelError"></p:remoteCommand>
								<li><h:commandLink styleClass="btn btn-warning tl-label" onclick="onclickDownload();PF('statusDialog').hide();">
									   <i class="fa fa-table"></i> &nbsp;
		        						  <h:outputText value="#{msg.formExternalRegulationExportToExcel}" />
										  <p:fileDownload value="#{notaryBean.dataPostProcessXLS}" />	
										<!-- <p:dataExporter type="xls" target="tableSearch"
											fileName="Notaris" pageOnly="true"
											postProcessor="notaryBean.postProcessXLS}" /> -->
									</h:commandLink></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{notaryBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}"
								rows="#{notaryBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;width:10%;"
									headerText="#{msg.formAction}">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}" style="display:none"
										action="#{notaryBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.notaryId}" />
									</p:commandLink>

									<h:outputText style="display:none; padding-left:4px; color:grey;'"
										value=" | " />
									<h:outputLabel value="&#160;" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label" update="tableSearch form:deletedMessage"
										action="#{notaryBean.delete(vo.notaryId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formNotaryCategory}" style="text-align:center;width:15%;">
									<h:outputLabel value="#{vo.notaryCategory.nameIn}" />
								</p:column>
								<p:column headerText="#{msg.formNotaryArea}">
									<h:outputLabel value="#{vo.area}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryNotarisName}">
									<h:outputLabel value="#{vo.notaryName}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryOfficeAddr}">
									<h:outputLabel value="#{vo.address}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryAreaCode}">
									<h:outputLabel value="#{vo.areaCode}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryTelpNo}">
									<h:outputLabel value="#{vo.phoneNo}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryFaxNo}">
									<h:outputLabel value="#{vo.faxNo}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryEmail}">
									<h:outputLabel value="#{vo.email}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryHPNo}">
									<h:outputLabel value="#{vo.mobileNo}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryWorkingArea}">
									<h:outputLabel value="#{vo.workArea}" />
								</p:column>
								
								<p:column headerText="#{msg.formNotaryNote}">
									<h:outputLabel value="#{vo.note}" />
								</p:column>

								<p:column headerText="No Pengajuan">
									<h:outputLabel value="#{vo.notaryNo}" />
								</p:column>

								<p:column headerText="User Pengaju">
									<h:outputLabel value="#{vo.userPengaju}" />
								</p:column>

								<p:column headerText="Tanggal Pengajuan">
									<h:outputLabel value="#{vo.tanggalPengajuan}" style="text-align:center" >
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputLabel>
								</p:column>

								<p:column headerText="Jenis Pengajuan">
									<h:outputLabel value="#{vo.jenisPengajuan}" />
								</p:column>

								<p:column headerText="Status">
									<h:outputLabel value="#{vo.status}" />
								</p:column>

								<p:column headerText="Tanggal Pensiun">
									<h:outputLabel value="#{vo.tanggalPensiun}" style="text-align:center" >
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputLabel>
								</p:column>

								<p:column headerText="Tanggal Berakhir Kerjasama">
									<h:outputLabel value="#{vo.tanggalBerakhirPks}" style="text-align:center" >
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputLabel>
								</p:column>
								
								<p:column headerText="#{msg.formNotaryCreatedDate}">
								<h:outputLabel value="#{vo.creationDate}" style="text-align:center" >
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputLabel>		
								</p:column>
								
								<p:column headerText="#{msg.formNotaryLastUpdated}">
								<h:outputLabel value="#{vo.lastUpdateDate}" style="text-align:center" >
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputLabel>		
								</p:column>
								
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div> 

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<p:dialog id="dlgJenisPengajuan" widgetVar="dlgJenisPengajuan" header="Jenis Pengajuan"
			modal="true" resizable="false" closable="true" width="400" appendTo="@form">
			<div class="form-group">
				<p:commandLink value="Tambah Notaris" process="@this" ajax="false"
					immediate="true" action="#{notaryBean.navigateTambahNotaris}"
					styleClass="btn btn-default btn-block tl-label" />
			</div>
			<div class="form-group">
				<p:commandButton value="Perpanjangan" process="@this" global="false"
					actionListener="#{notaryBean.openPerpanjangan}"
					update="form:dlgPerpanjangan form:deletedMessage"
					onclick="PF('dlgJenisPengajuan').hide(); PF('statusDialog').hide();"
					oncomplete="PF('statusDialog').hide(); setTimeout(function(){ PF('dlgPerpanjangan').show(); }, 50);"
					styleClass="btn btn-default btn-block tl-label" />
			</div>
			<div class="form-group">
				<p:commandButton value="Update Dokumen Pendukung" process="@this" global="false"
					actionListener="#{notaryBean.openUpdateDokumen}"
					update="form:dlgPerpanjangan form:deletedMessage"
					onclick="PF('dlgJenisPengajuan').hide(); PF('statusDialog').hide();"
					oncomplete="PF('statusDialog').hide(); setTimeout(function(){ PF('dlgPerpanjangan').show(); }, 50);"
					styleClass="btn btn-default btn-block tl-label" />
			</div>
		</p:dialog>

		<p:dialog id="dlgPerpanjangan" widgetVar="dlgPerpanjangan" header="Pilih Notaris"
			modal="true" resizable="false" closable="true" width="800" appendTo="@form">
			<p:dataTable id="tablePerpanjangan" var="vo"
				value="#{notaryBean.perpanjanganList}"
				selection="#{notaryBean.selectedNotary}"
				selectionMode="single" rowKey="#{vo.notaryId}"
				emptyMessage="#{msg.textNodata}"
				paginator="true" rows="10"
				paginatorAlwaysVisible="false">
				<p:ajax event="rowSelect" global="false"
					listener="#{notaryBean.onPickerRowSelect}"
					process="form:tablePerpanjangan" />
				<p:ajax event="rowUnselect" global="false"
					process="form:tablePerpanjangan" />
				<p:column selectionMode="single" style="width:40px;text-align:center" />
				<p:column headerText="Nama Notaris">
					<h:outputLabel value="#{vo.notaryName}" />
				</p:column>
				<p:column headerText="Kategori">
					<h:outputLabel value="#{vo.notaryCategory != null ? vo.notaryCategory.nameIn : ''}" />
				</p:column>
				<p:column headerText="Area">
					<h:outputLabel value="#{vo.area}" />
				</p:column>
				<p:column headerText="Email">
					<h:outputLabel value="#{vo.email}" />
				</p:column>
			</p:dataTable>
			<div class="filter-tools" style="margin-top:10px;">
				<ul class="no-margin no-padding pull-right">
					<li>
						<p:commandButton value="Close" type="button" process="@this"
							onclick="PF('dlgPerpanjangan').hide();"
							styleClass="btn btn-default btn-flat tl-label" />
					</li>
					<li>
						<p:commandButton value="Add" action="#{notaryBean.navigatePerpanjangan}"
							ajax="false" process="@this form:tablePerpanjangan"
							styleClass="btn btn-success tl-label" />
					</li>
				</ul>
			</div>
		</p:dialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formRCDeleteRC}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
