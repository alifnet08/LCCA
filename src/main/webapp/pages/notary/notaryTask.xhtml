<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="Daftar Tugas - Daftar Notaris" />
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="msgs" globalOnly="true" />
				<div class="row">
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText value="#{msg.formNotaryArea}" /></label>
							<p:inputText styleClass="form-control" autocomplete="off"
								value="#{notaryTaskBean.area}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText value="#{msg.formNotaryNotarisName}" /></label>
							<p:inputText styleClass="form-control" autocomplete="off"
								value="#{notaryTaskBean.notaryName}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}" ajax="true"
										update="tableSearch" styleClass="btn btn-success tl-label"
										actionListener="#{notaryTaskBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch" styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{notaryTaskBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{notaryTaskBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{notaryTaskBean.paging}"
								rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column headerText="Nomor Pengajuan">
									<h:outputText value="#{vo.notaryNo}"
										rendered="#{notaryTaskBean.cduMaker}" />
									<p:commandLink action="#{notaryTaskBean.openTask}" ajax="false"
										styleClass="tl-label"
										rendered="#{not notaryTaskBean.cduMaker}">
										<f:param name="id" value="#{vo.notaryId}" />
										<h:outputText value="#{vo.notaryNo}" />
									</p:commandLink>
								</p:column>
								<p:column headerText="User Pengaju">
									<h:outputLabel value="#{vo.userPengaju}" />
								</p:column>
								<p:column headerText="Jenis Pengajuan">
									<h:outputLabel value="#{vo.jenisPengajuan}" />
								</p:column>
								<p:column headerText="Region">
									<h:outputLabel value="#{vo.area}" />
								</p:column>
								<p:column headerText="Kategori">
									<h:outputLabel value="#{vo.notaryCategory.nameIn}" />
								</p:column>
								<p:column headerText="Tanggal Submit">
									<h:outputLabel value="#{vo.tanggalPengajuan}">
										<f:convertDateTime pattern="dd-MMM-yyyy" locale="en" />
									</h:outputLabel>
								</p:column>
								<p:column headerText="Status Pengajuan">
									<h:outputLabel value="#{vo.status}" />
								</p:column>
								<p:column headerText="#{msg.formAction}" style="text-align:center;width:12%;">
									<p:commandLink value="Submit" ajax="false"
										rendered="#{notaryTaskBean.cduMaker and vo.status eq 'revision'}"
										action="#{notaryTaskBean.openMakerSubmit}"
										styleClass="btn btn-primary tl-label">
										<f:param name="id" value="#{vo.notaryId}" />
									</p:commandLink>
								</p:column>
								<p:column headerText="History">
									<p:commandButton value="History" process="@this"
										actionListener="#{notaryTaskBean.openHistory(vo)}"
										update="form:dlgHistory" oncomplete="PF('dlgHistory').show();"
										styleClass="btn btn-default btn-flat" />
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:dialog id="dlgHistory" widgetVar="dlgHistory" header="History Pengajuan"
			modal="true" resizable="false" width="700" appendTo="@form">
			<div class="form-group">
				<label>Nomor Pengajuan</label>
				<p:inputText readonly="true" styleClass="form-control"
					rendered="#{notaryTaskBean.selectedHistoryNotary != null}"
					value="#{notaryTaskBean.selectedHistoryNotary.notaryNo}" />
			</div>
			<p:dataTable value="#{notaryTaskBean.historyList}" var="hist"
				emptyMessage="#{msg.textNodata}">
				<p:column headerText="Status">
					<h:outputText value="#{hist.status}" />
				</p:column>
				<p:column headerText="Tanggal">
					<h:outputText value="#{hist.creationDate}">
						<f:convertDateTime pattern="dd-MMM-yyyy" locale="en" />
					</h:outputText>
				</p:column>
				<p:column headerText="Catatan Revisi">
					<h:outputText value="#{hist.catatanRevisi}" />
				</p:column>
			</p:dataTable>
			<p:commandButton value="Close" type="button" process="@this"
				onclick="PF('dlgHistory').hide();" styleClass="btn btn-default" />
		</p:dialog>
	</ui:define>
</ui:composition>
