<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formDocumentTypeRegTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:growl id="messages" rendered="true" />
	<div class="box box-solid">
      <div class="box-header with-border">
        <h3 class="box-title tl-label" tl="new-master-document-type"><h:outputText value="#{msg.formDocumentTypeRegAddTitle}" /></h3>
      </div>
      <div class="box-body">
        <div class="row">
            <div class="col-lg-12">
              <div class="form-group required">
                <label for="jenis_ketentuan" class="control-label tl-label" tl="provision-type"><p:outputLabel value="#{msg.formDocumentTypeProvType}" for="docProv" /></label>
                <h:selectOneMenu id="docProv" required="true" requiredMessage="#{msg.formDocumentTypeProvType} #{msg.validateRequired}"
                	disabled="#{(documentTypeEditBean.actionMode eq 'EDIT') == true}" 
                	styleClass="form-control s2" value="#{documentTypeEditBean.documentType.parameterDetail.parameterDtlCode}">
                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
			    <f:selectItems value="#{documentTypeEditBean.provTypes}"/>
                </h:selectOneMenu>
                <p:message for="docProv"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" tl="document-type--form-id">
                	<p:outputLabel value="#{msg.formDocumentTypeReg}" for="docTypeIn" />
                </label>
                <p:inputText id="docTypeIn" maxlength="100" required="true" requiredMessage="#{msg.formDocumentTypeReg} #{msg.validateRequired}"
                	autocomplete="off" styleClass="form-control form-required" value="#{documentTypeEditBean.documentType.documentTypeIn}"></p:inputText>
                <p:message for="docTypeIn"/>
              </div>
            </div>
            <!-- <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" tl="document-type-form-en"><p:outputLabel value="#{msg.formDocumentTypeTitle}" for="docTypeEn" />&#160;&#160;<span class="label label-warning">
                	<h:outputLabel value="#{msg.english}"/>
                </span></label>
                <p:inputText id="docTypeEn" maxlength="100" required="true" requiredMessage="#{msg.formDocumentTypeTitle} #{msg.english} #{msg.validateRequired}"
                	autocomplete="off" styleClass="form-control form-required" value="#{documentTypeEditBean.documentType.documentTypeEn}"></p:inputText>
                <p:message for="docTypeEn"/>
              </div>
            </div> -->
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" tl="description-type"><p:outputLabel value="#{msg.formDocumentTypeRegTypeDesc}" for="docTypeDesc" /></label>
                <p:inputText id="docTypeDesc" maxlength="200" required="true" requiredMessage="#{msg.formDocumentTypeRegTypeDesc} #{msg.validateRequired}"
                	autocomplete="off" styleClass="form-control form-required" value="#{documentTypeEditBean.documentType.typeDescription}"></p:inputText>
                <p:message for="docTypeDesc"/>
              </div>
            </div>
          </div>
      </div>
      <div class="box-footer">
        <h:commandButton value="#{msg.buttonSave}" type="submit"
							styleClass="btn btn-primary pull-left"
							actionListener="#{documentTypeEditBean.save()}"></h:commandButton>
        <h:commandLink value="#{msg.buttonCancel}" actionListener="#{documentTypeEditBean.cancel()}" immediate="true"
							styleClass="btn btn-default pull-right tl-label"></h:commandLink>
      </div>
    </div>
	</ui:define>
</ui:composition>
