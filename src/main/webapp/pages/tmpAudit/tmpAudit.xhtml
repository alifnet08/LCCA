<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}

.ui-state-default.form-control {
	background: #F7F8F8;
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formAuditTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{tmpAuditBean.getNavigateEdit()}"
					ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">


		<p:growl id="deletedMessage" globalOnly="true" />
		<div class="box box-solid">
			<div class="box-body">
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="row">
							<div class="col-lg-4">
								<h:panelGroup id="panelAuditTemplate">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditTemplateName}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{tmpAuditBean.searchAuditTemplateName}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems value="#{tmpAuditBean.selectAuditTemplateName}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>

							<div class="col-lg-4">
								<h:panelGroup id="panelAuditFollowUp">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditType}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{tmpAuditBean.searchAuditFollowUp}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems value="#{tmpAuditBean.selectAuditFollowUp}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>

							<div class="col-lg-4">
								<h:panelGroup id="panelAuditFinding">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditFindingName}" /></label>
										<p:inputText id="auditFinding" styleClass="form-control"
											value="#{tmpAuditBean.searchAuditFindingsName}"
											autocomplete="off"></p:inputText>
									</div>
								</h:panelGroup>
							</div>
						</div>

						<div class="row">
							<div class="col-lg-4">
								<h:panelGroup id="panelAuditObject">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditObject}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{tmpAuditBean.searchAuditObject}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems value="#{tmpAuditBean.selectAuditObject}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>

							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label" tl=""><h:outputText
											value="#{msg.formAuditStatus}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{tmpAuditBean.searchStatusCode}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{tmpAuditBean.status}" />
									</h:selectOneMenu>
								</div>
							</div>

							<div class="col-lg-4">
								<div class="form-group">
									<label><h:outputText value="#{msg.formAuditPeriode}" /></label>
									<div class="input-group">
										<p:calendar styleClass="form-control-datepicker-wrap"
											placeholder="#{msg.from}" maxlength="11"
											value="#{tmpAuditBean.searchAuditPeriodFrom}"
											autocomplete="off" pattern="#{tmpAuditBean.inputDateFormat}"
											locale="#{tmpAuditBean.inputDateLocale}"></p:calendar>
										<span class="input-group-addon plain">-</span>

										<p:calendar styleClass="form-control-datepicker-wrap"
											placeholder="#{msg.to}" maxlength="11"
											value="#{tmpAuditBean.searchAuditPeriodTo}"
											autocomplete="off" pattern="#{tmpAuditBean.inputDateFormat}"
											locale="#{tmpAuditBean.inputDateLocale}"></p:calendar>

									</div>
								</div>
							</div>
						</div>

						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label><h:outputText value="#{msg.formAuditTargetDate}" /></label>
									<div class="input-group">
										<p:calendar styleClass="form-control-datepicker-wrap"
											placeholder="#{msg.from}" maxlength="11"
											value="#{tmpAuditBean.searchAuditTargetFrom}"
											autocomplete="off" pattern="#{tmpAuditBean.inputDateFormat}"
											locale="#{tmpAuditBean.inputDateLocale}"></p:calendar>
										<span class="input-group-addon plain">-</span>

										<p:calendar styleClass="form-control-datepicker-wrap"
											placeholder="#{msg.to}" maxlength="11"
											value="#{tmpAuditBean.searchAuditTargetTo}"
											autocomplete="off" pattern="#{tmpAuditBean.inputDateFormat}"
											locale="#{tmpAuditBean.inputDateLocale}"></p:calendar>

									</div>
								</div>
							</div>

							<div class="col-lg-4">
								<h:panelGroup id="panelAuditDivisiPic">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditPICAndWorkUnitDivision}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{tmpAuditBean.searchDivision}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems value="#{tmpAuditBean.selectDivisions}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>

							<div class="col-lg-2">
								<h:panelGroup id="panelAuditFollowupStatus">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditPICFollowupStatus}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{tmpAuditBean.searchFollowupStatus}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItem itemLabel="#{msg.formNA}" itemValue="x" />
											<f:selectItems value="#{tmpAuditBean.selectFollowupStatus}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>

							<div class="col-lg-2">
								<h:panelGroup id="panelAuditVerificationStatus">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formAuditPICStatusConfirmation}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{tmpAuditBean.searchComplianceStatus}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItem itemLabel="#{msg.formNA}" itemValue="x" />
											<f:selectItems value="#{tmpAuditBean.selectComplianceStatus}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>
						</div>
					</h:panelGroup>

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tmpAuditDataTable"
										styleClass="btn btn-success tl-label"
										actionListener="#{tmpAuditBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tmpAuditDataTable panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{tmpAuditBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
								<li><h:commandLink styleClass="btn btn-warning tl-label"
										onclick="onclickDownload(); PF('statusDialog').hide()">
										<i class="fa fa-table"></i> &nbsp;
		        	                    <h:outputText
											value="#{msg.formAuditPICExportToExcel}" />

										<p:dataExporter type="xls" target="tmpAuditDataTable"
											fileName="audit" pageOnly="true"
											postProcessor="#{tmpAuditBean.postProcessXLS}"
										 />
									</h:commandLink></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
							<div class="div-wrapper"></div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="tmpAuditDataTable" paginator="true" var="vo"
								value="#{tmpAuditBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{tmpAuditBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column width="100" headerText="#{msg.formAction}"
									exportable="false" style="text-align:center;" groupRow="true">

									<h:outputLabel value="#{msg.formWaitingForApproval}"
										rendered="#{vo.statusCd eq 'DATA_NEW'}" />

									<h:outputLabel value="&#160;"
										rendered="#{vo.statusCd ne 'DATA_NEW'}" />
									<p:commandLink id="edit"
										rendered="#{vo.statusCd ne 'DATA_NEW'}"
										value="#{msg.buttonEdit}"
										action="#{tmpAuditBean.getNavigateEdit()}" ajax="false"
										styleClass="tl-label">
										<f:param name="id" value="#{vo.auditId}" />
									</p:commandLink>
								&#160;
								<h:outputLabel value="|"
										rendered="#{vo.followupStatusCd eq null and vo.statusCd ne 'DATA_NEW'}" />
									<h:outputLabel value="&#160;"
										rendered="#{vo.followupStatusCd eq null and vo.statusCd ne 'DATA_NEW'}" />
									<p:commandLink id="Delete"
										rendered="#{vo.followupStatusCd eq null and vo.statusCd ne 'DATA_NEW'}"
										value="#{msg.buttonDelete}" styleClass="tl-label"
										update="tmpAuditDataTable form:deletedMessage"
										action="#{tmpAuditBean.delete(vo.auditId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>
								<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>
								
								<p:column headerText="#{msg.formAuditTemplateName}" width="100" groupRow="true">
									<h:outputLabel value="#{vo.auditTemplateName}" title="#{vo.auditTemplateName}"
										style="vertical-align: top;" />
									<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>

								<p:column headerText="#{msg.formAuditType}" width="100" groupRow="true">
									<h:outputLabel value="#{vo.auditor}" title="#{vo.auditor}"
										style="vertical-align: top;" />
									<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>
								
								<p:column headerText="#{msg.formAuditFindingName}" width="150" groupRow="true">
									<h:outputLabel value="#{vo.findingNameIn}"
										title="#{vo.findingNameIn}" />
								</p:column>
								
								<p:column headerText="#{msg.formAuditObject}" width="150" groupRow="true">
									<h:outputLabel value="#{vo.auditObject}"
										title="#{vo.auditObject}" />
									<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>

								<!-- <p:column
									headerText="#{msg.formAuditTopic}"
									width="150">
									<h:outputLabel value="#{vo.auditTopic}" title="#{vo.auditTopic}"/>
								</p:column> -->

								<p:column headerText="#{msg.formAuditCategory}" width="100" groupRow="true">
									<h:outputLabel value="#{vo.auditCategory}"
										title="#{vo.auditCategory}" style="vertical-align: top;" />
									<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>

								<p:column headerText="#{msg.formAuditPeriode}" width="150" groupRow="true">
									<h:outputLabel value="#{vo.auditDateFrom} - #{vo.auditDateTo}" />
									<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>

								<p:column headerText="#{msg.formAuditScope}" width="150" groupRow="true">
									<h:outputLabel value="#{vo.scope}" />
									<h:outputLabel value="#{vo.auditId}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>

								<p:column headerText="#{msg.formAuditStatus}" width="150"
									style="text-align:center;" groupRow="true">

									<h:outputLabel rendered="#{vo.statusCd eq 'DATA_ACTIVE'}">
										<span class="label label-success"> <h:outputText
												value="#{vo.status}" />
										</span>
									</h:outputLabel>
									<h:outputLabel rendered="#{vo.statusCd eq 'DATA_INACTIVE'}">
										<span class="label label-danger"> <h:outputText
												value="#{vo.status}" />
										</span>
									</h:outputLabel>
									<h:outputLabel rendered="#{vo.statusCd eq 'DATA_NEW'}">
										<span class="label label-info"> <h:outputText
												value="#{vo.status}" />
										</span>
									</h:outputLabel>
									<h:outputLabel rendered="#{vo.statusCd eq 'DATA_REVISE'}">
										<span class="label label-warning"> <h:outputText
												value="#{vo.status}" />
										</span>
									</h:outputLabel>
									<h:outputLabel value="#{vo.findingNameIn}"
										style="vertical-align: top;visibility:hidden;" />
								</p:column>

								<p:column headerText="#{msg.formAuditPICConfirmation}"
									width="150">
									<h:outputLabel value="#{vo.pic1}" />
								</p:column>
								
								<p:column headerText="#{msg.formAuditTargetDate}" width="150">
									<h:outputLabel value="#{vo.targetDate}" />
								</p:column>

								<p:column headerText="#{msg.formAuditPICFollowupStatus}"
									width="150">
									<h:outputLabel value="#{vo.followupStatus}" />
								</p:column>

								<p:column headerText="#{msg.formAuditPICConfirmationDate}"
									width="150">
									<h:outputLabel value="#{vo.confirmationDate}" />
								</p:column>

								<p:column headerText="#{msg.formAuditPICFollowupDate}"
									width="150">
									<h:outputLabel value="#{vo.followupDate}" />
								</p:column>

								<p:column headerText="#{msg.formAuditPICComplianceCheckStatus}"
									width="150">
									<h:outputLabel value="#{vo.complianceStatus}" />
								</p:column>
								
								<p:column headerText="Penjelasan Tindak Lanjut"
									width="150">
									<h:outputLabel value="#{vo.followupNote}" />
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>




	</ui:define>
</ui:composition>
