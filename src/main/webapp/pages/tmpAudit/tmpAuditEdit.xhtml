
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			 td.optionDisabled .ui-chkbox{
				display: none;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
			.bsPanelAuditFindings{
				padding: 5px 5px 5px 5px;
			}
			.ui-spinner-input {
				width:60px;
			}
			
		</style>
	</ui:define>
	
	<ui:define name="ajaxLoading">
	</ui:define>
	
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formAuditTitle}" />
	</ui:define>

	<ui:define name="content">
		
		<!-- required to enable selectbooleanchekcbox -->
		<p:remoteCommand autoRun="true" oncomplete="initSelect2()"
			update="form:listAuditCheckPoint" immediate="true">
		
		</p:remoteCommand>
		<p:growl id="msgs" rendered="true" escape="false"/>
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formAuditTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="templateAudit" class="control-label tl-label">
								<p:outputLabel for="templateAudit"
									value="#{msg.formAuditTemplateName}" />
							</label>
							<h:selectOneMenu id="templateAudit" styleClass="form-control s2"
								value="#{tmpAuditEditBean.tmpAudit.mstAudit.mstAuditId}"
								required="true"
								requiredMessage="#{msg.formAuditTemplateName} #{msg.validateRequired}"
								disabled="#{tmpAuditEditBean.disableMstAudit}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpAuditEditBean.templateAuditList}" />
								<p:ajax event="change" update="form:panelAuditTemplate form:panelAuditAuditor"
									listener="#{tmpAuditEditBean.onChangeAuditMaster()}" />
							</h:selectOneMenu>
							<p:message for="templateAudit" />
						</div>
					</div>

					<h:panelGroup id="panelAuditAuditor">
						<div class="col-lg-12">
							<div class="form-group required">
								<label for="auditFollowUp" class="control-label tl-label">
									<p:outputLabel for="auditFollowUp"
										value="#{msg.formAuditType}" />
								</label>
								<h:selectOneMenu id="auditFollowUp" required="true" disabled="true"
									requiredMessage="#{msg.formAuditType} #{msg.validateRequired}"
									styleClass="form-control s2 regulationSocializationProv"
									value="#{tmpAuditEditBean.tmpAudit.auditor}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{tmpAuditEditBean.selectAuditFollowUp}" />
								</h:selectOneMenu>
								<p:message for="auditFollowUp" />
							</div>
						</div>
					</h:panelGroup>
					
					<h:panelGroup id="panelTglKHP">
						<div class="col-lg-12">
							<div class="form-group required">
								<label for="auditFollowUp" class="control-label tl-label">
									<p:outputLabel for="auditFollowUp"
										value="Tanggal KHP" />
								</label>
								<p:calendar styleClass="form-control-datepicker-wrap"
										required="true"
										requiredMessage="Tanggal KHP #{msg.validateRequired}"
										value="#{tmpAuditEditBean.tmpAudit.khpDate}"
										autocomplete="off" 
										pattern="dd-MMM-yyyy" locale="en" >
								</p:calendar>
								
							</div>
						</div>
					</h:panelGroup>

					<h:panelGroup id="panelAuditTemplate">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="tl-label"><h:outputText
										value="#{msg.formAuditPeriode}" /></label>
								<div class="input-group">
									<p:calendar styleClass="form-control-datepicker-wrap"
										required="true"
										requiredMessage="#{msg.formAuditPeriodeFrom} #{msg.validateRequired}"
										value="#{tmpAuditEditBean.tmpAudit.auditDateFrom}"
										autocomplete="off" placeholder="#{msg.from}" disabled="true"
										pattern="dd-MMM-yyyy" locale="en" >
									</p:calendar>
									<span class="input-group-addon plain"
										style="margin-left: 10px; margin-right: 10px;"> <h:outputText
											value=" - " />
									</span>
									<p:calendar styleClass="form-control-datepicker-wrap"
										id="dateTo" required="true"
										requiredMessage="#{msg.formAuditPeriodeTo} #{msg.validateRequired}"
										value="#{tmpAuditEditBean.tmpAudit.auditDateTo}" disabled="true"
										 autocomplete="off" placeholder="#{msg.to}"
										pattern="dd-MMM-yyyy" locale="en">
									</p:calendar>
								</div>
							</div>
						</div>

						<div class="col-lg-12">
							<div class="form-group required">
								<label for="auditScope" class="control-label tl-label" tl=""><h:outputText
										value="#{msg.formAuditScope}" /></label>
								<p:inputTextarea styleClass="form-control" required="true"
									requiredMessage="#{msg.formAuditScope} #{msg.validateRequired}"
									disabled="true" value="#{tmpAuditEditBean.tmpAudit.scope}"
									maxlength="6000"></p:inputTextarea>
							</div>
						</div>
					</h:panelGroup>
					
					<p:focus for="auditFindingIn"/>

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="auditFindingIn" class="control-label tl-label" tl="">
								<h:outputText
									value="#{msg.formAuditFindingName}" />
							</label>
							<p:inputText id="auditFindingIn" styleClass="form-control"
								autocomplete="off"
								required="true"
								requiredMessage="#{msg.formAuditFindingName} #{msg.validateRequired}"
								value="#{tmpAuditEditBean.tmpAudit.findingNameIn}"
								maxlength="1000"></p:inputText>
						</div>
						<p:message for="auditFindingIn" />
					</div>

					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label for="auditFindingEn" class="control-label tl-label" tl=""><h:outputText
									value="#{msg.formAuditFindingName}" />&#160;&#160;<span
								class="label label-warning"> <h:outputLabel
										value="#{msg.english}" />
							</span></label>
							<p:inputText styleClass="form-control" autocomplete="off"
								value="#{tmpAuditEditBean.tmpAudit.findingNameEn}"
								maxlength="1000"></p:inputText>
						</div>
					</div> -->

					<div class="col-lg-12">
						<div class="form-group">
							<label for="auditObject" class="control-label tl-label">
								<p:outputLabel for="auditObject" value="#{msg.formAuditObject}" />
							</label>
							<h:selectOneMenu id="auditObject"
								styleClass="form-control s2 regulationSocializationProv"
								value="#{tmpAuditEditBean.tmpAudit.auditObject}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpAuditEditBean.selectAuditObject}" />
							</h:selectOneMenu>
							<p:message for="auditObject" />
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label for="auditCategory" class="control-label tl-label">
								<p:outputLabel for="auditCategory"
									value="#{msg.formAuditCategory}" />
							</label>
							<h:selectOneMenu id="auditCategory"
								styleClass="form-control s2 regulationSocializationProv"
								value="#{tmpAuditEditBean.tmpAudit.auditCategory}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpAuditEditBean.selectAuditCategory}" />
							</h:selectOneMenu>
							<p:message for="auditCategory" />
						</div>
					</div>

					<h3>
						<h:outputText
							value="#{msg.formRegulationSocializationPICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNewCompliance()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRowCompliance()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableCompliance" var="data"
									value="#{tmpAuditEditBean.tableModelCompliance}"
									selection="#{tmpAuditEditBean.selectedDataCompliance}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex"
									rowSelectMode="checkbox">

									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />

									<p:column headerText="#{msg.formAuditPicComplianceNIK}"
										width="150">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control temp-no-peraturan"
														value="#{data.user.nik}" readonly="true" /></td>
												<td style="width: 20%"><p:commandLink
														onclick="picComplianceDialog.show()" process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{tmpAuditEditBean.indexDtlCompliance}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>

									</p:column>

									<p:column headerText="#{msg.formAuditPicComplianceName}"
										width="200">
										<h:inputText styleClass="form-control"
											value="#{data.user.name}" readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formAuditPicComplianceEmail}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.user.email}" readonly="true" />
									</p:column>


								</p:dataTable>
							</div>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="followUp" class="control-label tl-label" tl=""><p:outputLabel
									for="tmpAuditFollow"
									value="#{msg.formRegulationSocializationFollowup}" /></label>
							<h:selectOneMenu id="tmpAuditFollow" required="true"
								requiredMessage="#{msg.formRegulationSocializationFollowup} #{msg.validateRequired}"
								styleClass="form-control s2"
								disabled="#{tmpAuditEditBean.disabledFollowUpStatus}"
								value="#{tmpAuditEditBean.tmpAudit.followUp}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpAuditEditBean.followUps}" />
								<p:ajax event="change" update="form:panelReminder"
									listener="#{tmpAuditEditBean.onChangeFollowupStatus}" />
							</h:selectOneMenu>
							<p:message for="tmpAuditFollow" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group ">
							<label  class="control-label tl-label" tl=""><p:outputLabel
									for="tmpAuditRisk"
									value="#{msg.formAuditPICFollowupRisk}" /></label>
							<p:inputTextarea id="tmpAuditRisk" styleClass="form-control" value="#{tmpAuditEditBean.tmpAudit.risk}" >
							</p:inputTextarea>
							<p:message for="tmpAuditRisk" />
						</div>
					</div>

					<h3>
						<h:outputText value="#{msg.formAuditPoints}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-audit-points">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink
												actionListener="#{tmpAuditEditBean.onAddCheckPoints}"
												process="@this form:listAuditCheckPoint" 
												update="form:listAuditCheckPoint">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												actionListener="#{tmpAuditEditBean.onDeleteCheckPoints}"
												process="@this form:listAuditCheckPoint" 
												update="form:listAuditCheckPoint">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4> 
							<h:panelGroup id="checkPoints">
								<p:dataList id="listAuditCheckPoint"
									value="#{tmpAuditEditBean.tmpAudit.tmpAuditCheckPoints}"
									var="checkPoint" type="definition"
									rowIndexVar="rivCheckPoint">
									<div class="col-md-1">
										<p:selectBooleanCheckbox value="#{checkPoint.checked}"
											rendered="#{checkPoint.disableEdit eq false}">
											<p:ajax event="change" process="@this" />
										</p:selectBooleanCheckbox>
									</div>
									<div class="col-md-11">
										<div class="panel panel-default bsPanelAuditFindings">
											<h:panelGroup id="panelAuditFindings">
												
													<div class="panel panel-default bsPanelAuditFindings">
														<div class="row" style="text-align: center;">
															<div class="col-md-11">
																<h5 class="sub-header">
																			&nbsp;
																			<div class="box-tools">
																				<label class="control-label tl-label"> <p:outputLabel
																						value="#{msg.formAuditFindings}" /></label>
																			</div>
																</h5>
																<div class="form-group">
																	<pe:ckEditor id="inputAuditFindings"
																		styleClass="form-control" value="#{checkPoint.auditFindings}">
																	</pe:ckEditor>
																	<p:message for="inputAuditFindings" />
																</div>
															</div>
														</div>
														<div class="row">
															<div class="col-lg-12">
																<h5 class="sub-header">
																	&nbsp;
																	<div class="box-tools">
																		<ul class="no-margin no-padding" style="width: auto">
																			<li><p:commandLink
																					action="#{tmpAuditEditBean.onAddAuditFindingsTable()}"
																					process="@this"
																					update="form:listAuditCheckPoint:#{rivCheckPoint}:dataTableAuditFindingsTable"
																					disabled="#{checkPoint.disableEdit eq true}"
																					>
																					<i class="fa fa-plus"></i>
																					<f:setPropertyActionListener
																						target="#{tmpAuditEditBean.indexDtlCheckPoint}"
																						value="#{rivCheckPoint}" />
																					<f:setPropertyActionListener
																						target="#{tmpAuditEditBean.indexDtlAuditFinding}"
																						value="#{rivAuditFindings}" />
																				</p:commandLink></li>
																			<li><p:commandLink
																					action="#{tmpAuditEditBean.onDeleteAuditFindingsTable()}"
																					process="@this"
																					update="form:listAuditCheckPoint:#{rivCheckPoint}:dataTableAuditFindingsTable"
																					disabled="#{checkPoint.disableEdit eq true}"
																					>
																					<i class="fa fa-trash"></i>
																					<f:setPropertyActionListener
																						target="#{tmpAuditEditBean.indexDtlCheckPoint}"
																						value="#{rivCheckPoint}" />
																					<f:setPropertyActionListener
																						target="#{tmpAuditEditBean.indexDtlAuditFinding}"
																						value="#{rivAuditFindings}" />
																				</p:commandLink></li>
																			<li style="padding-right: 5px;"><label
																				for="column" class="control-label tl-label" tl=""><h:outputText
																						value="#{msg.formAuditPICFollowupColumn}" /></label></li>
																			<li style="padding-right: 5px;"><p:spinner
																					min="0" max="50" id="spinnerAuditFindingsColumn"
																					value="#{checkPoint.column}" onkeypress="return false"
																					disabled="#{checkPoint.disableEdit eq true}"
																					>
																					<p:ajax event="change"
																						listener="#{tmpAuditEditBean.onChangeColumn(rivCheckPoint)}"
																						update="form:listAuditCheckPoint:#{rivCheckPoint}:dataTableAuditFindingsTable">
																					</p:ajax>
																				</p:spinner></li>
																			<li style="padding-right: 5px;"><label
																				for="header" class="control-label tl-label" tl=""><h:outputText
																						value="#{msg.formAuditPICFollowupHeader}" /></label></li>
																			<li style="display: -webkit-inline-box;"><h:selectOneMenu
																					value="#{checkPoint.hasHeader}"
																					styleClass="form-control s2"
																					disabled="#{checkPoint.disableEdit eq true}">
																					<f:selectItems value="#{tmpAuditEditBean.yesNo}"></f:selectItems>
																				</h:selectOneMenu></li>
																		</ul>
																	</div>
																</h5>
																&nbsp;
																<p:dataTable id="dataTableAuditFindingsTable"
																	value="#{checkPoint.tmpAuditPicFollowupAuditFindingsTables}"
																	var="auditFindingsTables"
																	rowIndexVar="rivAuditFindings" scrollable="true"
																	scrollWidth="100%">
																	<p:column width="50">
																		<p:selectBooleanCheckbox
																			value="#{auditFindingsTables.checked}"
																			disabled="false"
																			rendered="#{checkPoint.disableEdit eq false}">
																			<p:ajax event="change" process="@this" />
																		</p:selectBooleanCheckbox>
																	</p:column>
																	<p:columns width="150"
																		value="#{checkPoint.columnModel.columnModels}" var="tes"
																		columnIndexVar="civCol">

																		<p:inputText
																			value="#{auditFindingsTables[tes.property]}"
																			styleClass="form-control">
																			<p:ajax event="blur" process="@this">
																			</p:ajax>
																		</p:inputText>
																	</p:columns>
																</p:dataTable>
															</div>
														</div>
													</div>
												
											</h:panelGroup>
											<h:panelGroup id="panelBankResponse">
													
													<div class="row" style="text-align: center;">
														<div class="col-md-11">
															<h5 class="sub-header">
																		&nbsp;
																		<div class="box-tools">
																			<label class="control-label tl-label"> <p:outputLabel
																					value="#{msg.formAuditBankResponse}" /></label>
																		</div>
															</h5>
															<div class="form-group">
																<pe:ckEditor id="inputBankResponse"
																	styleClass="form-control"
																	value="#{checkPoint.bankResponse}">
																</pe:ckEditor>
																<p:message for="inputBankResponse" />
															</div>
														</div>
														<div class="col-md-1">
														</div>
														<div class="col-md-11">
															<div class="form-group">
														<h:panelGroup id="panelBankCommitment">
															<h6 class="sub-header">
																&nbsp;
																<div class="box-tools">
																	<ul class="no-margin no-padding">
																		<li>
																		<p:commandLink
																			process="@this" action="#{tmpAuditEditBean.onAddBankCommitment()}" immediate="true">
																			<i style="margin-top: 10px;" class="fa fa-plus"></i>
																			<f:setPropertyActionListener
																				target="#{tmpAuditEditBean.indexDtlCheckPoint}"
																				value="#{rivCheckPoint}" />
																		</p:commandLink>
																		</li>
																		<li>
																		<p:commandLink
																			process="@this" action="#{tmpAuditEditBean.onDeleteBankCommitment()}" immediate="true">
																			<i style="margin-top: 10px;" class="fa fa-trash"></i>
																			<f:setPropertyActionListener
																				target="#{tmpAuditEditBean.indexDtlCheckPoint}"
																				value="#{rivCheckPoint}" />
																		</p:commandLink>
																		</li>
																		<li><label class="control-label tl-label"> <p:outputLabel
																					value="#{msg.formAuditBankCommitment}" /></label></li>
																	</ul>
																</div>
															</h6>
															<p:dataList id="listBankCommitment"
																value="#{checkPoint.tmpAuditPicFollowupBankCommitments}"
																var="bankCommitment" rowIndexVar="rivBankCommitment" type="definition">
																
																<div class="row" style="text-align: center;">
																	<div class="col-md-1">
																		<p:selectBooleanCheckbox
																			value="#{bankCommitment.checked}"
																			rendered="#{checkPoint.disableEdit eq false}">
																			<p:ajax event="change" process="@this" />
																		</p:selectBooleanCheckbox>
																	</div>
																	<div class="col-md-11">
																	<h5 class="sub-header">
																		&nbsp;
																		<div class="box-tools">
																			<label class="control-label tl-label"> <p:outputLabel
																					value="#{msg.formAuditBankCommitment}" /></label>
																		</div>
																	</h5>
																		<div class="form-group">
																			<pe:ckEditor 
																				styleClass="form-control"
																				value="#{bankCommitment.bankCommitment}">
																				<p:ajax event="change" process="@this"  />
																			</pe:ckEditor>
																		</div>
																	</div>
																	<div class="col-md-1">
																	</div>
																	<div class="col-md-11">
																	
																	<div class="form-group">
																		
																		<h:panelGroup id="panelRecurrNew" >
																		<div class="form-row col-md-3">
																				<div class="col">
																					<div class="label-form" style="text-align:left">Continuous Action</div>
																					<h:selectOneMenu
																						style="font-size:13px;font-weight:normal;"
																						styleClass="form-control s2 divisionCc#{rivPoinPemeriksaan}"
																						value="#{bankCommitment.isRecurr}">
																						<f:selectItem itemLabel="Pilih" itemValue="" />
																						<f:selectItem itemLabel="Yes" itemValue="Y" />
																						<f:selectItem itemLabel="No" itemValue="N" />
																						<p:ajax event="change"  update="form:listAuditCheckPoint:${rivCheckPoint}:listBankCommitment:${rivBankCommitment}:panelRecurrNew"
																								listener="#{tmpAuditEditBean.onSelectRecurr(rivCheckPoint,rivBankCommitment)}" />
