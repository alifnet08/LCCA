<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[disabled] {
			    cursor: not-allowed;
			    font-family: 'Montserrat';
			    font-size: 13px;
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formInternalRegulationViewTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:messages id="messages" />
	<p:growl id="msgs" rendered="true"/>
	<div class="box box-solid">
      <div class="box-body">
        <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                <label for="jenis_ketentuan" class="control-label tl-label" ><h:outputText value="#{msg.formInternalRegulationProvType}" /></label>
                <h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationViewDetailBean.regulationMst.jenisKetentuan.parameterDtlCode}" disabled="true">
                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
			    <f:selectItems value="#{internalRegulationViewDetailBean.provTypes}" />
                </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><h:outputText value="#{msg.formInternalRegulationRegulationType}" /></label>
	          	<h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationViewDetailBean.docTypeId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationViewDetailBean.docTypes}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label"><h:outputText value="#{msg.formInternalRegulationRegulationCategory}" /></label>
	          	<h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationViewDetailBean.docCategoryId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationViewDetailBean.docCategories}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label"><h:outputLabel value="#{msg.formInternalRegulationDirectorate}" for="internalDirectorate"/></label>
	          	<h:selectOneMenu id="internalDirectorate" styleClass="form-control s2" disabled="true"
	          		value="#{internalRegulationViewDetailBean.regulationMst.directorate}">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationViewDetailBean.directorateLists}" />
	            </h:selectOneMenu>
	            <p:message for="internalDirectorate"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><p:outputLabel value="#{msg.formInternalRegulationProposerUnit}" for="internalRegulationPublisherUnit" /></label>
	            <h:selectOneMenu id="internalRegulationPublisherUnit" styleClass="form-control s2" disabled="true"
	            	value="#{internalRegulationViewDetailBean.regulationMst.publisherUnit}">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationViewDetailBean.unitPenerbitList}" />
	            </h:selectOneMenu>
	            <p:message for="internalRegulationPublisherUnit"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label">
                	<h:outputLabel value="#{msg.formInternalRegulationPIC}" for="internalPIC"/>
                </label>
	          	<h:inputText id="internalPIC" styleClass="form-control"
								alt="#{internalRegulationViewDetailBean.regulationMst.picNameTemp}"
								title="#{internalRegulationViewDetailBean.regulationMst.picNameTemp}"
								value="#{internalRegulationViewDetailBean.regulationMst.picNameTemp}"
								disabled="true" />
	            <p:message for="internalPIC"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label">
                	<h:outputLabel value="#{msg.formInternalRegulationPUK}" for="internalPUK"/>
                </label>
	          	<h:inputText id="internalPUK" styleClass="form-control"
								alt="#{internalRegulationViewDetailBean.regulationMst.pukNameTemp}"
								title="#{internalRegulationViewDetailBean.regulationMst.pukNameTemp}"
								value="#{internalRegulationViewDetailBean.regulationMst.pukNameTemp}"
								disabled="true" />
	            <p:message for="internalPUK"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationDocNo}" /></label>
               	<h:inputText styleClass="form-control" value="#{internalRegulationViewDetailBean.regulationMst.documentNo}"
               		title="#{internalRegulationViewDetailBean.regulationMst.documentNo}"
               		disabled="true" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">                
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationRegTitle}" /></label>
                <h:inputText styleClass="form-control" value="#{internalRegulationViewDetailBean.regulationMst.nameIn}"
                	title="#{internalRegulationViewDetailBean.regulationMst.nameIn}"
                	disabled="true" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" >
                	<h:outputText value="#{msg.formInternalRegulationDecriptionRegulation}" />
                </label>
                <pe:ckEditor id="descriptionRegulation" widgetVar="editorContent" width="100%" required="true"
								requiredMessage="#{msg.formInternalRegulationDecriptionRegulation} #{msg.validateRequired}"
								value="#{internalRegulationViewDetailBean.regulationMst.descriptionIn}" readonly="true"
								height="300" style="margin-bottom:10px" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationPublishedDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="publishedDate" 
                		value="#{internalRegulationViewDetailBean.regulationMst.publishedDateStr}" readonly="true"/> -->
                  <p:calendar styleClass="form-control-datepicker-wrap" id="publishedDate" disabled="true"
						value="#{internalRegulationViewDetailBean.regulationMst.publishedDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
				  </p:calendar> 	 	
              </div>
            </div>
           <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationEffDate}" /></label>
               <!--  <input type="text" class="form-control date_picker" id="effectiveDate" 
                      value="#{internalRegulationViewDetailBean.regulationMst.effectiveDateStr}" readonly="true"/> -->
                  <p:calendar styleClass="form-control-datepicker-wrap" id="effectiveDate" disabled="true"
						value="#{internalRegulationViewDetailBean.regulationMst.effectiveDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
				  </p:calendar>         
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationReviewDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="expiredDate" 
                        value="#{internalRegulationViewDetailBean.regulationMst.expiredDateStr}" readonly="true"/> -->
                  <p:calendar styleClass="form-control-datepicker-wrap" id="expiredDate" disabled="true"
						value="#{internalRegulationViewDetailBean.regulationMst.expiredDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
				  </p:calendar>            
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><p:outputLabel value="#{msg.formInternalRegulationEmailReminder}" for="internalEmailReminder" /></label>
	            <h:selectOneMenu id="internalEmailReminder" styleClass="form-control s2" disabled="true"
	            	value="#{internalRegulationViewDetailBean.counterTypeId}">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationViewDetailBean.emailReminderList}" />
	            </h:selectOneMenu>
	            <p:message for="internalEmailReminder"/>
              </div>
            </div>            
            
            <h3><h:outputText value="#{msg.formInternalRegulationAttachmentPeraturan}" /></h3>
            <div class="col-lg-12">
              <div class="form-group">
                <p:remoteCommand name="onCompleteUpload" update="peraturanIdList peraturanFAQList peraturanLampiranList peraturanFormRingkasanList peraturanOtherList"></p:remoteCommand>
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationPeraturanUtuh}" /></label>
               
                <p:dataList value="#{internalRegulationViewDetailBean.uploadedFilesPeraturanId}" 
                	emptyMessage=""
                	var="vo" id="peraturanIdList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationFAQ}" /></label>
                
                <p:dataList value="#{internalRegulationViewDetailBean.uploadedFilesFAQ}" 
                	emptyMessage=""
                	var="vo" id="peraturanFAQList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationLampiran}" /></label>
                
                <p:dataList value="#{internalRegulationViewDetailBean.uploadedFilesLampiran}" 
                	emptyMessage=""
                	var="vo" id="peraturanLampiranList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationSummaryForm}" /></label>
                
                <p:dataList value="#{internalRegulationViewDetailBean.uploadedFilesFormRingkasan}" 
                	emptyMessage=""
                	var="vo" id="peraturanFormRingkasanList" rowIndexVar="index">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationOther}" /></label>
               
                <p:dataList value="#{internalRegulationViewDetailBean.uploadedFilesOther}" 
                	emptyMessage=""
                	var="vo" id="peraturanOtherList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>            
            
            <h3><h:outputText value="#{msg.formInternalRegulationRekamJejak}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  
                  <div class="table-wrapper table-responsive">
                  <p:dataTable id="dataTable" var="data" value="#{internalRegulationViewDetailBean.tableModel}" 
                  selection="#{internalRegulationViewDetailBean.selectedData}" 
                  rowKey="#{data.sequence}"
                  rowIndexVar="statIndex">
                  		<p:ajax event="rowSelectCheckbox" process="@this"/>
                        <p:ajax event="rowUnselectCheckbox" process="@this"/>
                        <p:ajax event="toggleSelect" process="@this"/>
                    <!-- <p:column selectionMode="multiple" style="text-align:center; width:40px;"/> -->
				    <p:column headerText="#{msg.formInternalRegulationRekamJejak}">
				        <h:selectOneMenu styleClass="form-control s2" value="#{data.trackCode}" disabled="true">
			                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
						    <f:selectItems value="#{internalRegulationViewDetailBean.trackCodes}" />
			            </h:selectOneMenu>
				    </p:column>
				 
				    <p:column headerText="#{msg.formInternalRegulationRegNo}">
				    	<div class="input-group">
				        <h:inputHidden value="#{data.regulationLinkId}" ></h:inputHidden>
				        <h:inputText  styleClass="form-control temp-no-peraturan" value="#{data.regulationLinkName}" alt="#{data.regulationLinkName}" title="#{data.regulationLinkName}" disabled="true"/>
                        <span class="input-group-btn">
                              <p:commandLink  styleClass="btn btn-link"  onclick="jdlPeraturanDialog.show()"><i class="fa fa-search"> </i>
                              <f:setPropertyActionListener
											target="#{internalRegulationViewDetailBean.indexDtl}"
											value="#{statIndex}" />
                              </p:commandLink>
                        </span>
                        </div>
                        
				    </p:column>
				 
				    <p:column headerText="#{msg.formInternalRegulationKetMencabut}">
				        <h:inputText styleClass="form-control" value="#{data.trackNote}" alt="#{data.trackNote}" title="#{data.trackNote}" isabled="true"/>
				    </p:column>
	
				</p:dataTable>
				</div>
                </div>
              </div>             
          </div>
      </div>
      <div class="box-footer">
		<p:commandButton value="#{msg.buttonBack}" actionListener="#{internalRegulationViewDetailBean.back()}"
							styleClass="btn btn-default pull-left tl-label">
		</p:commandButton> 
      </div>
    </div>
    
	</ui:define>
	
	
</ui:composition>
