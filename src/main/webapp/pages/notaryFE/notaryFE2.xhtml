<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">
		<style>
			a.link:hover {
			    cursor: pointer;
			}
		</style>
		
		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">NOTARIS</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Notaris</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<h:form styleClass="wo-search-form">
				<p:remoteCommand name="onSearch" process="@this dataList"
					update="dataList" action="#{notaryFEBean.search()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onClickPage" process="@this dataList"
					update="dataList" action="#{notaryFEBean.searchDataPrevNext()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onPrev" process="@this dataList"
					update="dataList" action="#{notaryFEBean.prev()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onNext" process="@this dataList"
					update="dataList" action="#{notaryFEBean.next()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<h:inputHidden id="pageSelected" value="#{notaryFEBean.first}"></h:inputHidden>
				<h:inputHidden id="totalPage" value="#{notaryFEBean.totalPage}"></h:inputHidden>

				<div class="form-row">
					<div class="col-12 has-search form-group">
						<input id="searchVal" class="form-control cari-input"
							type="search"
							placeholder="CARI NOTARIS . . ." aria-label="Search" />
						<div class="input-group-append">
							<i
								class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
								onclick="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'0'}])"></i>
						</div>
					</div>
				</div>
			</h:form>
			<h:panelGroup id="dataList">
				<h:form>
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableInternal">
							<tbody>
								<div class="row">
									<ui:repeat value="#{notaryFEBean.listData}" var="vo">
										<div class="col-lg-4 col-12">
	
											<div class="table table-bordered rounded">
												<h:inputText styleClass="chosenId#{vo.notaryId}" style="display:none"
													value="#{vo.notaryId}" />
												<p:remoteCommand name="onClickEdit" id="view" process="@this"
													action="#{notaryFEBean.getNavigateEdit()}" type="submit" />
	
												<div class="col p-3 table-active">
													<a class="link" onclick="onClickEdit([{name : 'CHOSEN_ID', value:$('.chosenId#{vo.notaryId}').val()}])">
														<span class="td-header text-mb-secondary">#{vo.notaryCategoryIn}</span>
														<i class="fas fa-external-link-alt float-right" />
													</a>
												</div>
	
												<div>
													<div class="p-2 px-3 font-weight-bold">
														<i class="fa fa-street-view"></i> : <span>#{vo.notaryName}</span>
													</div>
													<div class="p-2 px-3 font-weight-bold">
														<i class="fa fa-phone"></i> : <span>#{vo.phoneNo}</span>
													</div>
													<div class="p-2 px-3 font-weight-bold">
														<i class="fa fa-fax"></i> : <span>#{vo.faxNo}</span>
													</div>
													<div class="p-2 px-3 font-weight-bold">
														<i class="fa fa-envelope"></i> : <span>#{vo.email}</span>
													</div>
													<div class="p-2 px-3 font-weight-bold">
														<i class="fa fa-mobile"></i> : <span>#{vo.mobileNo}</span>
													</div>
												</div>
											</div>
										</div>
									</ui:repeat>
								</div>
								<tr style="#{(notaryFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td>#{msg.textNodata}</td>
								</tr> 
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(notaryFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{notaryFEBean.totalPageList}" var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'#{row-1}'}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>
		</div>

	</ui:define>
</ui:composition>
