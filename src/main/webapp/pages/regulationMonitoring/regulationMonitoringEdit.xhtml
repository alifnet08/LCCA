<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			 td.optionDisabled .ui-chkbox{
				display: none;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formRegulationMonitoringTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formRegulationMonitoringTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label for="jenis_ketentuan" class="control-label tl-label"><p:outputLabel
									for="regulationMonitoringProv"
									value="#{msg.formRegulationMonitoringProvType}" /></label>
							<h:selectOneMenu id="regulationMonitoringProv" required="true"
								requiredMessage="#{msg.formRegulationMonitoringProvType} #{msg.validateRequired}"
								styleClass="form-control s2 regulationMonitoringProv"
								value="#{regMonitoringEditBean.regMonitoringTmp.jenisKetentuan.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{regMonitoringEditBean.provTypes}" />
								<p:ajax event="change" update="form:dataTable"
									listener="#{regMonitoringEditBean.onChangeJenisKetentuan}" />
							</h:selectOneMenu>
							<p:message for="regulationMonitoringProv" />
						</div>
					</div>

					<h3>
						<h:outputText value="#{msg.formRegulationMonitoringRegTitle}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNew()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRow()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTable" var="data"
									value="#{regMonitoringEditBean.tableModel}"
									selection="#{regMonitoringEditBean.selectedData}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />
									
									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									
									<p:column headerText="#{msg.formRegulationMonitoringRegNo}"
										width="200">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentNo}" readonly="true" />
									</p:column>
									
									<p:column
										headerText="#{msg.formRegulationMonitoringLinkJudul}"
										width="300">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														id="regulationMonitoringLink" required="true"
														requiredMessage="#{msg.formRegulationMonitoringLinkJudul} #{msg.validateRequired}"
														styleClass="form-control temp-no-peraturan form-required"
														value="#{data.regulation.name}" readonly="true" /> <p:message
														for="regulationMonitoringLink" /></td>
												<td style="width: 20%"><p:commandLink
														onclick="$('.hdnParamJudulPeraturanOption').val($('.regulationMonitoringProv').val());jdlPeraturanDialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regMonitoringEditBean.indexDtl}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>

									</p:column>
									
									<p:column headerText="#{msg.formRegulationMonitoringNote}"
										style="width:300px;">										
										<p:dataList value="#{data.regulation.regulationTrackRecords}"
											emptyMessage=""
											var="dtl2" >#{dtl2.trackNote}</p:dataList>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringDocType}"
										width="250">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentType.documentType}"
											readonly="true" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringPublishedDate}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.publishedDate!=null?regMonitoringEditBean.sdf.format(data.regulation.publishedDate):''}"
											readonly="true" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringEffectiveDate}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.effectiveDate!=null?regMonitoringEditBean.sdf.format(data.regulation.effectiveDate):''}"
											readonly="true" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringExpiredDate}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.expiredDate!=null?regMonitoringEditBean.sdf.format(data.regulation.expiredDate):''}"
											readonly="true" />
									</p:column>
									
									<p:column
										headerText="#{msg.formRegulationMonitoringCategory}"
										width="250">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentCategory.documentCategory}"
											readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formRegulationMonitoringTopic}"
										width="250">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentTopic.documentTopic}"
											readonly="true" />
									</p:column>
									
								</p:dataTable>
							</div>
						</div>
					</div>
					
					&nbsp;
					<h3>
						<h:outputText
							value="#{msg.formRegulationMonitoringPICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNewCompliance()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRowCompliance()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableCompliance" var="data"
									value="#{regMonitoringEditBean.tableModelCompliance}"
									selection="#{regMonitoringEditBean.selectedDataCompliance}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox" >
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />
									
									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />

									<p:column headerText="#{msg.formRegulationMonitoringNIK}"
										width="150">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control temp-no-peraturan"
														value="#{data.user.nik}" readonly="true" /></td>
												<td style="width: 20%"><p:commandLink
														onclick="picComplianceDialog.show()" process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regMonitoringEditBean.indexDtlCompliance}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>

									</p:column>

									<p:column headerText="#{msg.formRegulationMonitoringName}"
										width="200">
										<h:inputText styleClass="form-control"
											value="#{data.user.name}" readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formRegulationMonitoringEmail}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.user.email}" readonly="true" />
									</p:column>


								</p:dataTable>
							</div>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="followUp" class="control-label tl-label" tl=""><p:outputLabel
									for="regulationMonitoringFollow"
									value="#{msg.formRegulationMonitoringFollowup}" /></label>
							<h:selectOneMenu id="regulationMonitoringFollow"
								required="true"
								requiredMessage="#{msg.formRegulationMonitoringFollowup} #{msg.validateRequired}"
								styleClass="form-control s2"
								disabled="#{regMonitoringEditBean.disabledFollowUpStatus}"
								value="#{regMonitoringEditBean.regMonitoringTmp.followUp}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{regMonitoringEditBean.followUps}" />
								<p:ajax event="change" 
									update="form:panelReminder form:panelPICAndWorkUnit form:panelReminder" 
									listener="#{regMonitoringEditBean.onChangeFollowupStatus}" />
							</h:selectOneMenu>
							<p:message for="regulationMonitoringFollow" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="jenis_ketentuan" class="control-label tl-label" tl=""><h:outputText
									value="#{msg.formRegulationMonitoringNote}" /></label>
							<p:inputTextarea styleClass="form-control"
								value="#{regMonitoringEditBean.regMonitoringTmp.notes}"
								maxlength="5000"></p:inputTextarea>
						</div>
					</div>

					
					<h:panelGroup id="panelPICAndWorkUnit">
					<h3>
						<h:outputText
							value="#{msg.formRegulationMonitoringPICAndWorkUnit}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNewFollowup()" 
												>
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRowFollowup()"
												>
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableFollowup" var="data"
									value="#{regMonitoringEditBean.tableModelFollowup}"
									selection="#{regMonitoringEditBean.selectedDataFollowup}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />								
									
									<p:column selectionMode="multiple" 
										styleClass="#{!data.isEditableTemp ? 'optionDisabled':''}"										
										style="text-align:center; width:40px;" />
									
									<p:column
										headerText="#{msg.formRegulationMonitoringNote}"
										width="150">
										<p:inputTextarea styleClass="form-control"
											value="#{data.notes}"
											maxlength="5000">
											<p:ajax event="change" />
										</p:inputTextarea>
									</p:column>
									
									<p:column
										headerText="#{msg.formRegulationMonitoringDivision}"
										width="200">
										
										<h:selectOneMenu styleClass="form-control s2 divisionCc#{statIndex}"
											disabled="#{!data.isEditableTemp}"
											value="#{data.divisionId}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems
												value="#{regMonitoringEditBean.divisions}" />
											<p:ajax event="change" update="form:panelPICAndWorkUnit"
												listener="#{regMonitoringEditBean.onChangeDivision(statIndex)}"
												 />
										</h:selectOneMenu>


									</p:column>
									
									
									<p:column headerText="#{msg.formRegulationMonitoringPIC1}"
										width="250">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control user1#{statIndex}"
														id="userName1#{statIndex}" value="#{data.user1.name}"
														readonly="true" /></td>
												<td style="width: 20%"><p:commandLink 
														rendered="#{data.isEditableTemp}"
														onstart="$('.hdnParamEmailCc1Option').val($('.divisionCc#{statIndex}').val());pic1Dialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regMonitoringEditBean.indexDtlFollowup}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>
									</p:column>

									<p:column headerText="#{msg.formRegulationMonitoringPIC2}"
										width="250">
										<table>
											<tr>
												<td style="width: 70%">
													<h:inputText
														styleClass="form-control user2" value="#{data.user2.name}"
														readonly="true" /></td>
												<td style="width: 15%">
													<p:commandLink
														rendered="#{data.isEditableTemp}"
														onstart="$('.hdnParamEmailCc2Option').val($('.divisionCc#{statIndex}').val());pic2Dialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regMonitoringEditBean.indexDtlFollowup}"
															value="#{statIndex}" />
													</p:commandLink>
												</td>
												<td style="width: 15%">	
													<p:commandLink 
														rendered="#{data.isEditableTemp}"
														immediate="true"
														style="float:left;margin-left:-10px;"												
														actionListener="#{regMonitoringEditBean.clearPicDetail2(statIndex)}"
														update="dataTableFollowup">
														<span class="input-group-btn fa fa-trash btn btn-link"></span>															
													</p:commandLink>													
												</td>
											</tr>
										</table>
									</p:column>

									<p:column headerText="#{msg.formRegulationMonitoringPIC3}"
										width="250">
										<table>
											<tr>
												<td style="width: 70%"><h:inputText
														styleClass="form-control user3" value="#{data.user3.name}"
														readonly="true" /></td>
												<td style="width: 15%">
													<p:commandLink
														rendered="#{data.isEditableTemp}"
														onstart="$('.hdnParamEmailCc3Option').val($('.divisionCc#{statIndex}').val());pic3Dialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regMonitoringEditBean.indexDtlFollowup}"
															value="#{statIndex}" />
													</p:commandLink>
												</td>
												<td style="width: 15%">	
													<p:commandLink 
														rendered="#{data.isEditableTemp}"
														immediate="true"
														style="float:left;margin-left:-10px;"												
														actionListener="#{regMonitoringEditBean.clearPicDetail3(statIndex)}"
														update="dataTableFollowup">
														<span class="input-group-btn fa fa-trash btn btn-link"></span>															
													</p:commandLink>													
												</td>
											</tr>
										</table>
									</p:column>
									<p:column
										headerText="#{msg.formRegulationMonitoringTargetDate}"
										width="150">
										<p:calendar maxlength="11" style="width:100px" value="#{data.targetDate}" 
											styleClass="form-control-datepicker-wrap"
											autocomplete="off"
											disabled="#{'Y' ne regMonitoringEditBean.regMonitoringTmp.followUp}"
											pattern="dd MMM yyyy" locale="en" >
											<f:attribute name="seq" value="#{data.sequence}" />
											<f:attribute name="rowIdx" value="#{statIndex}" />
											<p:ajax event="dateSelect" 
												listener="#{regMonitoringEditBean.onTargetDateChange}" 
												/>
										</p:calendar>
									</p:column>
									<p:column rendered="#{regMonitoringEditBean.regMonitoringTmp.lastUpdateBy ne null
										and regMonitoringEditBean.regMonitoringTmp.lastUpdateBy ne ''}"
										headerText="#{msg.formRegulationMonitoringRescheduleReason}"
										width="150">
										<p:inputTextarea
											id="rescheduleReason" 
											styleClass="form-control"
											value="#{data.rescheduleReason}"
											maxlength="500"></p:inputTextarea>
									</p:column>
									<p:column
										headerText="#{msg.formRegulationMonitoringEmailDate}"
										width="150">
										<p:dataList value="#{data.regMonitoringPICFollowUpEmailTmps}"
											emptyMessage=""
											var="dtl">#{dtl.emailDate!=null?regMonitoringEditBean.sdf.format(dtl.emailDate):''}</p:dataList>
									</p:column>
									
								</p:dataTable>
							</div>
						</div>
					</div>
					</h:panelGroup>

					<!-- <div class="col-lg-12">
						<div class="form-group required">
							<p:outputLabel
									
									value="ID" />
							<p:outputLabel value="#{regMonitoringEditBean.regMonitoringTmp.regMonitoringTmpId}"></p:outputLabel>
							
						</div>
					</div> -->
					
					
					<h:panelGroup id="panelReminder">
					<div class="col-lg-12" style="margin-top:15px;">
						<div class="form-group #{'Y' eq regMonitoringEditBean.regMonitoringTmp.followUp? 'required':''}">
							<label class="control-label tl-label" tl=""><p:outputLabel
									for="#{'Y' eq regMonitoringEditBean.regMonitoringTmp.followUp? 'regulationMonitoringReminder':''}"
									value="#{msg.formRegulationMonitoringReminderType}" /></label>
							<h:selectOneMenu id="regulationMonitoringReminder"
								disabled="#{'Y' ne regMonitoringEditBean.regMonitoringTmp.followUp}"
								required="#{'Y' eq regMonitoringEditBean.regMonitoringTmp.followUp}" 
								styleClass="form-control s2"
								value="#{regMonitoringEditBean.counterTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{regMonitoringEditBean.counterTypes}" />
							</h:selectOneMenu>
							<p:message for="regulationMonitoringReminder" />
						</div>
					</div>
					</h:panelGroup>

					<h3>
						<h:outputText
							value="#{msg.formRegulationMonitoringStatusConfirmation}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">&nbsp;</h4>
							<div class="top-scroller">
							    <div class="div-wrapper">
							    </div>
							</div>
							<div class="table-wrapper table-responsive linked-to-top-scroller">
								<p:dataTable id="dataTableStatus" var="vo"
									value="#{regMonitoringEditBean.tableStatus}"
									rowIndexVar="statIndex">

									<p:column
										headerText="#{msg.formRegulationMonitoringConfirmationEvidence}"
										width="400">
										<p:dataList
											value="#{vo.regMonitoringPICFollowUpAttachmentTrcs}"
											emptyMessage=""
											var="dtl">
											<p:commandLink title="#{dtl.fileSize} KB" ajax="false"
												actionListener="#{regMonitoringEditBean.downloadFile(dtl.fileId,dtl.attachmentFile,null)}"
												target="_blank">#{dtl.attachmentFile}</p:commandLink>
										</p:dataList>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringFollowupStatus}"
										width="150">
										<h:outputLabel value="#{vo.followupStatus}" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringConfirmation}"
										width="150">
										<h:outputLabel value="#{vo.followupBy}" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringConfirmationDate}"
										width="150">
										<h:outputLabel value="#{vo.confirmationDate}">
											<f:convertDateTime
												pattern="#{regMonitoringEditBean.inputDateFormat}"
												locale="#{regMonitoringEditBean.inputDateLocale}">
											</f:convertDateTime>
										</h:outputLabel>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringFollowupDate}"
										width="150">
										<h:outputLabel value="#{vo.followupDate}">
											<f:convertDateTime
												pattern="#{regMonitoringEditBean.inputDateFormat}"
												locale="#{regMonitoringEditBean.inputDateLocale}">
											</f:convertDateTime>
										</h:outputLabel>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringInformation}"
										width="150">
										<h:outputLabel value="#{vo.followupNote}" /> 
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringFullfilmentOfFollowupDate}"
										width="150">
										<h:outputLabel value="#{vo.complianceDate}"> 
											<f:convertDateTime
												pattern="#{regMonitoringEditBean.inputDateFormat}"
												locale="#{regMonitoringEditBean.inputDateLocale}">
											</f:convertDateTime>
										</h:outputLabel>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringComplianceCheckStatus}"
										width="125">
										<h:outputLabel value="#{vo.complianceStatus}" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationMonitoringComplianceCheckNote}"
										width="450">
										<h:outputLabel value="#{vo.complianceNote}" />
									</p:column>


								</p:dataTable>
							</div>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group" style="margin-top:15px;">
							<label class="tl-label" tl=""><h:outputText
									value="#{msg.formRegulationMonitoringReminderStatus}" /></label>
							<h:selectOneRadio
								value="#{regMonitoringEditBean.regMonitoringTmp.reminderStatus}"
								>
								<f:selectItems
									value="#{regMonitoringEditBean.reminderStatusList}"
									 />
