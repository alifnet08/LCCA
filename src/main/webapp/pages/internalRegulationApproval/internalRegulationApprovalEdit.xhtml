<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[disabled] {
			    cursor: not-allowed;
			    font-family: 'Montserrat';
			    font-size: 13px;
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formInternalRegulationApprovalTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:growl id="msgs"  rendered="true"/>
	<div class="box box-solid">
      <div class="box-body">
        <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                <label for="jenis_ketentuan" class="control-label tl-label" ><h:outputText value="#{msg.formInternalRegulationProvType}" /></label>
                <h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationApprovalEditBean.regulation.jenisKetentuan.parameterDtlCode}" disabled="true">
                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
			    <f:selectItems value="#{internalRegulationApprovalEditBean.provTypes}" />
                </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><h:outputText value="#{msg.formInternalRegulationRegulationType}" /></label>
	          	<h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationApprovalEditBean.docTypeId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationApprovalEditBean.docTypes}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label"><h:outputText value="#{msg.formInternalRegulationRegulationCategory}" /></label>
	          	<h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationApprovalEditBean.docCategoryId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationApprovalEditBean.docCategories}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label"><h:outputLabel value="#{msg.formInternalRegulationDirectorate}" for="internalDirectorate"/></label>
	          	<h:selectOneMenu id="internalDirectorate" styleClass="form-control s2" disabled="true"
	          		value="#{internalRegulationApprovalEditBean.regulation.directorate}">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationApprovalEditBean.directorateLists}" />
	            </h:selectOneMenu>
	            <p:message for="internalDirectorate"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><p:outputLabel value="#{msg.formInternalRegulationProposerUnit}" for="internalRegulationPublisherUnit" /></label>
	            <h:selectOneMenu id="internalRegulationPublisherUnit" styleClass="form-control s2" disabled="true"
	            	value="#{internalRegulationApprovalEditBean.regulation.publisherUnit}">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationApprovalEditBean.unitPenerbitList}" />
	            </h:selectOneMenu>
	            <p:message for="internalRegulationPublisherUnit"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label">
                	<h:outputLabel value="#{msg.formInternalRegulationPIC}" for="internalPIC"/>
                </label>
	          	<h:inputText id="internalPIC" styleClass="form-control"
								alt="#{internalRegulationApprovalEditBean.regulation.picNameTemp}"
								title="#{internalRegulationApprovalEditBean.regulation.picNameTemp}"
								value="#{internalRegulationApprovalEditBean.regulation.picNameTemp}"
								disabled="true" />
	            <p:message for="internalPIC"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label">
                	<h:outputLabel value="#{msg.formInternalRegulationPUK}" for="internalPUK"/>
                </label>
	          	<h:inputText id="internalPUK" styleClass="form-control"
								alt="#{internalRegulationApprovalEditBean.regulation.pukNameTemp}"
								title="#{internalRegulationApprovalEditBean.regulation.pukNameTemp}"
								value="#{internalRegulationApprovalEditBean.regulation.pukNameTemp}"
								disabled="true" />
	            <p:message for="internalPUK"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationDocNo}" /></label>
                <h:inputText styleClass="form-control" value="#{internalRegulationApprovalEditBean.regulation.documentNo}"
                	title="#{internalRegulationApprovalEditBean.regulation.documentNo}"
                	disabled="true" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationRegTitle}" /></label>
                <h:inputText styleClass="form-control" value="#{internalRegulationApprovalEditBean.regulation.nameIn}"
                	title="#{internalRegulationApprovalEditBean.regulation.nameIn}"
                	disabled="true" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" >
                	<h:outputText value="#{msg.formInternalRegulationDecriptionRegulation}" />
                </label>
                <pe:ckEditor id="descriptionRegulation" widgetVar="editorContent" width="100%" required="true"
								requiredMessage="#{msg.formInternalRegulationDecriptionRegulation} #{msg.validateRequired}"
								value="#{internalRegulationApprovalEditBean.regulation.descriptionIn}" readonly="true"
								height="300" style="margin-bottom:10px" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationPublishedDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="publishedDate" 
                        value="#{internalRegulationApprovalEditBean.regulation.publishedDateStr}" readonly="true"/> -->
                  <p:calendar styleClass="form-control-datepicker-wrap" id="publishedDate" disabled="true"
						value="#{internalRegulationApprovalEditBean.regulation.publishedDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
				  </p:calendar>       
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group ">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationEffDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="effectiveDate" 
                        value="#{internalRegulationApprovalEditBean.regulation.effectiveDateStr}" readonly="true"/> -->
					<p:calendar styleClass="form-control-datepicker-wrap"
						id="effectiveDate" disabled="true"
						value="#{internalRegulationApprovalEditBean.regulation.effectiveDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
					</p:calendar>
				</div>
            </div>
            <div class="col-lg-12">
              <div class="form-group ">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationReviewDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="expiredDate" 
                       value="#{internalRegulationApprovalEditBean.regulation.expiredDateStr}" readonly="true"/> -->
                   <p:calendar styleClass="form-control-datepicker-wrap" id="expiredDate" disabled="true"
						value="#{internalRegulationApprovalEditBean.regulation.expiredDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
				  </p:calendar>    
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><p:outputLabel value="#{msg.formInternalRegulationEmailReminder}" for="internalEmailReminder" /></label>
	            <h:selectOneMenu id="internalEmailReminder" styleClass="form-control s2" disabled="true"
	            	value="#{internalRegulationApprovalEditBean.counterTypeId}">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{internalRegulationApprovalEditBean.emailReminderList}" />
	            </h:selectOneMenu>
	            <p:message for="internalEmailReminder"/>
              </div>
            </div>
            
            
            <h3><h:outputText value="#{msg.formInternalRegulationAttachmentPeraturan}" /></h3>
            <div class="col-lg-12">
              <div class="form-group">
                <p:remoteCommand name="onCompleteUpload" update="peraturanIdList peraturanFAQList peraturanLampiranList peraturanFormRingkasanList peraturanOtherList"></p:remoteCommand>
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationPeraturanUtuh}" /></label>
               
                <p:dataList value="#{internalRegulationApprovalEditBean.uploadedFilesPeraturanId}" 
                	emptyMessage=""
                	var="vo" id="peraturanIdList">
			       <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationFAQ}" /></label>
                
                <p:dataList value="#{internalRegulationApprovalEditBean.uploadedFilesFAQ}" 
                	emptyMessage=""
                	var="vo" id="peraturanFAQList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationLampiran}" /></label>
                
                <p:dataList value="#{internalRegulationApprovalEditBean.uploadedFilesLampiran}" 
                	emptyMessage=""
                	var="vo" id="peraturanLampiranList">
                    <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationSummaryForm}" /></label>
                
                <p:dataList value="#{internalRegulationApprovalEditBean.uploadedFilesFormRingkasan}" 
                	emptyMessage=""
                	var="vo" id="peraturanFormRingkasanList" rowIndexVar="index">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formInternalRegulationOther}" /></label>
               
                <p:dataList value="#{internalRegulationApprovalEditBean.uploadedFilesOther}" 
                	emptyMessage=""
                	var="vo" id="peraturanOtherList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{internalRegulationApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>            
            
            <h3><h:outputText value="#{msg.formInternalRegulationRekamJejak}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  
                  <div class="table-wrapper table-responsive">
                  <p:dataTable id="dataTable" var="data" value="#{internalRegulationApprovalEditBean.tableModel}" 
                  selection="#{internalRegulationApprovalEditBean.selectedData}" 
                  rowKey="#{data.sequence}"
                  rowIndexVar="statIndex">
                  		<p:ajax event="rowSelectCheckbox" process="@this"/>
                        <p:ajax event="rowUnselectCheckbox" process="@this"/>
                        <p:ajax event="toggleSelect" process="@this"/>
                    <!-- <p:column selectionMode="multiple" style="text-align:center; width:40px;"/> -->
				    <p:column headerText="#{msg.formInternalRegulationRekamJejak}">
				        <h:selectOneMenu styleClass="form-control s2" value="#{data.trackCode}" disabled="true">
			                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
						    <f:selectItems value="#{internalRegulationApprovalEditBean.trackCodes}" />
			            </h:selectOneMenu>
				    </p:column>
				 
				    <p:column headerText="#{msg.formInternalRegulationRegNo}">
				    	<div class="input-group">
				        <h:inputHidden value="#{data.regulationLinkId}" ></h:inputHidden>
				        <h:inputText  styleClass="form-control temp-no-peraturan" value="#{data.regulationLinkName}" disabled="true" alt="#{data.regulationLinkName}" title="#{data.regulationLinkName}"/>
                        <span class="input-group-btn">
                              <p:commandLink  styleClass="btn btn-link"  onclick="jdlPeraturanDialog.show()"><i class="fa fa-search"> </i>
                              <f:setPropertyActionListener
											target="#{internalRegulationApprovalEditBean.indexDtl}"
											value="#{statIndex}" />
                              </p:commandLink>
                        </span>
                        </div>
                        
				    </p:column>
				 
				    <p:column headerText="#{msg.formInternalRegulationKetMencabut}">
				        <h:inputText styleClass="form-control" value="#{data.trackNote}" alt="#{data.trackNote}" title="#{data.trackNote}" disabled="true"/>
				    </p:column>
				    
				    <p:column headerText="#{msg.formInactive}" style="text-align:center; width:80px;">
						<h:selectBooleanCheckbox value="#{data.inActive}" styleClass="icheckbox_square-grey"
						rendered="#{data.trackCode eq 'RECORD_CHANGE'}"
						disabled="true" />
					</p:column>
	
				</p:dataTable>
				</div>
                </div>
              </div>
              	<div class="col-lg-12">
	             <div class="form-group">
	             	<label class="tl-label"><h:outputText value="#{msg.textApprovalStatus}" /></label>
		          	<h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationApprovalEditBean.approvalStat}">
		                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
					    <f:selectItems value="#{internalRegulationApprovalEditBean.approvalStatus}" />
		            </h:selectOneMenu>
	             </div>
	           </div>
              	<div class="col-lg-12">
	              	<h3>#{msg.formInternalRegulationApprovalNote}</h3>
		              <div class="form-group">
		                
		                <textarea id="note" class="form-control" rows="5"></textarea>
		              </div>
            	</div>
          </div>
      </div>
      <div class="box-footer">
      	<p:commandButton value="#{msg.buttonSave}" 
      	                    rendered="#{internalRegulationApprovalEditBean.regulation.status eq 'DATA_NEW'}"
							styleClass="btn btn-success pull-left tl-label"
							onclick="saveOnClick([{name: 'NOTE', value:$('#note').val()}])"></p:commandButton>
      	
		<p:commandButton value="#{msg.buttonCancel}" actionListener="#{internalRegulationApprovalEditBean.cancel()}"
							styleClass="btn btn-default pull-right tl-label">
		</p:commandButton>
        <p:remoteCommand action="#{internalRegulationApprovalEditBean.save}" update="msgs"
                 name="saveOnClick" process="@form" />
      </div>
    </div>
    
	</ui:define>
	
	
</ui:composition>
