<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formResponsibilityTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:messages id="messages" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-document-type">
					<h:outputText value="#{msg.formResponsibilityAddTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="responsibility--form-id"><h:outputText
									value="#{msg.formResponsibilityTitle}" /></label>
							<p:inputText styleClass="form-control" autocomplete="off"
								value="#{responsibilityEditBean.responsibility.name}" maxlength="32"></p:inputText>
						</div>
					</div>

					<p:treeTable id="frmResponsibilityMenuTreeTable"
						value="#{responsibilityEditBean.root}" var="responsibilityMenu"
						selection="#{responsibilityEditBean.selectedNodes}"
						selectionMode="checkbox">
						<p:ajax event="select"
							listener="#{responsibilityEditBean.onNodeSelect}" />
						<p:ajax event="unselect"
							listener="#{responsibilityEditBean.onNodeUnselect}" />
						<p:column>
							<f:facet name="header">
								<h:outputText value="#{msg.formResponsibilityMenu}"></h:outputText>
							</f:facet>
							<h:outputText value="#{responsibilityMenu.menu_name}" />

						</p:column>
					</p:treeTable>


				</div>
			</div>
			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{responsibilityEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{responsibilityEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>
	</ui:define>
</ui:composition>
