<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">
		
		<div class="row brdcrumb">
			 <nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			 	<div class=" navbar-collapse " id="collapsibleNavbar">
			 		<ul class="navbar-nav">
			 			<li class="nav-item">
			 				<a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
			 				<a class="nav-link"><i class="fa fa-sm fa-bold fa-chevron-right" style="margin-top:-5px;color: #FFC600;"></i></a>
			 				<a class="nav-link disabled" href="#">#{announcementViewFEEditBean.announcement.announcementTitle}</a>
			 			</li>
			 		</ul>
			 	</div>
			 </nav>
		</div>
		
		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">#{announcementViewFEEditBean.announcement.announcementTitle}</div>
			<h:form class="internal-form" style="margin-top:20px;" id="form">
				<p:growl id="messages" severity="error"/>
				
				<div class="form-row">	
					<div class="col">
						<div class="label-form">Periode</div>
						<div class="value-form">#{announcementViewFEEditBean.periode}</div>
					</div>
				</div>
				
				<div class="form-row">
					<div class="col">
						<div class="label-form">Kontent Pengumuman</div>
						<div class="value-form">#{announcementViewFEEditBean.announcement.announcementContent}</div>
					</div>
				</div>
				
				<div class="form-row">
					<div class="col">
						<p:remoteCommand action="#{announcementViewFEEditBean.cancel}"
							name="cancel" immediate="true"></p:remoteCommand>
						<button type="button" class="btn btn-outline-secondary"
							onclick="cancel()">Kembali</button>
					</div>
				</div>
				
			</h:form>
		</div>
		
	</ui:define>
</ui:composition>
