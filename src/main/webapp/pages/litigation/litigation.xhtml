
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formLitigationTitle}" />
	</ui:define>
	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{litigationBean.getNavigateEdit()}" 
					type="submit" process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>
	
	<ui:define name="head">
		<style>
			.noti-lock {
				text-align: center;
			    background-color: red;
			    color: white;
			    border-radius: 5px;
			    position: fixed;
			    z-index: 9999;
			    width: 1322px;
			    height: 25px;
    			padding-top: 4px;
			}
			.box.box-solid {
				top:30px;
			}
		</style>
	</ui:define>

	<ui:define name="content">
		<h:panelGroup rendered="#{litigationBean.isActionUserLock}">
			<div class="noti-lock">
				<i class="fa fa-info-circle"/>
				&nbsp;
				<h:outputText value="#{litigationBean.noteLock}"/>
			</div>
		</h:panelGroup>
		 <div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLitigationCaseType}" /></label>
								<h:selectOneMenu id="searchCaseType"
										styleClass="form-control s2"
										value="#{litigationBean.searchCaseType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{litigationBean.caseTypeList}"/>
								</h:selectOneMenu>
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLitigationBranchOffice}" /></label>
								<p:inputText id="searchBranchOffice" styleClass="form-control"
									autocomplete="off" value="#{litigationBean.searchDivNameOrBranchOffice}" />
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText
										value="#{msg.formLitigationSegment}" />
								</label>
								<p:inputText id="searchSegment" styleClass="form-control"
									autocomplete="off" value="#{litigationBean.searchSegment}" />
							</div>
						</div>
						
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText
										value="#{msg.formLitigationDebitur}" />
								</label>
								<p:inputText id="searchDebtor" styleClass="form-control"
									autocomplete="off" value="#{litigationBean.searchDebtor}" />
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText
										value="#{msg.formLitigationCaseNumber}" />
								</label>
								<p:inputText id="searchCaseNumber" styleClass="form-control"
									autocomplete="off" value="#{litigationBean.searchCaseNumber}" />
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText
										value="#{msg.formLitigationReportNumber}" />
								</label>
								<p:inputText id="searchReportNumber" styleClass="form-control"
									autocomplete="off" value="#{litigationBean.searchReportNumber}" />
							</div>
						</div>
						
					</h:panelGroup>
				
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{litigationBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{litigationBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
								<li>
									<h:panelGroup id="panelLock">
										<h:panelGroup id="showPanelLock" rendered="#{litigationBean.isShowPanelLock}">
											<p:commandButton value="#{msg.textLock}" ajax="true" rendered="#{litigationBean.isLock}"
												update="tableSearch panelSearch form:deletedMessage form:panelLock" icon="fa fa-lock"
												styleClass="btn btn-default btn-flat tl-label"
												actionListener="#{litigationBean.lock()}"/>
											<p:commandButton value="#{msg.textUnlock}" ajax="true" rendered="#{litigationBean.isUnlock}"
												update="tableSearch panelSearch form:deletedMessage form:panelLock" icon="fa fa-unlock"
												styleClass="btn btn-default btn-flat tl-label"
												actionListener="#{litigationBean.unlock()}"/>
										</h:panelGroup>
									</h:panelGroup>
								</li>
								<li>
								</li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{litigationBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}"
								rows="#{litigationBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;"
									headerText="#{msg.formAction}" width="150">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{litigationBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label" update="form:deletedMessage">
										<f:param name="id" value="#{vo.litigationId}" />
									</p:commandLink>

									<h:outputText style=" padding-left:4px; color:grey;'"
										value=" | " />
									<h:outputLabel value="&#160;" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label" update="tableSearch form:deletedMessage"
										action="#{litigationBean.delete(vo.litigationId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formLitigationCaseType}" width="150">
									<h:outputLabel value="#{vo.caseTypeName} #{vo.caseTypeDtlName}" />
								</p:column>
								<p:column headerText="#{msg.formLitigationBranchOffice}" width="250">
									<h:outputLabel value="#{vo.divisionOrBranchOffice}" />
								</p:column>
								<p:column headerText="#{msg.formLitigationSegment}" width="250">
									<h:outputLabel value="#{vo.segment}" />
								</p:column>
								<p:column headerText="#{msg.formLitigationDebitur}" width="250">
									<h:outputLabel value="#{vo.debtorName}" />
								</p:column>
								<p:column headerText="#{msg.formLitigationCaseNumber}" width="250">
									<h:outputLabel value="#{vo.caseNumberName}" />
								</p:column>
								<p:column headerText="#{msg.formLitigationReportNumber}" width="250">
									<h:outputLabel value="#{vo.reportNumberName}" />
								</p:column>
	
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div> 

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formRCDeleteRC}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
