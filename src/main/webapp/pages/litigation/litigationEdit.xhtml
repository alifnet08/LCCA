<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
		.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}	
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    -webkit-box-shadow: none;
			    box-shadow: none;
			}
			.form-control[disabled]{
			    font-size: 13px;
			    font-family: 'Montserrat';
			    color: #444444;
			}
			.input-group {
			    margin-top: 15px;
			}
			.ui-widget-content .ui-inputfield {
			    font-family: 'Montserrat';
			}
			
			input#form\:picPerdataTergugat {
				margin-right: 10px;
			    width: 310px;
			}
			
		</style>
		<script>
			$('form').on('focus', 'input[type=number]', function (e) {
			  $(this).on('wheel.disableScroll', function (e) {
			    e.preventDefault()
			  })
			})
			$('form').on('blur', 'input[type=number]', function (e) {
			  $(this).off('wheel.disableScroll')
			})
		</script>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formLitigationTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-litigation">
					<h:outputText value="#{msg.formLitigationTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
				
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="category"><p:outputLabel
									value="#{msg.formLitigationCaseType}" for="caseType" /></label>								
							<h:selectOneMenu id="caseType" required="true" requiredMessage="#{msg.formLitigationCategory} #{msg.validateRequired}"
								styleClass="form-control s2" disabled="#{litigationEditBean.actionMode eq 'EDIT'}"
								value="#{litigationEditBean.litigationNew.selectCaseType}"> 
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{litigationEditBean.caseTypeList}"/>
								<p:ajax event="change" listener="#{litigationEditBean.onChangeCaseType}"
										update="panelCaseTypePerdata panelCaseTypePidana panelCaseTypePailitPkpu"/>
							</h:selectOneMenu>
						</div>
					</div>
					
					<h3>
						<h:outputLabel value="LOB"/>
					</h3>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="branchOffice"><p:outputLabel
									value="#{msg.formLitigationBranchOffice}" for="branchOffice" /></label>								
							<p:inputText autocomplete="off" style="width:100%" styleClass="form-control" id="branchOffice" 
									value="#{litigationEditBean.litigationNew.divisionOrBranchOffice}" 
									required="true" requiredMessage="#{msg.formLitigationBranchOffice} #{msg.validateRequired}"/>
							<p:message for="branchOffice"/>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="segment"><p:outputLabel
									value="#{msg.formLitigationSegment}" for="segment" /></label>								
							<p:inputText autocomplete="off" style="width:100%" styleClass="form-control" id="segment" 
									value="#{litigationEditBean.litigationNew.segment}" 
									required="true" requiredMessage="#{msg.formLitigationSegment} #{msg.validateRequired}"/>
							<p:message for="segment"/>
						</div>
					</div>
					
					<h:panelGroup id="panelCaseTypePerdata" style="#{litigationEditBean.litigationNew.selectCaseType eq 'CASE_TYPE_PERDATA' ? '':'display:none'}">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="tl-label" tl="category"><p:outputLabel
										value="#{msg.formLitigationCaseTypeMaybankAs}" for="caseTypeDtlPerdata" /></label>								
								<h:selectOneMenu id="caseTypeDtlPerdata"
										styleClass="form-control s2" disabled="#{litigationEditBean.actionMode eq 'EDIT'}"
										value="#{litigationEditBean.litigationNew.selectCaseTypeDtlPerdata}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{litigationEditBean.caseTypePerdataDtlList}"/>
									<p:ajax update="panelCaseTypeDtlPerdataTergugat panelCaseTypeDtlPerdataPenggugat" event="change"
											listener="#{litigationEditBean.onChangeCaseTypeDtlPerdata}"/>
								</h:selectOneMenu>
								<p:message for="caseTypeDtlPerdata"/>
							</div>
						</div>
						
						<h:panelGroup id="panelCaseTypeDtlPerdataTergugat" style="#{litigationEditBean.litigationNew.selectCaseTypeDtlPerdata eq 'CASE_TYPE_DTL_PERDATA_TERGUGAT' and litigationEditBean.litigationNew.selectCaseType eq 'CASE_TYPE_PERDATA' ? '':'display:none'}">
							<div class="col-lg-12">
								<div class="form-group">
									<label class="control-label tl-label" tl="debitur"><p:outputLabel
											value="#{msg.formLitigationDebitur}"/></label>								
									<p:inputText autocomplete="off" style="width:100%" styleClass="form-control" id="debitur" 
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.debitur}"/>
								</div>
							</div>
							
							<h3>
								<h:outputLabel value="#{msg.formLitigationCaseRegistration}"/>
							</h3>
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationCaseYear}"/></label>
									<p:inputText id="tahunPerkaraPerdataTergugat" styleClass="form-control" type="number" maxlength="4"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.caseYear}" />
								</div>
							</div>
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationCaseNumber}" /></label>
									<p:inputText id="nomorPerkaraPerdataTergugat" styleClass="form-control"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.caseNumber}" />
								</div>
							</div>
							
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationCourtType}"/></label>
									<h:selectOneMenu id="tipePengadilanPerdataTergugat" styleClass="form-control s2" immediate="true"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.selectCourtType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.courtTypeList}" />
									</h:selectOneMenu> 
								</div>
							</div>
							
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationCourtDomicile}"/></label>
									<p:inputText id="domisiliPengadilanPerdataTergugat" styleClass="form-control"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.courtDomicile}" />
								</div>
							</div>
							
							<h3>
								<h:outputLabel value="#{msg.formLitigationParaPihak}"/>
							</h3>
							<!-- DTL PENGGUGAT -->
							<h:panelGroup>

									<h:outputLabel value="#{msg.formLitigationPenggugat}"/>

													<li><p:commandLink onclick="onAddNewPihakPenggugatPerdataTergugat()">
															<i class="fa fa-plus"></i>
														</p:commandLink></li>
													<li><p:commandLink onclick="onDeleteRowPihakPenggugatPerdataTergugat()">
															<i class="fa fa-trash"></i>
														</p:commandLink></li>
												</ul>
											</div>
										</h4>
										<div class="table-wrapper table-responsive">

													value="#{litigationEditBean.tableModelLitigationPihakPenggugatPemohon}"

													rowKey="#{data.sequence}" rowIndexVar="statIndex"
													rowSelectMode="checkbox">
													
												<p:ajax event="rowSelectCheckbox" process="@this" update="dataTablePihakPenggugatPerdataTergugat" />
												<p:ajax event="rowUnselectCheckbox" process="@this" update="dataTablePihakPenggugatPerdataTergugat"/>
												<p:ajax event="toggleSelect" process="@this" update="dataTablePihakPenggugatPerdataTergugat"/>
													
												<p:column selectionMode="multiple" style="text-align:center; width:40px;" />
												
												<p:column headerText="#{msg.formLitigationPenggugat}" width="500">
													<p:inputText styleClass="form-control" value="#{data.penggugatPemohon}">
														<p:ajax event="change" update="@form" process="@this"/>
													</p:inputText>
												</p:column>
											</p:dataTable>
										</div>
									</div>
								</div>
							</h:panelGroup>
							<!-- DTL TERGUGAT -->
							<h:panelGroup>
								<h3>
									<h:outputLabel value="#{msg.formLitigationTergugat}"/>

										<h4 class="sub-header">
											&nbsp;

												<ul class="no-margin no-padding">
													<li><p:commandLink onclick="onAddNewPihakTergugatPerdataTergugat()">
															<i class="fa fa-plus"></i>
														</p:commandLink></li>
													<li><p:commandLink onclick="onDeleteRowPihakTergugatPerdataTergugat()">
															<i class="fa fa-trash"></i>
														</p:commandLink></li>
												</ul>
											</div>
										</h4>
										<div class="table-wrapper table-responsive">
											<p:dataTable id="dataTablePihakTergugatPerdataTergugat" var="data"
													value="#{litigationEditBean.tableModelLitigationPihakTergugatTermohon}"
													selection="#{litigationEditBean.selectedLitigationPihakTergugatTermohon}"
													rowKey="#{data.sequence}" rowIndexVar="statIndex"
													rowSelectMode="checkbox">
													
												<p:ajax event="rowSelectCheckbox" process="@this" update="dataTablePihakTergugatPerdataTergugat"/>
												<p:ajax event="rowUnselectCheckbox" process="@this" update="dataTablePihakTergugatPerdataTergugat"/>
												<p:ajax event="toggleSelect" process="@this" update="dataTablePihakTergugatPerdataTergugat"/>

												<p:column headerText="#{msg.formLitigationTergugat}" width="500">
													<p:inputText styleClass="form-control" value="#{data.tergugatTermohon}">
														<p:ajax event="change" update="@form" process="@this"/>
													</p:inputText>
												</p:column>
											</p:dataTable>
										</div>
									</div>
								</div>
							</h:panelGroup>

							<!-- DTL TURUT TERGUGAT -->
							<h:panelGroup>
								<h3>
									<h:outputLabel value="#{msg.formLitigationTurutTergugat}"/>
								</h3>
								<div class="col-lg-12">
									<div id="litigationTurutTergugatTableWarpPerdataTergugat">
										<h4 class="sub-header">
											&nbsp;
											<div class="box-tools">
												<ul class="no-margin no-padding">
													<li><p:commandLink onclick="onAddNewPihakTurutTergugatPerdataTergugat()">
															<i class="fa fa-plus"></i>
														</p:commandLink></li>
													<li><p:commandLink onclick="onDeleteRowPihakTurutTergugatPerdataTergugat()">
															<i class="fa fa-trash"></i>
														</p:commandLink></li>
												</ul>
											</div>
										</h4>
										<div class="table-wrapper table-responsive">
											<p:dataTable id="dataTablePihakTurutTergugatPerdataTergugat" var="data"
													value="#{litigationEditBean.tableModelLitigationPihakKuratorTurutTergugat}"
													selection="#{litigationEditBean.selectedLitigationPihakKuratorTurutTergugat}"
													rowKey="#{data.sequence}" rowIndexVar="statIndex"
													rowSelectMode="checkbox">
													
												<p:ajax event="rowSelectCheckbox" process="@this" update="dataTablePihakTurutTergugatPerdataTergugat"/>
												<p:ajax event="rowUnselectCheckbox" process="@this" update="dataTablePihakTurutTergugatPerdataTergugat"/>
												<p:ajax event="toggleSelect" process="@this" update="dataTablePihakTurutTergugatPerdataTergugat"/>
													
												<p:column selectionMode="multiple" style="text-align:center; width:40px;" />
												
												<p:column headerText="#{msg.formLitigationTurutTergugat}" width="500">
													<p:inputText styleClass="form-control" value="#{data.kuratorTurutTergugat}">
														<p:ajax event="change" update="@form" process="@this"/>
													</p:inputText>
												</p:column>
											</p:dataTable>
										</div>
									</div>
								</div>
							</h:panelGroup>
							
							<h3>
								<h:outputLabel value="#{msg.formLitigationAttorney}"/>
							</h3>
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationPenggugat}" for="penggugatKuasaHukumPerdataTergugat" /></label>
									<p:inputText id="penggugatKuasaHukumPerdataTergugat" styleClass="form-control"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.kuasaHukumPenggugat}" />
									<p:message for="penggugatKuasaHukumPerdataTergugat"/>
								</div>
							</div>
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationTergugat}" for="tipeTergugatKuasaHukumPerdataTergugat" /></label>
									<h:selectOneMenu id="tipeTergugatKuasaHukumPerdataTergugat"  styleClass="form-control s2" immediate="true"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.selectCaseHandler}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.caseHandlerList}" />
									</h:selectOneMenu> 
								</div>
							</div>
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationAttorneyOfficeName}" for="tergugatKuasaHukumPerdataTergugat" /></label>
									<p:inputText id="tergugatKuasaHukumPerdataTergugat" styleClass="form-control"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.attorneyOfficeName}" />
								</div>
							</div>
							
							<!-- DTL PENANGANAN TIM -->

									<h:outputLabel value="#{msg.formLitigationTeamHandler}"/>
								</h3>
								<div class="col-lg-12">
									<div id="litigationTimPerkaraPerdataTergugat">
										<div class="table-wrapper table-responsive">
											<p:dataTable id="dataTablePerkaraTimPerdataTergugat"
													value="#{litigationEditBean.litigationNew}">
												<p:column headerText="#{msg.formLitigationTeamHandler}" width="150">
													<h:selectOneMenu id="caseTeamHandlerPerdataTergugat" styleClass="form-control s2" immediate="true"
															value="#{litigationEditBean.litigationNew.selectCaseTeamHandlerPerdataTer}">
														<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
														<f:selectItems value="#{litigationEditBean.caseTeamHandlerList}" />

													</h:selectOneMenu>
												</p:column>
												<p:column headerText="#{msg.formLitigationPic}" width="200">
													<table>
														<tr>
															<td style="width: 80%">
																<p:inputText id="picPerdataTergugat" styleClass="form-control"
																	value="#{litigationEditBean.litigationNew.selectedPicName}" readonly="true">
																</p:inputText>
															</td>
															<td style="width: 20%">
																<p:commandLink process="@this"
																		onstart="$('.hdnParamViewer1').val(); picDialog.show();">
																	<i class="fa fa-search ico-lg"></i>
																</p:commandLink>

													</table>

													<p:inputTextarea id="picKeteranganPerdataTergugat" styleClass="form-control"

													</p:inputTextarea>
												</p:column>
											</p:dataTable>
										</div>
									</div>
								</div>

							<div class="col-lg-12">

								</div>
							</div>
							
							<div class="col-lg-12">

									<h:selectOneMenu id="pokokPerkaraPerdataTergugat" styleClass="form-control s2" immediate="true"

							<div class="col-lg-12">

									<h:selectOneMenu id="subPokokPerkaraPerdataTergugat" styleClass="form-control s2" immediate="true"

										<f:selectItems value="#{litigationEditBean.caseSubTopicList}" />
									</h:selectOneMenu>
								</div>	
							</div>
							
							<div class="col-lg-12">

									<label class="tl-label"><p:outputLabel

									<p:inputTextarea id="kasusPosisiGugatanPerdataTergugat" styleClass="form-control"

							<div class="col-lg-12">

									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationMaybankLegalPosition}" /></label>
									<p:inputTextarea id="kedudukanHukumMaybankPerdataTergugat" styleClass="form-control"

							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel
											value="#{msg.formLitigationPlaintiffDemand}" /></label>
									<p:inputTextarea id="tuntutatPenggugatPerdataTergugat" styleClass="form-control"
											value="#{litigationEditBean.litigationNew.litigationPerdataTergugat.plaintiffDemand}" />

							</div>

									<label class="tl-label"><p:outputLabel

									<p:inputNumber id="materialIdrNilaiTurunanPerkaraPerdataTergugat" styleClass="form-control"

										<p:ajax event="valueChange" update="totalTuntutanNilaiTurunanPerkaraPerdataTergugat"

									<label class="tl-label"><p:outputLabel
