	<ui:define name="head">
		<style>
		.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}	
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    -webkit-box-shadow: none;
			    box-shadow: none;
			}
			.form-control[disabled]{
			    font-size: 13px;
			    font-family: 'Montserrat';
			    color: #444444;
			}
			.input-group {
			    margin-top: 15px;
			}
			.ui-widget-content .ui-inputfield {
			    font-family: 'Montserrat';
			}
		</style>
		<script>
		function disable(){
			/* PT */
			$('#form\\:courtDetails\\:1\\:courtType').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:courtName').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:progress').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:decision').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:date_input').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:panelUpayaHukum').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:note').prop('disabled',true);
			$('#form\\:courtDetails\\:1\\:lampiranPutusanPT_input').prop('disabled',true);
			
			/* MA */
			$('#form\\:courtDetails\\:2\\:courtType').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:courtName').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:progress').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:decision').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:date_input').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:panelUpayaHukum').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:note').prop('disabled',true);
			$('#form\\:courtDetails\\:2\\:lampiranPutusanMA_input').prop('disabled',true);
		}
		function disableEnable(){
			if($('#form\\:courtDetails\\:0\\:legalEffortPN').val() == 'DECISION_BANDING'){
				$('#form\\:courtDetails\\:1\\:courtType').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:courtName').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:progress').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:decision').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:date_input').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:legalEffortPT').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:note').prop('disabled',false);
				$('#form\\:courtDetails\\:1\\:lampiranPutusanPT_input').prop('disabled',false);
			}else{
				$('#form\\:courtDetails\\:1\\:courtType').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:courtName').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:progress').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:decision').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:date_input').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:legalEffortPT').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:note').prop('disabled',true);
				$('#form\\:courtDetails\\:1\\:lampiranPutusanPT_input').prop('disabled',true);
			}
			
			if ($('#form\\:courtDetails\\:1\\:legalEffortPT').val() == 'LEGAL_EFFORT_KASASI') {
				$('#form\\:courtDetails\\:2\\:courtType').prop('disabled',false);
				$('#form\\:courtDetails\\:2\\:progress').prop('disabled',false);
				$('#form\\:courtDetails\\:2\\:decision').prop('disabled',false);
				$('#form\\:courtDetails\\:2\\:date_input').prop('disabled',false);
				$('#form\\:courtDetails\\:2\\:legalEffortMA').prop('disabled',false);
				$('#form\\:courtDetails\\:2\\:note').prop('disabled',false);
				$('#form\\:courtDetails\\:2\\:lampiranPutusanPT_input').prop('disabled',false);
			} else {
				$('#form\\:courtDetails\\:2\\:courtType').prop('disabled',true);
				$('#form\\:courtDetails\\:2\\:progress').prop('disabled',true);
				$('#form\\:courtDetails\\:2\\:decision').prop('disabled',true);
				$('#form\\:courtDetails\\:2\\:date_input').prop('disabled',true);
				$('#form\\:courtDetails\\:2\\:legalEffortMA').prop('disabled',true);
				$('#form\\:courtDetails\\:2\\:note').prop('disabled',true);
				$('#form\\:courtDetails\\:2\\:lampiranPutusanPT_input').prop('disabled',true);
			}
		}
		</script>

								<h:panelGroup id="panelCourtName" >
									<label class="tl-label" style="width: 100%;text-align:center;"> <p:outputLabel
											value="#{msg.formLitigationCourtName}" />
									</label>
									<h:selectOneMenu id="courtName#{statIndex}" styleClass="form-control s2"
										value="#{vo.courtName.parameterDtlCode}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.courtNameList}" />
									</h:selectOneMenu>
								</h:panelGroup>
								
								<!-- Progress -->
								<h:panelGroup id="panelProgress" >
									<label class="tl-label" style="width:100%;text-align:center;">
										<p:outputLabel value="#{msg.formLitigationProgress}"/>
									</label>
									<p:inputText autocomplete="off" value="#{vo.progress}" id="progress#{statIndex}" styleClass="form-control"/>
								</h:panelGroup>
								
								<!-- Decision -->
								<h:panelGroup id="panelDecision" >
									<label class="tl-label" style="width: 100%;text-align:center;"> <p:outputLabel
											value="#{msg.formLitigationDecision}" />
									</label>
									<h:selectOneMenu id="decision#{statIndex}"
										styleClass="form-control s2" 
										value="#{vo.sentence.parameterDtlCode}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.decisionList}" />
									</h:selectOneMenu>
								</h:panelGroup>
								
								<!-- Decision Date -->
								<h:panelGroup id="panelDecisionDate">
									<label class="tl-label" style="width: 100%;text-align:center;"> <p:outputLabel
											value="#{msg.formLitigationDate}" />
									</label>
									<p:calendar id="date#{statIndex}" styleClass="form-control-datepicker-wrap" 
										maxlength="11" value="#{vo.courtDate}" autocomplete="off"
										pattern="dd-MMM-yyyy" locale="en">
									</p:calendar>
								</h:panelGroup>
								
								<!-- Upaya Hukum -->
								<h:panelGroup id="panelUpayaHukum">
									<label class="tl-label" style="width: 100%;text-align:center;"> <p:outputLabel
											value="#{msg.formLitigationLegalEffort}" />
									</label>
									<h:selectOneMenu id="legalEffortPN#{statIndex}" rendered="#{statIndex == 0}" onchange="disableEnable()"
										styleClass="form-control s2" 
										value="#{litigationEditBean.legalEffort1}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.legalEffortListPN}" />
									</h:selectOneMenu>
									<h:selectOneMenu id="legalEffortPT#{statIndex}" rendered="#{statIndex == 1}" onchange="disableEnable()"
										styleClass="form-control s2" 
										value="#{litigationEditBean.legalEffort2}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.legalEffortListPT}" />
									</h:selectOneMenu>
									<h:selectOneMenu id="legalEffortMA#{statIndex}" rendered="#{statIndex == 2 and litigationEditBean.litigation.caseType.parameterDtlCode ne 'CASE_TYPE_PERDATA'}"
										styleClass="form-control s2" 
										value="#{litigationEditBean.legalEffort3}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.legalEffortListMA}" />
									</h:selectOneMenu>
									<h:selectOneMenu id="legalEffortMAPerdata#{statIndex}" rendered="#{statIndex == 2 and litigationEditBean.litigation.caseType.parameterDtlCode eq 'CASE_TYPE_PERDATA'}"
										styleClass="form-control s2" 
										value="#{litigationEditBean.legalEffort4}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationEditBean.legalEffortListMAPerdata}" />
									</h:selectOneMenu>
								</h:panelGroup>
								
								<!-- Information -->
								<h:panelGroup id="panelInformation">
									<label class="tl-label" style="width: 100%;text-align:center;"> <p:outputLabel
											value="#{msg.formLitigationInformation}" />
									</label>
									<h:inputText autocomplete="off" id="note" styleClass="form-control"
										value="#{vo.note}" />
								</h:panelGroup>
								
								<!-- Lampiran Putusan -->
								<h:panelGroup id="panelLampiranPutusan">
									<p:remoteCommand name="onCompleteUploadPN" update="form:courtDetails:0:attachmentPN"></p:remoteCommand>
									<p:remoteCommand name="onCompleteUploadPT" update="form:courtDetails:1:attachmentPT"></p:remoteCommand>
									<p:remoteCommand name="onCompleteUploadMA" update="form:courtDetails:2:attachmentMA"></p:remoteCommand>
									<label class="tl-label" style="width: 100%;"> <p:outputLabel
											value="#{msg.formLitigationAttachment}" />
											<br/>
											<h:outputText style="color: #dd4b39" value="#{litigationEditBean.textWarningUpload}"/>
									</label>
									<p:fileUpload rendered="#{statIndex == 0}"
										fileUploadListener="#{litigationEditBean.handleFileUploadPN}"
										oncomplete="onCompleteUploadPN()" id="lampiranPutusanPN#{statIndex}"
										value="litigationEditBean.uploadFilesPN" mode="advanced"
										auto="true" dragDropSupport="false" multiple="true"
										sizeLimit="#{litigationEditBean.standardAttachmentSize}"
										update="form:msgs" />
									<p:dataList value="#{litigationEditBean.uploadFilesPN}" rendered="#{statIndex == 0}"
										emptyMessage="" var="vo" id="attachmentPN" rowIndexVar="index">
										<table>
											<tr>
												<td style="width: 80%"><p:commandLink
														title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
														actionListener="#{litigationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
														target="_blank">#{vo.fileName}</p:commandLink></td>
												<td><p:commandLink immediate="true"
														actionListener="#{litigationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_DOCUMENT_PN')}"
														update="form:courtDetails:0:attachmentPN">#{msg.buttonDelete}</p:commandLink></td>
											</tr>
										</table>
									</p:dataList>
									<p:fileUpload rendered="#{statIndex == 1}"
										fileUploadListener="#{litigationEditBean.handleFileUploadPT}"
										oncomplete="onCompleteUploadPT()" id="lampiranPutusanPT#{statIndex}"
										value="litigationEditBean.uploadFilesPT" mode="advanced"
										auto="true" dragDropSupport="false" multiple="true"
										sizeLimit="#{litigationEditBean.standardAttachmentSize}"
										update="form:msgs" />
									<p:dataList value="#{litigationEditBean.uploadFilesPT}" rendered="#{statIndex == 1}"
										emptyMessage="" var="vo" id="attachmentPT" rowIndexVar="index">
										<table>
											<tr>
												<td style="width: 80%"><p:commandLink
														title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
														actionListener="#{litigationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
														target="_blank">#{vo.fileName}</p:commandLink></td>
												<td><p:commandLink immediate="true"
														actionListener="#{litigationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_DOCUMENT_PT')}"
														update="form:courtDetails:1:attachmentPT">#{msg.buttonDelete}</p:commandLink></td>
											</tr>
										</table>
									</p:dataList>
									<p:fileUpload rendered="#{statIndex == 2}"
										fileUploadListener="#{litigationEditBean.handleFileUploadMA}"
										oncomplete="onCompleteUploadMA()" id="lampiranPutusanMA#{statIndex}"
										value="litigationEditBean.uploadFilesMA" mode="advanced"
										auto="true" dragDropSupport="false" multiple="true"
										sizeLimit="#{litigationEditBean.standardAttachmentSize}"
										update="form:msgs" />
									<p:dataList value="#{litigationEditBean.uploadFilesMA}" rendered="#{statIndex == 2}"
										emptyMessage="" var="vo" id="attachmentMA" rowIndexVar="index">
										<table>
											<tr>
												<td style="width: 80%"><p:commandLink
														title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
														actionListener="#{litigationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
														target="_blank">#{vo.fileName}</p:commandLink></td>
												<td><p:commandLink immediate="true"
														actionListener="#{litigationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_DOCUMENT_MA')}"
														update="form:courtDetails:2:attachmentMA">#{msg.buttonDelete}</p:commandLink></td>
											</tr>
										</table>
									</p:dataList>
								</h:panelGroup>

							</p:dataGrid>
						</div>
					</div>
					
					<h3>
						<h:outputText value="#{msg.formLitigationViewer}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink
												onclick="onAddNewViewer();">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowViewer();">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tableViewerDetail" var="vo"
									value="#{litigationEditBean.tableViewerModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{litigationEditBean.selectedLitigationViewer}"
									rowKey="#{vo.sequence}" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									<p:column headerText="#{msg.formLitigationNik}"
										style="width:200px;">
										<table>
											<tr class="form-group required">
												<td style="width: 80%"><h:inputText
														id="viewer#{statIndex}" styleClass="form-control"
														value="#{vo.user.nik}" disabled="true" /></td>
												<td style="width: 20%"><p:commandLink process="@this"
														onstart="viewerDialog.show();">
														<span><i class="fa fa-search ico-lg"></i></span>
														<f:setPropertyActionListener
															target="#{litigationEditBean.indexDtlViewer}"
															value="#{statIndex}" />
													</p:commandLink></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formLitigationName}"
										style="width:200px;">
										<table>
											<tr class="form-group required">
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.user.name}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formLitigationStatus}"
										style="width:200px;">
										<table>
											<tr class="form-group required">
												<td style="width: 80%">
												<h:selectOneMenu id="status"
													styleClass="form-control s2"
													value="#{vo.status}">
													<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
													<f:selectItems
														value="#{litigationEditBean.statusList}"/>
												</h:selectOneMenu></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formLitigationModifiedBy}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.lastUpdateBy}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
					
				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{litigationEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{litigationEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
				<p:remoteCommand
					action="#{litigationEditBean.onAddNewViewer}" immediate="true"
					name="onAddNewViewer" update="tableViewerDetail"></p:remoteCommand>
				<p:remoteCommand
					action="#{litigationEditBean.onDeleteRowViewer}" immediate="true"
					name="onDeleteRowViewer" update="tableViewerDetail"></p:remoteCommand>
			</div>
		</div>
		
		<wo:selector id="viewer0" height="450" width="550"
			title="LOV User" widgetVar="viewerDialog0"
			selectorInfo="#{litigationEditBean.selectorViewer}"
			bean="#{litigationEditBean}"
			updateOnSelected="form:tableViewerDetail" />
		<wo:selector id="viewer" height="450" width="550"
			title="LOV User" widgetVar="viewerDialog"
			selectorInfo="#{litigationEditBean.selectorViewer}"
			bean="#{litigationEditBean}"
			updateOnSelected="form:tableViewerDetail" />
			
	</ui:define>
</ui:composition>
