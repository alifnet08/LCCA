
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formLogAccessTitle}" />
	</ui:define>
	


	<ui:define name="content">
		 <div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<h:panelGroup id="panelSearch">
					<div class="col-lg-4">
						<div class="form-group">
							<label><h:outputText
									value="Tanggal" /></label>
							<div class="input-group">
								<p:calendar styleClass="form-control-datepicker-wrap"
									placeholder="#{msg.from}" maxlength="11"
									id="startDate" value="#{logAccessBean.startDate}"
									required="true"
									requiredMessage="Tanggal #{msg.from} #{msg.validateRequired}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
								</p:calendar>
								<span class="input-group-addon plain">-</span>
								<p:calendar styleClass="form-control-datepicker-wrap"
									placeholder="#{msg.to}" maxlength="11"
									id="endDate" value="#{logAccessBean.endDate}"
									required="true"
									requiredMessage="Tanggal #{msg.from} #{msg.validateRequired}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
								</p:calendar>
							</div>
						</div>
					</div>
					<div class="col-lg-6">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="Nama" /></label>
							<p:inputText styleClass="form-control"
								value="#{logAccessBean.name}" autocomplete="off"></p:inputText>
						</div>
					</div>
					<div class="col-lg-6">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="Nama Divisi" /></label>
							<p:inputText styleClass="form-control"
								value="#{logAccessBean.divName}" autocomplete="off"></p:inputText>
						</div>
					</div>
					</h:panelGroup>
					
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{logAccessBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{logAccessBean.reset}"></p:commandButton></li>
							</ul>
							<!-- <ul class="no-margin no-padding pull-right">
								<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
								<li><h:commandLink styleClass="btn btn-warning tl-label" onclick="onclickDownload();PF('statusDialog').hide();">
										<i class="fa fa-table"></i> &nbsp;
		        							<h:outputText
											value="#{msg.formExternalRegulationExportToExcel}" />

										<p:dataExporter type="xls" target="tableSearch"
											fileName="LogAccess" pageOnly="true"
											postProcessor="logAccessBean.postProcessXLS}" />
									</h:commandLink></li>
							</ul> -->
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{logAccessBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}"
								rows="#{logAccessBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column headerText="#{msg.formLogAccessName}">
									<h:outputLabel value="#{vo.userName}" />
								</p:column>
								<p:column headerText="#{msg.formLogSourceId}">
									<h:outputLabel value="#{vo.sourceIp}" />
								</p:column>
								<p:column headerText="#{msg.formLogAccessTime}">
									<h:outputLabel value="#{vo.accessTime}" />
								</p:column>
								<p:column headerText="#{msg.formLogAccessAction}" width="500">
									<h:outputLabel value="#{vo.accessAction}" />
								</p:column>
								<p:column headerText="#{msg.formLogAccessId}" style="text-align:right">
									<h:outputLabel value="#{vo.accessId}" />
								</p:column>
								<p:column headerText="Nama Divisi">
									<h:outputLabel value="#{vo.divisionName}" />
								</p:column>
								
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div> 

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formRCDeleteRC}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
