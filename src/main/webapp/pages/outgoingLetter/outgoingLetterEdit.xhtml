<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			 td.optionDisabled .ui-chkbox{
				display: none;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
		
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formOutgoingLetterTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formOutgoingLetterTitle}" />
				</h3>
			</div>
			
			<div class="box-body">
				<div class="row">
				
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label">
								<p:outputLabel
									for="letterPurposeIn"
									value="#{msg.formOutgoingLetterPurpose}" />
							</label>
							<p:inputText id="letterPurposeIn" styleClass="form-control" 
								autocomplete="off" required="true" maxlength="100"
								requiredMessage="#{msg.formOutgoingLetterPurpose} #{msg.validateRequired}"
								value="#{outgoingLetterEditBean.outgoingLetter.letterPurposeIn}"></p:inputText>
							<p:message for="letterPurposeIn" />
						</div>
					</div>
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									for="letterPurposeEn"
									value="#{msg.formOutgoingLetterPurpose}" />&#160;&#160;<span class="label label-warning">
                					<h:outputLabel value="#{msg.english}"/>
                					</span></label>
							<p:inputText id="letterPurposeEn" styleClass="form-control" 
								autocomplete="off" maxlength="100"
								value="#{outgoingLetterEditBean.outgoingLetter.letterPurposeEn}"></p:inputText>
							<p:message for="letterPurposeEn" />
						</div>
					</div> -->
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label"><p:outputLabel
									for="letterNo"
									value="#{msg.formOutgoingLetterNo}" /></label>
							<p:inputText id="letterNo" styleClass="form-control" 
								autocomplete="off" required="true" maxlength="100"
								requiredMessage="#{msg.formOutgoingLetterNo} #{msg.validateRequired}"
								value="#{outgoingLetterEditBean.outgoingLetter.letterNo}"></p:inputText>
							<p:message for="letterNo" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label"><p:outputLabel
									for="letterDate"
									value="#{msg.formOutgoingLetterDate}" /></label>
							<p:calendar id="letterDate" required="true" 
								requiredMessage="#{msg.formOutgoingLetterDate} #{msg.validateRequired}"
								styleClass="form-control-datepicker-wrap" maxlength="11"
								value="#{outgoingLetterEditBean.outgoingLetter.letterDate}"
								autocomplete="off"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
							<p:message for="letterDate" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label">
								<p:outputLabel
									for="perihalIn"
									value="#{msg.formOutgoingLetterPerihal}" />
							</label>
							<p:inputTextarea id="perihalIn" styleClass="form-control" 
								autocomplete="off" required="true" maxlength="1000" rows="1"
								requiredMessage="#{msg.formOutgoingLetterPerihal} #{msg.validateRequired}"
								value="#{outgoingLetterEditBean.outgoingLetter.perihalIn}"></p:inputTextarea>
							<p:message for="perihalIn" />
						</div>
					</div>
					
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label"><p:outputLabel
									for="perihalIn"
									value="#{msg.formOutgoingLetterPerihal}" />&#160;&#160;<span class="label label-warning">
                					<h:outputLabel value="#{msg.english}"/>
                					</span></label>
							<p:inputText id="perihalEn" styleClass="form-control" 
								autocomplete="off" maxlength="1000"
								value="#{outgoingLetterEditBean.outgoingLetter.perihalEn}"></p:inputText>
							<p:message for="perihalEn" />
						</div>
					</div> -->
					
					<!-- <div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label"><p:outputLabel
									for="deliveredTo"
									value="#{msg.formOutgoingLetterDeliveredTo}" /></label>
							<p:inputText id="deliveredTo" styleClass="form-control" 
								autocomplete="off" required="true" maxlength="1000"
								requiredMessage="#{msg.formOutgoingLetterDeliveredTo} #{msg.validateRequired}"
								value="#{outgoingLetterEditBean.outgoingLetter.deliveredTo}"></p:inputText>
							<p:message for="deliveredTo" />
						</div>
					</div> -->
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label"><p:outputLabel
									for="tembusan"
									value="#{msg.formOutgoingLetterCarbonCopyNatation}" /></label>
							
							<p:inputTextarea id="tembusan" styleClass="form-control" 
							value="#{outgoingLetterEditBean.outgoingLetter.tembusan}" />
							<p:message for="tembusan" />
						</div>
					</div>
					
					<h3>
						<h:outputText
							value="#{msg.formOutgoingLetterTitleLetterTitle}" />
					</h3>
					
					<div class="col-lg-12">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUpload" update="outgoingLetterDocument"></p:remoteCommand>
							<label class="tl-label">
								<h:outputText value="#{msg.formOutgoingLetterSubTitle}"/>
								<br/>
								<h:outputText style="color: #dd4b39" value="#{outgoingLetterEditBean.textWarningUpload}"/>
							</label>
							<p:fileUpload fileUploadListener="#{outgoingLetterEditBean.handleFileUploadOutgoingLetter}"
									oncomplete="onCompleteUpload()"
									value="outgoingLetterEditBean.uploadFilesOutgoingLetters"
									mode="advanced" auto="true" dragDropSupport="false" multiple="true"
									sizeLimit="#{outgoingLetterEditBean.standardAttachmentSize}"
									update="msgs" />
									<p:dataList value="#{outgoingLetterEditBean.uploadFilesOutgoingLetters}" 
									emptyMessage=""
									var="vo" id="outgoingLetterDocument" rowIndexVar="index">
										<table>
									    	<tr>
									    	<td style="width:80%; padding-right: 10px;">
									        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{outgoingLetterEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
									        </td>
									        <td>
									        	<p:commandLink  immediate="true" actionListener="#{outgoingLetterEditBean.deleteAttachment(vo.fileId,index,'OUTGOING_LETTER_ATTACHMENT')}" update="outgoingLetterDocument">#{msg.buttonDelete}</p:commandLink>
									        </td>
								        	</tr>
								        </table>
									</p:dataList>
	
						</div>		
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUploadReceipt" update="outgoingLetterDocumentReceipt"></p:remoteCommand>
							<label class="tl-label">
								<h:outputText value="#{msg.formOutgoingLetterReceipt}"/>
								<br/>
								<h:outputText style="color: #dd4b39" value="#{outgoingLetterEditBean.textWarningUpload}"/>
							</label>
							<p:fileUpload fileUploadListener="#{outgoingLetterEditBean.handleReceiptFileUpload}"
									oncomplete="onCompleteUploadReceipt()"
									value="outgoingLetterEditBean.uploadFilesReceipt"
									mode="advanced" auto="true" dragDropSupport="false" multiple="true"
									sizeLimit="#{outgoingLetterEditBean.standardAttachmentSize}"
									update="msgs" />
									<p:dataList value="#{outgoingLetterEditBean.uploadFilesReceipt}" 
									emptyMessage=""
									var="vo" id="outgoingLetterDocumentReceipt" rowIndexVar="index">
										<table>
									    	<tr>
									    	<td style="width:80%; padding-right: 10px;">
									        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{outgoingLetterEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
									        </td>
									        <td>
									        	<p:commandLink  immediate="true" actionListener="#{outgoingLetterEditBean.deleteReceiptAttachment(vo.fileId,index,'OUTGOING_LETTER_RECEIPT')}" update="outgoingLetterDocumentReceipt">#{msg.buttonDelete}</p:commandLink>
									        </td>
								        	</tr>
								        </table>
									</p:dataList>
	
						</div>		
					</div>
					
					<div class="box-footer">
						<h:commandButton value="#{msg.buttonSave}" type="submit"
							styleClass="btn btn-primary pull-left"
							action="#{outgoingLetterEditBean.save}"></h:commandButton>
		
						<h:commandLink value="#{msg.buttonCancel}" immediate="true"
							actionListener="#{outgoingLetterEditBean.cancel()}"
							styleClass="btn btn-default pull-right tl-label"></h:commandLink>
					</div>
					
				</div>
			</div>
			
		</div>
	</ui:define>
</ui:composition>
