								<h:outputText style="color: #dd4b39" value="#{trcAuditEditBean.textWarningUpload}"/>
							</label>
							
							<p:fileUpload fileUploadListener="#{trcAuditEditBean.handleFileUpload}" mode="advanced" dragDropSupport="false" multiple="true"
				                   update="msgs evidenceAttachmentList" sizeLimit="#{trcAuditEditBean.maxAttachmentSize}" auto="true" rendered="#{trcAuditEditBean.viewOnly eq 'N'}"  />
				            <p:dataList value="#{trcAuditEditBean.uploadedFiles}" 
				            	emptyMessage=""
				            	var="vo" id="evidenceAttachmentList" rowIndexVar="index">
							        <table>
								    	<tr>
								    	<td style="width:80%">
								        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcAuditEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
								        </td>
								        <td>
								        	<p:commandLink  immediate="true" actionListener="#{trcAuditEditBean.deleteAttachment(vo.fileId,index)}" update="evidenceAttachmentList" rendered="#{trcAuditEditBean.viewOnly eq 'N'}">#{msg.buttonDelete}</p:commandLink>
								        </td>
							        	</tr>
							        </table>
							</p:dataList>
						</div>
					</div>
					
					
					
					<div class="col-lg-12">
						<div class="form-group required" style="margin-top:15px;">
							<label class="tl-label"><h:outputLabel
									value="#{msg.formPICFollowupConfirmationFollowupDate}" /></label>
							<p:calendar id ="folllowupDate" styleClass="form-control-datepicker-wrap"
								value="#{trcAuditEditBean.trcAuditPicFollowup.followupDate}"
								autocomplete="off" disabled="#{trcAuditEditBean.viewOnly eq 'Y'}"
								pattern="#{trcAuditEditBean.inputDateFormat}" maxlength="11"
								locale="#{trcAuditEditBean.inputDateLocale}"></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputLabel
									value="#{msg.formPICFollowupConfirmationInformation}" /></label>
							<p:inputTextarea styleClass="form-control" autocomplete="off"
								disabled="#{trcAuditEditBean.viewOnly eq 'Y'}"
								maxlength="1000"
								value="#{trcAuditEditBean.trcAuditPicFollowup.followupNote}"></p:inputTextarea>

						</div>
					</div>
					
					<div class="col-lg-12">
						<h3>
							<h:outputLabel
								value="#{msg.formPICFollowupConfirmationStatusConfirmation}" />
						</h3>
					</div>
					
					<div class="col-lg-12">
						<div id="mp-confirmation-status">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tableConfirmation" var="vo"
									value="#{trcAuditEditBean.complianceTableList}"
									rowIndexVar="statIndex" style="width:100%;">
																	
									<p:column
										headerText="#{msg.formTmpCorrespondenceComplianceCheckerStatus}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceStatus.name}"/>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpCorrespondenceComplianceCheckerNote}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceNote}"/>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpCorrespondenceComplianceCheckerDate}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceDate}" >
													<f:convertDateTime
														pattern="#{trcAuditEditBean.inputDateFormat}"
														locale="#{trcAuditEditBean.inputDateLocale}">
													</f:convertDateTime>
												</h:outputText>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpCorrespondenceComplianceCheckerBy}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceBy.name}"  />
											</div>
										</div>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>	
				</div>
			</div>
			<div class="box-footer">
				<p:commandButton value="#{msg.buttonSave}" 
					rendered="#{trcAuditEditBean.viewOnly eq 'N'}"
					actionListener="#{trcAuditEditBean.save()}"
					update="msgs" styleClass="btn btn-primary pull-left tl-label"></p:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{trcAuditEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>


			</div>
		</div>

		
	</ui:define>
