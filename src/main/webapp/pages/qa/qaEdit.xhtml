<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formQATitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:growl id="messages" rendered="true" />
	<div class="box box-solid">
      <div class="box-header with-border">
        <h3 class="box-title tl-label" tl="new-master-document-type"><h:outputText value="#{msg.formQAAddTitle}" /></h3>
      </div>
      <div class="box-body">
        <div class="row">
        	<div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><p:outputLabel value="#{msg.formQAQuestionedDate}" rendered="false" /></label>
                <p:calendar styleClass="form-control-datepicker-wrap"
										maxlength="11"
										autocomplete="off"
										value="#{qaEditBean.qa.qDate}"
										pattern="#{qaEditBean.inputDateFormat}"
										disabled="true"
										locale="#{qaEditBean.inputDateLocale}" rendered="false"></p:calendar>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group required">
                <label for="question" class="control-label tl-label" tl="question"><p:outputLabel value="#{msg.formQAQuestion}" /></label>
                <p:textEditor value="#{qaEditBean.qa.question}" rows="7" style="width:100%" 
                id="question" styleClass="text-area" required="true" height="150"
                requiredMessage="#{msg.formQAQuestion} #{msg.validateRequired}"></p:textEditor>
                <p:message for="question"/>
              </div>
            </div>
           <p:outputPanel rendered="#{qaEditBean.qa.qStatus eq 'QNA_STATUS_CLOSE'}">
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><p:outputLabel value="#{msg.formQAAnsweredDate}" /></label>
                <p:calendar styleClass="form-control-datepicker-wrap"
										maxlength="11"
										autocomplete="off"
										value="#{qaEditBean.qa.aDate}"
										pattern="#{qaEditBean.inputDateFormat}"
										locale="#{qaEditBean.inputDateLocale}" disabled="true" ></p:calendar>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group required">
                <label  class="control-label tl-label" tl="answer"><p:outputLabel value="#{msg.formQAAnswer}" /></label>
                <p:textEditor value="#{qaEditBean.qa.answer}" rows="7" style="width:100%" 
                id="answer" styleClass="text-area" readonly="true" height="150"></p:textEditor>
              </div>
            </div>
            </p:outputPanel>
            
          </div>
      </div>
      <div class="box-footer">
        <h:commandButton value="#{msg.buttonSubmit}" type="submit" rendered="#{qaEditBean.qa.qStatus eq 'QNA_STATUS_NEW' and qaEditBean.isViewOnly == false}"
							styleClass="btn btn-primary pull-left"
							actionListener="#{qaEditBean.save()}"></h:commandButton>
        <h:commandLink value="#{msg.buttonCancel}" actionListener="#{qaEditBean.cancel()}" immediate="true"
							styleClass="btn btn-default pull-right tl-label"></h:commandLink>
      </div>
    </div>
	</ui:define>
</ui:composition>
