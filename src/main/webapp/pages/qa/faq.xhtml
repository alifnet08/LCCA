<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-widget {
			    font-size: inherit;
			}
			.ui-state-default.form-control {
				background: #F7F8F8;
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="FAQ" />
	</ui:define>

	<ui:define name="buttonAdd">
		
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<p:accordionPanel multiple="true">
					        <p:tab title="When can I redeem my TreatsPoints">
					            <h:panelGrid columns="2" cellpadding="10">
					                <p:graphicImage name="demo/images/godfather/godfather1.jpg" />
					                <h:outputText
					                    value="You may redeem your Treatpoints one month after the 3-month campaign promotional period." />
					            </h:panelGrid>
					        </p:tab>
					        <p:tab title="How much do I need to open such a Regular Saving Account?">
					            <h:panelGrid columns="2" cellpadding="10">
					                <p:graphicImage name="demo/images/godfather/godfather2.jpg" />
					                <h:outputText value="You need a minimum of IDR 100,000 to open a Regular Savings Account." />
					            </h:panelGrid>
					        </p:tab>
					        <p:tab title="How many people are allowed to open a joint account?">
					            <h:panelGrid columns="2" cellpadding="10">
					                <p:graphicImage name="demo/images/godfather/godfather3.jpg" />
					                <h:outputText value="A joint account can be opened by a minimum of 2 people and a maximum of 4." />
					            </h:panelGrid>
					        </p:tab>
					        <p:tab title="What do I need to bring along to open a Savings Account?">
					            <h:panelGrid columns="2" cellpadding="10">
					                <p:graphicImage name="demo/images/godfather/godfather3.jpg" />
					                <h:outputText escape="false" value="You and / or your joint applicant will need to go to the nearest Maybank branch with the following relevant documents: Valid e-KTP and NPWP for Indonesians, valid Passports for Foreigners or KITAS" />
					            </h:panelGrid>
					        </p:tab>
					    </p:accordionPanel>
					</div>

				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formParameterConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formParameterDelete}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formParameterConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

</ui:composition>
