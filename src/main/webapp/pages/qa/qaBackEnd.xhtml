<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formQATitle}" />
	</ui:define>
	
	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="ui-widget ui-corner-all ui-message-info">
						    <span class="ui-message-info-icon"/>
						    <span class="ui-message-info-detail"><h:outputText escape="false" value="#{msg.formQAcheckFAQ}" /></span>
						</div>
					</div>
					<br />
					<br />
					<h:panelGroup id="panelSearch">
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formQATicketNo}" /></label>
								<p:inputText id="searchTicketNo" styleClass="form-control" autocomplete="off"
									value="#{qaBackEndBean.searchTicketNo}"></p:inputText>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formQAQuestion}" /></label>
								<p:inputText id="searchQuestion" styleClass="form-control" autocomplete="off"
									value="#{qaBackEndBean.searchQuestion}"></p:inputText>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formQAAdminSearchTitle}" /></label>
								<p:inputText id="searchQtitle" styleClass="form-control" autocomplete="off"
									value="#{qaBackEndBean.searchQtitle}"></p:inputText>
							</div>
						</div>
					</h:panelGroup>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{qaBackEndBean.search}"></p:commandButton>
								</li>
								<li><p:commandButton value="#{msg.buttonReset}"
										ajax="true" update="tableSearch form:panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{qaBackEndBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{qaBackEndBean.tableModel}" dynamic="true"
								lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{qaBackEndBean.paging}" rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;width:20%;"
									headerText="#{msg.formAction}">

									<p:commandLink id="edit" value="#{msg.buttonEdit}" action="#{qaBackEndBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="editId" value="#{vo.qnaId}" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formQATicketNo}">
									<h:outputLabel value="#{vo.ticketNo}" />
								</p:column>

								<p:column headerText="#{msg.formQAQuestionedBy}">
									<h:outputLabel value="#{vo.qName}" />
								</p:column>

								<p:column headerText="#{msg.formQAQuestionedDate}">
									<h:outputLabel value="#{vo.qDate}">
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputLabel>
								</p:column>
								
								<p:column headerText="#{msg.formQAQuestion}">
									<h:outputLabel value="#{vo.question}" />
								</p:column>
								
								<p:column headerText="#{msg.formQAAdminSearchTitle}">
									<h:outputLabel value="#{vo.qTitle}" />
								</p:column>

								<p:column headerText="#{msg.formQAStatus}">
									<h:outputLabel value="#{vo.status}" />
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
