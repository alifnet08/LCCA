<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formQATitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="messages" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-document-type">
					<h:outputText value="#{msg.formQAAddTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formQATicketNo}"/></label>
							<p:inputText id="ticketNo" styleClass="form-control" autocomplete="off"
									value="#{qaBackEndEditBean.qa.ticketNo}" disabled="true" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formQAAdminSearchTitle}"/></label>
							<p:inputText id="qTitle" styleClass="form-control" autocomplete="off"
									value="#{qaBackEndEditBean.qa.qTitle}"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formQAQuestionedDate}"/></label>
							<p:calendar styleClass="form-control-datepicker-wrap"
								maxlength="11" autocomplete="off" value="#{qaBackEndEditBean.qa.qDate}"
								pattern="#{qaBackEndEditBean.inputDateFormat}" disabled="true"
								locale="#{qaBackEndEditBean.inputDateLocale}"></p:calendar>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label for="question" class="control-label tl-label"
								tl="question"><p:outputLabel
									value="#{msg.formQAQuestion}" /></label>
							<p:inputTextarea value="#{qaBackEndEditBean.qa.question}" rows="7"
								style="width:100%" id="question" styleClass="text-area"></p:inputTextarea>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="answer"><p:outputLabel
									value="#{msg.formQAAnswer}" /></label>
							<p:inputTextarea value="#{qaBackEndEditBean.qa.answer}" rows="7"
								style="width:100%" id="answer" styleClass="text-area"/>
						</div>
					</div>
					
					<h:panelGroup id="panelAnswer2" rendered="#{not empty qaBackEndEditBean.qa.answer2}">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="control-label tl-label" tl="answer"><p:outputLabel
										value="#{msg.formQAAnswer} 2" /></label>
								<p:inputTextarea value="#{qaBackEndEditBean.qa.answer2}" rows="7"
									style="width:100%" id="answer2" styleClass="text-area"/>
							</div>
						</div>
					</h:panelGroup>
					
					<h:panelGroup id="panelAnswer3" rendered="#{not empty qaBackEndEditBean.qa.answer3}">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="control-label tl-label" tl="answer"><p:outputLabel
										value="#{msg.formQAAnswer} 3" /></label>
								<p:inputTextarea value="#{qaBackEndEditBean.qa.answer3}" rows="7"
									style="width:100%" id="answer3" styleClass="text-area"/>
							</div>
						</div>
					</h:panelGroup>
					
				</div>
			</div>
			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSubmit}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{qaBackEndEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{qaBackEndEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>
	</ui:define>
</ui:composition>
