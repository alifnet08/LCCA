<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<f:event listener="#{trcCorrespondenceVerifyBean.redirectCurrentPage}" type="preRenderView" />
	<ui:define name="head">

			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{

			    font-size: 13px;
			    color: #444444;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
				box-shadow: none;
			}
		</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcCorrespondenceTitle}" />
	</ui:define>

							<h:selectOneMenu styleClass="form-control s2"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.sender.parameterDtlCode}"

					</div>
					<div class="col-lg-12">

									value="#{msg.formTmpCorrespondenceLetterReceiveDate}" /></label>

								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.letterReceivedDate}"

								pattern="#{trcCorrespondenceVerifyBean.inputDateFormat}"
								locale="#{trcCorrespondenceVerifyBean.inputDateLocale}"
								disabled="true"></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group ">
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceLetterNo}" /></label>
							<h:inputText styleClass="form-control" title="#{trcCorrespondenceVerifyBean.trcCorrespondence.letterNo}"

					<div class="col-lg-12">

								locale="#{trcCorrespondenceVerifyBean.inputDateLocale}"

					</div>
					<div class="col-lg-12">

									<h:outputLabel value="#{msg.indonesia}"/>
								</span></label>
							<h:inputText styleClass="form-control" title="#{trcCorrespondenceVerifyBean.trcCorrespondence.perihalIn}"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.perihalIn}"
								disabled="true"/>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceLetterSummary}" /></label>

					</div>

							<h:selectOneMenu id="tmpCorrespondenceType"

								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.correspondenceCode.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{trcCorrespondenceVerifyBean.correspondenceTypeCodeList}"/>
							</h:selectOneMenu>
							<p:message for="tmpCorrespondenceType"/>
						</div>
					</div>
					
					<h:panelGroup id="panelDenda" style="#{trcCorrespondenceVerifyBean.trcCorrespondence.correspondenceCode.parameterDtlCode eq 'FINE'?'':'display:none'}" >

						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formTmpCorrespondenceRC}" for="rc"/></label>
							<h:selectOneMenu id="rc"
								styleClass="form-control s2"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.rc.rcId}">
								<f:selectItems
									value="#{trcCorrespondenceVerifyBean.rcList}"/>
							</h:selectOneMenu>
							<p:message for="rc"/>
						</div>
					</div>
					
					<div class="col-lg-12">

								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.fineDebitted}"

								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
							<p:message for="debitted"/>
						</div>
					</div>
					
					<div class="form-group">
							<label class="tl-label"><p:outputLabel for="nominal"

								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.fineAmount}"></p:inputText>
							<p:message for="nominal"/>
					</div>
					
					<div class="form-group">
							<label class="tl-label"><p:outputLabel for="breaches"
									value="#{msg.formTmpCorrespondenceBreaches}" /></label>
						    
							<p:inputTextarea id="breaches" styleClass="form-control" value="#{trcCorrespondenceVerifyBean.trcCorrespondence.breaches}" />
							<p:message for="breaches"/>
					</div>
					
					<div class="form-group">
							<label class="tl-label"><p:outputLabel for="rootCause"
									value="#{msg.formTmpCorrespondenceRootCause}" /></label>
						    
							<p:inputTextarea id="rootCause" styleClass="form-control" value="#{trcCorrespondenceVerifyBean.trcCorrespondence.rootCause}" />
							<p:message for="rootCause"/>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formTmpCorrespondenceCategory}" for="categories"/></label>
							<h:selectOneMenu id="categories"
								styleClass="form-control s2"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.category}">
								<f:selectItems
									value="#{trcCorrespondenceVerifyBean.categoryList}"/>
							</h:selectOneMenu>
							<p:message for="categories"/>
						</div>
					</div>
					</h:panelGroup>
					
					<h3>
						<h:outputText
							value="#{msg.formTmpCorrespondenceDocumentLetterTitle}" />
					</h3>

							<label class="tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceDocumentLetterSubTitle}" /></label>
							<p:dataList value="#{trcCorrespondenceVerifyBean.uploadedFilesDocument}" 
								emptyMessage=""
								var="vo" id="documentList" rowIndexVar="index">
								<table>
							    	<tr>
							    	<td style="width:80%">
							        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"  target="_blank">#{vo.fileName}</p:commandLink>
							        </td>
							        
						        	</tr>
						        </table>
							</p:dataList>
						</div>
					</div>

					<h3>
						<h:outputText value="#{msg.formTmpCorrespondencePICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tablePicComplianceDetail" var="vo"
									value="#{trcCorrespondenceVerifyBean.tablePicComplianceModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{trcCorrespondenceVerifyBean.selectedPicComplianceData}"
									rowKey="#{vo.sequence}">
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column headerText="#{msg.formTmpCorrespondenceNIK}"
										style="width:200px;">
										<h:inputText id="picCompliance#{statIndex}" alt="#{vo.nikTemp}" title="#{vo.nikTemp}"
											styleClass="form-control" value="#{vo.nikTemp}"
											disabled="true" />
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceName}"
										style="width:200px;">
										<h:inputText styleClass="form-control" value="#{vo.nameTemp}" alt="#{vo.nameTemp}" title="#{vo.nameTemp}"
											disabled="true" />
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceEmail}"
										style="width:200px;">
										<h:inputText styleClass="form-control" value="#{vo.emailTemp}" alt="#{vo.emailTemp}" title="#{vo.emailTemp}"
											disabled="true" />
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>


					<div class="col-lg-12">
						<div class="form-group ">
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceFollowup}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.followUp}"
								disabled="true">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{trcCorrespondenceVerifyBean.yesNoList}" />
							</h:selectOneMenu>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="note"><h:outputText
									value="#{msg.formTmpCorrespondenceNote}" /></label>
							<h:inputText styleClass="form-control" title="#{trcCorrespondenceVerifyBean.trcCorrespondence.notesDecrypted}"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.notesDecrypted}"
								disabled="true"/>
						</div>
					</div>

					<div class="col-lg-12">
						<h3>
							<h:outputText
								value="#{msg.formTmpCorrespondenceSubmissionConfirmation}" />
						</h3>
						<div class="form-group">
							<label for="divison" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceDivision}" /></label>
							<h:selectOneMenu styleClass="form-control s2 divId"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.divisionId}"
								disabled="true">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{trcCorrespondenceVerifyBean.divisionList}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic1" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondencePic1}" /> </label>
							<h:inputText id="inputPic1" styleClass="form-control" alt="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp1}" title="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp1}"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp1}"
								readonly="true" />

						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic2" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondencePic2}" /> </label>
							<h:inputText id="inputPic2" styleClass="form-control" alt="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp2}" title="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp2}"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp2}"
								readonly="true" />

						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic3" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondencePic3}" /></label>
							<h:inputText id="inputPic3" styleClass="form-control" alt="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp3}" title="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp3}"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.userNameTemp3}"
								readonly="true" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label for="targetDate" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceTargetDate}" /></label>
							<p:calendar styleClass="form-control-datepicker-wrap"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.targetDate}"
								autocomplete="off"
								pattern="#{trcCorrespondenceVerifyBean.inputDateFormat}"
								locale="#{trcCorrespondenceVerifyBean.inputDateLocale}"
								disabled="true"></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="emailDate" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceEmailDate}" /></label> <label
								for="emailDate" class="control-label tl-label"><h:outputText /></label>
							<p:dataTable id="tableFollowupEmail" var="vo"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.trcCorrespondencePicFollowupEmails}"
								styleClass="noHeader" style="width:100%;">
								<p:column styleClass="noHeader">
									<h:outputText value="#{vo.emailDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceVerifyBean.inputDateFormat}"
											locale="#{trcCorrespondenceVerifyBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
							</p:dataTable>
						</div>
					</div>

					<h:outputText value="&#160;" />

					<h3>
						<h:outputText value="#{msg.formTmpCorrespondenceSupportingUnit}" />
					</h3>

						<div id="mp-supporting-unit">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tableSupportingUnitDetail" var="vo"
									value="#{trcCorrespondenceVerifyBean.tableSupportingUnitModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{trcCorrespondenceVerifyBean.selectedSupportingUnitData}"
									rowKey="#{vo.sequence}">
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />


									<p:column headerText="#{msg.formTmpCorrespondenceDivision}"
										style="width:200px;">
										<div class="form-group" style="margin-top:15px;">
											<h:selectOneMenu
												styleClass="form-control s2 divisionCc#{statIndex}"
												value="#{vo.divisionId}" disabled="true">
												<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
												<f:selectItems
													value="#{trcCorrespondenceVerifyBean.divisionList}" />
											</h:selectOneMenu>
										</div>
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceEmailCc1}"
										style="width:200px;">
										<h:inputText id="emailCc1#{statIndex}" alt="#{vo.emailCcTemp1}" title="#{vo.emailCcTemp1}"
											styleClass="form-control" value="#{vo.emailCcTemp1}"
											disabled="true" />
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceEmailCc2}"
										style="width:200px;">
										<h:inputText id="emailCc2#{statIndex}" alt="#{vo.emailCcTemp2}" title="#{vo.emailCcTemp2}"
											styleClass="form-control" value="#{vo.emailCcTemp2}"
											disabled="true" />
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceEmailCc3}"
										style="width:200px;">
										<h:inputText id="emailCc3#{statIndex}" alt="#{vo.emailCcTemp3}" title="#{vo.emailCcTemp3}"
											styleClass="form-control" value="#{vo.emailCcTemp3}"
											disabled="true" />
									</p:column>
								</p:dataTable>
							</div>
						</div>

					<h:outputText value="&#160;" />

							<h:selectOneMenu styleClass="form-control s2"
								value="#{trcCorrespondenceVerifyBean.trcCorrespondence.counterType.counterTypeId}"
								disabled="true">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{trcCorrespondenceVerifyBean.counterTypeList}" />
							</h:selectOneMenu>
						</div>
					</div>
					

					<h:outputText value="&#160;" />

						<h:outputText
							value="#{msg.formTmpCorrespondenceFollowupStatus}" />

					<h:panelGroup rendered="#{trcCorrespondenceVerifyBean.trcCorrespondence.correspondenceCode.parameterDtlCode eq 'FINE' }">
					
						<div class="col-lg-12">
							<div class="form-group">
								<p:remoteCommand name="onCompleteUpload" update="evidenceFineList"></p:remoteCommand>
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdPicConfirmationEvidence}"/>
									<br/>
									<h:outputText style="color: #dd4b39" value="#{trcCorrespondenceVerifyBean.textWarningUpload}"/>
								</label>
								<p:fileUpload fileUploadListener="#{trcCorrespondenceVerifyBean.handleFileUploadEvidence}"
									oncomplete="onCompleteUpload()"
									value="trcCorrespondenceVerifyBean.uploadedFilesEvidence"
									mode="advanced" auto="true" dragDropSupport="false" multiple="true"
									sizeLimit="#{trcCorrespondenceVerifyBean.standardAttachmentSize}"
									update="messages" rendered="#{trcCorrespondenceVerifyBean.viewOnly eq 'N'}"/>
								<p:dataList value="#{trcCorrespondenceVerifyBean.uploadedFilesEvidence}" 
									emptyMessage=""
									var="vo" id="evidenceFineList" rowIndexVar="index">
									<table>
								    	<tr>
								    	<td style="width:80%">
								        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcCorrespondenceVerifyBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
								        </td>
								        <td>
								        	<p:commandLink  immediate="true" actionListener="#{trcCorrespondenceVerifyBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_EVIDENCE')}" update="evidenceList" rendered="#{trcCorrespondenceVerifyBean.viewOnly eq 'N'}">#{msg.buttonDelete}</p:commandLink>
								        </td>
							        	</tr>
							        </table>
								</p:dataList>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group required">
								<label id="followupDate" class="control-label tl-label" ><p:outputLabel
										value="#{msg.formTmpCorrespondenceTimeline}" /></label>
								<p:calendar styleClass="form-control-datepicker-wrap"
									value="#{trcCorrespondenceVerifyBean.trcCorrespondence.followupDate}"
									autocomplete="off" maxlength="11" disabled="#{trcCorrespondenceVerifyBean.viewOnly eq 'Y'}"
									pattern="#{trcCorrespondenceVerifyBean.inputDateFormat}"
									locale="#{trcCorrespondenceVerifyBean.inputDateLocale}"></p:calendar>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceRemedialAction}" /></label>
								<p:inputText styleClass="form-control" autocomplete="off" maxlength="1000"
									disabled="#{trcCorrespondenceVerifyBean.viewOnly eq 'Y'}"
									value="#{trcCorrespondenceVerifyBean.trcCorrespondence.followupNote}"></p:inputText>
								<p:inputTextarea  styleClass="form-control" value="#{trcCorrespondenceVerifyBean.trcCorrespondence.followupNote}" />
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceUserMaker}" /></label>
								<p:inputText styleClass="form-control" autocomplete="off" 
									value="#{trcCorrespondenceVerifyBean.trcCorrespondence.userMaker}"></p:inputText>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceUserSPV}" /></label>
								<p:inputText styleClass="form-control" autocomplete="off" 
									value="#{trcCorrespondenceVerifyBean.trcCorrespondence.userSpv}"></p:inputText>

								<p:inputText styleClass="form-control" autocomplete="off" 
									value="#{trcCorrespondenceVerifyBean.trcCorrespondence.noErr}"></p:inputText>
							</div>
						</div>
					</h:panelGroup>

							<div class="form-group">
								<p:remoteCommand name="onCompleteUpload" update="evidenceList"></p:remoteCommand>
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdPicConfirmationEvidence}"/>

								        </td>
							        	</tr>
							        </table>
								</p:dataList>
