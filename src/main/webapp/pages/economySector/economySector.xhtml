
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formFCCEconomySectorTitle}" />
	</ui:define>
	


	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<p:messages id="pesan" showDetail="summary" />
				<div class="row">

					<div class="col-lg-12">
						<!-- <div class="form-group">
							<label class="tl-label"><h:outputText
									value="Economy Sector Code" /></label>
							<p:inputText id="searchEcoSecCode" styleClass="form-control"
								autocomplete="off" value="#{economySectorBean.searchEcoSecCode}"></p:inputText>
						</div> -->
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formFCCEconomySectorName}" /></label>
							<p:inputText id="searchEcoSecName" styleClass="form-control"
								autocomplete="off" value="#{economySectorBean.searchEcoSecName}"></p:inputText>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{economySectorBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch searchEcoSecName"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{economySectorBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<li>
							    <p:fileUpload
										fileUploadListener="#{economySectorBean.handleFileUpload}"
										value="#{economySectorBean.uploadedFiles}"
										mode="advanced" auto="true" adragDropSupport="false"
										multiple="false" update="pesan tableSearch"
										oncomplete="setTimeout(function() { $('[id$=pesan]').hide(1000); }, 5000);" />
							    </li>
								<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
								<li><h:commandLink styleClass="btn btn-warning tl-label" onclick="onclickDownload();PF('statusDialog').hide();">
										<i class="fa fa-table"></i> &nbsp;
		        							<h:outputText
											value="#{msg.formExternalRegulationExportToExcel}" />

										<p:dataExporter type="xlsx" target="tableSearch"
											fileName="#{economySectorBean.fileNameDB}" pageOnly="true"
											postProcessor="#{economySectorBean.postProcessXLS}" />
									</h:commandLink></li>
							</ul>
						</div>
					</div>

					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{economySectorBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}"
								rowIndexVar="statIndex" rows="#{economySectorBean.paging}"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
								<!-- <p:column headerText="Economy Sector Code" style="text-align:left;">
									<h:outputLabel value="#{vo.economySectorCode}" />
								</p:column> -->
								<p:column headerText="#{msg.formFCCEconomySectorName}" style="text-align:left;">
									<h:outputLabel value="#{vo.economySector}" />
								</p:column>
								<p:column headerText="#{msg.formFCCRiskRating}" style="text-align:left;">
									<h:outputLabel value="#{vo.riskRating}" />
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formCounterTypeConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formCounterTypeDeleteCounterType}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formCounterTypeConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
