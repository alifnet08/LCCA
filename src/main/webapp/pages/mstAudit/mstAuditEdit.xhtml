
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.form-control[readonly] {
	font-family: 'Montserrat';
	font-size: 13px;
	color: #444444;
}

td.optionDisabled .ui-chkbox {
	display: none;
}

.form-control-datepicker-wrap input.hasDatepicker {
	font-family: 'Montserrat';
}

.ui-inputfield, .ui-widget-content .ui-inputfield {
	box-shadow: none;
}

.bsPanelAuditFindings {
	padding: 5px 5px 5px 5px;
}

.ui-spinner-input {
	width: 60px;
}
</style>
	</ui:define>

	<ui:define name="ajaxLoading">
	</ui:define>


	<ui:define name="menuName">
		<h:outputText value="#{msg.formMstAuditTitle}" />
	</ui:define>

	<ui:define name="content">

		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formMstAuditAddTitle}" />
				</h3>
			</div>

			<div class="box-body">
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="auditFollowUp" class="control-label tl-label">
								<p:outputLabel for="auditFollowUp"
									value="#{msg.formMstAuditTipeAudit}" />
							</label>
							<h:selectOneMenu id="auditFollowUp" required="true"
								requiredMessage="#{msg.formMstAuditTipeAudit} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{mstAuditEditBean.mstAudit.auditor}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{mstAuditEditBean.selectAuditFollowUp}" />
							</h:selectOneMenu>
							<p:message for="auditFollowUp" />
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"> <p:outputLabel
									for="auditTemplateNameIn" value="#{msg.formMstAuditTemplate}" />
							</label>
							<p:inputText id="auditTemplateNameIn"
								required="true"
								requiredMessage="#{msg.formMstAuditTemplate} #{msg.validateRequired}"
								styleClass="form-control" maxlength="200" autocomplete="off"
								value="#{mstAuditEditBean.mstAudit.auditTemplateIn}"></p:inputText>
							<p:message for="auditTemplateNameIn" />
						</div>
					</div>
				
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									for="auditTemplateNameEn"
									value="#{msg.formMstAuditTemplate}" /><span class="label label-warning">
                					<h:outputLabel value="#{msg.english}"/>
                					</span></label>
							<p:inputText id="auditTemplateNameEn"
								styleClass="form-control" maxlength="200" autocomplete="off"
								value="#{mstAuditEditBean.mstAudit.auditTemplateEn}"></p:inputText>
							<p:message for="auditTemplateNameEn" />
						</div>
					</div> -->
				
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><h:outputText
									value="#{msg.formMstAuditPeriode}" /></label>
							<div class="input-group">
								<p:calendar styleClass="form-control-datepicker-wrap"
									required="true"
									requiredMessage="#{msg.formAuditPeriodeFrom} #{msg.validateRequired}"
									value="#{mstAuditEditBean.mstAudit.auditDateFrom}"
									autocomplete="off" placeholder="#{msg.from}"
									pattern="dd-MMM-yyyy" locale="en">
								</p:calendar>
								<span class="input-group-addon plain"
									style="margin-left: 10px; margin-right: 10px;"> <h:outputText
										value=" - " />
								</span>
								<p:calendar styleClass="form-control-datepicker-wrap"
									id="dateTo" required="true"
									requiredMessage="#{msg.formAuditPeriodeTo} #{msg.validateRequired}"
									value="#{mstAuditEditBean.mstAudit.auditDateTo}"
									autocomplete="off" placeholder="#{msg.to}"
									pattern="dd-MMM-yyyy" locale="en">
								</p:calendar>
							</div>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="auditScope" class="control-label tl-label" tl=""><h:outputText
									value="#{msg.formMstAuditScope}" /></label>
							<p:inputTextarea styleClass="form-control" required="true"
								requiredMessage="#{msg.formAuditScope} #{msg.validateRequired}"
								value="#{mstAuditEditBean.mstAudit.scope}" maxlength="6000"></p:inputTextarea>
						</div>
					</div>
				</div>
			</div>
			
			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
							styleClass="btn btn-primary pull-left"
							actionListener="#{mstAuditEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}" immediate="true"
					actionListener="#{mstAuditEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>

	</ui:define>
</ui:composition>
