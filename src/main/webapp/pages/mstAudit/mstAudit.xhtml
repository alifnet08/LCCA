<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}

.ui-state-default.form-control {
	background: #F7F8F8;
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formMstAuditTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{mstAuditBean.getNavigateEdit()}"
					ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">

		<p:growl id="deletedMessage" globalOnly="true" />

		<div class="box box-solid">
			<div class="box-body">
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="row">
							<div class="col-lg-6">
								<h:panelGroup id="panelAuditFollowUp">
									<div class="form-group">
										<label class="tl-label" tl=""><h:outputText
												value="#{msg.formMstAuditTipeAudit}" /></label>
										<h:selectOneMenu styleClass="form-control s2"
											value="#{mstAuditBean.searchAuditFollowup}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems value="#{mstAuditBean.selectAuditFollowUp}" />
										</h:selectOneMenu>
									</div>
								</h:panelGroup>
							</div>

							<div class="col-lg-6">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formMstAuditTemplate}" /></label>
									<p:inputText id="mstAuditTemplate" styleClass="form-control"
										value="#{mstAuditBean.searchAuditTemplateName}"
										autocomplete="off"></p:inputText>
								</div>
							</div>

						</div>
						<div class="row">

							<div class="col-lg-6">
								<div class="form-group">
									<label><h:outputText value="#{msg.formMstAuditPeriode}" /></label>
									<div class="input-group">
										<p:calendar styleClass="form-control-datepicker-wrap"
											placeholder="#{msg.from}" maxlength="11"
											value="#{mstAuditBean.searchAuditDatePeriodFrom}"
											autocomplete="off" pattern="#{mstAuditBean.inputDateFormat}"
											locale="#{mstAuditBean.inputDateLocale}"></p:calendar>
										<span class="input-group-addon plain">-</span>

										<p:calendar styleClass="form-control-datepicker-wrap"
											placeholder="#{msg.to}" maxlength="11"
											value="#{mstAuditBean.searchAuditDatePeriodTo}"
											autocomplete="off" pattern="#{mstAuditBean.inputDateFormat}"
											locale="#{mstAuditBean.inputDateLocale}"></p:calendar>

									</div>
								</div>
							</div>

							<div class="col-lg-6">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formMstAuditScope}" /></label>
									<p:inputText id="auditScope" styleClass="form-control"
										value="#{mstAuditBean.searchScope}" autocomplete="off"></p:inputText>
								</div>
							</div>

						</div>
					</h:panelGroup>

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="mstAuditTable"
										styleClass="btn btn-success tl-label"
										actionListener="#{mstAuditBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="mstAuditTable panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{mstAuditBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>

					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
							<div class="div-wrapper"></div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="mstAuditTable" paginator="true" var="vo"
								value="#{mstAuditBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{mstAuditBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column width="100" headerText="#{msg.formAction}"
									exportable="false" style="text-align:center;">

									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{mstAuditBean.getNavigateEdit()}" ajax="false"
										styleClass="tl-label">
										<f:param name="id" value="#{vo.mstAuditId}" />
									</p:commandLink>
								&#160;
								<h:outputLabel value="|" />
								&#160;
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label"
										update="mstAuditTable form:deletedMessage"
										action="#{mstAuditBean.delete(vo.mstAuditId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>
								&#160;
								<h:outputLabel value="|" />
								&#160;
									<p:commandLink id="forwardToAudit" value="#{msg.formMstAuditAddFinding}"
										action="#{mstAuditBean.getNavigateForward()}" ajax="false"
										styleClass="tl-label">
										<f:param name="mstId" value="#{vo.mstAuditId}" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formMstAuditTipeAudit}" width="100">
									<h:outputLabel value="#{vo.auditor}" title="#{vo.auditor}"
										style="vertical-align: top;" />
								</p:column>

								<p:column headerText="#{msg.formMstAuditTemplate}" width="150">
									<h:outputLabel value="#{vo.auditTemplateNameIn}"
										title="#{vo.auditTemplateNameIn}" />
								</p:column>

								<p:column headerText="#{msg.formMstAuditPeriode}" width="150">
									<h:outputLabel value="#{vo.auditDateFrom} - #{vo.auditDateTo}" />
								</p:column>

								<p:column headerText="#{msg.formMstAuditScope}" width="150">
									<h:outputLabel value="#{vo.scope}" />
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

	</ui:define>
</ui:composition>
