<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formParameterTitle}" />
	</ui:define>
	
	<ui:define name="content">
		<div class="box box-solid">
		
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-parameter">
					<h:outputText value="#{msg.formParameterAddTitle}"/>
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
				<p:growl id="messages" rendered="true" sticky="true"/>
				<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label">
								<p:outputLabel value="#{msg.formParameter}" for="parameter" />
							</label>
							<h:selectOneMenu id="parameter" required="true" requiredMessage="#{msg.formParameter} #{msg.validateRequired}" disabled="#{(parameterDetailEditBean.actionMode eq 'EDIT') == true}"
								styleClass="form-control s2" value="#{parameterDetailEditBean.parameterDetail.parameterHeader.parameterCode}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />	
							<f:selectItems value="#{parameterDetailEditBean.parameterList}"/>
							</h:selectOneMenu>
							<p:message for="parameter"/>
						</div>
					</div>
				
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<p:outputLabel value="#{msg.formParameterDetailCode}" for="parameterDetailCode" />
							</label>
							<p:inputText id="parameterDetailCode" required="true" requiredMessage="#{msg.formParameterDetailCode} #{msg.validateRequired}"
								disabled="#{(parameterDetailEditBean.actionMode eq 'EDIT') == true}" maxlength="50"
								styleClass="form-control form-required" value="#{parameterDetailEditBean.parameterDetail.parameterDtlCode}">
							</p:inputText>
							<p:message for="parameterDetailCode"/>
						</div>
					</div>
				
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="parameter-detail-form-id">
								<p:outputLabel value="#{msg.formParameterDetail}" for="parameterDetailIn" />
							</label>
							<p:inputText id="parameterDetailIn" required="true" requiredMessage="#{msg.formParameterDetail} #{msg.validateRequired}"
								styleClass="form-control form-required" value="#{parameterDetailEditBean.parameterDetail.nameIn}" maxlength="512">
							</p:inputText>
							<p:message for="parameterDetailIn"/>
						</div>
					</div>
				
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="parameter-detail-form-en">
								<p:outputLabel value="#{msg.formParameterDetail}" for="parameterDetailEN" />&#160;&#160;<span class="label label-warning">
                					<h:outputLabel value="#{msg.english}"/>
                				</span></label>
							<p:inputText id="parameterDetailEN" required="true" requiredMessage="#{msg.formParameterDetail} #{msg.english} #{msg.validateRequired}"
								styleClass="form-control form-required" value="#{parameterDetailEditBean.parameterDetail.nameEn}" maxlength="512">
							</p:inputText>
							<p:message for="parameterDetailEN"/>
						</div>
					</div> -->
				
				</div>
			</div>
			
			<div class="box-footer">
				<p:commandButton value="#{msg.buttonSave}" type="submit" update="form"
							styleClass="btn btn-primary pull-left"
							actionListener="#{parameterDetailEditBean.save()}">
				</p:commandButton>
		       	
		       	<h:commandLink value="#{msg.buttonCancel}" actionListener="#{parameterDetailEditBean.cancel()}" immediate="true"
							styleClass="btn btn-default pull-right tl-label">
				</h:commandLink>
			</div>
		</div>
	</ui:define>
	
</ui:composition>
