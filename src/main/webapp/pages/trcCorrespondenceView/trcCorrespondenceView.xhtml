
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">
	<ui:define name="head">
		<style>
.ui-calendar input {
	display: block !important;
	width: 100% !important;
	padding: 10px 12px !important;
	background-color: #F7F8F8 !important;
	background-image: none !important;
	border-radius: 5px !important;
	box-shadow: none;
	transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s
		!important;
	border: 0 !important;
	height: inherit;
}

.ui-inputfield.ui-state-focus {
	box-shadow: none;
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTmpCorrespondenceTitle}" />
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
					<h:panelGroup id="panelSearch">
					<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceSender}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{trcCorrespondenceViewBean.searchPengirim}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems
										value="#{trcCorrespondenceViewBean.selectSender}" />
								</h:selectOneMenu>
							</div>
						</div>
						<div class="col-lg-9">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceLetterReceiveDate}" /></label>
								<div class="input-group">
									<p:calendar id="tglTerimaSuratFrom" autocomplete="off" styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										value="#{trcCorrespondenceViewBean.searchTanggalTerimaSuratFrom}"
										pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
										locale="#{trcCorrespondenceViewBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tglTerimaSuratTo" autocomplete="off" styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										value="#{trcCorrespondenceViewBean.searchTanggalTerimaSuratTo}"
										pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
										locale="#{trcCorrespondenceViewBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						</div>
						
						<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceLetterNo}" /></label>
								<h:inputText styleClass="form-control"
									value="#{trcCorrespondenceViewBean.searchNoSurat}" />
							</div>
						</div>
						<div class="col-lg-9">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceLetterDate}" /></label>
								<div class="input-group">
									<p:calendar id="tglSuratFrom" 
										placeholder="#{msg.from}" maxlength="11"
										autocomplete="off" styleClass="form-control-datepicker-wrap"
										value="#{trcCorrespondenceViewBean.searchTanggalSuratFrom}"
										pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
										locale="#{trcCorrespondenceViewBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tglSuratTo" 
										placeholder="#{msg.to}" maxlength="11"
										autocomplete="off" styleClass="form-control-datepicker-wrap"
										value="#{trcCorrespondenceViewBean.searchTanggalSuratTo}"
										pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
										locale="#{trcCorrespondenceViewBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						</div>
						
						<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceAbout}" /></label>
								<h:inputText styleClass="form-control"
									value="#{trcCorrespondenceViewBean.searchPerihal}" />
							</div>
						</div>
						<div class="col-lg-7">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpCorrespondenceTargetDate}" /></label>
								<div class="input-group">
									<p:calendar id="targetDateFrom" 
										placeholder="#{msg.from}" maxlength="11"
										autocomplete="off" styleClass="form-control-datepicker-wrap"
										value="#{trcCorrespondenceViewBean.searchTargetDateFrom}"
										pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
										locale="#{trcCorrespondenceViewBean.inputDateLocale}" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="targetDateTo" 
										placeholder="#{msg.to}" maxlength="11"
										autocomplete="off" styleClass="form-control-datepicker-wrap"
										value="#{trcCorrespondenceViewBean.searchTargetDateTo}"
										pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
										locale="#{trcCorrespondenceViewBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						<div class="col-lg-2">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcCorrespondenceViewFollowupStatus}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{trcCorrespondenceViewBean.searchStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems
										value="#{trcCorrespondenceViewBean.statusList}" />
								</h:selectOneMenu>
							</div>
						</div>
						</div>
					</h:panelGroup>
					
					<div class="row">
					<div class="col-lg-12">
						<div class="col-lg-6">
							<div class="filter-tools">
								<ul class="no-margin no-padding">
									<li><p:commandButton value="#{msg.buttonSearch}"
											ajax="true" update="tableSearch "
											styleClass="btn btn-success tl-label"
											actionListener="#{trcCorrespondenceViewBean.search}"></p:commandButton></li>
									<li><p:commandButton value="#{msg.buttonReset}"
											ajax="true"
											update="tableSearch panelSearch"
											styleClass="btn btn-default btn-flat tl-label"
											actionListener="#{trcCorrespondenceViewBean.reset}"></p:commandButton></li>
								</ul>
							</div>
						</div>
						<div class="col-lg-6">
							<div class="filter-tools" style="text-align: right;">
								<ul class="no-margin no-padding" style="float: right;">
									<li></li>
								</ul>
							</div>
						</div>

					</div>

					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
						    <div class="div-wrapper">
						    </div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{trcCorrespondenceViewBean.tableCorrespondence}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{trcCorrespondenceViewBean.paging}"
								rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;" width="100"
									headerText="#{msg.formAction}">
									<h:outputLabel value="&#160;" />
									<p:commandLink id="view" value="#{msg.buttonView}"
										action="#{trcCorrespondenceViewBean.getNavigateEdit()}"
										type="submit" ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.correspondenceId}" />
									</p:commandLink>
								</p:column>

								<p:column headerText="#{msg.formTmpCorrespondenceLetterNo}" width="300">
									<h:outputLabel value="#{vo.letterNo}" title="#{vo.letterNo}" />
								</p:column>
								
								<p:column width="140"
									headerText="#{msg.formTmpCorrespondenceLetterDate}">
									<h:outputText value="#{vo.letterDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
											locale="#{trcCorrespondenceViewBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
								
								<p:column headerText="#{msg.formTmpCorrespondencePerihal}" width="250">
									<h:outputLabel value="#{vo.perihalIn}" title="#{vo.perihalIn}"/>
								</p:column>

								<p:column headerText="#{msg.formTmpCorrespondenceSenderLetter}" width="250">
									<h:outputLabel value="#{vo.senderName}" title="#{vo.senderName}"/>
								</p:column>

								<p:column width="140"
									headerText="#{msg.formTmpCorrespondenceLetterReceivedDate}">
									<h:outputText value="#{vo.letterReceivedDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
											locale="#{trcCorrespondenceViewBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
								
								<p:column headerText="#{msg.formTmpCorrespondenceSearchStatus}" width="100"
									style="text-align:center;">
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_ACTIVE'}">
										<span class="label label-success"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_INACTIVE'}">
										<span class="label label-danger"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_NEW'}">
										<span class="label label-info"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_REVISE'}">
										<span class="label label-warning"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
								</p:column>
								
								<p:column width="140"
									headerText="#{msg.formTmpCorrespondenceTargetDate}">
									<h:outputText value="#{vo.targetDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
											locale="#{trcCorrespondenceViewBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column
									headerText="#{msg.formTmpCorrespondenceFollowupStatusOfPIC}" width="100"
									style="text-align:center;">
									<h:outputText value="#{vo.followupStatusName}" title="#{vo.followupStatusName}" />
								</p:column>

								<p:column
									headerText="#{msg.formTmpCorrespondencePICConfirmation}" width="150">
									<h:outputText value="#{vo.picConfirmationName}" title="#{vo.picConfirmationName}" />
								</p:column>

								<p:column
									headerText="#{msg.formTmpCorrespondenceConfirmationDate}" width="100"
									style="text-align:center;">
									<h:outputText value="#{vo.confirmationDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
											locale="#{trcCorrespondenceViewBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column headerText="#{msg.formTmpCorrespondenceFollowupDate}" width="100"
									style="text-align:center;">
									<h:outputText value="#{vo.followupDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
											locale="#{trcCorrespondenceViewBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column headerText="#{msg.formTmpCorrespondenceInformation}" width="150">
									<h:outputText value="#{vo.followupNote}" title="#{vo.followupNote}" />
								</p:column>

								<p:column
									headerText="#{msg.formTmpCorrespondenceFollowupFulfillmentDate}" width="140"
									style="text-align:center;">
									<h:outputText value="#{vo.fulfillmentFollowupDate}">
										<f:convertDateTime
											pattern="#{trcCorrespondenceViewBean.inputDateFormat}"
											locale="#{trcCorrespondenceViewBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column
									headerText="#{msg.formTmpCorrespondenceComplianceCheckStatus}" width="100"
									style="text-align:center;">
									<h:outputText value="#{vo.complianceCheckerStatus}" />
								</p:column>
								
								<p:column width="140"
									headerText="#{msg.formTmpCorrespondencePICAttendance}">
									<p:dataList value="#{vo.statusList}" emptyMessage=""
										var="dtl">
											<h:outputLabel value="#{dtl.picNameHadir != null ? dtl.picNameHadir : '' }" 
											rendered="#{dtl.picNameHadir ne null and dtl.picNameHadir != '' }"/>
									</p:dataList>
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputLabel
								value="#{msg.formTrcCorrespondenceViewConfirmDelete}"></h:outputLabel>
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputLabel value="#{msg.formTrcCorrespondenceViewDelete}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputLabel value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputLabel
								value="#{msg.formTrcCorrespondenceViewConfirmDelete}"></h:outputLabel>
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
