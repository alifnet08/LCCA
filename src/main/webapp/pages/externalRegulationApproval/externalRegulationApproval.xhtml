<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

    <ui:define name="head">
    <style>
    .ui-datatable .ui-datatable-data td {
	    vertical-align : top
	}
    </style>
    </ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formExternalRegulationApprovalTitle}" />
	</ui:define>
	
	<ui:define name="buttonAdd">
		
	</ui:define>
	
	<ui:define name="content">
	
	<div class="box box-solid">
    
    <div class="box-body">
      <div class="row">
        <div class="col-lg-12">
          <div class="table-responsive">
           <p:dataTable id="tableSearch" paginator="true" var="vo"
							value="#{externalRegulationApprovalBean.tableModel}" dynamic="true" lazy="true"
							emptyMessage="#{msg.textNodata}" rows="#{externalRegulationApprovalBean.paging}"
							rowIndexVar="statIndex" styleClass="table table-striped table-hover"
							rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
							>

							<p:column width="100" style="text-align:center;"
								headerText="#{msg.formAction}">
								<p:commandButton id="edit" icon="fa fa-check-square-o" title="#{msg.buttonEdit}" action="#{externalRegulationApprovalBean.getNavigateEdit()}"  ajax="false">
									<f:param name="id" value="#{vo.regulationId}" />
								</p:commandButton>
							</p:column>
							
							<p:column headerText="#{msg.formExternalRegulationApprovalRegTitle}" width="400" >
								<h:outputLabel value="#{vo.name}" title="#{vo.name}" style="vertical-align: top;"/>
							</p:column>
							
							<p:column headerText="#{msg.formExternalRegulationApprovalDocNo}" width="200" >
								<h:outputLabel value="#{vo.documentNo}" title="#{vo.documentNo}" style="vertical-align: top;"/>
							</p:column>

							<p:column headerText="#{msg.formExternalRegulationApprovalStatus}" width="100" 
									style="text-align:center;">
									<h:outputLabel rendered="#{vo.status eq 'DATA_NEW'}">
										<span class="label label-info">
											<h:outputText value="#{vo.statusName}"/>
										</span>
									</h:outputLabel>
							</p:column>
							
						</p:dataTable>
          </div>
        </div>
      </div>
    </div>
    </div>
   
	</ui:define>
</ui:composition>
