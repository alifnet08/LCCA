<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">
	<script type="text/javascript">
		//<![CDATA[
			function isNumeric (evt) {
					var theEvent = evt || window.event;
					var key = theEvent.keyCode || theEvent.which;
					key = String.fromCharCode (key);
					var regex = /[0-9]|\./;
					if ( !regex.test(key) ) {
					  theEvent.returnValue = false;
					  if(theEvent.preventDefault)
						  theEvent.preventDefault();
					}
				}
			//]]>
	</script>

		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">FORMULIR</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Formulir</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<!-- <h:form styleClass="form-group has-search my-2 my-lg-5"> -->
			<h:form styleClass="wo-search-form">
				<p:remoteCommand name="onSearch" 
				        process="@this dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun"
						update="dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun" 
						action="#{formulirRegulationFEBean.search()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onClickPage" 
					    process="@this dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun"
						update="dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun"
						action="#{formulirRegulationFEBean.searchDataPrevNext()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onPrev" 
						process="@this dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun"
						update="dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun" 
						action="#{formulirRegulationFEBean.prev()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onNext" 
						process="@this dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun"
						update="dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun" 
						action="#{formulirRegulationFEBean.next()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onChangeSearchParam" 
						process="@this dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun" 
						update="dataList searchVal searchDirectorate searchKategoriPeraturan searchStatus searchTahun" 
						action="#{formulirRegulationFEBean.onChangeSearchParam()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"/>
					<h:inputHidden id="pageSelected" styleClass="pageSelected"
						value="#{formulirRegulationFEBean.first}"></h:inputHidden>
					<h:inputHidden id="totalPage"
						value="#{formulirRegulationFEBean.totalPage}"></h:inputHidden>
				
			<div class="form-row">
			<div class="col-md-4 form-group">
              <div class="label-form">Direktorat</div>
						<p:selectOneMenu styleClass="form-control s2" id="searchDirectorate" widgetVar="selectDirectorate"
								onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}]); onChangeSearchParam();"
								value="#{formulirRegulationFEBean.directorateName}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
							<f:selectItems value="#{formulirRegulationFEBean.directorateList}" />
						</p:selectOneMenu>
		    </div>
		    
            <div class="col-md-4 form-group">
              <div class="label-form">Kategori Peraturan</div>
						<p:selectOneMenu styleClass="form-control s2" id="searchKategoriPeraturan" widgetVar="selectKategoriPeraturan"
								onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}]); onChangeSearchParam();"
								value="#{formulirRegulationFEBean.docCategory}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
							<f:selectItems value="#{formulirRegulationFEBean.tipeCategoryPeraturanList}" />
						</p:selectOneMenu>
		    </div>
		    
            <div class="col-md-4 form-group">
            <div class="label-form">Status</div>
						<p:selectOneMenu styleClass="form-control s2" id="searchStatus" widgetVar="selectStatus"
								onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}]); onChangeSearchParam();"
								value="#{formulirRegulationFEBean.searchStatus}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
							<f:selectItems value="#{formulirRegulationFEBean.statusList}" />
						</p:selectOneMenu>
				</div>
				</div>
				<div class="form-row">
				<div class="col-4 form-group">
					<p:inputText widgetVar="searchTahun" id="searchTahun" styleClass="form-control cari-input"  value="#{formulirRegulationFEBean.searchTahun}"
							placeholder="CARI TAHUN . . ." onkeypress="return isNumeric(event)" maxlength="4"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}]); onChangeSearchParam();"/>
				</div>
				<div class="col-8 has-search form-group">
					<!-- <input id="searchVal" class="form-control cari-input" type="search"
						placeholder="CARI PERATURAN INTERNAL . . ." aria-label="Search" /> -->
					<p:inputText widgetVar="searchVal" id="searchVal" styleClass="form-control cari-input"  value="#{formulirRegulationFEBean.searchVal}"
							placeholder="CARI FORMULIR . . ." aria-label="Search"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}]); onChangeSearchParam();"></p:inputText>
					<div class="input-group-append">
						<i
							class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
							onclick="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></i>
					</div>
				</div>
				</div>
			</h:form>

			<h:panelGroup id="dataList">
				<h:form>
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableFormulir">
							<tbody>
								<ui:repeat value="#{formulirRegulationFEBean.listData}" var="vo">
									<tr class="#{vo.isAccess == 0? 'unread':''}">
										<td class="col-9"><p:link
												outcome="#{formulirRegulationFEBean.viewRegulation()}"
												type="submit" ajax="true" styleClass="text-mb-g5">
											<f:param name="first" value="#{formulirRegulationFEBean.firstTemp}" /> 
											<f:param name="token" value="#{formulirRegulationFEBean.toEncrypt(vo.regulationId)}" />
											<f:param name="docType" value="#{formulirRegulationFEBean.docType}" />
											<f:param name="searchStatus" value="#{formulirRegulationFEBean.searchStatus}" />
											<f:param name="searchTahun" value="#{formulirRegulationFEBean.searchTahun}" />
											<f:param name="searchVal" value="#{formulirRegulationFEBean.searchVal}" />
												<span class="td-header #{vo.status eq 'DATA_INACTIVE'?'obsolete':''}  text-mb-secondary">
													#{vo.docNo}	- #{vo.nameIn}
												</span>
												<br /> 
												<span class="td-detail text-mb-g4">
													Tanggal berlaku : #{vo.effectiveDate}
												</span>
										</p:link></td>
										<td class="col-2"><p:graphicImage
												value="/resources/images/obsolete.svg"
												style="#{vo.status eq 'DATA_INACTIVE'?'':'display:none'}" /></td>
										<td class="col-1"><p:link
												outcome="#{formulirRegulationFEBean.viewRegulation()}"
												type="submit" ajax="true" styleClass="text-mb-g5">
												<f:param name="first" value="#{formulirRegulationFEBean.firstTemp}" />
												<f:param name="token" value="#{formulirRegulationFEBean.toEncrypt(vo.regulationId)}" />
												<f:param name="docType" value="#{formulirRegulationFEBean.docType}" />
												<f:param name="searchStatus" value="#{formulirRegulationFEBean.searchStatus}" />
												<f:param name="searchTahun" value="#{formulirRegulationFEBean.searchTahun}" />
												<f:param name="searchVal" value="#{formulirRegulationFEBean.searchVal}" />
												<i class="fas fa-external-link-alt"></i>
											</p:link></td>
									</tr>
								</ui:repeat>
								<tr style="#{(formulirRegulationFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td>#{msg.textNodata}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(formulirRegulationFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev()"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{formulirRegulationFEBean.totalPageList}" var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'PAGE_SELECTED', value:'#{row-1}'}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext()"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>

		</div>

	</ui:define>
</ui:composition>
