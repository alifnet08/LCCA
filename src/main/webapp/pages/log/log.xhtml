<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formLogHeaderTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">

	</ui:define>

	<ui:define name="content">

		<div class="box box-solid">

			<div class="box-body">
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="col-lg-4">
							<div class="form-group">
								<label><h:outputText
										value="#{msg.formLogHeaderProcessDate}" /></label>
								<div class="input-group">
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										value="#{logHeaderBean.searchProcessDateFrom}"
										autocomplete="off"
										pattern="#{logHeaderBean.inputDateFormat}"
										locale="#{logHeaderBean.inputDateLocale}"></p:calendar>
									<span class="input-group-addon plain">-</span>
		
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										value="#{logHeaderBean.searchProcessDateTo}"
										autocomplete="off"
										pattern="#{logHeaderBean.inputDateFormat}"
										locale="#{logHeaderBean.inputDateLocale}"></p:calendar>
		
								</div>
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLogHeaderProcessId}" /></label>
								<h:inputText styleClass="form-control"
									value="#{logHeaderBean.searchProcessId}" />
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLogHeaderMessage}" /></label>
								<h:inputText styleClass="form-control"
									value="#{logHeaderBean.searchRemarks}" />
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLogHeaderStatus}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{logHeaderBean.searchProcessStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{logHeaderBean.searchProcessStatusList}" />
								</h:selectOneMenu>	
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLogHeaderFunction}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{logHeaderBean.searchFunctionId}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{logHeaderBean.searchFunctionList}" />
								</h:selectOneMenu>	
							</div>
						</div>
						<div class="col-lg-4">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formLogHeaderFile}" /></label>
								<h:inputText styleClass="form-control"
									value="#{logHeaderBean.searchFilename}" />
							</div>
						</div>
					</h:panelGroup>
				</div>
				<div>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{logHeaderBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{logHeaderBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="entity"
								value="#{logHeaderBean.tableModel}" dynamic="true"
								lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{logHeaderBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column headerText="#{msg.formLogHeaderProcessId}">
									<h:commandLink action="#{logHeaderBean.getNavigateDetail()}"
										value="#{entity.processId}">
										<f:param name="id" value="#{entity.processId}" />
									</h:commandLink>
								</p:column>
								<p:column headerText="#{msg.formLogHeaderFunction}">
									<h:outputText value="#{entity.functionParam.name}" />
								</p:column>
								<p:column headerText="#{msg.formLogHeaderStartDate}">
									<h:outputText value="#{entity.processDate}">
										<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
									</h:outputText>
								</p:column>
								<p:column headerText="#{msg.formLogHeaderEndDate}">
									<h:outputText value="#{entity.endDate}">
										<f:convertDateTime pattern="dd-MMM-yyyy HH:mm:ss" />
									</h:outputText>
								</p:column>
								<p:column headerText="#{msg.formLogHeaderStatus}">
									<h:outputText value="#{entity.processStsParam.name}" />
								</p:column>
								<p:column headerText="#{msg.formLogHeaderMessage}">
									<h:outputText value="#{entity.remarks}" />
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

	</ui:define>
</ui:composition>
