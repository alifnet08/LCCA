<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">

		<style>
.ui-widget {
	font-family: lato;
}
</style>

		
		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">LITIGASI</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">LITIGASI</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<h:form styleClass="wo-search-form">
				<p:growl id="messages" severity="error" />
				<p:remoteCommand name="onSearch" process="@this dataList"
					update="dataList"
					action="#{litigationViewFEBean.search()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onClickPage" process="@this dataList"
					update="dataList"
					action="#{litigationViewFEBean.searchDataPrevNext()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onPrev" process="@this dataList"
					update="dataList"
					action="#{litigationViewFEBean.prev()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onNext" process="@this dataList"
					update="dataList"
					action="#{litigationViewFEBean.next()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<h:inputHidden id="pageSelected"
					value="#{litigationViewFEBean.first}"></h:inputHidden>
				<h:inputHidden id="totalPage"
					value="#{litigationViewFEBean.totalPage}"></h:inputHidden>

				<div class="row">
					<div class="col-12 col-lg-12 search-bar form-group">
						<input id="searchVal" class="form-control cari-input"
							type="search"
							placeholder="CARI LITIGASI . . ."
							aria-label="Search"
							onchange="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'0'}])" />
						<div class="input-group-append">
							<i
								class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
								onclick="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'0'}])" />
						</div>
					</div>
				</div>
			</h:form>

			<h:panelGroup id="dataList">
				<h:form>
					<div class="">
						<table class="table table-hover table-bordered wo-table" style="min-width: 500px;">
							<thead>
								<tr style="background-color: rgba(236, 236, 236, 1);">
									<td>#{msg.formLitigationCaseNumber}</td>
									<td>#{msg.formLitigationDebitur}</td>
								</tr>
							</thead>
							<tbody>
								<ui:repeat value="#{litigationViewFEBean.listData}" var="vo">
									<tr>
										<td>
											<span class="td-header text-mb-secondary">#{vo.noPerkara}</span>
										</td>
										<td>
											<span class="td-header text-mb-secondary">#{vo.debitur}</span>
										</td>
									</tr>
								</ui:repeat>
								<tr style="#{(litigationViewFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td colspan="4">#{msg.textNodata}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(litigationViewFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{litigationViewFEBean.totalPageList}"
						var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'#{row-1}'},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>
		</div>

	</ui:define>
</ui:composition>
