
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formEmailTitle}" />
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formEmailType}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{emailBean.searchEmailType}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{emailBean.selectEmailTypes}" />
								</h:selectOneMenu>
							</div>
						</div>
						<div class="col-lg-3">
							<div class="form-group">
								<label><h:outputText
										value="#{msg.formEmailDate}" /></label>
								<div class="input-group">
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										id="startDate" value="#{emailBean.searchEmailDateFrom}"
										autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
									</p:calendar>
									<span class="input-group-addon plain">-</span>
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										id="endDate" value="#{emailBean.searchEmailDateTo}"
										autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
									</p:calendar>
								</div>
							</div>
						</div>
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formEmailStatus}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{emailBean.searchEmailStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{emailBean.selectStatus}" />
								</h:selectOneMenu>
							</div>
						</div>
						<div class="col-lg-3">
							<div class="form-group">
								<label><h:outputText
										value="#{msg.formEmailLastSentDate}" /></label>
								<div class="input-group">
									<!-- <input type="text" class="form-control date_picker" id="startDate" placeholder="from" value="#{externalRegulationBean.startDateStr}"/> -->
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										id="LastSentDateFrom" value="#{emailBean.searchLastSentDateFrom}"
										autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
									</p:calendar>
									<span class="input-group-addon plain">-</span>
									<!-- <input type="text" class="form-control date_picker" id="endDate" placeholder="to" value="#{externalRegulationBean.endDateStr}"/> -->
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										id="LastSentDateTo" value="#{emailBean.searchLastSentDateTo}"
										autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
									</p:calendar>
								</div>
							</div>
						</div>
					</h:panelGroup>

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{emailBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}"
										ajax="true" update="tableSearch panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{emailBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{emailBean.tableModel}" dynamic="true"
								lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{emailBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								>
								
								<p:column headerText="#{msg.formEmailType}">
									<h:outputLabel value="#{vo.emailType}" />
								</p:column>
								<p:column headerText="#{msg.formEmailDate}">
									<h:outputLabel value="#{vo.emailDate}" />
								</p:column>
								<p:column headerText="#{msg.formEmailStatus}">
									<h:outputLabel value="#{vo.emailStatus}" />
								</p:column>
								<p:column headerText="#{msg.formEmailSubject}">
									<h:outputLabel value="#{vo.emailSubject}" />
								</p:column>
								<p:column headerText="#{msg.formEmailContent}">
									<h:outputLabel value="#{vo.emailContent}" />
								</p:column>
								<p:column headerText="#{msg.formEmailResendCount}">
									<h:outputLabel value="#{vo.resendCount}" />
								</p:column>
								<p:column headerText="#{msg.formEmailLastSentDate}">
									<h:outputLabel value="#{vo.lastSentDate}" />
								</p:column>
								<p:column style="text-align:center;width:20%;"
									headerText="#{msg.formAction}">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonResend}" update="form:deletedMessage form:tableSearch"
										actionListener="#{emailBean.resend(vo.emailId, vo.emailType)}" type="submit"
										styleClass="tl-label">
									</p:commandLink>

								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

	</ui:define>
</ui:composition>
