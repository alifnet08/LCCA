<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
			.ui-widget-content .ui-inputfield {
			    font-weight: normal;
			    height: 38px;
			    margin-left: 200px;
    			margin-top: -37px;
			}
			
			.ui-chips-container {
		     width:100%!important;
		     background-color: rgba(245, 131, 34, 0.25);
		     }
			
			/* .ui-widget-content .ui-inputfield {
			    margin-right: 110px;
			} */
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formAdvocatTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-advocate">
					<h:outputText value="#{msg.formAdvocatTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="region"><p:outputLabel
									value="#{msg.formAdvocatRegion}" for="region" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="region" value="#{advocateEditBean.advocate.region}"  required="true" requiredMessage="#{msg.formAdvocatRegion} #{msg.validateRequired}"/>
							<p:message for="region"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="branch"><p:outputLabel
									value="#{msg.formAdvocatBranch}" for="branch" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="branch" value="#{advocateEditBean.advocate.branch}"  required="true" requiredMessage="#{msg.formAdvocatBranch} #{msg.validateRequired}"/>
							<p:message for="branch"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="no"><p:outputLabel
									value="#{msg.formAdvocatNo}" for="no" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="no" value="#{advocateEditBean.advocate.no}"  required="true" requiredMessage="#{msg.formAdvocatOfficeName} #{msg.validateRequired}"/>
							
							<p:message for="no"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="advocateName"><p:outputLabel
									value="#{msg.formAdvocatOfficeName}" for="advocateName" /></label>								
							<p:inputText id="advocateName" styleClass="form-control"  required="true" requiredMessage="#{msg.formAdvocatOfficeName} #{msg.validateRequired}"
							value="#{advocateEditBean.advocate.advocateName}" />
							<p:message for="advocateName"/>
						</div>
					</div>
					
					<h3>
						<h:outputText value="#{msg.formAdvocatPartners}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink
												onclick="onAddNewPartner()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowPartner()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tablePartnerDetail" var="vo"
									value="#{advocateEditBean.advocatePartnerModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{advocateEditBean.selectedPartnerData}"
									rowKey="#{vo.sequence}" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									
									<p:column headerText="#{msg.formAdvocatPartnerName}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%">
													<h:inputText id="partnerName#{statIndex}" styleClass="form-control" 
														value="#{vo.partners}">
														<f:ajax event="change"/>
													</h:inputText>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formAdvocatTelpNo}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%">
													<h:inputText id="partnerNo#{statIndex}" styleClass="form-control" 
															value="#{vo.phoneNo}"> 
														<f:ajax event="change"/>
													</h:inputText>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
					
					<h3>
						<h:outputText value="#{msg.formAdvocatInfo}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink
												onclick="onAddNewInfo()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowInfo()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tableInfoDetail" var="vo"
									value="#{advocateEditBean.advocateInfoModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{advocateEditBean.selectedInfoData}"
									rowKey="#{vo.sequence}" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									
									<p:column headerText="#{msg.formAdvocatOfficeAddress}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%">
													<h:inputText styleClass="form-control" value="#{vo.officeAddress}">
														<f:ajax event="change"/>
													</h:inputText>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formAdvocatTelpNo}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%">
													<h:inputText styleClass="form-control" value="#{vo.phoneNo}">
														<f:ajax event="change"/>
													</h:inputText>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formAdvocatFaxNo}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%">
													<h:inputText styleClass="form-control" value="#{vo.faxNo}">
														<f:ajax event="change"/>
													</h:inputText>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formAdvocatEmail}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%">
													<h:inputText styleClass="form-control" value="#{vo.email}">
														<f:ajax event="change"/>
													</h:inputText>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" tl="website"><p:outputLabel
									value="#{msg.formAdvocatWebsite}" for="website" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="website" value="#{advocateEditBean.advocate.website}"  />
							<p:message for="website"/>
						</div>
					</div>
				
					<div class="col-lg-12">
						<div class="form-group ">
							<label class="control-label tl-label" tl="clasification"><p:outputLabel
									value="#{msg.formAdvocatClasification}" for="clasification" /></label>								
							<p:inputTextarea id="clasification" styleClass="form-control" 
							value="#{advocateEditBean.advocate.clasification}" />
							<p:message for="clasification"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group ">
							<label class="control-label tl-label" tl="note"><p:outputLabel
									value="#{msg.formAdvocatNote}" for="note" /></label>								
							<p:inputTextarea id="note" styleClass="form-control" 
							value="#{advocateEditBean.advocate.note}" />
							<p:message for="note"/>
						</div>
					</div>
					
				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{advocateEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{advocateEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
				<p:remoteCommand
					action="#{advocateEditBean.onAddNewInfo}" immediate="true"
					name="onAddNewInfo" update="tableInfoDetail" process="@this"></p:remoteCommand>
				<p:remoteCommand
					action="#{advocateEditBean.onDeleteRowInfo}" immediate="true"
					name="onDeleteRowInfo" update="tableInfoDetail" process="@this"></p:remoteCommand>
				<p:remoteCommand
					action="#{advocateEditBean.onAddNewPartner}" immediate="true"
					name="onAddNewPartner" update="tablePartnerDetail" process="@this"></p:remoteCommand>
				<p:remoteCommand
					action="#{advocateEditBean.onDeleteRowPartner}" immediate="true"
					name="onDeleteRowPartner" update="tablePartnerDetail" process="@this"></p:remoteCommand>

			</div>
		</div>
	</ui:define>
</ui:composition>
