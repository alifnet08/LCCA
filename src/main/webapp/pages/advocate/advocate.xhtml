
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formAdvocatTitle}" />
	</ui:define>
	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{advocateBean.getNavigateEdit()}"
					type="submit" process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>


	<ui:define name="content">
		 <div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">

					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formAdvocatRegion}" /></label>
							<p:inputText id="region" styleClass="form-control"
								autocomplete="off" value="#{advocateBean.region}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formAdvocatBranch}" /></label>
							<p:inputText id="branch" styleClass="form-control"
								autocomplete="off" value="#{advocateBean.branch}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formAdvocatOfficeName}" /></label>
							<p:inputText id="advocateName" styleClass="form-control"
								autocomplete="off" value="#{advocateBean.advocatName}"></p:inputText>
						</div>
					</div>
					
					
					

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{advocateBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{advocateBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
							    
								<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
								<li>
									<p:commandLink  ajax="false" styleClass="btn btn-warning tl-label"
											immediate="true" id="download"
											actionListener="#{advocateBean.downloadFileXls()}"
											target="_blank">
											<i class="fa fa-table"></i> &nbsp;
		        							<h:outputText
											value="#{msg.formExternalRegulationExportToExcel}" />
									</p:commandLink>
								</li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
						    <div class="div-wrapper">
						    </div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{advocateBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" styleClass="table table-striped table-hover"
								rows="#{advocateBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column width="125" style="text-align:center;"
									headerText="#{msg.formAction}">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{advocateBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.advocateId}" />
									</p:commandLink>

									<h:outputText style=" padding-left:4px; color:grey;'"
										value=" | " />
									<h:outputLabel value="&#160;" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label" update="tableSearch form:deletedMessage"
										action="#{advocateBean.delete(vo.advocateId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>

								</p:column>

								
								<p:column width="100" headerText="#{msg.formAdvocatRegion}">
									<h:outputLabel value="#{vo.region}" />
								</p:column>
								<p:column width="100" headerText="#{msg.formAdvocatBranch}">
									<h:outputLabel value="#{vo.branch}" />
								</p:column>
								<p:column width="100" headerText="#{msg.formAdvocatNo}">
									<h:outputLabel value="#{vo.no}" />
								</p:column>
								<p:column width="200" headerText="#{msg.formAdvocatOfficeName}">
									<h:outputLabel value="#{vo.advocateName}" />
								</p:column>
								<p:column width="300" headerText="#{msg.formAdvocatPartnerName}">
									<p:dataList value="#{vo.advocatePartners}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.partners}" title="#{dtl.partners}" />
									</p:dataList>
								</p:column>
								<p:column width="325" headerText="#{msg.formAdvocatOfficeAddress}">
									<p:dataList value="#{vo.advocateInfos}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.officeAddress}" title="#{dtl.officeAddress}" />
									</p:dataList>
								</p:column>
								<p:column width="175" headerText="#{msg.formAdvocatTelpNo}">
									<p:dataList value="#{vo.advocateInfos}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.phoneNo}" title="#{dtl.phoneNo}" />
									</p:dataList>
								</p:column>
								<p:column width="175" headerText="#{msg.formAdvocatFaxNo}">
									<p:dataList value="#{vo.advocateInfos}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.faxNo}" title="#{dtl.faxNo}" />
									</p:dataList>
								</p:column>
								<p:column width="275" headerText="#{msg.formAdvocatEmail}">
									<p:dataList value="#{vo.advocateInfos}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.email}" title="#{dtl.email}" />
									</p:dataList>
								</p:column>
								<p:column width="275" headerText="#{msg.formAdvocatWebsite}">
									<h:outputLabel value="#{vo.website}" />
								</p:column>
								<p:column width="165" headerText="#{msg.formAdvocatClasification}">
									<h:outputLabel value="#{vo.clasification}" />
								</p:column>
								<p:column width="175" headerText="#{msg.formAdvocatNote}">
									<h:outputLabel value="#{vo.note}" />
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div> 

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formRCDeleteRC}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formRCConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
