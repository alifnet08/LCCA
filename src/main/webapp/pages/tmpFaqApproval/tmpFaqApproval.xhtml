<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">


	<ui:define name="head">
		<style>
.form-control, .form-control-datepicker-wrap input.hasDatepicker {
	border: 0;
	height: inherit;
	padding: 9px 12px;
	border-radius: 5px !important;
	-webkit-border-radius: 5px !important;
	-moz-border-radius: 5px !important;
	background-color: #F7F8F8;
	-webkit-box-shadow: none;
	box-shadow: none;
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formFaqApprovalTitle}" />
	</ui:define>
	
	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{tmpFaqApprovalBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{tmpFaqApprovalBean.paging}"
								rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;width:20%;"
									headerText="#{msg.formAction}">
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{tmpFaqApprovalBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.faqId}" />
									</p:commandLink>
								</p:column>
								
								<p:column headerText="#{msg.formFaqApprovalSubject}">
									<h:outputLabel value="#{vo.keyword}" />
								</p:column>
								<p:column headerText="#{msg.formFaqApprovalCategory}">
									<h:outputLabel value="#{vo.category}" />
								</p:column>
								<p:column headerText="#{msg.formFaqApprovalQuestion}">
									<h:outputLabel value="#{vo.questionIn}" />
								</p:column>
								<p:column headerText="#{msg.formFaqApprovalUploadDate}">
									<h:outputLabel value="#{vo.date}"
										style="text-align:center">
										<f:convertDateTime pattern="dd-MMM-yyyy" locale="en">
										</f:convertDateTime>
									</h:outputLabel>
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

	</ui:define>
</ui:composition>
