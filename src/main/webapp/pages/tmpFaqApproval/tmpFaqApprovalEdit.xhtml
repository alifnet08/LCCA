<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-inputfield, .ui-widget-content .ui-inputfield {
	box-shadow: none;
}

.ui-widget-content .ui-inputfield {
	font-weight: normal;
	height: 38px;
	margin-left: 200px;
	margin-top: -37px;
}

.ui-chips-container {
	width: 100% !important;
}

/* .ui-widget-content .ui-inputfield {
			    margin-right: 110px;
			} */
</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formFaqApprovalTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-faq">
					<h:outputText value="#{msg.formFaqTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<p:growl id="messages" rendered="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" tl="subject"><p:outputLabel
									value="#{msg.formFaqApprovalKeyword}" for="subject" /></label>
							<p:chips style="width:100%" styleClass="" id="subject" disabled="true"
								value="#{tmpFaqApprovalEditBean.keywords}" />
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="institution"><p:outputLabel
									value="#{msg.formFaqApprovalInstitution}" for="institution" /></label>
							<h:selectOneMenu id="institution"
								styleClass="form-control s2" disabled="true"
								value="#{tmpFaqApprovalEditBean.tmpFaq.institution.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpFaqApprovalEditBean.institutionList}" />
							</h:selectOneMenu>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="category"><p:outputLabel
									value="#{msg.formFaqApprovalCategory}" for="category" /></label>
							<h:selectOneMenu id="category"
								styleClass="form-control s2" disabled="true"
								value="#{tmpFaqApprovalEditBean.tmpFaq.faqCategory.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpFaqApprovalEditBean.categoryList}" />
							</h:selectOneMenu>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="question"><p:outputLabel
									value="#{msg.formFaqApprovalQuestion}" for="question" /></label>
							<p:inputTextarea id="question" styleClass="form-control" disabled="true"
								value="#{tmpFaqApprovalEditBean.tmpFaq.questionIn}" />
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="answer"><p:outputLabel
									value="#{msg.formFaqApprovalAnswer}" for="answer" /></label>
							<p:textEditor id="answer" widgetVar="logEditor" readonly="true"
								value="#{tmpFaqApprovalEditBean.tmpFaq.answerIn}" height="150"
								style="margin-bottom:10px" />
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="uploadDate"><p:outputLabel
									value="#{msg.formFaqApprovalUploadDate}" for="uploadDate" /></label>
							<p:calendar id="uploadDate"
								styleClass="form-control-datepicker-wrap" maxlength="11" disabled="true"
								value="#{tmpFaqApprovalEditBean.tmpFaq.date}" autocomplete="off"
								pattern="dd-MMM-yyyy" locale="en"></p:calendar>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">

							<p:remoteCommand name="onCompleteUpload" update="attachment"></p:remoteCommand>
							<label class="tl-label"><h:outputText
									value="#{msg.formFaqApprovalAttachment}" />
							</label>
							<p:dataList value="#{tmpFaqApprovalEditBean.uploadFiles}" emptyMessage=""
								var="vo" id="attachment" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
												actionListener="#{tmpFaqApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
									</tr>
								</table>
							</p:dataList>

						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel value="Hits " /></label>
							<br></br>
							<p:outputLabel value="#{tmpFaqApprovalEditBean.hits} kali" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formFaqApprovalApprStatus}" />
							</label>
							<h:selectOneMenu id="status" styleClass="form-control s2"
								value="#{tmpFaqApprovalEditBean.approvalStatus}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpFaqApprovalEditBean.statusList}" />
							</h:selectOneMenu>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formFaqApprovalApprNote}" />
							</label>
							<p:inputTextarea id="approvalNote" styleClass="form-control"
								value="#{tmpFaqApprovalEditBean.approvalNote}" />
						</div>
					</div>

				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{tmpFaqApprovalEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}" actionListener="#{tmpFaqApprovalEditBean.cancel()}"
					onclick="window.history.back();" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>

			</div>
		</div>
	</ui:define>
</ui:composition>
