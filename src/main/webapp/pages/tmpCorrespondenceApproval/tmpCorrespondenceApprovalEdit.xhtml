<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			.select2-container--default .select2-selection--single {
			    background-color: #eeeeee;
    		}
		</style>
	</ui:define>
	<ui:define name="menuName">

								<f:selectItems
									value="#{tmpCorrespondenceApprovalEditBean.reminderStatusList}" />
							</h:selectOneRadio>

						</div>
					</div>
					
					<div class="col-lg-12">
		             <div class="form-group required">
		             	<label class="tl-label"><h:outputText value="#{msg.textApprovalStatus}" /></label>
			          	<h:selectOneMenu styleClass="form-control s2" value="#{tmpCorrespondenceApprovalEditBean.approvalStat}">

</ui:composition>
