<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
		.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}	
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    -webkit-box-shadow: none;
			    box-shadow: none;
			}
			.form-control[disabled]{
			    font-size: 13px;
			    font-family: 'Montserrat';
			    color: #444444;
			}
			.input-group {
			    margin-top: 15px;
			}
			.ui-widget-content .ui-inputfield {
			    font-family: 'Montserrat';
			}
			
			input#form\:picPerdataTergugat {
				margin-right: 10px;
			    width: 310px;
			}
			
		</style>
		<script>
			$('form').on('focus', 'input[type=number]', function (e) {
			  $(this).on('wheel.disableScroll', function (e) {
			    e.preventDefault()
			  })
			})
			$('form').on('blur', 'input[type=number]', function (e) {
			  $(this).off('wheel.disableScroll')
			})
		</script>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formLitigationViewTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-litigation">
					<h:outputText value="#{msg.formLitigationTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
				
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="category"><p:outputLabel
									value="#{msg.formLitigationCaseType}" for="caseType" /></label>								
							<h:selectOneMenu id="caseType" required="true" requiredMessage="#{msg.formLitigationCategory} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{litigationViewDetailBean.litigationNew.selectCaseType}" disabled="true"> 
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{litigationViewDetailBean.caseTypeList}"/>
							</h:selectOneMenu>
						</div>
					</div>
					
					<h3>
						<h:outputLabel value="LOB"/>
					</h3>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="branchOffice"><p:outputLabel
									value="#{msg.formLitigationBranchOffice}" for="branchOffice" /></label>								
							<p:inputText autocomplete="off" style="width:100%" styleClass="form-control" id="branchOffice" 
									value="#{litigationViewDetailBean.litigationNew.divisionOrBranchOffice}" 
									required="true" requiredMessage="#{msg.formLitigationBranchOffice} #{msg.validateRequired}" disabled="true"/>

						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="segment"><p:outputLabel
									value="#{msg.formLitigationSegment}" for="segment" /></label>								
							<p:inputText autocomplete="off" style="width:100%" styleClass="form-control" id="segment" 
									value="#{litigationViewDetailBean.litigationNew.segment}" 
									required="true" requiredMessage="#{msg.formLitigationSegment} #{msg.validateRequired}" disabled="true"/>
							<p:message for="segment"/>
						</div>
					</div>
					
					<h:panelGroup id="panelCaseTypePerdata" style="#{litigationViewDetailBean.litigationNew.selectCaseType eq 'CASE_TYPE_PERDATA' ? '':'display:none'}">

							<div class="form-group required">
								<label class="tl-label" tl="category"><p:outputLabel
										value="#{msg.formLitigationCaseTypeMaybankAs}" for="caseTypeDtlPerdata" /></label>

										styleClass="form-control s2"
										value="#{litigationViewDetailBean.litigationNew.selectCaseTypeDtlPerdata}" disabled="true">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{litigationViewDetailBean.caseTypePerdataDtlList}"/>
								</h:selectOneMenu>
								<p:message for="caseTypeDtlPerdata"/>
							</div>
						</div>
						
						<h:panelGroup id="panelCaseTypeDtlPerdataTergugat" style="#{litigationViewDetailBean.litigationNew.selectCaseTypeDtlPerdata eq 'CASE_TYPE_DTL_PERDATA_TERGUGAT' and litigationViewDetailBean.litigationNew.selectCaseType eq 'CASE_TYPE_PERDATA' ? '':'display:none'}">
							<div class="col-lg-12">
								<div class="form-group">
									<label class="control-label tl-label" tl="debitur"><p:outputLabel
											value="#{msg.formLitigationDebitur}"/></label>								
									<p:inputText autocomplete="off" style="width:100%" styleClass="form-control" id="debitur" 
											value="#{litigationViewDetailBean.litigationNew.litigationPerdataTergugat.debitur}" disabled="true"/>
								</div>
							</div>
							
							<h3>
								<h:outputLabel value="#{msg.formLitigationCaseRegistration}"/>
							</h3>
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><p:outputLabel

											value="#{litigationViewDetailBean.litigationNew.litigationPerdataTergugat.caseYear}" disabled="true"/>

							</div>
							<div class="col-lg-12">

							</div>
							
							<div class="col-lg-12">

										<f:selectItems value="#{litigationViewDetailBean.courtTypeList}" />
									</h:selectOneMenu>

							</div>
							
							<div class="col-lg-12">

							</div>
							
							<h3>
								<h:outputLabel value="#{msg.formLitigationParaPihak}"/>

								</div>

									<h:selectOneMenu id="tipeTergugatKuasaHukumPerdataTergugat"  styleClass="form-control s2" immediate="true"

										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{litigationViewDetailBean.caseHandlerList}" />

							</div>
							<div class="col-lg-12">

											value="#{msg.formLitigationAttorneyOfficeName}" for="tergugatKuasaHukumPerdataTergugat" /></label>

														<f:selectItems value="#{litigationViewDetailBean.caseTeamHandlerList}" />

																<p:inputText id="picPerdataTergugat" styleClass="form-control" disabled="true"
																	value="#{litigationViewDetailBean.litigationNew.selectedPicName}">
																</p:inputText>
															</td>
														</tr>
													</table>	
												</p:column>
												<p:column headerText="#{msg.formLitigationPicDescription}" width="250">
													<p:inputTextarea id="picKeteranganPerdataTergugat" styleClass="form-control" 
															value="#{litigationViewDetailBean.litigationNew.picDescPerdataTer}" disabled="true">
														<p:ajax event="change"/>
													</p:inputTextarea>
												</p:column>
											</p:dataTable>
										</div>
									</div>
								</div>

									<p:inputTextarea id="kasusPosisiGugatanPerdataTergugat" styleClass="form-control"
