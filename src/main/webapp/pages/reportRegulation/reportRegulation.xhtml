<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formReportRegulationTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="message" rendered="true" />
		<div class="box box-solid">
			<div class="box-body">
				<h:panelGroup id="panelSearch">
					<div class="row">
						
						<div class="col-lg-4">
							<div class="form-group">
								<label>
									<h:outputText value="#{msg.formReportRegulationJenisKetentuan}" />
								</label>
								<h:selectOneMenu styleClass="form-control s2" id="jnsKetentuan" 
									value="#{reportRegulationBean.searchJenisKetentuan}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{reportRegulationBean.selectJenisKetentuan}" />
									<p:ajax event="change" update="form:panelDocType"
											listener="#{reportRegulationBean.onChangeJenisKetentuan}" />
								</h:selectOneMenu>
							</div>
						</div>
						
						<div class="col-lg-4">
						   <h:panelGroup id="panelDocType">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formInternalRegulationRegulationType}" /></label>
								<h:selectOneMenu styleClass="form-control s2" id="tipePeraturan"
									value="#{reportRegulationBean.searchTipePeraturan}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{reportRegulationBean.selectTipePeraturan}" />
								</h:selectOneMenu>
							</div>
							</h:panelGroup>
						</div>
						
						
						<div class="col-lg-4">
							<div class="form-group">
								<label>
									<h:outputText value="#{msg.formReportRegulationPublishDate}" />
								</label>
								<div class="input-group">
									<p:calendar id="searchPublishDateFrom" 
										styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										value="#{reportRegulationBean.searchPublishDateFrom}"
										autocomplete="off"
										pattern="#{reportRegulationBean.inputDateFormat}"
										locale="#{reportRegulationBean.inputDateLocale}" />
										
									<span class="input-group-addon plain">-</span>

									<p:calendar id="searchPublishDateTo" 
										styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										value="#{reportRegulationBean.searchPublishDateTo}"
										autocomplete="off"
										pattern="#{reportRegulationBean.inputDateFormat}"
										locale="#{reportRegulationBean.inputDateLocale}" />
								</div>
							</div>
						</div>
					</div>
					
					<div class="row">
						
						<div class="col-lg-6">
							<div class="form-group">
								<label>
									<h:outputText value="#{msg.formReportRegulationExpiredDate}" />
								</label>
								<div class="input-group">
									<p:calendar id="searchExpiredDateFrom" 
										styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										value="#{reportRegulationBean.searchExpiredDateFrom}"
										autocomplete="off"
										pattern="#{reportRegulationBean.inputDateFormat}"
										locale="#{reportRegulationBean.inputDateLocale}" />
										
									<span class="input-group-addon plain">-</span>

									<p:calendar id="searchExpiredDateTo" 
										styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										value="#{reportRegulationBean.searchExpiredDateTo}"
										autocomplete="off"
										pattern="#{reportRegulationBean.inputDateFormat}"
										locale="#{reportRegulationBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						
						<div class="col-lg-6">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText value="#{msg.formReportRegulationStatus}" />
								</label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{reportRegulationBean.searchStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{reportRegulationBean.selectStatus}" />
								</h:selectOneMenu>
							</div>
						</div>
					</div>
					
					<div class="row">
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label">
									<h:outputText value="#{msg.formReportRegulationpPublisherUnit}" />
								</label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{reportRegulationBean.searchPublisherUnit}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{reportRegulationBean.selectDirectorat}" />
								</h:selectOneMenu>
							</div>
						</div>
					</div>
				</h:panelGroup>
				
				<div class="row">
					<div class="col-lg-12">
						<div class="filter-tools">
						
							<ul class="no-margin no-padding">
								<li>
									<p:commandButton value="#{msg.buttonPrint}" ajax="true"
										update="reportRegulation panelSearch message"
										styleClass="btn btn-success tl-label"
										oncomplete="reInitSelect2();"
										actionListener="#{reportRegulationBean.generateExcelInBackgroundJob}" />
								</li>
								<li>
									<p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="panelSearch" oncomplete="reInitSelect2();"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{reportRegulationBean.reset}" />
								</li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<li>
									<p:commandButton value="#{msg.buttonRefresh}"
										ajax="true" update="reportRegulation"
										styleClass="btn btn-success tl-label" immediate="true"
										actionListener="#{reportRegulationBean.search}" />
								</li>
								<li>
									<p:commandButton value="#{msg.buttonDelete}"
										ajax="true" update="reportRegulation"
										styleClass="btn btn-default btn-flat tl-label" process="@this"
										actionListener="#{reportRegulationBean.delete}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandButton>
								</li>
							</ul>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="reportRegulation" paginator="true"
								var="vo" value="#{reportRegulationBean.tableModel}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{reportRegulationBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								selection="#{reportRegulationBean.selectedReportGen}"
								rowKey="#{vo.reportGenId}" rowSelectMode="checkbox"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
							
								<p:ajax event="rowSelectCheckbox" process="@this" update="reportRegulation" />
								<p:ajax event="rowUnselectCheckbox" process="@this" update="reportRegulation" />
								<p:ajax event="toggleSelect" process="@this" update="reportRegulation" />
								
								<p:column selectionMode="multiple"
									style="text-align:center; width:40px;" />
								
								<p:column width="90" headerText="#{msg.formReportGenReportId}">
									<h:outputLabel value="#{vo.reportGenId}"
										title="#{vo.reportGenId}" />
								</p:column>
								
								<p:column headerText="#{msg.formReportGenReportName}">
									<h:outputLabel value="#{vo.reportGenReportName}"
										title="#{vo.reportGenReportName}" />
								</p:column>
								
								<p:column headerText="#{msg.formReportGenReportExecuteDate}"
									style="text-align:center;">
									<h:outputLabel value="#{vo.creationDate}"
										title="#{vo.creationDate}" />
								</p:column>
								
								<p:column width="100"
									headerText="#{msg.formReportGenReportStatus}"
									style="text-align:center;">
									<h:outputText styleClass="label label-warning"
										value="#{vo.reportGenStatus}" title="#{vo.reportGenStatus}"></h:outputText>
								</p:column>
								
								<p:column style="text-align:center;" headerText="#{msg.textAction}">
									<p:outputPanel rendered="#{vo.statusIsCompleted}">
										<p:commandLink ajax="false" value="#{msg.textDownload}"
											immediate="true"
											actionListener="#{reportRegulationBean.downloadFile(
												vo.reportGenFileId, 
												vo.reportGenReportFileName,
												null
											)}"
											target="_blank" />
									</p:outputPanel>
								</p:column>
								
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
		
	</ui:define>
</ui:composition>
