
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formMstProvinceTitle}" />
	</ui:define>
	
	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{mstProvinceBean.getNavigateEdit()}"
					type="submit" process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
			<li><p:fileUpload
					fileUploadListener="#{mstProvinceBean.handleFileUpload}"
					value="mstProvinceBean.uploadFile" mode="advanced" auto="true"
					dragDropSupport="false" multiple="true"
					sizeLimit="#{mstProvinceBean.standardAttachmentSize}"
					update="pesan tableSearch" />
					<div class="maxSizeText">
						<h:outputText value="#{msg.formMstProvinceMaxAttachment}"/>
					</div></li>
		</ul>
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<p:messages id="pesan" showDetail="summary" />
				<div class="row">

					<div class="col-lg-6">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formMstProvinceBranchCode}" /></label>
							<p:inputText id="searchBranchCode" styleClass="form-control"
								value="#{mstProvinceBean.searchBranchCode}"></p:inputText>
						</div>
					</div>
					
					<div class="col-lg-6">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formMstProvinceProvince}" /></label>
							<p:inputText id="searchProvince" styleClass="form-control"
								value="#{mstProvinceBean.searchProvince}"></p:inputText>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{mstProvinceBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}"
										ajax="true" update="tableSearch form:searchBranchCode form:searchProvince"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{mstProvinceBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
							    <p:remoteCommand name="onclickDownload" ></p:remoteCommand>
								<li><p:commandLink styleClass="btn btn-warning tl-label"
										actionListener="#{mstProvinceBean.createTemplateFile()}"
										ajax="false" immediate="true">
										<i class="fa fa-table"></i> &nbsp;
		        	                    <h:outputText
											value="#{msg.formMstProvinceDownloadTemplate}" />
									</p:commandLink></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{mstProvinceBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{mstProvinceBean.paging}"
								rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">


								<p:column style="text-align:center;"
									headerText="#{msg.formAction}">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label" update="tableSearch form:deletedMessage"
										action="#{mstProvinceBean.delete(vo.provinceId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>
								</p:column>
								
								

								<p:column headerText="#{msg.formMstProvinceBranchCode}">
									<h:outputLabel value="#{vo.branchCode}" />
								</p:column>

								<p:column headerText="#{msg.formMstProvinceProvince}">
									<h:outputLabel value="#{vo.province}" />
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formMstProvinceConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formMstProvinceDeleteProvince}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formMstProvinceConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>


	</ui:define>
</ui:composition>
