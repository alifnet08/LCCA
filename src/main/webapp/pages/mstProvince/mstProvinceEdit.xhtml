<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
			.ui-widget-content .ui-inputfield {
			    font-weight: normal;
			    height: 38px;
			    margin-left: 200px;
    			margin-top: -37px;
			}
			
			.ui-chips-container {
		     width:100%!important;
		     background-color: rgba(245, 131, 34, 0.25);
		     }
			
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formMstProvinceTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-aboutUs">
					<h:outputText value="#{msg.formMstProvinceAddTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="branchCode"><p:outputLabel
									value="#{msg.formMstProvinceBranchCode}" for="branchCode" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="branchCode" 
									value="#{mstProvinceEditBean.mstProvince.branchCode}"  required="true" 
									requiredMessage="#{msg.formMstProvinceBranchCode} #{msg.validateRequired}"
									autocomplete="off"/>
							<p:message for="branchCode"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="province"><p:outputLabel
									value="#{msg.formMstProvinceProvince}" for="province" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="province" 
									value="#{mstProvinceEditBean.mstProvince.province}"  required="true" 
									requiredMessage="#{msg.formMstProvinceProvince} #{msg.validateRequired}"
									autocomplete="off"/>
							<p:message for="province"/>
						</div>
					</div>
					
				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{mstProvinceEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{mstProvinceEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>

			</div>
		</div>
			
	</ui:define>
</ui:composition>
