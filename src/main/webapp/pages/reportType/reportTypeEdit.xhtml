<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formReportTypeTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:growl id="messages" rendered="true"></p:growl>
	<div class="box box-solid">
      <div class="box-header with-border">
        <h3 class="box-title tl-label" ><h:outputText value="#{msg.formReportTypeAddTitle}" /></h3>
      </div>
      <div class="box-body">
        <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><p:outputLabel value="#{msg.formReportTypeTitle}" for="reportTypeIn"/>&#160;&#160;<span class="label label-warning">
                	<h:outputLabel value="#{msg.indonesia}"/>
                </span></label>
                <p:inputText id="reportTypeIn" maxlength="100" required="true" requiredMessage="#{msg.formReportTypeTitle} #{msg.validateRequired}"
                	autocomplete="off" styleClass="form-control form-required" value="#{reportTypeEditBean.reportType.reportTypeIn}"></p:inputText>
                <p:message for="reportTypeIn"/>
              </div>
            </div>
            <!-- <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><p:outputLabel value="#{msg.formReportTypeTitle}" for="reportTypeEn"/>&#160;&#160;<span class="label label-warning">
                	<h:outputLabel value="#{msg.english}"/>
                </span></label>
                <p:inputText id="reportTypeEn" maxlength="100" required="true" requiredMessage="#{msg.formReportTypeTitle} #{msg.english} #{msg.validateRequired}"
                	autocomplete="off" styleClass="form-control form-required" value="#{reportTypeEditBean.reportType.reportTypeEn}"></p:inputText>
              	<p:message for="reportTypeEn"/>
              </div>
            </div> -->
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><p:outputLabel value="#{msg.formReportTypeDocTypeDesc}" for="reportTypeDesc" /></label>
                <p:inputText id="reportTypeDesc" maxlength="500" required="true" requiredMessage="#{msg.formReportTypeDocTypeDesc} #{msg.validateRequired}"
                	autocomplete="off" styleClass="form-control form-required" value="#{reportTypeEditBean.reportType.reportTypeDescription}"></p:inputText>
              	<p:message for="reportTypeDesc"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label><h:outputText value="#{msg.formReportTypeDueDateType}" /></label>
              <ul class="radio-group-horizontal">
                <li>
                  <label> 
        
                    <input type="checkbox" class="minimal" id="dueDay"  checked="#{reportTypeEditBean.reportType.dueDay!=null &amp;&amp; reportTypeEditBean.reportType.dueDay.equals(reportTypeBean.NO)?'':true}"/>  
                    <span>&nbsp;<h:outputText value="#{msg.formReportTypeDay}" /></span>
                  </label>
                </li>
                <li>
                  <label>
                 	<input type="checkbox" class="minimal" id="dueDate" value="#{reportTypeEditBean.reportType.dueDateBoolean}" checked="#{reportTypeEditBean.reportType.dueDate!=null &amp;&amp; reportTypeEditBean.reportType.dueDate.equals(reportTypeBean.NO)?'':true}"/>
                    <span>&nbsp;<h:outputText value="#{msg.formReportTypeDate}" /></span>
                  </label>
                </li>
                <li>
                  <label>
                  <input type="checkbox" class="minimal" id="dueMonth" value="#{reportTypeEditBean.reportType.dueMonthBoolean}" checked="#{reportTypeEditBean.reportType.dueMonth!=null &amp;&amp; reportTypeEditBean.reportType.dueMonth.equals(reportTypeBean.NO)?'':true}"/>
                    <span>&nbsp;<h:outputText value="#{msg.formReportTypeMonth}" /></span>
                  </label>
                </li>
                <li>
                  <label>
                  <input type="checkbox" class="minimal" id="dueYear" value="#{reportTypeEditBean.reportType.dueYearBoolean}" checked="#{reportTypeEditBean.reportType.dueYear!=null &amp;&amp; reportTypeEditBean.reportType.dueYear.equals(reportTypeBean.NO)?'':true}"/>
                    <span>&nbsp;<h:outputText value="#{msg.formReportTypeYear}" /></span>
                  </label>
                </li>
              </ul>
            </div>
            </div>
            <div class="col-lg-12">
						<div class="col">
							<div class="label-form" style="text-align:left">Tipe Recurring</div>
							<h:selectOneMenu
							style="font-size:13px;font-weight:normal;"
							styleClass="form-control s2"
							value="#{reportTypeEditBean.reportType.recurringType}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
							<f:selectItems value="#{reportTypeEditBean.recurringTypeList}" />
							</h:selectOneMenu>
						</div>
			</div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formReportTypeNumberOfDueDate}" /></label>
                <p:inputText autocomplete="off" styleClass="form-control" value="#{reportTypeEditBean.reportType.numberOfDueDate}"></p:inputText>
              </div>
            </div>
          </div>
      </div>
      <div class="box-footer">
       <p:commandButton value="#{msg.buttonSave}" 
							styleClass="btn btn-primary pull-left"
							onclick="saveOnClick([{name: 'DUE_DAY', value:$('#dueDay').prop('checked')},{name: 'DUE_DATE', value:$('#dueDate').prop('checked')},{name: 'DUE_MONTH', value:$('#dueMonth').prop('checked')},{name: 'DUE_YEAR', value:$('#dueYear').prop('checked')}])"></p:commandButton> 
		<p:remoteCommand  action="#{reportTypeEditBean.save}" name="saveOnClick" update="messages" ></p:remoteCommand>
        <p:commandLink id="btnCancel" value="#{msg.buttonCancel}" actionListener="#{reportTypeEditBean.cancel()}" immediate="true"
							styleClass="btn btn-default pull-right tl-label"></p:commandLink>
      </div>
    </div>
	</ui:define>
</ui:composition>
