<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formReportTypeTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{reportTypeBean.getNavigateEdit()}"
					type="submit" process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">

		<div class="box box-solid">

			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formReportTypeDocTypeName}" /></label>
							<p:inputText id="searchVal" styleClass="form-control"
								autocomplete="off" value="#{reportTypeBean.searchVal}"></p:inputText>

						</div>
					</div>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{reportTypeBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}"
										ajax="true" update="tableSearch form:searchVal"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{reportTypeBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{reportTypeBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{reportTypeBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;width:20%;"
									headerText="#{msg.formAction}">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{reportTypeBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.reportTypeId}" />
									</p:commandLink>
									<h:outputText style=" padding-left:4px; color:grey;'"
										value=" | " />
									<h:outputLabel value="&#160;" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label" update="tableSearch form:deletedMessage"
										action="#{reportTypeBean.delete(vo.reportTypeId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formReportTypeDocTypeName}">
									<h:outputLabel value="#{vo.reportTypeIn}" />
								</p:column>

								<p:column headerText="#{msg.formReportTypeDocTypeDesc}">
									<h:outputLabel value="#{vo.reportTypeDescription}" />
								</p:column>

								<p:column headerText="#{msg.formReportTypeDay}">
									<i
										class="#{vo.dueDay!=null &amp;&amp; vo.dueDay.equals(reportTypeBean.YES) ? 'fa fa-check':''}"></i>
								</p:column>

								<p:column headerText="#{msg.formReportTypeDate}">
									<i
										class="#{vo.dueDate!=null &amp;&amp; vo.dueDate.equals(reportTypeBean.YES) ? 'fa fa-check':''}"></i>
								</p:column>

								<p:column headerText="#{msg.formReportTypeMonth}">
									<i
										class="#{vo.dueMonth!=null &amp;&amp; vo.dueMonth.equals(reportTypeBean.YES) ? 'fa fa-check':''}"></i>
								</p:column>

								<p:column headerText="#{msg.formReportTypeYear}">
									<i
										class="#{vo.dueYear!=null &amp;&amp; vo.dueYear.equals(reportTypeBean.YES) ? 'fa fa-check':''}"></i>
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

	</ui:define>
</ui:composition>
