<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control:not(select) {
			    font-family: 'Montserrat';
			}
			.ui-widget {
			    font-size: 13px;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formExternalRegulationTitle}" />
	</ui:define>

	<ui:define name="content">
		<!-- <p:messages id="messages" /> -->
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formExternalRegulationAddTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label for="jenis_ketentuan" class="control-label tl-label"><p:outputLabel
									value="#{msg.formExternalRegulationProvType}"
									for="externalRegulationProv" /></label>
							<h:selectOneMenu id="externalRegulationProv" required="true"
								requiredMessage="#{msg.formExternalRegulationProvType} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{externalRegulationEditBean.regulation.jenisKetentuan.parameterDtlCode}"
								disabled="true">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationEditBean.provTypes}" />
							</h:selectOneMenu>
							<p:message for="externalRegulationProv"></p:message>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formExternalRegulationRegulationType}"
									for="externalRegulationDoc" /></label>
							<h:selectOneMenu id="externalRegulationDoc" required="true"
								requiredMessage="#{msg.formExternalRegulationDocType} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{externalRegulationEditBean.docTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationEditBean.docTypes}" />
							</h:selectOneMenu>
							<p:message for="externalRegulationDoc" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formExternalRegulationRegulationCategory}"
									for="externalRegulationCat" /></label>
							<h:selectOneMenu id="externalRegulationCat"
								styleClass="form-control s2"
								value="#{externalRegulationEditBean.docCategoryId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{externalRegulationEditBean.docCategories}" />
							</h:selectOneMenu>
							<p:message for="externalRegulationCat" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationRegulationTopic}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{externalRegulationEditBean.docTopicId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationEditBean.docTopics}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formExternalRegulationDocNo}"
									for="externalRegulationDocNo" /></label>
							<p:inputText id="externalRegulationDocNo" required="true"
								requiredMessage="#{msg.formExternalRegulationDocNo} #{msg.validateRequired}"
								styleClass="form-control form-required"
								value="#{externalRegulationEditBean.regulation.documentNo}"
								maxlength="100"
								autocomplete="off"></p:inputText>
							<p:message for="externalRegulationDocNo" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">

							<label class="tl-label"><p:outputLabel
									for="externalRegulationRegTitleIn"
									value="#{msg.formExternalRegulationRegTitle}" /></label>
							<p:inputText id="externalRegulationRegTitleIn" required="true"
								requiredMessage="#{msg.formExternalRegulationRegTitle} #{msg.validateRequired}"
								styleClass="form-control form-required"
								maxlength="300"
								value="#{externalRegulationEditBean.regulation.nameIn}"
								autocomplete="off"></p:inputText>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									for="publishedDate"
									value="#{msg.formExternalRegulationPublishedDate}" /></label>
							<!-- <input type="text" class="form-control date_picker" id="publishedDate" 
                         value="#{externalRegulationEditBean.regulation.publishedDateStr}"/> -->
							<p:calendar required="true" maxlength="11"
								requiredMessage="#{msg.formExternalRegulationPublishedDate} #{msg.validateRequired}"
								styleClass="form-control-datepicker-wrap" id="publishedDate"
								value="#{externalRegulationEditBean.regulation.publishedDate}"
								autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
							</p:calendar>
							<p:message for="publishedDate" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group ">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationEffDate}" /></label>
							<!-- <input type="text" class="form-control date_picker" id="effectiveDate" 
                         value="#{externalRegulationEditBean.regulation.effectiveDateStr}"/> -->
							<p:calendar styleClass="form-control-datepicker-wrap"
								id="effectiveDate" maxlength="11"
								value="#{externalRegulationEditBean.regulation.effectiveDate}"
								autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
							</p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label for="descriptionRegulation" class="control-label tl-label" 
								tl="descriptionRegulation"><h:outputText
									value="#{msg.formExternalRegulationDecriptionRegulation}" /></label>
							<pe:ckEditor id="descriptionRegulation" widgetVar="editorContent" width="100%" required="true"
								requiredMessage="#{msg.formExternalRegulationDecriptionRegulation} #{msg.validateRequired}"
								value="#{externalRegulationEditBean.regulation.descriptionIn}"
								height="300" style="margin-bottom:10px" />
						</div>
					</div>
					<!-- <div class="col-lg-12">
						<div class="form-group ">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationReviewDate}" /></label>
							<input type="text" class="form-control date_picker" id="expiredDate" 
                          value="#{externalRegulationEditBean.regulation.expiredDateStr}"/>
							<p:calendar styleClass="form-control-datepicker-wrap"
								id="expiredDate" maxlength="11"
								value="#{externalRegulationEditBean.regulation.expiredDate}"
								autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
							</p:calendar>
						</div>
					</div> -->
					

					<h3>
						<h:outputText
							value="#{msg.formExternalRegulationAttachmentPeraturan}" />
					</h3>
					<div class="col-lg-12">
						<div class="form-group">
							<p:remoteCommand name="onCompleteUploadPeraturanId"
								update="peraturanIdList"></p:remoteCommand>
							<label class="tl-label">
								<h:outputText
									value="#{msg.formExternalRegulationPeraturanUtuh}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{externalRegulationEditBean.textWarningUpload}"/>
							</label>
							<p:fileUpload
								fileUploadListener="#{externalRegulationEditBean.handleFileUploadPeraturanId}"
								oncomplete="onCompleteUploadPeraturanId()"
								sizeLimit="#{externalRegulationEditBean.maxAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{externalRegulationEditBean.uploadedFilesPeraturanId}"
								emptyMessage=""
								var="vo" id="peraturanIdList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{externalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{externalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_PERATURAN_ID')}"
												update="peraturanIdList">#{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<h:outputText value="#{msg.formExternalRegulationSummary}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{externalRegulationEditBean.textWarningUpload}"/>
							</label>
							<p:remoteCommand name="onCompleteUploadSummary"
								update="summaryList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{externalRegulationEditBean.handleFileUploadSummary}"
								oncomplete="onCompleteUploadSummary()"
								sizeLimit="#{externalRegulationEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{externalRegulationEditBean.uploadedFilesSummary}"
								emptyMessage=""
								var="vo" id="summaryList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{externalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{externalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_SUMMARY')}"
												update="summaryList">#{msg.buttonDelete}</p:commandLink></td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<h:outputText value="#{msg.formExternalRegulationPenjelasan}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{externalRegulationEditBean.textWarningUpload}"/>
							</label>
							<p:remoteCommand name="onCompleteUploadPenjelasan"
								update="peraturanPenjelasanList" process="@this"/>
							<p:fileUpload
								fileUploadListener="#{externalRegulationEditBean.handleFileUploadPenjelasan}"
								oncomplete="onCompleteUploadPenjelasan()"
								sizeLimit="#{externalRegulationEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{externalRegulationEditBean.uploadedFilesPenjelasan}"
								emptyMessage=""
								var="vo" id="peraturanPenjelasanList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{externalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{externalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_PENJELASAN')}"
												update="peraturanPenjelasanList">#{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<h:outputText value="#{msg.formExternalRegulationFAQ}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{externalRegulationEditBean.textWarningUpload}"/>
							</label>
							<p:remoteCommand name="onCompleteUploadFAQ"
								update="peraturanFAQList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{externalRegulationEditBean.handleFileUploadFAQ}"
								oncomplete="onCompleteUploadFAQ()"
								sizeLimit="#{externalRegulationEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{externalRegulationEditBean.uploadedFilesFAQ}" 
								emptyMessage=""
								var="vo"
								id="peraturanFAQList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{externalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{externalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_FAQ')}"
												update="peraturanFAQList">#{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<h:outputText value="#{msg.formExternalRegulationLampiran}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{externalRegulationEditBean.textWarningUpload}"/>
							</label>
							<p:remoteCommand name="onCompleteUploadLampiran"
								update="peraturanLampiranList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{externalRegulationEditBean.handleFileUploadLampiran}"
								oncomplete="onCompleteUploadLampiran()"
								sizeLimit="#{externalRegulationEditBean.maxAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{externalRegulationEditBean.uploadedFilesLampiran}"
								emptyMessage=""
								var="vo" id="peraturanLampiranList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{externalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{externalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_LAMPIRAN')}"
												update="peraturanLampiranList">#{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label">
								<h:outputText value="#{msg.formExternalRegulationMateriSosialisasi}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{externalRegulationEditBean.textWarningUpload}"/>
							</label>
							<p:remoteCommand name="onCompleteUploadMateri"
								update="peraturanMateriList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{externalRegulationEditBean.handleFileUploadMateri}"
								oncomplete="onCompleteUploadMateri()"
								sizeLimit="#{externalRegulationEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{externalRegulationEditBean.uploadedFilesMateri}"
								emptyMessage=""
								var="vo" id="peraturanMateriList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{externalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{externalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_MATERI')}"
												update="peraturanMateriList">#{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>


					<h3>
						<h:outputText value="#{msg.formExternalRegulationRekamJejak}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNew()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRow()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTable" var="data"
									value="#{externalRegulationEditBean.tableModel}"
									selection="#{externalRegulationEditBean.selectedData}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox" >
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />
									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
										
									<p:column headerText="#{msg.formExternalRegulationRekamJejak}"
										style="text-align:center; width:150px;">
										<h:selectOneMenu styleClass="form-control s2"
											value="#{data.trackCode}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems
												value="#{externalRegulationEditBean.trackCodes}" />
											<p:ajax
												listener="#{externalRegulationEditBean.linkRegulationListener}" 
												event="change" 
												update="form:dataTable" 
												/>
										</h:selectOneMenu>
									</p:column>

									<p:column headerText="#{msg.formExternalRegulationRegNo}">
										<table>
											<tr>
												<td style="width: 80%"><h:inputHidden
														id="regulationLinkId" value="#{data.regulationLinkId}"></h:inputHidden>
													<h:inputText id="regulationLinkName" maxlength="300"
														styleClass="form-control temp-no-peraturan"
														value="#{data.regulationLinkName}"
														readonly="#{data.regulationLinkId ne null}" />
												</td>
												<td style="width: 20%"><p:commandLink id="peraturanMagnify"
														onclick="jdlPeraturanDialog.show()">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{externalRegulationEditBean.indexDtl}"
															value="#{statIndex}" />
													</p:commandLink></td>
											</tr>
										</table>
									</p:column>

									<p:column headerText="#{msg.formExternalRegulationKetMencabut}">
										<p:inputText styleClass="form-control" maxlength="1000"
											value="#{data.trackNote}" autocomplete="off" >
											<p:ajax event="change"></p:ajax>
										</p:inputText>
									</p:column>
									
									<p:column headerText="#{msg.formInactive}" style="text-align:center; width:80px;">
										<h:selectBooleanCheckbox value="#{data.inActive}" styleClass="icheckbox_square-grey"
										rendered="#{data.trackCode eq 'RECORD_CHANGE'}" />
									</p:column>

								</p:dataTable>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="box-footer">
				<p:commandButton value="#{msg.buttonSave}"
					styleClass="btn btn-primary pull-left tl-label"
					onclick="saveOnClick([{name: 'PUBLISHED_DATE', value:$('#publishedDate').val()},{name: 'EXPIRED_DATE', value:$('#expiredDate').val()},{name: 'EFFECTIVE_DATE', value:$('#effectiveDate').val()}])"></p:commandButton>
				<p:remoteCommand action="#{externalRegulationEditBean.save}"
					name="saveOnClick" update="msgs" process="@form"></p:remoteCommand>
				<p:remoteCommand action="#{externalRegulationEditBean.onAddNew}"
					name="onAddNew" update="dataTable" process="@this dataTable"></p:remoteCommand>
				<p:remoteCommand action="#{externalRegulationEditBean.onDeleteRow}"
					name="onDeleteRow" update="dataTable" process="@this dataTable"></p:remoteCommand>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{externalRegulationEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label" immediate="true"></h:commandLink>

			</div>
		</div>


		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formTmpRmdApprovalHistory}" />
				</h3>
			</div>

			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="table-wrapper table-responsive">
							<p:dataTable id="tableApproval" var="vo"
								value="#{externalRegulationEditBean.regulation.regulationApprovals}"
								rowIndexVar="statIndex" style="width:100%;">

								<p:column headerText="#{msg.formTmpRmdApprovalBy}"
									style="width:200px;">
									<div class="form-group">
										<div class="input-group">
											<h:outputLabel value="#{vo.user.name}" />
										</div>
									</div>
								</p:column>
								<p:column headerText="#{msg.formTmpRmdApprovalStatus}"
									style="width:200px; text-align:center;">
									<h:outputLabel
										rendered="#{vo.approvalStatus.parameterDtlCode eq 'STATUS_APPROVED'}">
										<span class="label label-success"><h:outputLabel
												value="#{msg.formApprove}" /></span>
									</h:outputLabel>
									<h:outputLabel
										rendered="#{vo.approvalStatus.parameterDtlCode eq 'STATUS_REVISE'}">
										<span class="label label-danger"><h:outputLabel
												value="#{msg.formRevisi}" /></span>
									</h:outputLabel>
								</p:column>
								<p:column headerText="#{msg.formTmpRmdApprovalDate}"
									style="width:200px; text-align:center;">									
									<h:outputText value="#{vo.approvalDate}" style="text-align:center" >
										<f:convertDateTime
											pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
