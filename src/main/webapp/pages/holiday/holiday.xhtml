<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formHolidayTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink action="#{holidayBean.getNavigateEdit()}"
					type="submit" process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">

		<div class="box box-solid">

			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formHolidayName}" /></label>
							<p:inputText id="searchVal" styleClass="form-control"
								autocomplete="off" value="#{holidayBean.searchVal}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="tableSearch"
										styleClass="btn btn-success tl-label"
										actionListener="#{holidayBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="tableSearch form:searchVal"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{holidayBean.reset}"></p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{holidayBean.tableModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{holidayBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;width:20%;"
									headerText="#{msg.formAction}">

									<h:outputLabel value="&#160;" />
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{holidayBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.holidayId}" />
									</p:commandLink>
									<h:outputText style=" padding-left:4px; color:grey;'"
										value=" | " />
									<h:outputLabel value="&#160;" />
									<p:commandLink id="Delete" value="#{msg.buttonDelete}"
										styleClass="tl-label" update="tableSearch form:deletedMessage"
										action="#{holidayBean.delete(vo.holidayId)}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formHolidayName}">
									<h:outputLabel value="#{vo.holidayName}" />
								</p:column>

								<p:column headerText="#{msg.formHolidayDate}">
									<h:outputText value="#{vo.holidayDateFrom}">
										<f:convertDateTime pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputText>
									-
									<h:outputText value="#{vo.holidayDateTo}">
										<f:convertDateTime pattern="dd-MMM-yyyy" locale="en" >
										</f:convertDateTime>
									</h:outputText>

									
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

	</ui:define>
</ui:composition>
