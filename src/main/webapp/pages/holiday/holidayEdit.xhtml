<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formHolidayTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<div class="box box-solid">
      <div class="box-header with-border">
        <h3 class="box-title tl-label" ><h:outputText value="#{msg.formHolidayAddTitle}" /></h3>
      </div>
      <div class="box-body">
        <div class="row">
			<p:growl id="messages" rendered="true"/>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><p:outputLabel value="#{msg.formHolidayName}" for="holidayName" /></label>
                   <p:inputText id="holidayName" maxlength="100" required="true" requiredMessage="#{msg.formHolidayName} #{msg.validateRequired}"
                   		styleClass="form-control form-required" value="#{holidayEditBean.holiday.holidayName}" 
                	      autocomplete="off">
                   </p:inputText>
                   <p:message for="holidayName"/>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formHolidayDate}" /></label>
                <div class="input-group">
                 
                 	<p:calendar styleClass="form-control-datepicker-wrap"
							value="#{holidayEditBean.holiday.holidayDateFrom}" autocomplete="off"
							pattern="dd-MMM-yyyy" locale="en">
						<p:ajax event="dateSelect" listener="#{holidayEditBean.handleDateFromSelect}" update="dateTo" />
				    </p:calendar>
                  <span class="input-group-addon plain">
                  	<h:outputText value=" - "/>
                  </span>
                 
                   <p:calendar styleClass="form-control-datepicker-wrap" id="dateTo"
							value="#{holidayEditBean.holiday.holidayDateTo}" autocomplete="off"
							pattern="dd-MMM-yyyy" locale="en">
				    </p:calendar>
                </div>
              </div>
            </div>
          </div>
      </div>
      <div class="box-footer">
      	<p:commandButton value="#{msg.buttonSave}"
					actionListener="#{holidayEditBean.save()}"
					styleClass="btn btn-primary pull-left tl-label" update="messages"></p:commandButton>
					
		
		<p:remoteCommand name="saveOnClick" process="@form"></p:remoteCommand>
        <h:commandLink value="#{msg.buttonCancel}" actionListener="#{holidayEditBean.cancel()}" immediate="true"
							styleClass="btn btn-default pull-right tl-label"></h:commandLink>
      </div>
    </div>
	</ui:define>
	
</ui:composition>
