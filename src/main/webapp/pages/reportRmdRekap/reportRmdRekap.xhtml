<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formReportRmdRekapTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="message" rendered="true" />
		
		<div class="box box-solid">
			<div class="box-body">
			
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="col-lg-4">
							<div class="form-group">
								<label><h:outputText
										value="#{msg.formReportRmdRekapCreationDate}" /></label>
								<div class="input-group">
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										required="true"
										requiredMessage="#{msg.formReportRmdRekapCreationDate} #{msg.from} #{msg.validateRequired}"
										value="#{reportRmdRekapBean.searchDateFrom}"
										autocomplete="off"
										pattern="#{reportRmdRekapBean.inputDateFormat}"
										locale="#{reportRmdRekapBean.inputDateLocale}"></p:calendar>
									<span class="input-group-addon plain">-</span>
		
									<p:calendar styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										required="true"
										requiredMessage="#{msg.formReportRmdRekapCreationDate} #{msg.to} #{msg.validateRequired}"
										value="#{reportRmdRekapBean.searchDateTo}"
										autocomplete="off"
										pattern="#{reportRmdRekapBean.inputDateFormat}"
										locale="#{reportRmdRekapBean.inputDateLocale}"></p:calendar>
								</div>
							</div>
						</div>
						
						<div class="col-lg-3">
							<h:panelGroup id="panelProvType">
								<div class="form-group">
									<label class="tl-label" tl=""><h:outputText
											value="#{msg.formReportRmdRekapProvType}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{reportRmdRekapBean.searchProvType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{reportRmdRekapBean.provTypes}" />
									<p:ajax event="change"
											update="form:panelDocType"
											listener="#{reportRmdRekapBean.onChangeProvType}" />
									</h:selectOneMenu>	
								</div>
							</h:panelGroup>
						</div>
						
						<div class="col-lg-3">
							<h:panelGroup id="panelDocType">
								<div class="form-group">
									<label class="tl-label size-font" tl="document-type"><h:outputText
											value="#{msg.formReportRmdRekapDocType}" /></label>
									<h:selectOneMenu id="docType" styleClass="form-control s2"
										value="#{reportRmdRekapBean.searchDocType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{reportRmdRekapBean.docTypes}" />
									</h:selectOneMenu>
								</div>
							</h:panelGroup>
						</div>
						
						<div class="col-lg-2">
							<h:panelGroup id="panelSenderType">
								<div class="form-group">
									<label class="tl-label size-font" tl="document-type"><h:outputText
											value="#{msg.formReportRmdRekapSender}" /></label>
									<h:selectOneMenu id="senderType" styleClass="form-control s2"
										value="#{reportRmdRekapBean.searchSenderType}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{reportRmdRekapBean.senderTypes}" />
									</h:selectOneMenu>
								</div>
							</h:panelGroup>
						</div>
						
					</h:panelGroup>
				</div>
				
				<div class="row">
				
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonPrint}"
										ajax="true" update="reportRmdRekap panelSearch message"
										styleClass="btn btn-success tl-label"
										oncomplete="reInitSelect2();"
										actionListener="#{reportRmdRekapBean.generateExcelInBackgroundJob}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}"
										ajax="true" update="panelSearch"
										oncomplete="reInitSelect2();"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{reportRmdRekapBean.reset}"></p:commandButton></li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<li><p:commandButton value="#{msg.buttonRefresh}"
										ajax="true" update="reportRmdRekap"
										immediate="true"
										styleClass="btn btn-success tl-label"
										actionListener="#{reportRmdRekapBean.search}"></p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonDelete}"
										ajax="true" update="reportRmdRekap"
										process="@this"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{reportRmdRekapBean.delete}">
										<p:confirm header="Konfirmasi" message="#{msg.formDeleteMessage}" icon="pi pi-exclamation-triangle" />	
									</p:commandButton></li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="table-responsive">
						
							<p:dataTable id="reportRmdRekap" paginator="true" var="vo"
								value="#{reportRmdRekapBean.tableModel}" dynamic="true"
								lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{reportRmdRekapBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								selection="#{reportRmdRekapBean.selectedReportGen}"
								rowKey="#{vo.reportGenId}" rowSelectMode="checkbox"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
							
								<p:ajax event="rowSelectCheckbox" process="@this" />
								<p:ajax event="rowUnselectCheckbox" process="@this" />
								<p:ajax event="toggleSelect" process="@this" />
								
								<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
								
								<p:column  width="90"
										headerText="#{msg.formReportGenReportId}">
									<h:outputLabel value="#{vo.reportGenId}"
										title="#{vo.reportGenId}" />
								</p:column>
								
								<p:column
									headerText="#{msg.formReportGenReportName}">
									<h:outputLabel value="#{vo.reportGenReportName}"
										title="#{vo.reportGenReportName}" />
								</p:column>
	
								<p:column
									headerText="#{msg.formReportGenReportExecuteDate}" style="text-align:center;">
									<h:outputLabel value="#{vo.creationDate}" title="#{vo.creationDate}" />
								</p:column>
	
								<p:column width="100"
									headerText="#{msg.formReportGenReportStatus}" style="text-align:center;">
									<h:outputText styleClass="label label-warning"
										value="#{vo.reportGenStatus}" title="#{vo.reportGenStatus}"></h:outputText>
								</p:column>
								
								<p:column style="text-align:center;" headerText="#{msg.textAction}">
									<p:outputPanel rendered="#{vo.statusIsCompleted}">
										<p:commandLink ajax="false" value="#{msg.textDownload}"
											immediate="true"
											actionListener="#{reportRmdRekapBean.downloadFile(
												vo.reportGenFileId, 
												vo.reportGenReportFileName,
												null
											)}"
											target="_blank"/>
									</p:outputPanel>
								</p:column>
								
							</p:dataTable>
							
						</div>
					</div>
					
				</div>
				
			</div>
		</div>
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
	</ui:define>
</ui:composition>
