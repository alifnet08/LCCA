<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">

		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">

			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">FAQ</a></li>

				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Frequently Asked
				Questions</div>
			<div style="font-size: 14px; color: #7D7D7D;">Tidak menemukan
				jawaban? Hubungi kami di 021-123456789 atau faq@maybank.co.id</div>
			<h:form styleClass="form-group has-search my-2 my-lg-5">
				<p:remoteCommand name="onSearch" process="@this dataList"
					update="dataList" action="#{faqFEBean.search()}"></p:remoteCommand>

				<div class="col-12 search-bar">
					<input id="searchVal" class="form-control cari-input"
						style="height: 60px;" type="search" value="#{faqFEBean.searchVal}"
						placeholder="CARI FAQ . . ." aria-label="Search" />
					<div class="input-group-append">
						<i
							class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
							onclick="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
					</div>
				</div>
			</h:form>
			<div id="accordion">

				<h:panelGroup id="dataList">
					<ui:repeat value="#{faqFEBean.institutionVO}" var="ins" varStatus="statusIns">
						<div class="card">
							<div class="card-header" style="">
								<a
									class="collapsed card-link d-flex justify-content-between align-items-center"
									data-toggle="collapse" href="#{faqFEBean.id}collapseThree-#{statusIns.index}">
									#{ins.institution} <i class="align-middle fa fa-chevron-down"></i>
								</a>
							</div>
							<div id="collapseThree-#{statusIns.index}" class="collapse" data-parent="#accordion"
								style="">
								<div class="card-body">


									<ui:repeat value="#{ins.categoryFaq}" var="vo" varStatus="statusCategory">

										<div class="card-header" style="">
											<a
												class="collapsed card-link d-flex justify-content-between align-items-center"
												data-toggle="collapse" href="#{faqFEBean.id}collapseThree-#{statusIns.index}-#{statusCategory.index}">
												#{vo.faqCategory} <i class="align-middle fa fa-chevron-down"></i>
											</a>
										</div>
										<div id="collapseThree-#{statusIns.index}-#{statusCategory.index}" class="collapse"
											data-parent="#{faqFEBean.id}collapseThree-#{statusIns.index}" style="">
											<div class="card-body">

												<ui:repeat value="#{vo.listFaq}" var="faq" varStatus="statusFaq">
													<div class="card">
														<div class="card-header">
															<a class="collapsed card-link" data-toggle="collapse"
																href="#{faqFEBean.id}collapseThree-#{statusIns.index}-#{statusCategory.index}-#{statusFaq.index}"> <i
																class="align-middle fa fa-plus"></i> #{faq.questionIn}
															</a>

														</div>
														<div id="collapseThree-#{statusIns.index}-#{statusCategory.index}-#{statusFaq.index}" class="collapse"
															data-parent="#{faqFEBean.id}collapseThree-#{statusIns.index}-#{statusCategory.index}">
															<div class="card-body">#{faq.answerIn}</div>
														</div>
													</div>
												</ui:repeat>

											</div>
										</div>

									</ui:repeat>
								</div>
							</div>
						</div>
					</ui:repeat>
				</h:panelGroup>



			</div>
		</div>



	</ui:define>
</ui:composition>
