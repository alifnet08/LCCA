<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">
		
		<style>
			.ui-inputtextarea-resizable{
				width: 100%;
			}
			.ui-inputfield {
				-webkit-box-shadow: none;
				box-shadow: none;
			}
			.ui-datalist-data {
				list-style-type: none;
			}
			li.ui-datalist-item.even {
			    text-align: right;
			    background-color: #f1f1f1;
			    font-family: Lato;
			    font-size: 14.4px;
			    color: #7D7D7D !important;
			}
			li.ui-datalist-item.odd {
			    text-align: left;
			    background-color: #ebf3fe;
			    font-family: Lato;
			    font-size: 14.4px;
			    color: #7D7D7D !important;
			}
			.card-body{
				color: #7D7D7D !important;
			    font-size: 14.4px;
			    font-family: Lato;
			    font-weight: initial;
		    }
		</style>
		
		<script>
			function remove(){
				$('#form\\:j_idt31_toolbar').remove();
			}
			
			function showing(){
				document.getElementById("form:komentar").style.display = "block";
				document.getElementById("form:komentar").style.width = "100%";
				document.getElementById("form:btnKomentar").style.display = "initial";
				document.getElementById("line").style.display = "block";
			}
		</script>
		
		<div class="row brdcrumb">
			 <nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			 	<div class=" navbar-collapse " id="collapsibleNavbar">
			 		<ul class="navbar-nav">
			 			<li class="nav-item">
			 				<a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
			 				<a class="nav-link"><i class="fa fa-sm fa-bold fa-chevron-right" style="margin-top:-5px;color: #FFC600;"></i></a>
			 				<a class="nav-link" href="#">Group Discussion</a>
			 				<a class="nav-link"><i class="fa fa-sm fa-bold fa-chevron-right" style="margin-top:-5px;color: #FFC600;"></i></a>
			 				<a class="nav-link disabled" href="#">#{discussionFEEditBean.discussion.threadNameIn}</a>
			 			</li>
			 		</ul>
			 	</div>
			 </nav>
		</div>
		
		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">#{discussionFEEditBean.discussion.threadNameIn}</div>
			<h:form class="internal-form" style="margin-top:20px;" id="form">
				<p:growl id="messages" />

				<div class="form-row">
					<div class="col">
						<div class="value-form card">
							<p:textEditor
								value="#{discussionFEEditBean.discussion.threadContentIn}"
								styleClass="card-body" readonly="true" toolbarVisible="false" />
							<div class="col card-footer" style="display: inline-flex;">
								<p:rating value="#{discussionFEEditBean.rating}" cancel="false" />
								<div>
									<button id="komentari" type="button"
										style="border: none; background-color: transparent;
											font-family: Lato;font-size: 14.4px;color: #373737;"
										onclick="showing()">Komentari</button>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="form-row">
					
				</div>
				
				<div class="form-row">
					<div class="col">
						<p:dataList value="#{discussionFEEditBean.discussionPostLists}" var="vo" 
							rowIndexVar="statIndex" itemStyleClass="#{statIndex%2 == 1 ? 'odd' : 'even'}" >
							<p:column style="list-style-type: none;">
								<div class="postComment" style="text-align:left;">
									<h:outputLabel value="#{vo.postedComment}"/>								
								</div>
								<br />
								<h:outputLabel value="#{vo.time} lalu oleh #{vo.postedByName}" 
									style="font-size: 12.8px;margin-top: 15px;margin-bottom: 0px;"/>
							</p:column>
						</p:dataList>
					</div>
				</div>
		
				<div class="form-row">
					<div class="col">
						<hr id="line" style="display: none;"/>
						<p:inputTextarea id="komentar" autoResize="false" value="#{discussionFEEditBean.komentar}" style="display:none;"
							placeholder="Tulis Komentar anda di sini..."/>
					</div>
				</div>
				
				<div class="form-row">
					<div class="col">
						<p:remoteCommand action="#{discussionFEEditBean.cancel}"
							name="cancel" immediate="true"></p:remoteCommand>
						<p:commandButton id="btnKomentar" value="Komentar" type="submit"
							styleClass="btn btn-mb-secondary" style="display:none;"
							actionListener="#{discussionFEEditBean.save()}"/>
						<button type="button" class="btn btn-outline-secondary"
							onclick="window.history.back();">Kembali</button>
					</div>
				</div>
				
			</h:form>
		</div>
		
	</ui:define>
</ui:composition>
