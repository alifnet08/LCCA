<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formUserTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:messages id="messages" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-user">
					<h:outputText value="#{msg.formUserTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="name"><h:outputText
									value="#{msg.formUserName}" /></label>
							<p:inputText styleClass="form-control"
								value="#{userEditBean.user.name}" disabled="true"></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="username"><h:outputText
									value="#{msg.formUserUsername}" /></label>
							<p:inputText styleClass="form-control"
								value="#{userEditBean.user.nik}" disabled="true"></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="email"><h:outputText
									value="#{msg.formUserEmail}" />&#160;&#160;</label>
							<p:inputText styleClass="form-control"
								value="#{userEditBean.user.email}" disabled="true"></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="role" class="control-label tl-label" tl="role-list"><h:outputText
									value="#{msg.formUserRole}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{userEditBean.user.responsibilityId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{userEditBean.roleList}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="status" class="control-label tl-label"
								tl="status-list"><h:outputText
									value="#{msg.formUserStatus}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{userEditBean.user.status}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{userEditBean.statusList}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="divisionName"><h:outputText
									value="#{msg.formUserDivisionName}" /></label>
							<p:inputText styleClass="form-control"
								value="#{userEditBean.user.divisionName}" disabled="true"></p:inputText>
						</div>
					</div>
				</div>
			</div>
			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{userEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{userEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>
	</ui:define>
</ui:composition>
