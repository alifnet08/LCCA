<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">
	<script type="text/javascript">
		//<![CDATA[
			function isNumeric (evt) {
					var theEvent = evt || window.event;
					var key = theEvent.keyCode || theEvent.which;
					key = String.fromCharCode (key);
					var regex = /[0-9]|\./;
					if ( !regex.test(key) ) {
					  theEvent.returnValue = false;
					  if(theEvent.preventDefault)
						  theEvent.preventDefault();
					}
				}
			//]]>
	</script>

		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">PERATURAN EKSTERNAL</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Peraturan Eksternal</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			
			<h:form styleClass="wo-search-form">
				<p:remoteCommand name="onSearch" process="@this dataList searchVal searchTipe searchStatus searchTahun"
					update="dataList" action="#{externalRegulationFEBean.search()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onClickPage" process="@this dataList searchVal searchTipe searchStatus searchTahun"
					update="dataList"
					action="#{externalRegulationFEBean.searchDataPrevNext()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onPrev" process="@this dataList searchVal searchTipe searchStatus searchTahun"
					update="dataList" action="#{externalRegulationFEBean.prev()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onNext" process="@this dataList searchVal searchTipe searchStatus searchTahun"
					update="dataList" action="#{externalRegulationFEBean.next()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<h:inputHidden id="pageSelected"
					value="#{externalRegulationFEBean.first}"></h:inputHidden>
				<h:inputHidden id="totalPage"
					value="#{externalRegulationFEBean.totalPage}"></h:inputHidden>
				<div class="form-row">
	            <div class="col-md-6 form-group">
	              <div class="label-form">Tipe Peraturan</div>
							<p:selectOneMenu styleClass="form-control s2" id="searchTipe" widgetVar="selectTipePeraturan"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"
								value="#{externalRegulationFEBean.docType}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationFEBean.tipePeraturanList}" />
							</p:selectOneMenu>
			    </div>
	            <div class="col-md-6 form-group">
	            <div class="label-form">Status</div>
							<p:selectOneMenu styleClass="form-control s2" id="searchStatus" widgetVar="selectStatus"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"
								value="#{externalRegulationFEBean.searchStatus}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationFEBean.statusList}" />
							</p:selectOneMenu>
				</div>
				</div>
				<div class="form-row">
					<div class="col-4 has-search form-group">
						<p:inputText widgetVar="searchTahun" id="searchTahun" styleClass="form-control cari-input"  value="#{externalRegulationFEBean.searchTahun}"
							placeholder="CARI TAHUN . . ." onkeypress="return isNumeric(event)" maxlength="4"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])" />
					</div>
					<div class="col-8 has-search form-group">
						<!-- <input  id="searchVal" class="form-control cari-input" type="search"
							placeholder="CARI PERATURAN EKSTERNAL . . ." aria-label="Search" /> -->
						<p:inputText widgetVar="searchVal" id="searchVal" styleClass="form-control cari-input"  value="#{externalRegulationFEBean.searchVal}"
							placeholder="CARI PERATURAN EKSTERNAL . . ." aria-label="Search"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></p:inputText>
						<div class="input-group-append">
							<i
								class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
								onclick="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></i>
						</div>
					</div>
				</div>
			</h:form>

			<h:panelGroup id="dataList">
				<h:form>
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableInternal">
							<tbody>
								<ui:repeat value="#{externalRegulationFEBean.listData}" var="vo">
									<tr class="#{vo.isAccess == 0? 'unread':''}">
										<td class="col-9"><p:link 
												outcome="#{externalRegulationFEBean.getNavigateEdit()}"
												type="submit" ajax="false">
												<f:param name="first" value="#{externalRegulationFEBean.firstTemp}" />
												<f:param name="token" value="#{externalRegulationFEBean.toEncrypt(vo.regulationId)}" /> <span
												class="td-header #{vo.status eq 'DATA_INACTIVE'?'obsolete':''}  text-mb-secondary">#{vo.docNo}
													- #{vo.nameIn}</span><br /> <span class="td-detail text-mb-g4">Tanggal
													berlaku : #{vo.effectiveDate}</span>
										</p:link></td>
										<td class="col-2"><p:graphicImage
												value="/resources/images/obsolete.svg"
												style="#{vo.status eq 'DATA_INACTIVE'?'':'display:none'}" /></td>
										<td class="col-1"><p:link title="Lihat"
												outcome="#{externalRegulationFEBean.getNavigateEdit()}"
												type="submit" ajax="false" styleClass="text-mb-g5">
												<f:param name="first" value="#{externalRegulationFEBean.firstTemp}" />
												<f:param name="token" value="#{externalRegulationFEBean.toEncrypt(vo.regulationId)}" />
												<i class="fas fa-external-link-alt"></i>
											</p:link></td>
									</tr>
								</ui:repeat>
								<tr style="#{(externalRegulationFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td>#{msg.textNodata}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(externalRegulationFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{externalRegulationFEBean.totalPageList}"
						var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'#{row-1}'}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>

		</div>

	</ui:define>
</ui:composition>
