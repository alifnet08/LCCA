
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">

		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">NOTIFIKASI</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">NOTIFIKASI</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Notifikasi</div>
			Sejak kunjungan terakhir, Anda <h:outputText value="memiliki:" rendered="#{headerFrontEndBean.showDataNotif ne '' and headerFrontEndBean.showDataNotif ne null}" /><h:outputText value="tidak memiliki notifikasi" rendered="#{headerFrontEndBean.showDataNotif eq '' or headerFrontEndBean.showDataNotif eq null}" />
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<h:panelGroup id="dataList">
				<h:form>
					<p:remoteCommand name="onSearch" process="@this dataList"
						update="dataList" action="#{headerFrontEndBean.search()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onClickPage" process="@this dataList"
						update="dataList"
						action="#{headerFrontEndBean.searchDataPrevNext()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onPrev" process="@this dataList"
						update="dataList" action="#{headerFrontEndBean.prev()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onNext" process="@this dataList"
						update="dataList" action="#{headerFrontEndBean.next()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<h:inputHidden id="pageSelected"
						value="#{headerFrontEndBean.first}"></h:inputHidden>
					<h:inputHidden id="totalPage"
						value="#{headerFrontEndBean.totalPage}"></h:inputHidden>
						
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableInternal">
							<tbody>
								<ui:repeat value="#{headerFrontEndBean.listData}" var="vo">
									<tr style="#{vo.count > 0 ? '' : 'display:none' }">
										<td class="col-9"><p:link 
												outcome="#{vo.getLink()}"
												type="submit" ajax="false">
												<span class="td-header text-mb-secondary">#{vo.count}
													- #{vo.text}</span><br /> <span class="td-detail text-mb-g4">Terakhir
													update : #{vo.maxDate}</span>
										</p:link></td>
										<td class="col-1"><p:link
												outcome="#{vo.getLink()}"
												type="submit" ajax="false" styleClass="text-mb-g5">
												<i class="fas fa-external-link-alt"></i>
											</p:link></td>
									</tr>
								</ui:repeat>
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(headerFrontEndBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{headerFrontEndBean.totalPageList}"
						var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'#{row-1}'}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext([{name: 'SEARCH_VAL', value:$('#searchVal').val()}])"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>

		</div>

	</ui:define>
</ui:composition>
