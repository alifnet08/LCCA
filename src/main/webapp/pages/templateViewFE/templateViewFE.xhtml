<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">

		<style>
.ui-widget {
	font-family: lato;
}
</style>

		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a>
						<a class="nav-link disabled" href="#">TEMPLATE</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Template</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<h:form styleClass="wo-search-form">
				<p:remoteCommand name="onSearch" process="@this dataList"
					update="dataList" action="#{templateViewFEBean.search()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onClickPage" process="@this dataList"
					update="dataList"
					action="#{templateViewFEBean.searchDataPrevNext()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onPrev" process="@this dataList"
					update="dataList" action="#{templateViewFEBean.prev()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onNext" process="@this dataList"
					update="dataList" action="#{templateViewFEBean.next()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<h:inputHidden id="pageSelected" value="#{templateViewFEBean.first}"></h:inputHidden>
				<h:inputHidden id="totalPage"
					value="#{templateViewFEBean.totalPage}"></h:inputHidden>

				<div class="form-row">
					<div class="col-md-6 form-group">
						<p:selectOneMenu id="searchStatus" widgetVar="selectStatus"
						onchange="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'0'},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])"
							styleClass="form-control"
							value="#{templateViewFEBean.searchStatus}">
							<f:selectItem itemLabel="Pilih" itemValue="" />
							<f:selectItems value="#{templateViewFEBean.templateCatLists}" />
						</p:selectOneMenu>
					</div>
	
					<div class="col-md-6 form-group">
						<input id="searchVal" class="form-control cari-input" type="search"
							placeholder="CARI TEMPLATE . . ." aria-label="Search"
							onchange="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'0'},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])" />
						<div class="input-group-append">
							<i
								class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
								onclick="onSearch([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'0'},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])" />
						</div>
					</div>
				</div>
			</h:form>

			<h:panelGroup id="dataList">
				<h:form>
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableInternal">
							<tbody>
								<ui:repeat value="#{templateViewFEBean.listData}" var="vo">
									<tr>
										<td class="col-9">
										<p:link 
												outcome="#{templateViewFEBean.getNavigateEdit()}"
												type="submit" ajax="false" styleClass="text-mb-g5">
												<f:param name="first" value="#{templateViewFEBean.firstTemp}" />
												<f:param name="token" value="#{templateViewFEBean.toEncrypt(vo.templateId)}" /> <span
												class="td-header text-mb-secondary">#{vo.perihalIn}</span> <br />
												<span class="td-detail text-mb-g4">#{vo.templateCategoryIn}</span>
												<i class="fa fa-sm fa-bold fa-chevron-right"
												style="margin-top: -5px; color: #FFC600;"></i> <span
												class="td-detail text-mb-g4">#{vo.templateSubCategoryIn}</span>
										</p:link>
										</td>
										<td class="col-3"><p:link title="Lihat"
												outcome="#{templateViewFEBean.getNavigateEdit()}"
												type="submit" ajax="false" styleClass="text-mb-g5">
												<f:param name="first" value="#{templateViewFEBean.firstTemp}" />
												<f:param name="token" value="#{templateViewFEBean.toEncrypt(vo.templateId)}" />
												<i class="fas fa-external-link-alt"></i>
										</p:link></td>
									</tr>
								</ui:repeat>
								<tr style="#{(templateViewFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td>#{msg.textNodata}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(templateViewFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{templateViewFEBean.totalPageList}"
						var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'PAGE_SELECTED', value:'#{row-1}'},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext([{name: 'SEARCH_VAL', value:$('#searchVal').val()},{name: 'SEARCH_STATUS', value:PF('selectStatus').getSelectedValue()}])"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>
		</div>

	</ui:define>
</ui:composition>
