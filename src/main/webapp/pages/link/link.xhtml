<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-widget {
			    font-size: inherit;
			}
			.ui-state-default.form-control {
				background: #F7F8F8;
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="Link Management" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink type="submit"
					process="@this" ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"> <h:outputText
									value="Link Management" />
							</label>
							<p:inputText id="searchVal" styleClass="form-control">
							</p:inputText>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><p:commandButton value="#{msg.buttonSearch}"
										ajax="true"
										styleClass="btn btn-success tl-label">
									</p:commandButton></li>
								<li><p:commandButton value="#{msg.buttonReset}" 
										ajax="true"
										styleClass="btn btn-default btn-flat tl-label">
									</p:commandButton></li>
							</ul>
						</div>
					</div>

					<div class="col-lg-12">&nbsp;</div>

					<div class="col-lg-12">
						<div class="table-responsive">
							<table class="table table-striped table-hover">
              <tbody>
                <tr>
                  <th class="tl-label" tl="action">Action</th>
                  <th class="tl-label" tl="">Nama Situs</th>
				  <th class="tl-label" tl="">Link Situs</th>
                </tr>
                                    <tr>
                      <td class="text-center">
                        <a href="ml-document-type-form.html" class="tl-label" tl="edit">Edit</a> | 
                        <a href="#" data-toggle="modal" data-target="#confirmDelete" class="tl-label" tl="delete">Delete</a>
                      </td>
                      <td class="tl-content">TechInAsia</td>
                      <td class="tl-content">https://id.techinasia.com/</td>
                    </tr>
					<tr>
                      <td class="text-center">
                        <a href="ml-document-type-form.html" class="tl-label" tl="edit">Edit</a> | 
                        <a href="#" data-toggle="modal" data-target="#confirmDelete" class="tl-label" tl="delete">Delete</a>
                      </td>
                      <td class="tl-content">Detik</td>
                      <td class="tl-content">https://www.detik.com/</td>
                    </tr>
                                    
                              </tbody>
            </table>
						</div>
					</div>

				</div>
			</div>
		</div>

		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>

		<div class="modal fade modal-danger" id="confirmDelete" role="dialog"
			aria-labelledby="confirmDeleteLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
						<h4 class="modal-title">
							<h:outputText value="#{msg.formParameterConfirmDelete}" />
						</h4>
					</div>
					<div class="modal-body">
						<p>
							<h:outputText value="#{msg.formParameterDelete}" />
						</p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-outline pull-left btn-flat" type="button"
							data-dismiss="modal">
							<i class="fa fa-fw fa-close" aria-hidden="true"></i>
							<h:outputText value="#{msg.buttonCancel}" />
						</button>
						<button class="btn btn-danger pull-right btn-flat" type="button"
							id="confirm">
							<i class="fa fa-fw fa-trash-o" aria-hidden="true"></i>
							<h:outputText value="#{msg.formParameterConfirmDelete}" />
						</button>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

</ui:composition>
