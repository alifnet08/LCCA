<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formMenuTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:messages id="messages" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-menu">
					<h:outputText value="#{msg.formMenuTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="nameIn"> <h:outputText
									value="#{msg.formMenuMenuName}" />
							</label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.nameIn}" ></p:inputText>
						</div>
					</div>
					<!-- <div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="nameEn"><h:outputText
									value="#{msg.formMenuMenuName}" />&#160;&#160;<span
								class="label label-warning">EN</span></label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.nameEn}" ></p:inputText>
						</div>
					</div> -->
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="action"><h:outputText
									value="#{msg.formMenuAction}" />&#160;&#160;</label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.action}" disabled="true"></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="description"><h:outputText
									value="#{msg.formMenuDescription}" />&#160;&#160;</label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.description}" ></p:inputText>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="fontawesome"><h:outputText
									value="#{msg.formMenuFontawesome}" />&#160;&#160;</label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.fontawesome}" ></p:inputText>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label for="status" class="control-label tl-label"
								tl="status-list"><h:outputText
									value="#{msg.formMenuParentMenu}" /></label>
							<h:selectOneMenu styleClass="form-control s2 "
								value="#{menuEditBean.menu.parentId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{menuEditBean.parentList}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="menuOrder"><h:outputText
									value="#{msg.formMenuMenuOrder}" /></label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.menuOrder}" ></p:inputText>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="menuLevel"><h:outputText
									value="#{msg.formMenuMenuLevel}" /></label>
							<p:inputText styleClass="form-control"
								value="#{menuEditBean.menu.menuLevel}" disabled="true"></p:inputText>
						</div>
					</div>
				</div>
			</div>
			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{menuEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{menuEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>
	</ui:define>
</ui:composition>
