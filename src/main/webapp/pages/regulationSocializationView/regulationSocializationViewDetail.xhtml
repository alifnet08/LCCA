<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<f:event listener="#{regulationSocializationViewDetailBean.redirectCurrentPage}" type="preRenderView" />
	<ui:define name="head">
		<style>
				.form-control[readonly] {;
					font-family: 'Montserrat';
					color: #444444;
				    margin: -4px 0px 0px;
				}
				.form-control-datepicker-wrap input.hasDatepicker {
				    font-family: 'Montserrat';
				}
				.ui-inputfield, .ui-widget-content .ui-inputfield{
			    	box-shadow: none;
				}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formRegulationSocializationViewTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:messages id="messages" />
	<p:growl id="msgs"  rendered="true"/>
	<div class="box box-solid">
      <div class="box-body">
        <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                <label for="jenis_ketentuan" class="control-label tl-label" ><h:outputText value="#{msg.formRegulationSocializationApprovalProvType}" /></label>
                <h:selectOneMenu styleClass="form-control s2" value="#{regulationSocializationViewDetailBean.socializationTrc.jenisKetentuan.parameterDtlCode}" disabled="true">
                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
			    <f:selectItems value="#{regulationSocializationViewDetailBean.provTypes}" />
                </h:selectOneMenu>
              </div>
            </div>
            
         
            <h3><h:outputText value="#{msg.formRegulationSocializationApprovalRegTitle}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  <h4 class="sub-header">&nbsp;
                   
                  </h4>
                  <div class="table-wrapper table-responsive">
                  <p:dataTable id="dataTable" var="data" value="#{regulationSocializationViewDetailBean.tableModel}" 
                  
                  rowIndexVar="statIndex">
                  		
                    <p:column headerText="#{msg.formRegulationSocializationDocNo}" width="200">
				        <h:inputText styleClass="form-control" value="#{data.regulation.documentNo}" alt="#{data.regulation.documentNo}" title="#{data.regulation.documentNo}" readonly="true"/>
				    </p:column>
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalLinkJudul}" width="300">
				    	<table>
				    	<tr>
				    	<td style="width:80%">
				        
				        <h:inputText  styleClass="form-control temp-no-peraturan" value="#{data.regulation.name}" alt="#{data.regulation.name}" title="#{data.regulation.name}" readonly="true"/>
                        </td>
                        
                         </tr>
                        </table>
                       
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationNote}"
						style="width:300px;">										
						<p:dataList value="#{data.regulation.regulationTrackRecords}"
							emptyMessage=""
							var="dtl2" >#{dtl2.trackNote}</p:dataList>										
					</p:column>
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalRegulationType}" width="300">
				        <h:inputText styleClass="form-control" value="#{data.regulation.documentType.documentType}" alt="#{data.regulation.documentType.documentType}" title="#{data.regulation.documentType.documentType}" readonly="true"/>
				    </p:column>	   
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalPublishedDate}" width="150">
				        <h:inputText styleClass="form-control" value="#{data.regulation.publishedDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.publishedDate):''}"
				        	alt="#{data.regulation.publishedDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.publishedDate):''}"
				        	title="#{data.regulation.publishedDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.publishedDate):''}"
				        	readonly="true" />
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalEffectiveDate}" width="150">
				        <h:inputText styleClass="form-control" 
				        	title="#{data.regulation.effectiveDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.effectiveDate):''}"
				        	alt="#{data.regulation.effectiveDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.effectiveDate):''}"
				        	value="#{data.regulation.effectiveDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.effectiveDate):''}" readonly="true"/>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalExpiredDate}" width="150">
				        <h:inputText styleClass="form-control" 
				        	alt="#{data.regulation.expiredDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.expiredDate):''}"
				        	title="#{data.regulation.expiredDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.expiredDate):''}"
				        	value="#{data.regulation.expiredDate!=null?regulationSocializationViewDetailBean.sdf.format(data.regulation.expiredDate):''}" readonly="true"/>
				    </p:column>
					
					<p:column headerText="#{msg.formRegulationSocializationApprovalRegulationCategory}" width="300">
				        <h:inputText styleClass="form-control" value="#{data.regulation.documentCategory.documentCategory}" alt="#{data.regulation.documentCategory.documentCategory}" title="#{data.regulation.documentCategory.documentCategory}" readonly="true"/>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalRegulationTopic}" width="300">
				        <h:inputText styleClass="form-control" value="#{data.regulation.documentTopic.documentTopic}" alt="#{data.regulation.documentTopic.documentTopic}" title="#{data.regulation.documentTopic.documentTopic}" readonly="true"/>
				    </p:column>
				</p:dataTable>
				</div>
                </div>
              </div>
              
              &nbsp;
              <h3><h:outputText value="#{msg.formRegulationSocializationApprovalPICCompliance}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  <h4 class="sub-header">&nbsp;
                    
                  </h4>
                  <div class="table-wrapper table-responsive">
                  <p:dataTable id="dataTableCompliance" var="data" value="#{regulationSocializationViewDetailBean.tableModelCompliance}" 
                  rowIndexVar="statIndex">
                  		
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalNIK}" width="150">
				    	<table>
				    	<tr>
				    	<td style="width:80%">
				        
				        <h:inputText  styleClass="form-control temp-no-peraturan" value="#{data.user.nik}" alt="#{data.user.nik}" title="#{data.user.nik}" readonly="true"/>
                        </td>
                        
                         </tr>
                        </table>
                       
				    </p:column>
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalName}" width="200">
				        <h:inputText styleClass="form-control" value="#{data.user.name}" alt="#{data.user.name}" title="#{data.user.name}" readonly="true"/>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalEmail}" width="150">
				        <h:inputText styleClass="form-control" value="#{data.user.email}" alt="#{data.user.email}" title="#{data.user.email}" readonly="true"/>
				    </p:column>
				    
				    
				</p:dataTable>
				</div>
                </div>
              </div>
              
              <div class="col-lg-12">
	            <div class="form-group" style="margin-top:15px;">
	              <label for="jenis_ketentuan" class="control-label tl-label" tl=""><h:outputText value="#{msg.formRegulationSocializationApprovalFollowup}" /></label>
		            <h:selectOneMenu styleClass="form-control s2" value="#{regulationSocializationViewDetailBean.socializationTrc.followUp}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{regulationSocializationViewDetailBean.followUps}" />
	                </h:selectOneMenu>
	            </div>
	          </div>
	          <div class="col-lg-12">
	            <div class="form-group">
	              <label for="jenis_ketentuan" class="control-label tl-label" tl=""><h:outputText value="#{msg.formRegulationSocializationApprovalNote}" /></label>
	              <p:inputTextarea styleClass="form-control" value="#{regulationSocializationViewDetailBean.socializationTrc.notes}" disabled="true"></p:inputTextarea>
	            </div>
	          </div>
	          
	          <h3><h:outputText value="#{msg.formRegulationSocializationApprovalPICAndWorkUnit}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  <h4 class="sub-header">&nbsp;
                   
                  </h4>
                  <div class="table-wrapper table-responsive">
                  <p:dataTable id="dataTableFollowup" var="data" value="#{regulationSocializationViewDetailBean.tableModelFollowup}" 
                  rowIndexVar="statIndex">
                  		
                    <p:column
						headerText="#{msg.formRegulationSocializationNote}"
						width="150">
						<h:outputText value="#{data.notes}" title="#{data.notes}" />
					</p:column>
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalDivision}" width="200">
				    	
                       
							<h:selectOneMenu styleClass="form-control s2" value="#{data.divisionId}" disabled="true">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{regulationSocializationViewDetailBean.divisions}" />
							</h:selectOneMenu>
						
                       
				    </p:column>
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalPIC1}" width="250">
				        <table>
				    	<tr>
				    	<td style="width:80%">
				        <h:inputText styleClass="form-control user1#{statIndex}" id="userName1#{statIndex}" value="#{data.user1.name}" alt="#{data.user1.name}" title="#{data.user1.name}" readonly="true"/>
                        </td>
                        
                         </tr>
                        </table>
				    </p:column>
				   
				    <p:column headerText="#{msg.formRegulationSocializationApprovalPIC2}" width="250">
				        <table>
				    	<tr>
				    	<td style="width:80%">
				        <h:inputText styleClass="form-control user2" value="#{data.user2.name}" alt="#{data.user2.name}" title="#{data.user2.name}" readonly="true"/>
                        </td>
                        
                         </tr>
                        </table>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalPIC3}" width="250">
				        <table>
				    	<tr>
				    	<td style="width:80%">
				        <h:inputText styleClass="form-control user3" value="#{data.user3.name}" alt="#{data.user3.name}" title="#{data.user3.name}" readonly="true"/>
                        </td>
                        
                         </tr>
                        </table>
				    </p:column>
				    <p:column headerText="#{msg.formRegulationSocializationApprovalTargetDate}" width="150">
				        <p:calendar maxlength="11" styleClass="form-control-datepicker-wrap"  
				        	disabled="true" value="#{data.targetDate}" pattern="dd-MMM-yyyy" locale="en" />
				    </p:column>
				    <p:column 
						headerText="#{msg.formPICFollowupConfirmationRescheduleReason}"
						width="150">
						<p:inputTextarea
							disabled="true"
							id="rescheduleReason" 
							styleClass="form-control"
							value="#{data.rescheduleReason}"
							maxlength="500"></p:inputTextarea>
					</p:column>
				    <p:column headerText="#{msg.formRegulationSocializationApprovalEmailDate}" width="150">
				        <p:dataList value="#{data.socializationPICFollowupEmailTrcs}" 
				        	emptyMessage=""
				        	var="dtl">#{dtl.emailDate!=null?regulationSocializationViewDetailBean.sdf.format(dtl.emailDate):''}</p:dataList>
				    </p:column>
				</p:dataTable>
				</div>
                </div>
              </div>
              
              <div class="col-lg-12" style="margin-top:15px;">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUpload" update="attachment"></p:remoteCommand>
							<label class="tl-label"><h:outputText
										value="#{msg.formRegulationSocializationAttachment}"/></label>
									<p:dataList value="#{regulationSocializationViewDetailBean.uploadFiles}" 
									emptyMessage=""
									var="vo" id="attachment" rowIndexVar="index">
										<table>
									    	<tr>
									    	<td style="width:80%">
									        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{regulationSocializationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
									        </td>
								        	</tr>
								        </table>
									</p:dataList>
	
						</div>		
					</div>
              
              <div class="col-lg-12">
	            <div class="form-group" style="margin-top:15px;">
	              <label for="jenis_ketentuan" class="control-label tl-label" tl=""><h:outputText value="#{msg.formRegulationSocializationApprovalReminderType}" /></label>
		            <h:selectOneMenu styleClass="form-control s2" value="#{regulationSocializationViewDetailBean.counterTypeId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{regulationSocializationViewDetailBean.counterTypes}" />
	                </h:selectOneMenu>
	            </div>
	          </div>
	          
              <h3><h:outputText value="#{msg.formRegulationSocializationApprovalStatusConfirmation}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  <h4 class="sub-header">&nbsp;
                  </h4>
                  <div class="top-scroller">
					    <div class="div-wrapper">
					    </div>
					</div>
                  <div class="table-wrapper table-responsive linked-to-top-scroller">
                  <p:dataTable id="dataTableStatus" var="vo" value="#{regulationSocializationViewDetailBean.tableStatus}" rowIndexVar="statIndex">
                  		
                    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalConfirmationEvidence}" style="width:250px;" styleClass="wr">
				    	<p:dataList value="#{vo.socializationPICFollowupAttachmentTrcs}" 
				    		emptyMessage=""
				    		var="dtl">
								<p:commandLink title="#{dtl.fileSizeKB} KB" ajax="false" actionListener="#{regulationSocializationViewDetailBean.downloadFile(dtl.fileId,dtl.attachmentFile,null)}" target="_blank">#{dtl.attachmentFile}</p:commandLink>
						</p:dataList> 
				    </p:column>
				 
				    <p:column headerText="#{msg.formRegulationSocializationApprovalFollowupStatus}" width="150">
				        <h:outputLabel value="#{vo.followupStatus}" />
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalConfirmation}" width="150">
				        <h:outputLabel value="#{vo.followupBy}" />
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalConfirmationDate}" width="150">
				        <h:outputLabel value="#{vo.confirmationDate}"> 
				        	<f:convertDateTime
								pattern="#{regulationSocializationViewDetailBean.inputDateFormat}"
								locale="#{regulationSocializationViewDetailBean.inputDateLocale}">
							</f:convertDateTime>
						</h:outputLabel>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalFollowupDate}" width="150">
				        <h:outputLabel value="#{vo.followupDate}"> 
				        	<f:convertDateTime
								pattern="#{regulationSocializationViewDetailBean.inputDateFormat}"
								locale="#{regulationSocializationViewDetailBean.inputDateLocale}">
							</f:convertDateTime>
				        </h:outputLabel>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalInformation}" width="150">
				        <h:outputLabel value="#{vo.followupNote}" />
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalFullfilmentOfFollowupDate}" width="150">
				        <h:outputLabel value="#{vo.complianceDate}"> 
				        	<f:convertDateTime
								pattern="#{regulationSocializationViewDetailBean.inputDateFormat}"
								locale="#{regulationSocializationViewDetailBean.inputDateLocale}">
							</f:convertDateTime>
				        </h:outputLabel>
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalComplianceCheckStatus}" width="150">
				        <h:outputLabel value="#{vo.complianceStatus}" />
				    </p:column>
				    
				    <p:column headerText="#{msg.formRegulationSocializationApprovalComplianceCheckNote}" width="150">
				        <h:outputLabel value="#{vo.complianceNote}" />
				    </p:column>
				    
				    
				</p:dataTable>
				</div>
                </div>
              </div>
              
            <div class="col-lg-12">
            <div class="form-group" style="margin-top:15px;">
              <label class="tl-label" tl=""><h:outputText value="#{msg.formRegulationSocializationApprovalReminderStatus}" /></label>
              <h:selectOneRadio
								value="#{regulationSocializationViewDetailBean.socializationTrc.reminderStatus}" disabled="true">
								<f:selectItems value="#{regulationSocializationViewDetailBean.reminderStatusList}" />
			  </h:selectOneRadio>
            </div>
          </div>
          </div>
      </div>
      <div class="box-footer">
     	   <p:commandButton value="#{msg.buttonBack}" actionListener="#{regulationSocializationViewDetailBean.back()}"
							styleClass="btn btn-default pull-left tl-label">
		   </p:commandButton>        
      </div>
    </div>
    
	</ui:define>
	
	
</ui:composition>
