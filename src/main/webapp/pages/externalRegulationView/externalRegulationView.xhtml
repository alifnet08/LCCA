<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

    <ui:define name="head">
    <style>
    .ui-datatable .ui-datatable-data td {
	    vertical-align : top
	}
    </style>
    </ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formExternalRegulationViewTitle}" />
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">

			<div class="box-body">
				<div class="row">
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationRegulationType}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{externalRegulationViewBean.documentTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationViewBean.docTypes}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationRegulationCategory}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{externalRegulationViewBean.documentCategoryId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationViewBean.docCategories}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationRegulationTopic}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{externalRegulationViewBean.documentTopicId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationViewBean.docTopics}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-6">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationDocNo}" /></label>
							<p:inputText styleClass="form-control"
								value="#{externalRegulationViewBean.documentNo}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-6">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationRegTitle}" /></label>
							<p:inputText styleClass="form-control"
								value="#{externalRegulationViewBean.judulPeraturan}"></p:inputText>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label><h:outputText
									value="#{msg.formExternalRegulationPublishedDate}" /></label>
							<div class="input-group">
								<!-- <input type="text" class="form-control date_picker"
									id="startDate" placeholder="from"
									value="#{externalRegulationViewBean.startDateStr}" />  -->
								<p:calendar styleClass="form-control-datepicker-wrap" id="startDate"
									placeholder="#{msg.from}" maxlength="11"
									value="#{externalRegulationViewBean.startDate}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
							    </p:calendar> 		
									<span class="input-group-addon plain">-</span> 
								<!-- <input type="text"
									class="form-control date_picker" id="endDate" placeholder="to"
									value="#{externalRegulationViewBean.endDateStr}" /> -->
								<p:calendar styleClass="form-control-datepicker-wrap" id="endDate"
									placeholder="#{msg.to}" maxlength="11"
									value="#{externalRegulationViewBean.endDate}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
							    </p:calendar> 	
							</div>
						</div>
					</div>


					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationTrackRecord}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{externalRegulationViewBean.trackRecordCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationViewBean.trackRecords}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="form-group">
							<label class="tl-label" tl=""><h:outputText
									value="#{msg.formExternalRegulationStatus}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{externalRegulationViewBean.statusCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{externalRegulationViewBean.status}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li><h:commandButton value="#{msg.buttonSearch}"
										styleClass="btn btn-success tl-label"
										onclick="searchOnClick([{name: 'START_DATE', value:$('#startDate').val()},{name: 'END_DATE', value:$('#endDate').val()}])"></h:commandButton>
									<p:remoteCommand
										actionListener="#{externalRegulationViewBean.search}"
										name="searchOnClick"></p:remoteCommand></li>
								<li><h:commandLink value="#{msg.buttonReset}"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{externalRegulationViewBean.reset}"></h:commandLink>
								</li>
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
						    <div class="div-wrapper">
						    </div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{externalRegulationViewBean.tableModel}" dynamic="true"
								lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{externalRegulationViewBean.paging}" rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column width="100" headerText="#{msg.formAction}">
									<p:commandButton id="rekamJejak" icon="fa fa-history"
										title="#{msg.formExternalRegulationRekamJejak}"
										process="@this"
										onclick="$('.hdnParamRekamJejak').val(#{vo.regulationId});rekamJejakDialog.show();">
									</p:commandButton>
									<h:outputLabel value="&#160;" />
									<p:commandButton id="view" title=" #{msg.buttonView}"
										action="#{externalRegulationViewBean.getNavigateView()}"
										ajax="false" icon="fa fa-info-circle">
										<f:param name="id" value="#{vo.regulationId}" />
									</p:commandButton>
								</p:column>
								
								<p:column headerText="#{msg.formExternalRegulationRegNo}"
									width="150">
									<h:outputLabel value="#{vo.documentNo}" title="#{vo.documentNo}" />
								</p:column>

								<p:column headerText="#{msg.formExternalRegulationRegTitle}"
									width="150">
									<h:outputLabel value="#{vo.name}" title="#{vo.name}" />
								</p:column>
								<!-- 
								<p:column headerText="#{msg.formExternalRegulationAttachment}"
									width="250">
									<p:dataList value="#{vo.regulationAttachments}" 
										emptyMessage=""
										var="dtl">
										<p:commandLink title="#{dtl.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewBean.downloadFile(dtl.fileId,dtl.attachmentFile,null)}" target="_blank">#{dtl.attachmentFile}</p:commandLink>
									</p:dataList>
								</p:column>
								
								<p:column headerText="#{msg.formExternalRegulationNote}"
									width="250">
									<p:dataList value="#{vo.regulationTrackRecords}" 
										emptyMessage=""
										var="dtl2"><h:outputLabel value="#{dtl2.trackNote}" /></p:dataList>
								</p:column>
								 -->
								<p:column headerText="#{msg.formExternalRegulationStatus}"
									width="100" style="text-align:center;">
									<h:outputLabel rendered="#{vo.status eq 'DATA_ACTIVE'}" >
									<span  class="label label-success">
										<h:outputText value="#{vo.statusName}"/>
									</span>
								</h:outputLabel>
								<h:outputLabel rendered="#{vo.status eq 'DATA_INACTIVE'}" >
									<span  class="label label-danger">
										<h:outputText value="#{vo.statusName}"/>
									</span>
								</h:outputLabel>
								<h:outputLabel rendered="#{vo.status eq 'DATA_NEW'}" >
									<span  class="label label-info">
										<h:outputText value="#{vo.statusName}"/>
									</span>
								</h:outputLabel>
								<h:outputLabel rendered="#{vo.status eq 'DATA_REVISE'}" >
									<span  class="label label-warning">
										<h:outputText value="#{vo.statusName}"/>
									</span>
								</h:outputLabel>
								</p:column>
								
								<p:column headerText="#{msg.formExternalRegulationRegulationType}"
									width="100">
									<h:outputLabel value="#{vo.documentTypeName}" title="#{vo.documentTypeName}"
										style="vertical-align: top;" />
								</p:column>

								<p:column
									headerText="#{msg.formExternalRegulationPublishedDate}"
									width="120">
									<h:outputLabel value="#{vo.publishedDateStr}" />
								</p:column>
								<!--
								<p:column headerText="#{msg.formExternalRegulationReviewDate}"
									width="120">
									<h:outputLabel value="#{vo.expiredDateStr}" />
								</p:column>
								
								<p:column headerText="#{msg.formExternalRegulationRegulationCategory}"
									width="150">
									<h:outputLabel value="#{vo.documentCategoryName}" title="#{vo.documentCategoryName}" />
								</p:column>

								<p:column headerText="#{msg.formExternalRegulationRegulationTopic}"
									width="150">
									<h:outputLabel value="#{vo.documentTopicName}" title="#{vo.documentTopicName}" />
								</p:column>
								 -->
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

		<wo:selector id="RekamJejakDummy" height="330" width="700"
			title="#{msg.formExternalRegulationRekamJejak}"
			widgetVar="rekamJejakDummyDialog"
			selectorInfo="#{externalRegulationViewBean.selectorRekamJejak}"
			bean="#{externalRegulationBean}" isSelected="false" />
			
		<wo:selector id="RekamJejak" height="330" width="700"
			title="#{msg.formExternalRegulationRekamJejak}"
			widgetVar="rekamJejakDialog"
			selectorInfo="#{externalRegulationViewBean.selectorRekamJejak}"
			bean="#{externalRegulationBean}" isSelected="false" />

	</ui:define>
</ui:composition>
