<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-state-disabled{
				opacity: .60;
			}
			.form-control[disabled] {
			    cursor: not-allowed;
			    font-family: 'Montserrat';
			    font-size: 13px;
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formExternalRegulationViewTitle}" />
	</ui:define>
	
	<ui:define name="content">
	<p:messages id="messages" />
	<p:growl id="msgs"  rendered="true"/>
	<div class="box box-solid">
      <div class="box-header with-border">
        <h3 class="box-title tl-label"><h:outputText value="#{msg.formExternalRegulationViewTitle}" /></h3>
      </div>
      <div class="box-body">
        <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                <label for="jenis_ketentuan" class="control-label tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalProvType}" /></label>
                <h:selectOneMenu styleClass="form-control s2" value="#{externalRegulationViewDetailBean.regulationMst.jenisKetentuan.parameterDtlCode}" disabled="true">
                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
			    <f:selectItems value="#{externalRegulationViewDetailBean.provTypes}" />
                </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><h:outputText value="#{msg.formExternalRegulationApprovalRegulationType}" /></label>
	          	<h:selectOneMenu styleClass="form-control s2" value="#{externalRegulationViewDetailBean.docTypeId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{externalRegulationViewDetailBean.docTypes}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label"><h:outputText value="#{msg.formExternalRegulationApprovalRegulationCategory}" /></label>
	          	<h:selectOneMenu styleClass="form-control s2" value="#{externalRegulationViewDetailBean.docCategoryId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{externalRegulationViewDetailBean.docCategories}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
              	<label class="tl-label"><h:outputText value="#{msg.formExternalRegulationApprovalRegulationTopic}" /></label>
	            <h:selectOneMenu styleClass="form-control s2" value="#{externalRegulationViewDetailBean.docTopicId}" disabled="true">
	                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
				    <f:selectItems value="#{externalRegulationViewDetailBean.docTopics}" />
	            </h:selectOneMenu>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationDocNo}" /></label>
                <h:inputText styleClass="form-control" value="#{externalRegulationViewDetailBean.regulationMst.documentNo}"
                	title="#{externalRegulationViewDetailBean.regulationMst.documentNo}"
                	disabled="true" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalRegTitle}" /></label>
                <h:inputText styleClass="form-control" value="#{externalRegulationViewDetailBean.regulationMst.nameIn}"
                	title="#{externalRegulationViewDetailBean.regulationMst.nameIn}"
                	disabled="true" />
              </div>
            </div>
            
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalPublishedDate}" /></label>
               <!--  <input type="text" class="form-control date_picker" id="publishedDate" 
                	    value="#{externalRegulationViewDetailBean.regulationMst.publishedDateStr}" readonly="true"/> -->
                  <p:calendar styleClass="form-control-datepicker-wrap" id="publishedDate" disabled="true"
						value="#{externalRegulationViewDetailBean.regulationMst.publishedDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
				  </p:calendar>     	    
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" >
                	<h:outputText value="#{msg.formExternalRegulationApprovalDescriptionRegulation}" />
                </label>
                <pe:ckEditor id="descriptionRegulation" widgetVar="editorContent" width="100%" required="true"
								requiredMessage="#{msg.formExternalRegulationDecriptionRegulation} #{msg.validateRequired}"
								value="#{externalRegulationViewDetailBean.regulationMst.descriptionIn}" readonly="true"
								height="300" style="margin-bottom:10px" />
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group ">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalReviewDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="expiredDate" 
                       value="#{externalRegulationViewDetailBean.regulationMst.expiredDateStr}" readonly="true"/> -->
                   <p:calendar styleClass="form-control-datepicker-wrap" id="expiredDate" disabled="true"
						value="#{externalRegulationViewDetailBean.regulationMst.expiredDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
				  </p:calendar>     
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group ">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalEffDate}" /></label>
                <!-- <input type="text" class="form-control date_picker" id="effectiveDate" 
                       value="#{externalRegulationViewDetailBean.regulationMst.effectiveDateStr}" readonly="true"/> -->
                  <p:calendar styleClass="form-control-datepicker-wrap" id="effectiveDate" disabled="true"
						value="#{externalRegulationViewDetailBean.regulationMst.effectiveDate}"
						autocomplete="off" pattern="dd-MMM-yyyy" locale="en" >
				  </p:calendar>     
              </div>
            </div>
            
            
            <h3><h:outputText value="#{msg.formExternalRegulationApprovalAttachmentPeraturan}" /></h3>
            <div class="col-lg-12">
              <div class="form-group">
                <p:remoteCommand name="onCompleteUpload" update="peraturanIdList summaryList peraturanPenjelasanList peraturanFAQList peraturanLampiranList peraturanMateriList"></p:remoteCommand>
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalPeraturanUtuh}" /></label>
               
                <p:dataList value="#{externalRegulationViewDetailBean.uploadedFilesPeraturanId}" 
                	emptyMessage=""
                	var="vo" id="peraturanIdList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalSummary}" /></label>
                
                <p:dataList value="#{externalRegulationViewDetailBean.uploadedFilesSummary}" 
                	emptyMessage=""
                	var="vo" id="summaryList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalPenjelasan}" /></label>
                
                <p:dataList value="#{externalRegulationViewDetailBean.uploadedFilesPenjelasan}" 
                	emptyMessage=""
                	var="vo" id="peraturanPenjelasanList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalFAQ}" /></label>
                
                <p:dataList value="#{externalRegulationViewDetailBean.uploadedFilesFAQ}" 
                	emptyMessage=""
                	var="vo" id="peraturanFAQList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalLampiran}" /></label>
                
                <p:dataList value="#{externalRegulationViewDetailBean.uploadedFilesLampiran}" 
                	emptyMessage=""
                	var="vo" id="peraturanLampiranList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            
            <div class="col-lg-12">
              <div class="form-group">
                <label class="tl-label" ><h:outputText value="#{msg.formExternalRegulationApprovalMateriSosialisasi}" /></label>
                
                <p:dataList value="#{externalRegulationViewDetailBean.uploadedFilesMateri}" 
                	emptyMessage=""
                	var="vo" id="peraturanMateriList">
			        <p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" actionListener="#{externalRegulationViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
			    </p:dataList>
              </div>
            </div>
            
            
            <h3><h:outputText value="#{msg.formExternalRegulationApprovalRekamJejak}" /></h3>
              <div class="col-lg-12">
                <div id="mp-rekam-jejak">
                  
                  <div class="table-wrapper table-responsive">
                  <p:dataTable id="dataTable" var="data" value="#{externalRegulationViewDetailBean.tableModel}" 
                  selection="#{externalRegulationViewDetailBean.selectedData}" 
                  rowKey="#{data.sequence}"
                  rowIndexVar="statIndex">
                  		<p:ajax event="rowSelectCheckbox" process="@this"/>
                        <p:ajax event="rowUnselectCheckbox" process="@this"/>
                        <p:ajax event="toggleSelect" process="@this"/>
                    <!-- <p:column selectionMode="multiple" style="text-align:center; width:40px;"/> -->
				    <p:column headerText="#{msg.formExternalRegulationApprovalRekamJejak}">
				        <h:selectOneMenu styleClass="form-control s2" value="#{data.trackCode}" disabled="true">
			                <f:selectItem itemLabel="#{msg.choose}" itemValue="" />
						    <f:selectItems value="#{externalRegulationViewDetailBean.trackCodes}" />
			            </h:selectOneMenu>
				    </p:column>
				 
				    <p:column headerText="#{msg.formExternalRegulationRegNo}">
				    	<div class="input-group">
				        <h:inputHidden value="#{data.regulationLinkId}" ></h:inputHidden>
				        <h:inputText  styleClass="form-control temp-no-peraturan" value="#{data.regulationLinkName}" disabled="true" alt="#{data.regulationLinkName}" title="#{data.regulationLinkName}"/>
                        <span class="input-group-btn">
                              <p:commandLink  styleClass="btn btn-link"  onclick="jdlPeraturanDialog.show()"><i class="fa fa-search"> </i>
                              <f:setPropertyActionListener
											target="#{externalRegulationViewDetailBean.indexDtl}"
											value="#{statIndex}" />
                              </p:commandLink>
                        </span>
                        </div>                        
				    </p:column>
				 
				    <p:column headerText="#{msg.formExternalRegulationApprovalKetMencabut}">
				        <h:inputText styleClass="form-control" value="#{data.trackNote}" disabled="true" alt="#{data.trackNote}" title="#{data.trackNote}"/>
				    </p:column>
	
				</p:dataTable>
				</div>
              </div>             
            </div>
          </div>
      </div>
      <div class="box-footer">
      	   <p:commandButton value="#{msg.buttonBack}" actionListener="#{externalRegulationViewDetailBean.back()}"
			  	 styleClass="btn btn-default pull-left tl-label" />
      </div>
    </div>
    
	</ui:define>
	
	
</ui:composition>
