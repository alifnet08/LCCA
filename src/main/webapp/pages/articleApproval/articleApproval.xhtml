<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">
	<ui:define name="head">
		<style>
			.ui-calendar input {
				display: block!important;
			    width: 100%!important;
			    padding: 10px 12px!important;
			    background-color: #F7F8F8 !important;
			    background-image: none!important;
			    border-radius: 5px!important;
			    box-shadow: none;
			    transition: border-color ease-in-out .15s,box-shadow ease-in-out .15s!important;
			    border: 0 !important;
		        height: inherit;
			}
			
			.ui-inputfield.ui-state-focus {
				box-shadow: none;
			}
		</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formArticleApprovalTitle}" />
	</ui:define>

	<ui:define name="content">
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="table-responsive">
							<p:dataTable id="tableSearch" paginator="true" var="vo"
								value="#{articleApprovalBean.articleApprovalDataModel}" dynamic="true" lazy="true"
								emptyMessage="#{msg.textNodata}" rows="#{articleApprovalBean.paging}"
								rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
							
								<p:column style="text-align:center;" width="100"
									headerText="#{msg.formAction}">
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{articleApprovalBean.getNavigateEdit()}" type="submit"
										ajax="false" styleClass="tl-label">
										<f:param name="editId" value="#{vo.articleId}" />
									</p:commandLink>
								</p:column>
								
								<p:column headerText="#{msg.formArticleApprovalArtTitle}" width="300">
									<h:outputLabel value="#{vo.articleTitle}" title="#{vo.articleTitle}"/>
								</p:column>
								
								<p:column headerText="#{msg.formArticleApprovalArtType}" width="300">
									<h:outputLabel value="#{vo.articleType}" title="#{vo.articleType}"/>
								</p:column>
								
								<p:column headerText="#{msg.formArticleApprovalArtPublishDate}" width="300">
									<h:outputLabel value="#{vo.publishDateStr}" title="#{vo.publishDateStr}"/>
								</p:column>
							
							</p:dataTable>
						</div>
					</div>
					
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
