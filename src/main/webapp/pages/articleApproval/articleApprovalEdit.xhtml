<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			.select2-container--default .select2-selection--single {
			    background-color: #eeeeee;
    		}
		</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formArticleApprovalTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
		
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-article-approval">
					<h:outputText value="#{msg.formArticleApprovalTitle}" />
				</h3>
			</div>
			
			<div class="box-body">
				<p:growl id="messages" rendered="true" severity="error"/>
				<div class="row">
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label">
								<p:outputLabel value="#{msg.formArticleApprovalArtType}"/>
							</label>
							<h:selectOneMenu id="articleType" styleClass="form-control s2" disabled="true"
								value="#{articleApprovalEditBean.tmpArticle.articleType.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{articleApprovalEditBean.articleTypeList}" />
							</h:selectOneMenu>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtAuthor}" />
							</label>
							<p:inputText id="author" autocomplete="off" styleClass="form-control"
								disabled="true"
								value="#{articleApprovalEditBean.tmpArticle.author}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtPublishDate}" />
							</label>
							<p:calendar id="publishDate" styleClass="form-control-datepicker-wrap" 
								maxlength="11" disabled="true"
								value="#{articleApprovalEditBean.tmpArticle.publishDate}"
								autocomplete="off"
								pattern="dd-MMM-yyyy" locale="en" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtTagName}" />
							</label>
							<p:chips id="tagName" style="width:100%" disabled="true"
								styleClass="form-control" value="#{articleApprovalEditBean.tagNames}"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtTitle}" />
							</label>
							<p:inputText id="titleIn" autocomplete="off" 
								styleClass="form-control" disabled="true"
								value="#{articleApprovalEditBean.tmpArticle.articleTitleIn}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtDescription}" />
							</label>
							<p:inputTextarea id="descIn" styleClass="form-control"
								disabled="true"
								value="#{articleApprovalEditBean.tmpArticle.descriptionIn}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtContent}" />
							</label>
							<pe:ckEditor id="contentIn" widgetVar="editorContentIn" width="100%"
								value="#{articleApprovalEditBean.tmpArticle.contentIn}" readonly="true"
								height="300" style="margin-bottom:10px" />
						</div>
					</div>
					
					<h3>
						<h:outputText value="#{msg.formArticleApprovalArtAttachment}" />
					</h3>
					
					<div class="col-lg-12">
						<div class="form-group">
							
							<label class="tl-label">
								<h:outputText value="#{msg.formArticleApprovalArtUploadDocument}"/>
							</label>
							<p:dataList value="#{articleApprovalEditBean.uploadFiles}"
								emptyMessage="" var="vo" id="attachment" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%">
											<p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
												actionListener="#{articleApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}
											</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtStatus}" />
							</label>
							<h:selectOneMenu id="status" styleClass="form-control s2"
								value="#{articleApprovalEditBean.approvalStatus}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{articleApprovalEditBean.statusList}" />
							</h:selectOneMenu>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" >
								<p:outputLabel value="#{msg.formArticleApprovalArtNote}" />
							</label>
							<p:inputTextarea id="approvalNote" styleClass="form-control"
								value="#{articleApprovalEditBean.approvalNote}" />
						</div>
					</div>
				</div>
				
				<div class="box-footer">
					<h:commandButton value="#{msg.buttonSave}"
						rendered="#{articleApprovalEditBean.tmpArticle.status.parameterDtlCode eq 'DATA_NEW'}"
						actionListener="#{articleApprovalEditBean.save}"
						styleClass="btn btn-success pull-left tl-label" update="messages" />

					<h:commandLink value="#{msg.buttonCancel}"
						actionListener="#{articleApprovalEditBean.cancel()}"
						styleClass="btn btn-default pull-right tl-label" />
				</div>
				
			</div>
		</div>
	</ui:define>
</ui:composition>
