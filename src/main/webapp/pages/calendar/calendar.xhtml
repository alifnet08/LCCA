
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formCalendarTitle}" />
	</ui:define>
	


	<ui:define name="content">
		
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="messages" showDetail="true" />
				<h:panelGrid columnClasses="value">
		        <p:schedule id="schedule" value="#{calendarBean.eventModel}" widgetVar="myschedule" timeZone="GMT+7" >
		        	<p:ajax event="dateSelect" listener="#{calendarBean.onDateSelect}" update="eventDetails" oncomplete="PF('eventDialog').show();" />
                    <p:ajax event="eventSelect" listener="#{calendarBean.onEventSelect}" update="eventDetails" oncomplete="PF('eventDialog').show();" />
                    <p:ajax event="eventMove" listener="#{calendarBean.onEventMove}" update="messages" />
                    <p:ajax event="eventResize" listener="#{calendarBean.onEventResize}" update="messages" />
		        </p:schedule>
		    	</h:panelGrid>
			</div>
		</div>

		<p:dialog widgetVar="eventDialog" header="Event Details"
			showEffect="clip" hideEffect="clip" positionType="center">
			<!-- <h:panelGrid id="eventDetails" columns="2"> -->
			<p:outputPanel id="eventDetails">
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group">
							<p:outputLabel for="title" value="#{msg.formCalendarEvent}" />
							<p:inputText id="title" styleClass="form-control"
								value="#{calendarBean.event.title}" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<p:outputLabel for="from" value="#{msg.formCalendarStartDate}" />
							<p:calendar styleClass="form-control-datepicker-wrap" id="from"
								appendTo="@(body)" maxlength="11" autocomplete="off"
								value="#{calendarBean.event.startDate}"
								pattern="#{calendarBean.inputDateFormat}"
								locale="#{calendarBean.inputDateLocale}"></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<p:outputLabel for="to" value="#{msg.formCalendarEndDate}" />
							<p:calendar styleClass="form-control-datepicker-wrap" id="to"
								appendTo="@(body)" maxlength="11" autocomplete="off"
								value="#{calendarBean.event.endDate}"
								pattern="#{calendarBean.inputDateFormat}"
								locale="#{calendarBean.inputDateLocale}"></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<p:outputLabel for="allDay" value="#{msg.formCalendarHoliday}" />
							<h:selectBooleanCheckbox id="allDay"
								value="#{calendarBean.event.allDay}"
								styleClass="icheckbox_square-grey" />
						</div>
					</div>

					<p:commandButton type="reset" value="Reset" styleClass="btn btn-default pull-right tl-label" onclick="$('#form\\:title').val('');$('#form\\:allDay').val('')" />
					<p:commandButton id="addButton" value="Save" styleClass="btn btn-primary pull-left tl-label"
						actionListener="#{calendarBean.addEvent}" 
						oncomplete="PF('myschedule').update();PF('eventDialog').hide();" />
				</div>
			</div>
			</p:outputPanel>
			<!-- </h:panelGrid> -->
		</p:dialog>


	</ui:define>
</ui:composition>
