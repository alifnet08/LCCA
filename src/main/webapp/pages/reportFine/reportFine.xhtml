<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formReportFineTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="message" rendered="true" />
		<div class="box box-solid">
			<div class="box-body">
				<h:panelGroup id="panelSearch">
					<div class="row">
					
						<div class="col-lg-4">
							<div class="form-group">
								<label>
									<h:outputText value="#{msg.formReportFineCreationDate}" />
								</label>
								<div class="input-group">
									<p:calendar id="searchCreationDateFrom" styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										value="#{reportFineBean.searchCreationDateFrom}"
										autocomplete="off"
										pattern="#{reportFineBean.inputDateFormat}"
										locale="#{reportFineBean.inputDateLocale}" />
									
									<span class="input-group-addon plain">-</span>

									<p:calendar id="searchCreationDateTo" styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										value="#{reportFineBean.searchCreationDateTo}"
										autocomplete="off"
										pattern="#{reportFineBean.inputDateFormat}"
										locale="#{reportFineBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						
						<div class="col-lg-4">
							<div class="form-group">
								<label>
									<h:outputText value="#{msg.formReportFineTargetDate}" />
								</label>
								<div class="input-group">
									<p:calendar id="searchTargetDateFrom" styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.from}" maxlength="11"
										value="#{reportFineBean.searchTargetDateFrom}"
										autocomplete="off"
										pattern="#{reportFineBean.inputDateFormat}"
										locale="#{reportFineBean.inputDateLocale}" />
										
									<span class="input-group-addon plain">-</span>

									<p:calendar id="searchTargetDateTo" styleClass="form-control-datepicker-wrap"
										placeholder="#{msg.to}" maxlength="11"
										value="#{reportFineBean.searchTargetDateTo}"
										autocomplete="off"
										pattern="#{reportFineBean.inputDateFormat}"
										locale="#{reportFineBean.inputDateLocale}" />
								</div>
							</div>
						</div>
						
						<div class="col-lg-4">
							<h:panelGroup id="panelSenderCode">
								<div class="form-group">
									<label class="tl-label size-font">
										<h:outputText value="#{msg.formReportFineSender}" />
									</label>
									<h:selectOneMenu id="searchSenderCode" styleClass="form-control s2"
										value="#{reportFineBean.searchSenderCode}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{reportFineBean.senderCodeList}" />
									</h:selectOneMenu>
								</div>
							</h:panelGroup>
						</div>
					</div>
				</h:panelGroup>
				
				<div class="row">
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<li>
									<p:commandButton value="#{msg.buttonPrint}" ajax="true"
										update="reportDenda panelSearch message"
										styleClass="btn btn-success tl-label"
										oncomplete="reInitSelect2();"
										actionListener="#{reportFineBean.generateExcelInBackgroundJob}">
									</p:commandButton>
								</li>
								<li>
									<p:commandButton value="#{msg.buttonReset}" ajax="true"
										update="panelSearch" oncomplete="reInitSelect2();"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{reportFineBean.reset}">
									</p:commandButton>
								</li>
							</ul>
							<ul class="no-margin no-padding pull-right">
								<li>
									<p:commandButton value="#{msg.buttonRefresh}"
										ajax="true" update="reportDenda"
										styleClass="btn btn-success tl-label" immediate="true"
										actionListener="#{reportFineBean.search}">
									</p:commandButton>
								</li>
								<li>
									<p:commandButton value="#{msg.buttonDelete}"
										ajax="true" update="reportDenda"
										styleClass="btn btn-default btn-flat tl-label" process="@this"
										actionListener="#{reportFineBean.delete}">
										<p:confirm header="Konfirmasi"
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandButton>
								</li>
							</ul>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="table-responsive">
							
							<p:dataTable id="reportDenda" paginator="true"
								var="vo" value="#{reportFineBean.tableModel}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{reportFineBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								selection="#{reportFineBean.selectedReportGen}"
								rowKey="#{vo.reportGenId}" rowSelectMode="checkbox"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
								
								<p:ajax event="rowSelectCheckbox" process="@this" update="reportDenda" />
								<p:ajax event="rowUnselectCheckbox" process="@this" update="reportDenda" />
								<p:ajax event="toggleSelect" process="@this" update="reportDenda" />

								<p:column selectionMode="multiple"
									style="text-align:center; width:40px;" />

								<p:column width="90" headerText="#{msg.formReportGenReportId}">
									<h:outputLabel value="#{vo.reportGenId}"
										title="#{vo.reportGenId}" />
								</p:column>

								<p:column headerText="#{msg.formReportGenReportName}">
									<h:outputLabel value="#{vo.reportGenReportName}"
										title="#{vo.reportGenReportName}" />
								</p:column>

								<p:column headerText="#{msg.formReportGenReportExecuteDate}"
									style="text-align:center;">
									<h:outputLabel value="#{vo.creationDate}"
										title="#{vo.creationDate}" />
								</p:column>

								<p:column width="100"
									headerText="#{msg.formReportGenReportStatus}"
									style="text-align:center;">
									<h:outputText styleClass="label label-warning"
										value="#{vo.reportGenStatus}" title="#{vo.reportGenStatus}"></h:outputText>
								</p:column>

								<p:column style="text-align:center;"
									headerText="#{msg.textAction}">
									<p:outputPanel rendered="#{vo.statusIsCompleted}">
										<p:commandLink ajax="false" value="#{msg.textDownload}"
											immediate="true"
											actionListener="#{reportFineBean.downloadFile(
												vo.reportGenFileId, 
												vo.reportGenReportFileName,
												null
											)}"
											target="_blank" />
									</p:outputPanel>
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
		
	</ui:define>
</ui:composition>
