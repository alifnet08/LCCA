<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
	
		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">PERATURAN INTERNAL</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Peraturan Internal</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<!-- <h:form styleClass="form-group has-search my-2 my-lg-5"> -->
			<h:form styleClass="wo-search-form">
				<p:remoteCommand name="onSearch" process="@this dataList searchVal searchTipe searchStatus searchTahun"
						update="dataList searchVal searchTipe searchStatus searchTahun" 
						action="#{internalRegulationFEBean.search()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onClickPage" process="@this dataList searchVal searchTipe searchStatus searchTahun"
						update="dataList searchVal searchTipe searchStatus searchTahun"
						action="#{internalRegulationFEBean.searchDataPrevNext()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onPrev" process="@this dataList searchVal searchTipe searchStatus searchTahun"
						update="dataList searchVal searchTipe searchStatus searchTahun" 
						action="#{internalRegulationFEBean.prev()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<p:remoteCommand name="onNext" process="@this dataList searchVal searchTipe searchStatus searchTahun"
						update="dataList searchVal searchTipe searchStatus searchTahun" 
						action="#{internalRegulationFEBean.next()}"
						onstart="PF('statusDialog').show()"
						onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
					<h:inputHidden id="pageSelected" styleClass="pageSelected"
						value="#{internalRegulationFEBean.first}"></h:inputHidden>
					<h:inputHidden id="totalPage"
						value="#{internalRegulationFEBean.totalPage}"></h:inputHidden>
				
			<div class="form-row">
            <div class="col-md-6 form-group">
              <div class="label-form">Tipe Peraturan</div>
						<p:selectOneMenu styleClass="form-control s2" id="searchTipe" widgetVar="selectTipePeraturan"
						onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"
							value="#{internalRegulationFEBean.docType}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
							<f:selectItems value="#{internalRegulationFEBean.tipePeraturanList}" />
						</p:selectOneMenu>
		    </div>
            <div class="col-md-6 form-group">
            <div class="label-form">Status</div>
						<p:selectOneMenu styleClass="form-control s2" id="searchStatus" widgetVar="selectStatus"
						onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"
							value="#{internalRegulationFEBean.searchStatus}">
							<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
							<f:selectItems value="#{internalRegulationFEBean.statusList}" />
						</p:selectOneMenu>
				</div>
				</div>
				<div class="form-row">
				<div class="col-4 form-group">
					<p:inputText widgetVar="searchTahun" id="searchTahun" styleClass="form-control cari-input"  value="#{internalRegulationFEBean.searchTahun}"
							placeholder="CARI TAHUN . . ." onkeypress="return isNumeric(event)" maxlength="4"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"/>
				</div>
				<div class="col-8 has-search form-group">
					<!-- <input id="searchVal" class="form-control cari-input" type="search"
						placeholder="CARI PERATURAN INTERNAL . . ." aria-label="Search" /> -->
					<p:inputText widgetVar="searchVal" id="searchVal" styleClass="form-control cari-input"  value="#{internalRegulationFEBean.searchVal}"
							placeholder="CARI PERATURAN INTERNAL . . ." aria-label="Search"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></p:inputText>
					<div class="input-group-append">
						<i
							class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
							onclick="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></i>
					</div>
				</div>
				</div>
			</h:form>

			<h:panelGroup id="dataList">
				<h:form>
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableInternal">
							<tbody>
								<ui:repeat value="#{internalRegulationFEBean.listData}" var="vo">
									<tr class="#{vo.isAccess == 0? 'unread':''}">
										<td class="col-9"><p:link
												outcome="#{internalRegulationFEBean.getNavigateEdit()}"
												onclick="#{internalRegulationFEMainBean.modeView()}"
												type="submit" styleClass="text-mb-g5" ajax="false">
												<f:param name="first" value="#{internalRegulationFEBean.firstTemp}" />
												<f:param name="token" value="#{internalRegulationFEBean.toEncrypt(vo.regulationId)}" /> <span
												class="td-header #{vo.status eq 'DATA_INACTIVE'?'obsolete':''}  text-mb-secondary">#{vo.docNo}
													- #{vo.nameIn}</span><br /> <span class="td-detail text-mb-g4">Tanggal
													berlaku : #{vo.effectiveDate}</span>
										</p:link></td>
										<td class="col-2"><p:graphicImage
												value="/resources/images/obsolete.svg"
												style="#{vo.status eq 'DATA_INACTIVE'?'':'display:none'}" /></td>
										<td class="col-1"><p:link
												outcome="#{internalRegulationFEBean.getNavigateEdit()}"
												type="submit" styleClass="text-mb-g5" ajax="false">
												<f:param name="first" value="#{internalRegulationFEBean.firstTemp}" />
												<f:param name="token" value="#{internalRegulationFEBean.toEncrypt(vo.regulationId)}" />
												<i class="fas fa-external-link-alt"></i>
										</p:link></td>
									</tr>
								</ui:repeat>
								<tr style="#{(internalRegulationFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td>#{msg.textNodata}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</h:form>
				<nav aria-label="Page navigation" style="#{(internalRegulationFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev()"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{internalRegulationFEBean.totalPageList}" var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'PAGE_SELECTED', value:'#{row-1}'}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext()"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>

		</div>

</ui:composition>
