<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield, .ui-widget-header .ui-inputfield {
				box-shadow: none;
			}
		</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTmpCorrespondenceAmlTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="messages" rendered="true"></p:growl>
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-rmd">
					<h:outputText value="#{msg.formTmpCorrespondenceAmlAddTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">

					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formTmpCorrespondenceAmlSender}" for="tmpCorrespondenceSender"/></label>
							<h:selectOneMenu id="tmpCorrespondenceSender" required="true" requiredMessage="#{msg.formTmpCorrespondenceAmlSender} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.senderCode.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{tmpCorrespondenceAmlEditBean.senderCodeList}"/>
							</h:selectOneMenu>
							<p:message for="tmpCorrespondenceSender"/>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel for="tmpCorrespondenceLetterReceiveDate"
									value="#{msg.formTmpCorrespondenceAmlLetterReceiveDate}" /></label>
							<p:calendar id="tmpCorrespondenceLetterReceiveDate" required="true" requiredMessage="#{msg.formTmpCorrespondenceAmlLetterReceiveDate} #{msg.validateRequired}"
								styleClass="form-control-datepicker-wrap" maxlength="11"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.letterReceivedDate}"
								autocomplete="off"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel for="tmpCorrespondenceLetterNo"
									value="#{msg.formTmpCorrespondenceAmlLetterNo}" /></label>
							<p:inputText id="tmpCorrespondenceLetterNo" required="true" requiredMessage="#{msg.formTmpCorrespondenceAmlLetterNo} #{msg.validateRequired}"
								styleClass="form-control" maxlength="100" autocomplete="off"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.letterNo}"></p:inputText>
							<p:message for="tmpCorrespondenceLetterNo"/>
						</div>
					</div>
					<div class="col-lg-12">
							<div class="form-group ">
							<label for="role" class="control-label tl-label"><p:outputLabel
									for="tmpCorrespondeceLetterDate"
									value="#{msg.formTmpCorrespondenceAmlLetterDate}" /></label>
							<p:calendar id="tmpCorrespondeceLetterDate"
								styleClass="form-control-datepicker-wrap"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.letterDate}"
								autocomplete="off" maxlength="11"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
							<p:message for="tmpCorrespondeceLetterDate"/>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"> <p:outputLabel
									for="tmpCorrespondecePerihalIn"
									value="#{msg.formTmpCorrespondenceAmlPerihal}" />
							</label>
							<p:inputText id="tmpCorrespondecePerihalIn"
								styleClass="form-control" autocomplete="off" maxlength="5000"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.perihalIn}"></p:inputText>
							<p:message for="tmpCorrespondecePerihalIn"/>
						</div>
					</div>
					<!-- <div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel for="tmpCorrespondecePerihalEn"
									value="#{msg.formTmpCorrespondenceAmlPerihal}" />&#160;&#160;<span
								class="label label-warning">
									<h:outputText value="#{msg.english}"/>
								</span></label>
							<p:inputText id="tmpCorrespondecePerihalEn"
								styleClass="form-control" autocomplete="off" maxlength="5000"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.perihalEn}"></p:inputText>
							<p:message for="tmpCorrespondecePerihalEn"/>
						</div>
					</div> -->

					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlLetterSummary}" /></label>
							<p:inputText id="formTmpCorrespondenceAmlLetterSummary" styleClass="form-control" autocomplete="off" maxlength="5000"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.letterSummary}"></p:inputText>
						</div>
						<p:message for="formTmpCorrespondenceAmlLetterSummary"/>
					</div>
						
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formTmpCorrespondenceAmlCorrespondenceType}" for="tmpCorrespondenceType"/></label>
							<h:selectOneMenu id="tmpCorrespondenceType" required="true" 
								requiredMessage="#{msg.formTmpCorrespondenceAmlCorrespondenceType} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.correspondenceCode.parameterDtlCode}">
								<f:selectItems
									value="#{tmpCorrespondenceAmlEditBean.correspondenceTypeCodeList}"/>
							</h:selectOneMenu>
							<p:message for="tmpCorrespondenceType"/>
						</div>
					</div>
					
					<h3>
						<h:outputText
							value="#{msg.formTmpCorrespondenceAmlDocumentLetterTitle}" />
					</h3>
					<div class="col-lg-12">
						<div class="form-group">
							<p:remoteCommand name="onCompleteUpload" update="documentList"></p:remoteCommand>
							<label class="tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlDocumentLetterSubTitle}" />
								<br/>
								<h:outputText style="color: #dd4b39" value="#{tmpCorrespondenceAmlEditBean.textWarningUpload}"/>
							</label>
							<p:fileUpload
								fileUploadListener="#{tmpCorrespondenceAmlEditBean.handleFileUploadDocument}"
								oncomplete="onCompleteUpload()" 
								required="#{!(tmpCorrespondenceAmlEditBean.tmpCorrespondence.senderCode.parameterDtlCode eq 'SENDER_PPATK' or
											tmpCorrespondenceAmlEditBean.tmpCorrespondence.senderCode.parameterDtlCode eq 'SENDER_KPK')}"
								requiredMessage="#{msg.formTmpCorrespondenceAmlDocumentLetterSubTitle} #{msg.validateRequired}"
								value="#{tmpCorrespondenceAmlEditBean.uploadedFilesDocument}"
								mode="advanced" auto="true" adragDropSupport="false" multiple="true"
								update="messages" 
								sizeLimit="#{tmpCorrespondenceAmlEditBean.maxAttachmentSize}"
								 />
							<p:dataList value="#{tmpCorrespondenceAmlEditBean.uploadedFilesDocument}" 
								emptyMessage=""
								var="vo" id="documentList" rowIndexVar="index">
								<table>
							    	<tr>
							    	<td style="width:80%">
							        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{tmpCorrespondenceAmlEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							        </td>
							        <td>
							        	<p:commandLink  immediate="true" actionListener="#{tmpCorrespondenceAmlEditBean.deleteAttachment(vo.fileId,index)}" update="documentList">#{msg.buttonDelete}</p:commandLink>
							        </td>
						        	</tr>
						        </table>
							</p:dataList>
						</div>
					</div>


					<h3>
						<h:outputText value="#{msg.formTmpCorrespondenceAmlPICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink
												onclick="onAddNewPicCompliance();">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowPicCompliance();">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tablePicComplianceDetail" var="vo"
									value="#{tmpCorrespondenceAmlEditBean.tablePicComplianceModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{tmpCorrespondenceAmlEditBean.selectedPicComplianceData}"
									rowKey="#{vo.sequence}" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />

									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									<p:column headerText="#{msg.formTmpCorrespondenceAmlNIK}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														id="picCompliance#{statIndex}" styleClass="form-control"
														value="#{vo.nikTemp}" disabled="true" /></td>
												<td style="width: 20%"><p:commandLink process="@this"
														onstart="picComplianceDialog.show();">
														<span><i class="fa fa-search ico-lg"></i></span>
														<f:setPropertyActionListener
															target="#{tmpCorrespondenceAmlEditBean.indexDtlPicCompliance}"
															value="#{statIndex}" />
													</p:commandLink></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceAmlName}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.nameTemp}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceAmlEmail}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.emailTemp}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>

					<h:panelGroup id="panelChangeFollowUp">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="tl-label"><p:outputLabel for="tmpCorrespondenceFollowup" style="margin-top:15px;"
										value="#{msg.formTmpCorrespondenceAmlFollowup}" /></label>
								<h:selectOneMenu id="tmpCorrespondenceFollowup" required="true" 
									requiredMessage="#{msg.formTmpCorrespondenceAmlFollowup} #{msg.validateRequired}"
									styleClass="form-control s2"
									value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{tmpCorrespondenceAmlEditBean.yesNoList}" />
									<p:ajax event="change" 
										update="form:panelReminder form:panelSubmissionConfirmation form:panelSupportingUnit" 
										listener="#{tmpCorrespondenceAmlEditBean.onChangeFollowupStatus}" />
								</h:selectOneMenu>
								<p:message for="tmpCorrespondenceFollowup"/>
							</div>
						</div>

						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label" ><h:outputText
										value="#{msg.formTmpCorrespondenceAmlNote}" /></label>
								<p:inputText styleClass="form-control" autocomplete="off" maxlength="5000"
									value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.notes}"></p:inputText>
							</div>
						</div>
					</h:panelGroup>
					

					<h:panelGroup id="panelSubmissionConfirmation">
					<div class="col-lg-12">
						<h3>
							<h:outputText
								value="#{msg.formTmpCorrespondenceAmlSubmissionConfirmation}" />
						</h3>
						<div class="form-group">
							<label for="divison" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlDivision}" /></label>
							<h:selectOneMenu styleClass="form-control s2 divId"
								disabled="#{('Y' or 'N') ne tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp
								or tmpCorrespondenceAmlEditBean.disabledFollowUpStatus}"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.divisionId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{tmpCorrespondenceAmlEditBean.divisionList}" />
								<p:ajax event="change" update="form:panelSubmissionConfirmation"
									listener="#{tmpCorrespondenceAmlEditBean.onChangeDivisionSingle}"
								 />
								
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic1" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlPic1}" /> 
								<p:commandLink
									rendered="#{('Y' or 'N') eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp
									and !tmpCorrespondenceAmlEditBean.disabledFollowUpStatus}"
									process="@this"
									onstart="$('.hdnParamPic1Option').val($('.divId').val());pic1Dialog.show();">
									<span class="input-group-btn fa fa-search btn btn-link"></span>
								</p:commandLink>
								
							</label>
							<p:inputText id="inputPic1" styleClass="form-control"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.userNameTemp1}"
								readonly="true" />

						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic2" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlPic2}" /> 
								<p:commandLink 
									rendered="#{('Y' or 'N') eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp
									and !tmpCorrespondenceAmlEditBean.disabledFollowUpStatus}"
									process="@this"
									onstart="$('.hdnParamPic2Option').val($('.divId').val());pic2Dialog.show();">
									<span class="input-group-btn fa fa-search btn btn-link"></span>
								</p:commandLink>
								<p:commandLink immediate="true"
									rendered="#{('Y' or 'N') eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp
									and !tmpCorrespondenceAmlEditBean.disabledFollowUpStatus}"
									actionListener="#{tmpCorrespondenceAmlEditBean.clearPic2}"
									update="form:inputPic2">
									<span class="input-group-btn fa fa-trash btn btn-link"></span>	
								</p:commandLink>
							</label>
							<p:inputText id="inputPic2" styleClass="form-control"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.userNameTemp2}"
								readonly="true" />

						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="pic3" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlPic3}" /> 
								<p:commandLink 
									rendered="#{('Y' or 'N') eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp
									and !tmpCorrespondenceAmlEditBean.disabledFollowUpStatus}"
									process="@this"
									onstart="$('.hdnParamPic3Option').val($('.divId').val());pic3Dialog.show();">
									<span class="input-group-btn fa fa-search btn btn-link"></span>
								</p:commandLink>
								<p:commandLink immediate="true"
									rendered="#{('Y' or 'N') eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp
									and !tmpCorrespondenceAmlEditBean.disabledFollowUpStatus}"
									actionListener="#{tmpCorrespondenceAmlEditBean.clearPic3}"
									update="form:inputPic3">
									<span class="input-group-btn fa fa-trash btn btn-link"></span>	
								</p:commandLink>
							</label>
							<p:inputText id="inputPic3" styleClass="form-control"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.userNameTemp3}"
								readonly="true" />
						</div>
					</div>
					<div class="col-lg-12">
						
						<div class="form-group #{('Y' or 'N') eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp? 'required':''}">
							<label for="targetDate" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlTargetDate}" /></label>
							<p:calendar id="targetDateCalendar" styleClass="form-control-datepicker-wrap"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.targetDate}"
								autocomplete="off" maxlength="11"
								required="#{'Y' eq tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp}" 
								requiredMessage="#{msg.formTmpCorrespondenceAmlTargetDate} #{msg.validateRequired}"
								disabled="#{'Y' ne tmpCorrespondenceAmlEditBean.tmpCorrespondence.followUp}"
								pattern="dd-MMM-yyyy" locale="en" ></p:calendar>
						</div>
						
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="emailDate" class="control-label tl-label"><h:outputText
									value="#{msg.formTmpCorrespondenceAmlEmailDate}" /></label> <label
								for="emailDate" class="control-label tl-label"><h:outputText /></label>
							<p:dataTable id="tableFollowupEmail" var="vo"
								value="#{tmpCorrespondenceAmlEditBean.tmpCorrespondence.tmpCorrespondencePicFollowupEmails}"
								styleClass="noHeader" style="width:100%;">
								<p:column styleClass="noHeader">
									<h:outputText value="#{vo.emailDate}">
										<f:convertDateTime
											pattern="#{tmpCorrespondenceAmlEditBean.inputDateFormat}"
											locale="#{tmpCorrespondenceAmlEditBean.inputDateLocale}">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
							</p:dataTable>
						</div>
					</div>
					</h:panelGroup>


					<h:panelGroup id="panelSupportingUnit">
					<h:outputText value="&#160;" />

					<h3>
						<h:outputText value="#{msg.formTmpCorrespondenceAmlSupportingUnit}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-supporting-unit">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink
												onclick="onAddNewSupportingUnit();">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink
												onclick="onDeleteRowSupportingUnit();">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tableSupportingUnitDetail" var="vo"
									value="#{tmpCorrespondenceAmlEditBean.tableSupportingUnitModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{tmpCorrespondenceAmlEditBean.selectedSupportingUnitData}"
									rowKey="#{vo.sequence}" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									
									<p:ajax event="toggleSelect" process="@this" /> 
									
									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" >
									
									</p:column>										
									
									<p:column headerText="#{msg.formTmpCorrespondenceAmlDivision}"
										style="width:200px;">
										<div class="form-group" style="margin-top:15px;">
											<h:selectOneMenu
												styleClass="form-control s2 divisionCc#{statIndex}" 
												style="margin-top:15px;height:38px;"
												value="#{vo.divisionId}">
												<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
												<f:selectItems
													value="#{tmpCorrespondenceAmlEditBean.divisionList}" />
												<p:ajax event="change" update="form:tableSupportingUnitDetail"
													listener="#{tmpCorrespondenceAmlEditBean.onChangeDivision(statIndex)}"
												 />
											</h:selectOneMenu>
										</div>
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceAmlEmailCc1}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														id="emailCc1#{statIndex}" styleClass="form-control"
														value="#{vo.emailCcTemp1}" disabled="true" /></td>
												<td style="width: 20%"><p:commandLink process="@this"
														onstart="$('.hdnParamEmailCc1Option').val($('.divisionCc#{statIndex}').val());emailCc1Dialog.show();">
														<span><i class="fa fa-search ico-lg"></i></span>
														<f:setPropertyActionListener
															target="#{tmpCorrespondenceAmlEditBean.indexDtlCc}"
															value="#{statIndex}" />
													</p:commandLink></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceAmlEmailCc2}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 70%"><h:inputText
														id="emailCc2#{statIndex}" styleClass="form-control"
														value="#{vo.emailCcTemp2}" disabled="true" /></td>
												<td style="width: 15%">
													<p:commandLink process="@this"
														onstart="$('.hdnParamEmailCc2Option').val($('.divisionCc#{statIndex}').val());emailCc2Dialog.show();">
														<span><i class="fa fa-search ico-lg"></i></span>
														<f:setPropertyActionListener
															target="#{tmpCorrespondenceAmlEditBean.indexDtlCc}"
															value="#{statIndex}" />
													</p:commandLink>
												</td>
												<td style="width: 15%">	
													<p:commandLink immediate="true"	style="float:left;margin-left:-10px;"												
														actionListener="#{tmpCorrespondenceAmlEditBean.clearPicDetail2(statIndex)}"
														update="form:panelSupportingUnit">
														<span class="input-group-btn fa fa-trash btn btn-link"></span>															
													</p:commandLink>													
												</td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpCorrespondenceAmlEmailCc3}"
