	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{

			    font-size: 13px;
			    color: #444444;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield, .ui-widget-header .ui-inputfield {
				box-shadow: none;
			}

	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcFineViewTitle}" />

								styleClass="form-control-datepicker-wrap" maxlength="11"
								value="#{trcFineViewDetailBean.trcFine.letterReceivedDate}"

					</div>
					<div class="col-lg-12">

						</div>
					</div>

							<label class="tl-label"><p:outputLabel for="tmpCorrespondecePerihalEn"
									value="#{msg.formTrcFinePerihal}" />&#160;&#160;<span

									<h:outputText value="#{msg.english}"/>

							<p:inputText id="tmpCorrespondecePerihalEn"

								requiredMessage="#{msg.formTrcFinePerihal} #{msg.english} #{msg.validateRequired}"
								styleClass="form-control" autocomplete="off" maxlength="5000"
								value="#{trcFineViewDetailBean.trcFine.perihalEn}"></p:inputText>
							<p:message for="tmpCorrespondecePerihalEn"/>
						</div>
					</div> -->

						<p:message for="formTrcFineLetterSummary"/>

					<div class="col-lg-12">

											<h:selectOneMenu

												<f:selectItems

											</h:selectOneMenu>
										</div>
									</p:column>
									<p:column headerText="#{msg.formTrcFinePIC}"

										<table>
											<tr>
												<td style="width: 80%"><h:inputText

											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.userId2.name}" 
														disabled="true"/></td>
											</tr>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.userId3.name}" 
														disabled="true"/></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTrcFineTargetDate}"

										<table>
											<tr>
												<td style="width: 80%">
													<p:calendar id="targetDate"
														styleClass="form-control-datepicker-wrap" maxlength="11"
														value="#{vo.targetDate}" autocomplete="off"
														pattern="dd-MMM-yyyy" locale="en" disabled="true"/>
												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
					
					&nbsp;
					<h3>
						<h:outputText
							value="#{msg.formTrcFineDocumentLetterTitle}" />
					</h3>
					<div class="col-lg-12">
						<div class="form-group">
							<p:remoteCommand name="onCompleteUpload" update="documentList"></p:remoteCommand>
							<label class="tl-label"><h:outputText
									value="#{msg.formTrcFineDocumentLetterSubTitle}" /></label>
							<p:dataList value="#{trcFineViewDetailBean.uploadedFilesDocument}" 
								emptyMessage=""
								var="vo" id="documentList" rowIndexVar="index">
								<table>
							    	<tr>
							    	<td style="width:80%">
							        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcFineViewDetailBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							        </td>
						        	</tr>
						        </table>
							</p:dataList>
						</div>
					</div>


					<h3>
						<h:outputText value="#{msg.formTrcFinePICCompliance}" />

					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<h4 class="sub-header">
								&nbsp;
								
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tablePicComplianceDetail" var="vo"
									value="#{trcFineViewDetailBean.tablePicComplianceModel}"
									rowIndexVar="statIndex" style="width:100%;">

										<table>
											<tr>
												<td style="width: 80%"><h:inputText

														value="#{vo.nikTemp}" disabled="true" /></td>
											</tr>
										</table>

									<p:column headerText="#{msg.formTrcFineName}"

									<p:column headerText="#{msg.formTrcFineEmail}"

						</div>

					<h:outputText value="&#160;" />

							<p:message for="trcFineReminderType"/>
