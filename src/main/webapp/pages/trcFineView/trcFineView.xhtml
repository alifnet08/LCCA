
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/template.xhtml">
	
	<ui:define name="head">
		<style>
			.ui-calendar input {
				display: block !important;
				width: 100% !important;
				padding: 10px 12px !important;
				background-color: #F7F8F8 !important;
				background-image: none !important;
				border-radius: 5px !important;
				box-shadow: none;
				transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s
					!important;
				border: 0 !important;
				height: inherit;
			}
			
			.ui-inputfield.ui-state-focus {
				box-shadow: none;
			}
			/* .ui-widget {
			    font-size: inherit;
			} */
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcFineViewTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="deletedMessage" globalOnly="true" />
		<div class="box box-solid">
			<div class="box-body">

					<h:panelGroup id="panelSearch">
					<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineSender}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{trcFineViewBean.searchPengirim}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{trcFineViewBean.selectSender}" />
								</h:selectOneMenu>
							</div>
						</div>
						<div class="col-lg-9">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineLetterReceiveDate}" /></label>
								<div class="input-group">
									<p:calendar id="tglTerimaSuratFrom" autocomplete="off" maxlength="11"
										placeholder="#{msg.from}" styleClass="form-control-datepicker-wrap"
										value="#{trcFineViewBean.searchTanggalTerimaSuratFrom}"
										pattern="dd-MMM-yyyy"
										locale="en" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tglTerimaSuratTo" autocomplete="off" maxlength="11"
										placeholder="#{msg.to}" styleClass="form-control-datepicker-wrap"
										value="#{trcFineViewBean.searchTanggalTerimaSuratTo}"
										pattern="dd-MMM-yyyy"
										locale="en" />
								</div>
							</div>
						</div>
						</div>
						
						<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineLetterNo}" /></label>
								<h:inputText styleClass="form-control"
									value="#{trcFineViewBean.searchNoSurat}" />
							</div>
						</div>
						<div class="col-lg-9">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineLetterDate}" /></label>
								<div class="input-group">
									<p:calendar id="tglSuratFrom" autocomplete="off" maxlength="11"
										placeholder="#{msg.from}" styleClass="form-control-datepicker-wrap"
										value="#{trcFineViewBean.searchTanggalSuratFrom}"
										pattern="dd-MMM-yyyy"
										locale="en" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="tglSuratTo" autocomplete="off" placeholder="#{msg.to}"
										styleClass="form-control-datepicker-wrap" maxlength="11"
										value="#{trcFineViewBean.searchTanggalSuratTo}"
										pattern="dd-MMM-yyyy"
										locale="en" />
								</div>
							</div>
						</div>
						</div>
						
						<div class="row">
						<div class="col-lg-3">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineAbout}" /></label>
								<h:inputText styleClass="form-control"
									value="#{trcFineViewBean.searchPerihal}" />
							</div>
						</div>
						<div class="col-lg-7">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineTargetDate}" /></label>
								<div class="input-group">
									<p:calendar id="targetDateFrom" autocomplete="off" maxlength="11"
										placeholder="#{msg.from}" styleClass="form-control-datepicker-wrap"
										value="#{trcFineViewBean.searchTargetDateFrom}"
										pattern="dd-MMM-yyyy"
										locale="en" />
									<span class="input-group-addon plain">-</span>
									<p:calendar id="targetDateTo" autocomplete="off" maxlength="11"
										placeholder="#{msg.to}" styleClass="form-control-datepicker-wrap"
										value="#{trcFineViewBean.searchTargetDateTo}"
										pattern="dd-MMM-yyyy"
										locale="en" />
								</div>
							</div>
						</div>
						<div class="col-lg-2">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTrcFineSearchStatus}" /></label>
								<h:selectOneMenu styleClass="form-control s2"
									value="#{trcFineViewBean.searchStatus}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{trcFineViewBean.statusList}" />
								</h:selectOneMenu>
							</div>
						</div>
						</div>
					</h:panelGroup>
					<div class="row">
					<div class="col-lg-12">
						<div class="col-lg-12">
							<div class="filter-tools">
								<ul class="no-margin no-padding">
									<li><p:commandButton value="#{msg.buttonSearch}"
											ajax="true" update="Fine"
											styleClass="btn btn-success tl-label"
											actionListener="#{trcFineViewBean.search}"></p:commandButton></li>
									<li><p:commandButton value="#{msg.buttonReset}"
											ajax="true"
											update="Fine panelSearch"
											styleClass="btn btn-default btn-flat tl-label"
											actionListener="#{trcFineViewBean.reset}"></p:commandButton></li>
								</ul>
							</div>
						</div>
						<div class="col-lg-6">
							<div class="filter-tools" style="text-align: right;">
								<ul class="no-margin no-padding" style="float: right;">
									<li></li>
								</ul>
							</div>
						</div>

					</div>

					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
						    <div class="div-wrapper">
						    </div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="Fine" paginator="true" var="vo"
								value="#{trcFineViewBean.tableFine}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{trcFineViewBean.paging}" rowIndexVar="statIndex"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column style="text-align:center;" exportable="false" width="120"
									headerText="#{msg.formAction}">

									<h:outputLabel value="#{msg.formWaitingForApproval}"
										rendered="#{vo.statusCode eq 'DATA_NEW'}" />								
									
									<h:outputLabel value="&#160;" />
									<p:commandLink id="viewId" value="#{msg.buttonView}"
										action="#{trcFineViewBean.getNavigateView()}"
										type="submit" ajax="false" styleClass="tl-label">
										<f:param name="id" value="#{vo.fineId}" />
										<f:param name="viewId" value="#{vo.fineId}" />
									</p:commandLink>

								</p:column>

								<p:column headerText="#{msg.formTrcFineLetterNo}" width="250">
									<h:outputLabel value="#{vo.letterNo}" title="#{vo.letterNo}"/>
								</p:column>
								
								<p:column width="140"
									headerText="#{msg.formTrcFineLetterDate}">
									<h:outputText value="#{vo.letterDate}">
										<f:convertDateTime
											pattern="dd-MMM-yyyy"
											locale="en">
										</f:convertDateTime>
									</h:outputText>
								</p:column>

								<p:column headerText="#{msg.formTrcFineSenderLetter}" width="200">
									<h:outputLabel value="#{vo.senderName}"  title="#{vo.senderName}"/>
								</p:column>

								<p:column width="140"
									headerText="#{msg.formTrcFineLetterReceivedDate}">
									<h:outputText value="#{vo.letterReceivedDate}">
										<f:convertDateTime
											pattern="dd-MMM-yyyy"
											locale="en">
										</f:convertDateTime>
									</h:outputText>
								</p:column>
								
								
								
								<!-- <p:column headerText="#{msg.formTrcFineAbout}">
									<h:outputLabel value="#{vo.perihalName}" />
								</p:column> -->
								
								<p:column headerText="#{msg.formTrcFineSearchStatus}"
									style="text-align:center;" width="100">
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_ACTIVE'}">
										<span class="label label-success"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_INACTIVE'}">
										<span class="label label-danger"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_NEW'}">
										<span class="label label-info"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
									<p:outputLabel rendered="#{vo.statusCode eq 'DATA_REVISE'}">
										<span class="label label-warning"> <h:outputText
												value="#{vo.statusName}" />
										</span>
									</p:outputLabel>
								</p:column>
								
								<p:column
									headerText="#{msg.formTrcFineFollowupStatusOfPIC}"
									style="text-align:center" width="100">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >#{dtl.followupStatus.name}
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTrcFinePICName}" width="150">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.userId1.name}" title="#{dtl.userId1.name}" />, <br />
										<h:outputText value="#{dtl.userId2.name}" title="#{dtl.userId2.name}"/>,  <br />
										<h:outputText value="#{dtl.userId3.name}" title="#{dtl.userId3.name}"/> 
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTrcFineConfirmationDate}" width="140">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.confirmationDate}">
										<f:convertDateTime
											pattern="dd-MMM-yyyy"
											locale="en">
										</f:convertDateTime>
									</h:outputText>
									</p:dataList>
									
								</p:column>

								<p:column headerText="#{msg.formTrcFineFollowupDate}" width="140">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.followupDate}">
										<f:convertDateTime
											pattern="dd-MMM-yyyy"
											locale="en">
										</f:convertDateTime>
									</h:outputText>
									</p:dataList>
								</p:column>

								<p:column headerText="#{msg.formTrcFineInformation}" width="150">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >#{dtl.followupNote}
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTrcFineFollowupFulfillmentDate}" width="140">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >
										<h:outputText value="#{dtl.complianceDate}">
										<f:convertDateTime
											pattern="dd-MMM-yyyy"
											locale="en">
										</f:convertDateTime>
										</h:outputText>
									</p:dataList>
								</p:column>

								<p:column
									headerText="#{msg.formTrcFineComplianceCheckStatus}" width="100"
									style="text-align:center;">
									<p:dataList value="#{vo.trcFine.trcFinePicFollowups}" 
										emptyMessage=""
										var="dtl" >#{dtl.complianceStatus.name}
									</p:dataList>
								</p:column>
								
								
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>

	</ui:define>
</ui:composition>
