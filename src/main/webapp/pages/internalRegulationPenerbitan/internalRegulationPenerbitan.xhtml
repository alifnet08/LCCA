<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-datatable .ui-datatable-data td {
				vertical-align: top
			}
		</style>
	</ui:define>
	<ui:define name="menuName">
	<!-- msg.formInternalRegulationTitle -->
		<h:outputText value="#{msg.formInternalRegulationPenerbitanTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink
					action="#{internalRegulationPenerbitanBean.getNavigateEdit()}" ajax="false"
					styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">
		<p:growl id="messages" />
		<div class="box box-solid">
			<div class="box-body">
				<p:growl id="deletedMessage" globalOnly="true" />
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationPenerbitanRegulationTitle}" /></label>
									<p:inputText styleClass="form-control" value="#{internalRegulationPenerbitanBean.judulRegulasi}" autocomplete="off"></p:inputText>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationPenerbitanRegulationType}" /></label>
									<h:selectOneMenu styleClass="form-control s2" value="#{internalRegulationPenerbitanBean.tipeRegulasiId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{internalRegulationPenerbitanBean.typeRegulasis}" />
									</h:selectOneMenu>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label><h:outputText
											value="#{msg.formInternalRegulationPenerbitanRegulationDateIn}" /></label>
									<div class="input-group">
										<p:calendar styleClass="form-control-datepicker-wrap" id="startDate"
												placeholder="#{msg.from}" maxlength="11"
												value="#{internalRegulationPenerbitanBean.startDate}" autocomplete="off"
												pattern="dd-MMM-yyyy" locale="en"  >
									    </p:calendar>	
									    <span class="input-group-addon plain">-</span> 
										<p:calendar styleClass="form-control-datepicker-wrap" id="endDate"
												placeholder="#{msg.to}" maxlength="11"
												value="#{internalRegulationPenerbitanBean.endDate}" autocomplete="off"
												pattern="dd-MMM-yyyy" locale="en"  >
										</p:calendar>			
									</div>
								</div>
							</div>
						</div>
						
						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="No. Referensi" /></label>
									<p:inputText styleClass="form-control" value="#{internalRegulationPenerbitanBean.noReferensi}" autocomplete="off"></p:inputText>
								</div>
							</div>
							
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationPenerbitanWorkUnitTpg}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationPenerbitanBean.unitKerjaTpgId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />			
										<f:selectItems value="#{internalRegulationPenerbitanBean.unitKerjas}" />						
									</h:selectOneMenu>
								</div>
							</div>	
													
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationPenerbitanRegulationStatus}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationPenerbitanBean.statusRegulasiId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />	
										<f:selectItems value="#{internalRegulationPenerbitanBean.statusRegulasis}" />								
									</h:selectOneMenu>
								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label">
										<h:outputText value="#{msg.formInternalRegulationPenerbitanProcessStatus}" />
									</label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationPenerbitanBean.processStatusId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />	
										<f:selectItems value="#{internalRegulationPenerbitanBean.processStatusList}" />								
									</h:selectOneMenu>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label">
										<h:outputText value="#{msg.formInternalRegulationPenerbitanPICIrg}" />
									</label>
									<h:selectOneMenu styleClass="form-control s2"
											value="#{internalRegulationPenerbitanBean.picIrgNik}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />	
										<f:selectItems value="#{internalRegulationPenerbitanBean.picsIrg}" />		
									</h:selectOneMenu>
								</div>
							</div>
						</div>
					</h:panelGroup>
					<div class="col-lg-12">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<p:commandButton value="#{msg.buttonSearch}"
										ajax="true" update="dataTable"
										styleClass="btn btn-success tl-label"
										actionListener="#{internalRegulationPenerbitanBean.search}" ></p:commandButton>
							    <span></span>
								<p:commandButton value="#{msg.buttonReset}"
										ajax="true" update="dataTable panelSearch"
										styleClass="btn btn-default btn-flat tl-label"
										actionListener="#{internalRegulationPenerbitanBean.reset}"></p:commandButton>								
							</ul>
						</div>
					</div>
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
						    <div class="div-wrapper">
						    </div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="dataTable" paginator="true" var="data"
								value="#{internalRegulationPenerbitanBean.tableModel}" dynamic="true"
								lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{internalRegulationPenerbitanBean.paging}" rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
														
								<p:column width="140" headerText="#{msg.formAction}"  >
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
										action="#{internalRegulationPenerbitanBean.getNavigateEdit()}"
										oncomplete="initSelect2()"
										ajax="false" styleClass="tl-label">
										<f:param name="editId" value="#{data.irgId}" />
									</p:commandLink>
									<h:outputLabel value="&#160;"/>
									<h:outputLabel value="|" />
									<h:outputLabel value="&#160;"/>
									<p:commandLink id="delete"
										value="#{msg.buttonDelete}" styleClass="tl-label"
										update="form:deletedMessage dataTable"
										action="#{internalRegulationPenerbitanBean.delete(data.irgId)}">
										<p:confirm header="Konfirmasi" 
											message="#{msg.formDeleteMessage}"
											icon="pi pi-exclamation-triangle" />
									</p:commandLink>
								</p:column>
								
								<p:column headerText="No. Referensi" width="150">
									<h:outputLabel value="#{data.referenceNo}" />
								</p:column>

								<p:column headerText="#{msg.formInternalRegulationPenerbitanRegulationTitle}"
									width="150">
									<h:outputLabel value="#{data.irgTitle}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationPenerbitanRegulationDateIn}"
									width="150">
									<h:outputLabel value="#{data.regulationInDateStr}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationPenerbitanRegulationType}"
									width="150">
									<h:outputLabel value="#{data.regulationTypeName}"/>
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationPenerbitanWorkUnitTpg}"
									width="150">
									<h:outputLabel value="#{data.workUnitTpgName}"/>
								</p:column>								
								<p:column headerText="#{msg.formInternalRegulationPenerbitanPICIrg}"
									width="150">
									<h:outputLabel value="#{data.userName1}" />
								</p:column>								
								<p:column headerText="#{msg.formInternalRegulationPenerbitanStatus}" width="100" style="text-align:center;">									
									<h:outputLabel value="#{data.regulationStatusName}"/>
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationPenerbitanProcessStatus}" width="100" style="text-align:center;">									
									<h:outputLabel value="#{data.processStatusNameTemp}"/>
								</p:column>
								<!-- <p:column headerText="#{msg.formInternalRegulationPenerbitanReminderDate}" width="300" style="text-align:center;">									
									<p:dataList value="#{vo.tanggalReminderStrList}" emptyMessage="" var="tanggalReminder"> 
										#{tanggalReminder}
									</p:dataList>
								</p:column> -->
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>		
		
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			widgetVar="deleteConfirm" hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				update="messages" styleClass="ui-confirmdialog-yes"
				icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
		
	</ui:define>
</ui:composition>
