<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			
			.ui-inputfield, .ui-widget-content .ui-inputfield {
				-webkit-box-shadow: none;
				box-shadow: none;
			}
			
			.form-control[disabled] {
				font-size: 13px;
				font-family: 'Montserrat';
				color: #444444;
			}
			
			.input-group {
				margin-top: 15px;
			}
			
			.ui-widget-content .ui-inputfield {
				font-family: 'Montserrat';
			}
			
			.div-css-margin-bottom {
				margin-bottom: -20px !important;
			}
	</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText
			value="Verification #{msg.formCompliancePlanSelfAssessmentTitle}" />
	</ui:define>

	<ui:define name="content">
		

	    <p:outputPanel id="approvalManager" rendered="#{cpsaVerificationEditBean.renderedShow == 'APPROVAL'}">
	          <ui:include src="cpsaVerificationApproval.xhtml" />
	    </p:outputPanel>
	    
	    <p:outputPanel id="showPic" rendered="#{cpsaVerificationEditBean.renderedShow == 'VIEW'}">
	       <ui:include src="cpsaVerificationView.xhtml" />
	    </p:outputPanel>
	    
	</ui:define>
</ui:composition>
