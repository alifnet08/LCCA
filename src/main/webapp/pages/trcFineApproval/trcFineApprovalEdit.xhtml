	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield, .ui-widget-header .ui-inputfield {
				box-shadow: none;
			}
		</style>
	</ui:define>
	<ui:define name="menuName">

	</ui:define>

					<div class="col-lg-12">

						</div>
					</div>
					<div class="col-lg-12">

							<label class="tl-label"><p:outputLabel for="trcFineLetterNo"

					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label">
								<p:outputLabel for="tmpCorrespondecePerihalIn"

							</label>

						</div>
					</div>

							<p:inputText id="tmpCorrespondecePerihalEn"

								requiredMessage="#{msg.formTmpFinePerihal} #{msg.english} #{msg.validateRequired}"
								styleClass="form-control" autocomplete="off" maxlength="5000"
								value="#{trcFineApprovalEditBean.trcFine.perihalEn}"></p:inputText>
							<p:message for="tmpCorrespondecePerihalEn"/>

					</div> -->

								value="#{trcFineApprovalEditBean.trcFine.letterSummary}"></p:inputText>

						<p:message for="formTmpFineLetterSummary"/>

						</h:panelGroup>
					
					<div class="col-lg-12">

							<label class="tl-label"><p:outputLabel

								<p:message for="trcFineOtherReportName" />
							</h:panelGroup>
						</div>
					</h:panelGroup>
					
					<div class="col-lg-12">

					<div class="col-lg-12">

												</td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpFineNominal}"

										<table>
											<tr>
												<td style="width: 80%"><h:inputText

												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									
									<p:column headerText="#{msg.formTmpFinePIC}"

											</tr>
											<tr>
												<td style="width: 80%"><h:inputText

												<td style="width: 20%"></td>
											</tr>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.userId3.name}" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>

							</div>

						<h:outputText
							value="#{msg.formTmpFineDocumentLetterTitle}" />

							<p:dataList value="#{trcFineApprovalEditBean.uploadedFilesDocument}" 
								emptyMessage=""

								<table>
							    	<tr>
							    	<td style="width:80%">
							        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcFineApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
							        </td>
							        
						        	</tr>
						        </table>
							</p:dataList>
						</div>
					</div>
					
	
					<h3>
						<h:outputText value="#{msg.formTmpFinePICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-pic-compliance">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tablePicComplianceDetail" var="vo"
									value="#{trcFineApprovalEditBean.tablePicComplianceModel}"
									rowIndexVar="statIndex" style="width:100%;"
									selection="#{trcFineApprovalEditBean.selectedPicComplianceData}"
									rowKey="#{vo.sequence}" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />

									<p:ajax event="toggleSelect" process="@this" />

									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									<p:column headerText="#{msg.formTmpFineNIK}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														id="picCompliance#{statIndex}" styleClass="form-control"
														value="#{vo.nikTemp}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpFineName}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.nameTemp}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
									<p:column headerText="#{msg.formTmpFineEmail}"
										style="width:200px;">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control" value="#{vo.emailTemp}" disabled="true" /></td>
												<td style="width: 20%"></td>
											</tr>
										</table>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>

					<h:panelGroup id="panelChangeFollowUp">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="tl-label"><p:outputLabel for="trcFineFollowup" style="margin-top:15px;"
										value="#{msg.formTmpFineFollowup}" /></label>
								<h:selectOneMenu id="trcFineFollowup" disabled="true"
									styleClass="form-control s2"
									value="#{trcFineApprovalEditBean.trcFine.followUp}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems value="#{trcFineApprovalEditBean.yesNoList}" />
								</h:selectOneMenu>
								<p:message for="trcFineFollowup"/>

						</div>

								<p:inputText styleClass="form-control" autocomplete="off" maxlength="5000" disabled="true"
									value="#{trcFineApprovalEditBean.trcFine.notes}"></p:inputText>
							</div>
						</div>
					</h:panelGroup>


					<h:outputText value="&#160;" />
					<h:outputText value="&#160;" />

								<f:selectItems
									value="#{trcFineApprovalEditBean.counterTypeList}" />
							</h:selectOneMenu>
							<p:message for="trcFineReminderType"/>
						</div>
					</div>

							</label>
							<p:remoteCommand name="onCompleteUploadPayment" 
								update="form:proofOfPaymentList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{trcFineApprovalEditBean.handleFileUploadProofOfPayment}"
								oncomplete="onCompleteUploadPayment()"
								sizeLimit="#{trcFineApprovalEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="messages" />
							<p:dataList
								value="#{trcFineApprovalEditBean.uploadedFilesProofOfPayment}"
								emptyMessage=""
								var="vo" id="proofOfPaymentList" rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink title="#{vo.fileSizeKB} KB" ajax="false"
												immediate="true"
												actionListener="#{trcFineApprovalEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td><p:commandLink immediate="true"
												actionListener="#{trcFineApprovalEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_PROOF_OF_PAYMENT')}"
												update="proofOfPaymentList">#{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>

				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{trcFineApprovalEditBean.save()}"></h:commandButton>

				<h:commandLink value="#{msg.buttonCancel}" immediate="true"
					actionListener="#{trcFineApprovalEditBean.cancel()}"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>

					
		 

	</ui:define>
</ui:composition>
