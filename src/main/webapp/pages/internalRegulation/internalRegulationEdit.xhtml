<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.form-control:not(select) {
	font-family: 'Montserrat';
}

.ui-widget {
	font-size: 13px;
}

.ui-inputfield, .ui-widget-content .ui-inputfield {
	box-shadow: none;
}
</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formInternalRegulationTitle}" />
	</ui:define>

	<ui:define name="content">
		<!-- <p:messages id="messages" /> -->
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formInternalRegulationAddTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label for="jenis_ketentuan" class="control-label tl-label"><p:outputLabel
									for="internalRegulationProv"
									value="#{msg.formInternalRegulationProvType}" /></label>
							<h:selectOneMenu id="internalRegulationProv" required="true"
								requiredMessage="#{msg.formInternalRegulationProvType} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{internalRegulationEditBean.regulation.jenisKetentuan.parameterDtlCode}"
								disabled="true">
								<f:selectItems value="#{internalRegulationEditBean.provTypes}" />
							</h:selectOneMenu>
							<p:message for="internalRegulationProv" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									value="#{msg.formInternalRegulationRegulationType}"
									for="internalRegulationDoc" /></label>
							<h:selectOneMenu id="internalRegulationDoc" required="true"
								requiredMessage="#{msg.formInternalRegulationDocType} #{msg.validateRequired}"
								styleClass="form-control s2"
								value="#{internalRegulationEditBean.docTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{internalRegulationEditBean.docTypes}" />
								<p:ajax event="change" update="panelExpiredDate"
									listener="#{internalRegulationEditBean.onChangeDocType()}" />
							</h:selectOneMenu>
							<p:message for="internalRegulationDoc" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formInternalRegulationRegulationCategory}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{internalRegulationEditBean.docCategoryId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{internalRegulationEditBean.docCategories}" />
							</h:selectOneMenu>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formExternalRegulationRegulationTopic}" /></label>
							<h:selectOneMenu styleClass="form-control s2"
								value="#{internalRegulationEditBean.docTopicId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{internalRegulationEditBean.docTopics}" />
							</h:selectOneMenu>
						</div>
					</div>
					
					<h:panelGroup id="panelProposePu" style="margin-top: 100px;">
					    <h4>
							<h:outputText value="#{msg.formInternalRegulationProposerUnit}" />
						</h4>
						<div class="col-lg-12">
							<div id="ir-unit-pengusul">
								<h4 class="sub-header">
									&nbsp;
									<div class="box-tools">
										<ul class="no-margin no-padding">
											<li><p:commandLink onclick="onAddNewPicPu()">
													<i class="fa fa-plus"></i>
												</p:commandLink></li>
											<li><p:commandLink onclick="onDeleteRowPicPu()">
													<i class="fa fa-trash"></i>
												</p:commandLink></li>
										</ul>
									</div>
								</h4>

								<div class="table-wrapper table-responsive">
									<p:dataTable id="dataTableProposerUnit" var="data"
										value="#{internalRegulationEditBean.tableModelProposerUnit}"
										selection="#{internalRegulationEditBean.selectedDataProposerUnit}"
										rowKey="#{data.sequence}" rowIndexVar="statIndex"
										rowSelectMode="checkbox">
										
										<p:ajax event="rowSelectCheckbox" update="@this" />
										<p:ajax event="rowUnselectCheckbox" update="@this" />
										<p:ajax event="toggleSelect" update="@this" />

										<p:column selectionMode="multiple" style="text-align:center; width:40px;" />
										<p:column headerText="#{msg.formInternalRegulationDirectorate}" >
											<div class="form-group required text-input-required" style="margin-top:12px;">
												<h:selectOneMenu styleClass="form-control s2 directoratePu#{statIndex}"
													style="margin-bottom:10px;" value="#{data.directorate}">
													<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
													<f:selectItems
														value="#{internalRegulationEditBean.directorateLists}" />
													<p:ajax event="change" update="form:dataTableProposerUnit"
														listener="#{internalRegulationEditBean.onChangeDirectoratePu(statIndex)}" />
												</h:selectOneMenu>
											</div>
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationProposerUnit}">
											<table>
												<tr>
													<td style="width: 80%">
													    <div class="form-group required text-input-required" style="margin-top:12px;">
														     <h:inputText styleClass="form-control"
																id="proposerUnit#{statIndex}" value="#{data.publisherUnit}"
																readonly="true" />
														</div>	
													</td>
													<td style="width: 10%"><p:commandLink
															onstart="$('.hdnParamProposerUnitOption').val($('.directoratePu#{statIndex}').val());proposerUnitDialog.show();"
															process="@this">
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationEditBean.indexDtlPuPic}"
																value="#{statIndex}" />
														</p:commandLink></td>
													<td style="width: 15%"><p:commandLink immediate="true"
															style="float:left;margin-left:-5px;"
															actionListener="#{internalRegulationEditBean.clearProposerUnitPuDetail(statIndex)}"
															update="dataTableProposerUnit">
															<span class="input-group-btn fa fa-trash btn btn-link"></span>
														</p:commandLink></td>
												</tr>
											</table>
											
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationPIC}">
											<table>
												<tr>
													<td style="width: 80%"><h:inputText
															styleClass="form-control text-input-required"
															id="picNameTemp#{statIndex}" value="#{data.picNameTemp}"
															readonly="true" /></td>
													<td style="width: 10%"><p:commandLink
															onstart="$('.hdnParamPicOption').val($('.divId'));picDialog.show();"
															process="@this">
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationEditBean.indexDtlPuPic}"
																value="#{statIndex}" />
														</p:commandLink></td>
													<td style="width: 15%"><p:commandLink immediate="true"
															style="float:left;margin-left:-5px;"
															actionListener="#{internalRegulationEditBean.clearPicPuDetail(statIndex)}"
															update="dataTableProposerUnit">
															<span class="input-group-btn fa fa-trash btn btn-link"></span>
														</p:commandLink></td>
												</tr>
											</table>
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationPUK}" >
											<table>
												<tr>
													<td style="width: 80%"><h:inputText
															id="pukNameTemp#{statIndex}" styleClass="form-control"
															value="#{data.pukNameTemp}" readonly="true" /></td>
													<td style="width: 10%"><p:commandLink
															onstart="$('.hdnParamPukOption').val($('.divId'));pukDialog.show();"
															process="@this">
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationEditBean.indexDtlPuPic}"
																value="#{statIndex}" />
														</p:commandLink></td>
													<td style="width: 15%"><p:commandLink immediate="true"
															style="float:left;margin-left:-5px;"
															actionListener="#{internalRegulationEditBean.clearPukPuDetail(statIndex)}"
															update="dataTableProposerUnit">
															<span class="input-group-btn fa fa-trash btn btn-link"></span>
														</p:commandLink></td>
												</tr>
											</table>
										</p:column>

									</p:dataTable>
								</div>
							</div>
						</div>
					</h:panelGroup>
					
					<div style="margin-top:150px;">
						<div class="col-lg-12">
							<div class="form-group required">
								<label class="tl-label"><p:outputLabel
										for="internalRegulationDocNo"
										value="#{msg.formInternalRegulationDocNo}" /></label>
								<p:inputText id="internalRegulationDocNo" required="true"
									requiredMessage="#{msg.formInternalRegulationDocNo} #{msg.validateRequired}"
									styleClass="form-control form-required"
									value="#{internalRegulationEditBean.regulation.documentNo}"
									maxlength="100" autocomplete="off"></p:inputText>
								<p:message for="internalRegulationDocNo" />
							</div>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									for="internalRegulationRegTitleIn"
									value="#{msg.formInternalRegulationRegTitle}" /></label>
							<p:inputText id="internalRegulationRegTitleIn" required="true"
								maxlength="300"
								requiredMessage="#{msg.formInternalRegulationRegTitle} #{msg.validateRequired}"
								styleClass="form-control form-required"
								value="#{internalRegulationEditBean.regulation.nameIn}"
								autocomplete="off"></p:inputText>
							<p:message for="internalRegulationRegTitleIn" />
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="descriptionRegulation" class="control-label tl-label"
								tl="descriptionRegulation"> <h:outputText
									value="#{msg.formInternalRegulationDecriptionRegulation}" />
							</label>
							<pe:ckEditor id="descriptionRegulation" widgetVar="editorContent"
								width="100%" required="true"
								requiredMessage="#{msg.formInternalRegulationDecriptionRegulation} #{msg.validateRequired}"
								value="#{internalRegulationEditBean.regulation.descriptionIn}"
								height="300" style="margin-bottom:10px" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label"><p:outputLabel
									for="publishedDate"
									value="#{msg.formInternalRegulationPublishedDate}" /></label>
							<!-- <input type="text" class="form-control date_picker" id="publishedDate"
                		 value="#{internalRegulationEditBean.regulation.publishedDateStr}"/> -->
							<p:calendar required="true"
								requiredMessage="#{msg.formInternalRegulationPublishedDate} #{msg.validateRequired}"
								styleClass="form-control-datepicker-wrap" id="publishedDate"
								maxlength="11"
								value="#{internalRegulationEditBean.regulation.publishedDate}"
								autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
								<p:ajax event="dateSelect" listener="#{internalRegulationEditBean.onChangeReviewDateType}" update="@this expiredDate" process="@this"/>
							</p:calendar>
							<p:message for="publishedDate" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><h:outputText
									value="#{msg.formInternalRegulationEffDate}" /></label>
							<!--  <input type="text" class="form-control date_picker" id="effectiveDate" 
		                        value="#{internalRegulationEditBean.regulation.effectiveDateStr}"/> -->
							<!-- <p:calendar styleClass="form-control-datepicker-wrap"
								id="effectiveDate" maxlength="11"
								value="internalRegulationEditBean.regulation.effectiveDate}"
								autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
							</p:calendar> -->
							
							<p:calendar styleClass="form-control-datepicker-wrap" id="effectiveDate" maxlength="11"
									value="#{internalRegulationEditBean.regulation.effectiveDate}" autocomplete="off"	
									pattern="dd-MMM-yyyy" locale="en">
									<p:ajax event="dateSelect" listener="#{internalRegulationEditBean.setExpiredDateValue}" process="@this" update="expiredDate" />
						     </p:calendar>	  
							
						</div>
					</div>
					
					<h:panelGroup id="panelExpiredDate">
						<p:outputPanel id="expiredDatePanel" rendered="#{internalRegulationEditBean.isShowPanelTipeTanggalUlasan}">
							<div class="col-lg-12">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="Tipe Tanggal Ulasan (Bulan)" /></label>
									<h:selectOneMenu id="expiredDateSementara"
										styleClass="form-control s2"
										value="#{internalRegulationEditBean.typeReviewDateParamCode}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{internalRegulationEditBean.typeReviewDateList}" />
										<p:ajax event="change" update="expiredDate publishedDate"
											listener="#{internalRegulationEditBean.onChangeReviewDateType}" />
									</h:selectOneMenu>
								</div>
							</div>
						</p:outputPanel>

						<div class="col-lg-12">
							<div class="form-group ">
								<label class="tl-label"><h:outputText
										value="#{msg.formInternalRegulationReviewDate}" /></label>
								<!-- <input type="text" class="form-control date_picker" id="expiredDate" 
	                		value="#{internalRegulationEditBean.regulation.expiredDateStr}"/> -->
								<p:calendar styleClass="form-control-datepicker-wrap"
									id="expiredDate" maxlength="11"
									value="#{internalRegulationEditBean.regulation.expiredDate}"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
								</p:calendar>
							</div>
						</div>
					</h:panelGroup>

					<div class="col-lg-12">
						<div class="form-group">
							<div class="form-group required">
								<label for="internalEmailReminder"
									class="control-label tl-label"> <p:outputLabel
										value="#{msg.formInternalRegulationEmailReminder}"
										for="internalEmailReminder" />
								</label>
								<h:selectOneMenu id="internalEmailReminder"
									styleClass="form-control s2"
									value="#{internalRegulationEditBean.counterTypeId}"
									required="true"
									requiredMessage="#{msg.formInternalRegulationEmailReminder} #{msg.validateRequired}">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems
										value="#{internalRegulationEditBean.emailReminderList}" />
								</h:selectOneMenu>
								<p:message for="internalEmailReminder" />
							</div>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"><p:outputLabel for="penerima"
									value="Penerima" /></label>
							<p:inputText id="penerima" maxlength="300"
								styleClass="form-control"
								value="#{internalRegulationEditBean.regulation.receiver}"
								autocomplete="off"></p:inputText>
						</div>
					</div>
					<h3>
						<h:outputText
							value="#{msg.formInternalRegulationAttachmentPeraturan}" />
					</h3>
					<div class="col-lg-12">
						<div class="form-group">
							<p:remoteCommand name="onCompleteUploadPeraturanId"
								update="peraturanIdList"></p:remoteCommand>
							<label class="tl-label"> <h:outputText
									value="#{msg.formInternalRegulationPeraturanUtuh}" /> <br /> <h:outputText
									style="color: #dd4b39"
									value="#{internalRegulationEditBean.textWarningUpload}" />
							</label>
							<p:fileUpload
								fileUploadListener="#{internalRegulationEditBean.handleFileUploadPeraturanId}"
								oncomplete="onCompleteUploadPeraturanId()"
								sizeLimit="#{internalRegulationEditBean.maxAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{internalRegulationEditBean.uploadedFilesPeraturanId}"
								emptyMessage="" var="vo" id="peraturanIdList"
								rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
												actionListener="#{internalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td>&nbsp;<p:commandLink immediate="true"
												actionListener="#{internalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_PERATURAN_ID')}"
												update="peraturanIdList"> #{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"> <h:outputText
									value="#{msg.formInternalRegulationFAQ}" /> <br /> <h:outputText
									style="color: #dd4b39"
									value="#{internalRegulationEditBean.textWarningUpload}" />
							</label>
							<p:remoteCommand name="onCompleteUploadFAQ"
								update="peraturanFAQList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{internalRegulationEditBean.handleFileUploadFAQ}"
								oncomplete="onCompleteUploadFAQ()"
								sizeLimit="#{internalRegulationEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{internalRegulationEditBean.uploadedFilesFAQ}"
								emptyMessage="" var="vo" id="peraturanFAQList"
								rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
												actionListener="#{internalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td>&nbsp;<p:commandLink immediate="true"
												actionListener="#{internalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_FAQ')}"
												update="peraturanFAQList"> #{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"> <h:outputText
									value="#{msg.formInternalRegulationLampiran}" /> <br /> <h:outputText
									style="color: #dd4b39"
									value="#{internalRegulationEditBean.textWarningUpload}" />
							</label>
							<p:remoteCommand name="onCompleteUploadLampiran"
								update="peraturanLampiranList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{internalRegulationEditBean.handleFileUploadLampiran}"
								oncomplete="onCompleteUploadLampiran()"
								sizeLimit="#{internalRegulationEditBean.maxAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{internalRegulationEditBean.uploadedFilesLampiran}"
								emptyMessage="" var="vo" id="peraturanLampiranList"
								rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
												actionListener="#{internalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td>&nbsp;<p:commandLink immediate="true"
												actionListener="#{internalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_LAMPIRAN')}"
												update="peraturanLampiranList"> #{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"> <h:outputText
									value="#{msg.formInternalRegulationSummaryForm}" /> <br /> <h:outputText
									style="color: #dd4b39"
									value="#{internalRegulationEditBean.textWarningUpload}" />
							</label>
							<p:remoteCommand name="onCompleteUploadFormRingkasan"
								update="peraturanFormRingkasanList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{internalRegulationEditBean.handleFileUploadFormRingkasan}"
								oncomplete="onCompleteUploadFormRingkasan()"
								sizeLimit="#{internalRegulationEditBean.maxAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{internalRegulationEditBean.uploadedFilesFormRingkasan}"
								emptyMessage="" var="vo" id="peraturanFormRingkasanList"
								rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
												actionListener="#{internalRegulationEditBean.downloadFile(vo.fileId,vo.fileName,null)}"
												target="_blank">#{vo.fileName}</p:commandLink></td>
										<td>&nbsp;<p:commandLink immediate="true"
												actionListener="#{internalRegulationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_FROM_RINGKASAN')}"
												update="peraturanFormRingkasanList"> #{msg.buttonDelete}</p:commandLink>
										</td>
									</tr>
								</table>
							</p:dataList>
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label"> <h:outputText
									value="#{msg.formInternalRegulationOther}" /> <br /> <h:outputText
									style="color: #dd4b39"
									value="#{internalRegulationEditBean.textWarningUpload}" />
							</label>
							<p:remoteCommand name="onCompleteUploadOther"
								update="peraturanOtherList"></p:remoteCommand>
							<p:fileUpload
								fileUploadListener="#{internalRegulationEditBean.handleFileUploadOther}"
								oncomplete="onCompleteUploadOther()"
								sizeLimit="#{internalRegulationEditBean.standardAttachmentSize}"
								mode="advanced" dragDropSupport="false" multiple="true"
								auto="true" update="msgs" />
							<p:dataList
								value="#{internalRegulationEditBean.uploadedFilesOther}"
								emptyMessage="" var="vo" id="peraturanOtherList"
								rowIndexVar="index">
								<table>
									<tr>
										<td style="width: 80%"><p:commandLink
												title="#{vo.fileSizeKB} KB" ajax="false" immediate="true"
