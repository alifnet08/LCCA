<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
.ui-datatable .ui-datatable-data td {
	vertical-align: top
}
</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formInternalRegulationObsoleteTitle}" />
	</ui:define>

	<ui:define name="buttonAdd">
		<ul class="action list-inline">
			<li><h:commandLink
					action="#{internalRegulationObsoleteBean.getNavigateEdit()}"
					ajax="false" styleClass="tl-label">
					<i class="fa fa-fw fa-plus" aria-hidden="true"></i>
					<h:outputText value="#{msg.buttonAdd}" />
				</h:commandLink></li>
		</ul>
	</ui:define>

	<ui:define name="content">
		<p:growl id="messages" />
		<div class="box box-solid">
			<div class="box-body">
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoleteObsoleteTitle}" /></label>
									<p:inputText styleClass="form-control"
										value="#{internalRegulationObsoleteBean.judulObsolete}"
										autocomplete="off"></p:inputText>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoleteRegulationType}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationObsoleteBean.tipeRegObsoleteCode}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{internalRegulationObsoleteBean.tipeRegulasiObsoletes}" />
									</h:selectOneMenu>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label>
										<h:outputText value="#{msg.formInternalRegulationObsoleteObsoleteDate}" />
									</label>
									<div class="input-group">
										<p:calendar styleClass="form-control-datepicker-wrap"
											id="startDateObsolete" placeholder="#{msg.from}"
											maxlength="11"
											value="#{internalRegulationObsoleteBean.startDate}"
											autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
										</p:calendar>
										<span class="input-group-addon plain">-</span>
										<p:calendar styleClass="form-control-datepicker-wrap"
											id="endDateObsolete" placeholder="#{msg.to}" maxlength="11"
											value="#{internalRegulationObsoleteBean.endDate}"
											autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
										</p:calendar>
									</div>
								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoleteObsoleteNumber}" /></label>
									<p:inputText styleClass="form-control"
										value="#{internalRegulationObsoleteBean.noObsolete}"
										autocomplete="off"></p:inputText>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoleteObsoleteInfo}" /></label>
									<p:inputText styleClass="form-control"
										value="#{internalRegulationObsoleteBean.infoObsolete}"
										autocomplete="off"></p:inputText>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoletePublisherDivision}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationObsoleteBean.unitKerjaPenerbitId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{internalRegulationObsoleteBean.unitKerjas}" />
									</h:selectOneMenu>
								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoleteOpenClose}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationObsoleteBean.openCloseRegObsoleteId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{internalRegulationObsoleteBean.openCloseRegulationObsoletes}" />
									</h:selectOneMenu>
								</div>
							</div>
							<div class="col-lg-4">
								<div class="form-group">
									<label class="tl-label"><h:outputText
											value="#{msg.formInternalRegulationObsoletePICIRG}" /></label>
									<h:selectOneMenu styleClass="form-control s2"
										value="#{internalRegulationObsoleteBean.picIrgUserId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems
											value="#{internalRegulationObsoleteBean.picIrgNames}" />
									</h:selectOneMenu>
								</div>
							</div>
						</div>
					</h:panelGroup>
					<div class="col-lg-6">
						<div class="filter-tools">
							<ul class="no-margin no-padding">
								<p:commandButton value="#{msg.buttonSearch}" ajax="true"
									update="InternalRegulation"
									styleClass="btn btn-success tl-label"
									actionListener="#{internalRegulationObsoleteBean.search}" />
								<span></span>
								<p:commandButton value="#{msg.buttonReset}" ajax="true"
									update="InternalRegulation panelSearch"
									styleClass="btn btn-default btn-flat tl-label"
									actionListener="#{internalRegulationObsoleteBean.reset}" />
							</ul>
						</div>
					</div>
					<div class="col-lg-6">
					   <div class="filter-tools" style="text-align: right;">
							<ul class="no-margin no-padding pull-right">
								<p:remoteCommand name="onclickDownload" update="@form"></p:remoteCommand>
								<li><h:commandLink styleClass="btn btn-warning tl-label" onclick="onclickDownload(); PF('statusDialog').hide();">
									<i class="fa fa-table"></i> &nbsp;
	        							<h:outputText
										value="#{msg.formComplianceReviewExportExcel}" />
										<p:dataExporter type="xlsx" target="dummyTable"
											fileName="IRG_Obsolete"
											pageOnly="true"
											postProcessor="#{internalRegulationObsoleteBean.postProcessXLS}"/>
									</h:commandLink></li>
							</ul>
						</div>
					</div>
					
					<div class="col-lg-12">&nbsp;</div>
					<div class="col-lg-12">
						<div class="top-scroller">
							<div class="div-wrapper"></div>
						</div>
						<div class="table-responsive linked-to-top-scroller">
							<p:dataTable id="InternalRegulation" paginator="true" var="vo"
								value="#{internalRegulationObsoleteBean.tableModel}"
								dynamic="true" lazy="true" emptyMessage="#{msg.textNodata}"
								rows="#{internalRegulationObsoleteBean.paging}"
								rowIndexVar="statIndex"
								styleClass="table table-striped table-hover"
								rowStyleClass="#{statIndex%2 == 1 ? 'odd' : null}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

								<p:column width="140" headerText="#{msg.formAction}" style="text-align:center;">				
									<p:commandLink id="edit" value="#{msg.buttonEdit}"
											action="#{internalRegulationObsoleteBean.getNavigateEdit}" 
											type="submit" ajax="false" styleClass="tl-label"> 
										<f:param name="editedId" value="#{vo.internalRegulasiObsoleteId}" />
									</p:commandLink>
									<h:outputLabel value="&#160;"/>
									<h:outputLabel value="|" />
									<h:outputLabel value="&#160;"/>
									<p:commandLink id="delete" value="#{msg.buttonDelete}"
											action="#{internalRegulationObsoleteBean.delete(vo.internalRegulasiObsoleteId)}"
											update="form:messages InternalRegulation">
										<p:confirm header="Konfirmasi" 
												message="#{msg.formDeleteMessage}"
												icon="pi pi-exclamation-triangle" />
									</p:commandLink>
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoleteObsoleteTitle}" 
										width="150">
									<h:outputLabel value="#{vo.judulRegulasi}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoleteRegulationType}" 
										width="150">
									<h:outputLabel value="#{vo.tipeRegulasiObsolete}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoleteObsoleteNumber}" 
										width="150">
									<h:outputLabel value="#{vo.nomorObsolete}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoleteObsoleteInfo}" 
										width="150">
									<h:outputLabel value="#{vo.infoObsolete}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoletePublisherDivision}" 
										width="150">
									<h:outputLabel value="#{vo.publishDivision}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoletePublisherDirectorate}" 
										width="150">
									<h:outputLabel value="#{vo.publishDirectorateName}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoleteObsoleteDate}" 
										width="150">
									<h:outputLabel value="#{vo.tanggalObsoleteStr}" />
								</p:column>
								<p:column headerText="#{msg.formInternalRegulationObsoleteOpenClose}" 
										width="150">
									<h:outputLabel value="#{vo.statusOpenCloseObsolete}" />
								</p:column>
							</p:dataTable>
							
							<!-- 
								This dataTable are used for dataExporter target, 
								I dont have time to learn how to use specific module
								on InternalRegulationPenerbitReport.xhtml
								
								Jovan
							-->
							<p:dataTable id="dummyTable" rendered="false"> </p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<p:confirmDialog id="deleteConfirm" global="true" showEffect="fade"
			widgetVar="deleteConfirm" hideEffect="fade">
			<p:commandButton value="#{msg.textYes}" type="button"
				update="messages" styleClass="ui-confirmdialog-yes"
				icon="pi pi-check" />
			<p:commandButton value="#{msg.textNo}" type="button"
				styleClass="ui-confirmdialog-no" icon="pi pi-times" />
		</p:confirmDialog>
		
	</ui:define>
</ui:composition>
