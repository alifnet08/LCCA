<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly] {
				font-family: 'Montserrat';
				font-size: 13px;
				color: #444444;
			}
			
			td.optionDisabled .ui-chkbox {
				display: none;
			}
			
			.form-control-datepicker-wrap input.hasDatepicker {
				font-family: 'Montserrat';
			}
			
			.ui-inputfield, .ui-widget-content .ui-inputfield {
				box-shadow: none;
			}
			
			.ui-autocomplete-input, ui-inputfield, ui-widget, ui-state-default, ui-corner-all {
				width:100%!important;
				height: 40px;
			    background-color: rgba(245, 131, 34, 0.25);
			}
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formInternalRegulationObsoleteTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-body">
				<div class="row">
					<h:panelGroup id="panelSearch">
						<div class="col-lg-12">
							<div class="form-group required">
								<label for="judul_obsolete" class="control-label tl-label">
									<p:outputLabel for="internalRegulasiObsoleteJudul"
										value="#{msg.formInternalRegulationObsoleteObsoleteTitle}" />
								</label>
								<p:autoComplete id="internalRegulasiObsoleteJudul" cache="true" cacheTimeout="30000" 
										style="width:100%" styleClass=""								
										required="true" disabled="#{!internalRegulationObsoleteEditBean.regulationObsolete.isEditable}"
							            requiredMessage="#{msg.formInternalRegulationObsoleteObsoleteTitle} #{msg.validateRequired}"			
										value="#{internalRegulationObsoleteEditBean.regulationObsolete.judulObsolete}"
                              			completeMethod="#{internalRegulationObsoleteEditBean.completeObsoleteTitle}" 
                              			scrollHeight="1500" >
                                </p:autoComplete>
								<p:message for="internalRegulasiObsoleteJudul" /> 
							</div>
						</div>

						<div class="col-lg-12">
							<div class="form-group required">
								<label for="tipe_regulasi_obsolete"
									class="control-label tl-label"> <p:outputLabel
										for="internalRegulasiObsoleteTypeRegObsolete"
										value="#{msg.formInternalRegulationObsoleteRegulationType}" />
								</label>
								<h:selectOneMenu id="internalRegulasiObsoleteTypeRegObsolete"
									value="#{internalRegulationObsoleteEditBean.typeRegObsoleteDtlId}"
									styleClass="form-control s2">
									<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
									<f:selectItems
										value="#{internalRegulationObsoleteEditBean.typeRegObsoletes}" />
								</h:selectOneMenu>
								<p:message for="internalRegulasiObsoleteTypeRegObsolete" />
							</div>
						</div>
						
						<div class="col-lg-12">
							<div class="form-group required">
								<label for="no_obsolete" class="control-label tl-label">
									<p:outputLabel value="#{msg.formInternalRegulationObsoleteObsoleteNumber}" />
								</label>
								<p:inputText id="internalRegulasiObsoleteNoObsolete" 
									value="#{internalRegulationObsoleteEditBean.regulationObsolete.nomorObsolete}"
									styleClass="form-control" autocomplete="off" 
									disabled="#{!internalRegulationObsoleteEditBean.regulationObsolete.isEditable}"/>
							</div>
						</div>

						<div class="col-lg-12">
							<div class="form-group required">
								<label for="obsolete_info" class="control-label tl-label">
									<p:outputLabel for="internalRegulasiObsoleteObsInfo"
										value="#{msg.formInternalRegulationObsoleteObsoleteInfo}" />
								</label>
								<p:inputText id="internalRegulasiObsoleteObsInfo" 
									value="#{internalRegulationObsoleteEditBean.regulationObsolete.infoObsolete}"
									styleClass="form-control" autocomplete="off" />
								<p:message for="internalRegulasiObsoleteObsInfo" />
							</div>
						</div>						

						<div class="col-lg-12">
							<div class="form-group required">
								<label for="unit_kerja_penerbit" class="control-label tl-label">
									<p:outputLabel value="#{msg.formInternalRegulationObsoletePublisherDivision}" />
								</label>								
							    <h:selectOneMenu id="internalRegulasiObsoleteUnitKerjaPenerbit"
							    	styleClass="form-control s2 divisionCc#{statIndex}"
									value="#{internalRegulationObsoleteEditBean.publisherDivisionId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{internalRegulationObsoleteEditBean.unitKerjas}" />
										<f:ajax event="change" update="form:internalRegulasiObsoleteUnitKerjaPenerbit 
												form:internalRegulasiObsoleteDirPenerbit" 
												listener="#{internalRegulationObsoleteEditBean.onChangeUnitKerjaPenerbit()}" />
								</h:selectOneMenu>
							</div>
						</div>

						<div class="col-lg-12">
							<div class="form-group">
								<label for="direktorat_penerbit" class="control-label tl-label">
									<p:outputLabel for="internalRegulasiObsoleteDirPenerbit"
										value="#{msg.formInternalRegulationObsoletePublisherDirectorate}" />
								</label>
								<p:inputText id="internalRegulasiObsoleteDirPenerbit" 
									value="#{internalRegulationObsoleteEditBean.regulationObsolete.publisherDirectorateName}"
									styleClass="form-control" autocomplete="off" disabled="true" />
							</div>
						</div>


						<div class="col-lg-12">
							<div class="form-group">
								<label for="tgl_obsolete" class="control-label tl-label">
									<p:outputLabel for="internalRegulasiTglObsolete"
										value="#{msg.formInternalRegulationObsoleteObsoleteDate}" />
								</label>
								<p:calendar id="internalRegulasiTglObsolete" 
									value="#{internalRegulationObsoleteEditBean.regulationObsolete.tanggalObsolete}"
									placeholder="#{msg.formInternalRegulationObsoleteObsoleteDate}"
									styleClass="form-control-datepicker-wrap" maxlength="11"
									autocomplete="off" pattern="dd-MMM-yyyy" locale="en">
								</p:calendar>
								<p:message for="internalRegulasiTglObsolete" />
							</div>
						</div>
						
						<div class="col-lg-12">
							<div class="form-group required">
								<label for="open_close_regulation" class="control-label tl-label">
									<p:outputLabel value="#{msg.formInternalRegulationObsoleteOpenClose}" />
								</label>								
							    <h:selectOneMenu id="internalRegulasiObsoleteOpenClose"
							    	styleClass="form-control s2"
									value="#{internalRegulationObsoleteEditBean.openCloseRegObsoleteId}">
										<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
										<f:selectItems value="#{internalRegulationObsoleteEditBean.openCloseRegulationObsoletes}" />
								</h:selectOneMenu>
							</div>
						</div>
						
					</h:panelGroup>
					<h:panelGroup id="panelPickonversi">
						<h3>
							<h:outputText value="#{msg.formInternalRegulationObsoleteConversionPICTitle}" />
						</h3>
						<div class="col-lg-12">
							<div id="mp-rekam-jejak">
								<h4 class="sub-header">
									&nbsp;
									<div class="box-tools">
										<ul class="no-margin no-padding">
											<li><p:commandLink onclick="onAddNewPickonversi()">
													<i class="fa fa-plus"></i>
												</p:commandLink></li>
											<li><p:commandLink onclick="onDeleteRowPickonversi()">
													<i class="fa fa-trash"></i>
												</p:commandLink></li>
										</ul>
									</div>
								</h4>
								<div class="table-wrapper table-responsive">
									<p:dataTable id="dataTablePickonversi" var="data"
										value="#{internalRegulationObsoleteEditBean.tableModelPickonversi}"
										selection="#{internalRegulationObsoleteEditBean.selectedDataPickonversi}"
										rowKey="#{data.sequence}" rowIndexVar="statIndex"
										rowSelectMode="checkbox">

										<p:ajax event="rowSelectCheckbox" process="@this" />
										<p:ajax event="rowUnselectCheckbox" process="@this" />
										<p:ajax event="toggleSelect" process="@this" />

										<p:column selectionMode="multiple"
											style="text-align:center; width:40px;" />
											
										<p:column headerText="#{msg.formInternalRegulationObsoleteConversionPICDivision}"
											width="200">

											<h:selectOneMenu
												styleClass="form-control s2 division#{statIndex}"
												disabled="#{!data.isEditable}"
												value="#{data.divisionId}">
												<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
												<f:selectItems
													value="#{internalRegulationObsoleteEditBean.unitKerjas}" />												
												<p:ajax event="change" update="form:panelPickonversi"
														actionListener="#{internalRegulationObsoleteEditBean.onChangeUnitKerja(statIndex)}" />
											</h:selectOneMenu>
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationObsoletePIC1}"
											width="250">
											<table>
												<tr>
													<td style="width: 80%">
														<h:inputText
															styleClass="form-control user1#{statIndex}"
															id="userName1#{statIndex}" value="#{data.user1.name}"
															readonly="true" />
													</td>
													<td style="width: 20%">
														<p:commandLink
															rendered="#{data.isEditable}"
															onstart="$('.hdnParamPic1Option').val($('.division#{statIndex}').val());pic1Dialog.show();"
															process="@this form:dataTablePickonversi" >
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationObsoleteEditBean.indexDtlPicKonversi}"
																value="#{statIndex}" />
														</p:commandLink>
													</td>
												</tr>
											</table>
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationObsoletePIC2}"
											width="250">
											<table>
												<tr>
													<td style="width: 70%"><h:inputText
															styleClass="form-control user2"
															id="userName2#{statIndex}" value="#{data.user2.name}" 
															readonly="true" />
													</td>
													<td style="width: 15%">
														<p:commandLink
															rendered="#{data.isEditable}"
															onstart="$('.hdnParamPic2Option').val($('.division#{statIndex}').val());pic2Dialog.show();"
															process="@this">
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationObsoleteEditBean.indexDtlPicKonversi}"
																value="#{statIndex}" /> 
														</p:commandLink>
													</td>
													<td style="width: 15%">
														<p:commandLink
															rendered="#{data.isEditable}" immediate="true"
															style="float:left;margin-left:-10px;"
															actionListener="#{internalRegulationObsoleteEditBean.clearPicDetail2(statIndex)}"
															update="dataTablePickonversi">
															<span class="input-group-btn fa fa-trash btn btn-link"></span>
														</p:commandLink>
													</td>
												</tr>
											</table>
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationObsoletePIC3}"
											width="250">
											<table>
												<tr>
													<td style="width: 70%">
														<h:inputText
															styleClass="form-control user3"
															id="userName3#{statIndex}" value="#{data.user3.name}"
															readonly="true" />
													</td>
													<td style="width: 15%">
														<p:commandLink
															rendered="#{data.isEditable}"
															onstart="$('.hdnParamPic3Option').val($('.division#{statIndex}').val());pic3Dialog.show();"
															process="@this form:dataTablePickonversi">
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationObsoleteEditBean.indexDtlPicKonversi}"
																value="#{statIndex}" />
														</p:commandLink>
													</td>
													<td style="width: 15%">
														<p:commandLink
															rendered="#{data.isEditable}" immediate="true"
															style="float:left;margin-left:-10px;"
															actionListener="#{internalRegulationObsoleteEditBean.clearPicDetail3(statIndex)}"
															update="dataTablePickonversi">
															<span class="input-group-btn fa fa-trash btn btn-link"></span>
														</p:commandLink>
													</td>
												</tr>
											</table>
										</p:column>
										<p:column
											headerText="#{msg.formInternalRegulationObsoleteConversionTargetDate}"
											width="150">
											<p:calendar maxlength="11" style="width:100px"
												value="#{data.targetDate}"
												styleClass="form-control-datepicker-wrap" autocomplete="off"
												pattern="dd MMM yyyy" locale="en" 
												disabled="#{!data.isEditable}">
												<f:attribute name="seq" value="#{data.sequence}" />
												<f:attribute name="rowIdx" value="#{statIndex}" />
											</p:calendar>
										</p:column>
										<p:column headerText="#{msg.formInternalRegulationObsoleteNote}"
											width="150">
											<p:inputTextarea styleClass="form-control" disabled="#{!data.isEditable}"
												value="#{data.notes}" maxlength="5000">
											</p:inputTextarea>
										</p:column>
									</p:dataTable>
								</div>
							</div>
						</div>
					</h:panelGroup>
					
					<h:panelGroup id="panelPicIrg">
						<h3>
							<h:outputText value="#{msg.formInternalRegulationPenerbitanPICIrg}" />
						</h3>
						<div class="col-lg-12">
							<div id="mp-rekam-jejak">
								<div class="table-wrapper table-responsive">
									<p:dataTable id="dataTablePicIrg" rowIndexVar="statIndex"
											value="#{internalRegulationObsoleteEditBean.regulationObsolete}"
											var="data" rowKey="#{data.sequence}">
										<p:column headerText="#{msg.formInternalRegulationObsoletePIC1}"
											width="250">
											<table>
												<tr>
													<td style="width: 80%"><h:inputText
															styleClass="form-control user1#{statIndex}"
															id="userName1#{statIndex}" value="#{data.picIrg1.name}"
															readonly="true" />
													</td>
												</tr>
											</table>
										</p:column>

										<p:column headerText="#{msg.formInternalRegulationObsoletePIC2}"
											width="250">
											<table>
												<tr>
													<td style="width: 70%"><h:inputText id="userName2#{statIndex}"
															styleClass="form-control user2 text-input-required"
															value="#{data.picIrg2.name}" readonly="true" />
													</td>
													<td style="width: 15%"><p:commandLink
															rendered="#{data.isEditable}"
															onstart="$('.hdnParamPic2OptionIrg').val($('.division#{statIndex}').val());pic2DialogIrg.show();"
															process="@this">
															<i class="fa fa-search ico-lg"></i>
															<f:setPropertyActionListener
																target="#{internalRegulationObsoleteEditBean.indexDtlFollowupIrg}"
																value="#{statIndex}" />
														</p:commandLink></td>
													<td style="width: 15%"><p:commandLink immediate="true"
															rendered="#{data.isEditable}"
															style="float:left;margin-left:-10px;"
															actionListener="#{internalRegulationObsoleteEditBean.clearPicIrgDetail2}"
															update="dataTablePicIrg">
															<span class="input-group-btn fa fa-trash btn btn-link"></span>
														</p:commandLink></td>
												</tr>
											</table>
										</p:column>
									</p:dataTable>
								</div>
							</div>
						</div>
					</h:panelGroup>
				</div>
			</div>
			<div class="box-footer">
				<p:commandButton value="#{msg.buttonSave}" type="submit"
					actionListener="#{internalRegulationObsoleteEditBean.save()}"
					styleClass="btn btn-primary pull-left tl-label" update="msgs"></p:commandButton>
				<p:commandButton value="#{msg.buttonCancel}" immediate="true"
					actionListener="#{internalRegulationObsoleteEditBean.cancel}"
					styleClass="btn btn-default pull-right tl-label"></p:commandButton>
				<p:remoteCommand
					action="#{internalRegulationObsoleteEditBean.onAddNewPickonversi}"
					process="@this" immediate="true" name="onAddNewPickonversi"
					update="dataTablePickonversi"></p:remoteCommand>
				<p:remoteCommand
					action="#{internalRegulationObsoleteEditBean.onDeleteRowPickonversi}"
					process="@this" immediate="true" name="onDeleteRowPickonversi"
					update="dataTablePickonversi"></p:remoteCommand>
				
			</div>
		</div>
		
		<!-- DUMMY SELECTOR BAIT SO LOV COULD WORK - MANDATORY - THE BACKCODE IS WEIRD IDK WHY -->
		<wo:selector id="Pic1OptionDummy" height="450" width="550"
			title="LOV #{msg.formInternalRegulationObsoletePIC1}" widgetVar="pic1DialogDummy"
			selectorInfo="#{internalRegulationObsoleteEditBean.selectorUser1}"
			bean="#{internalRegulationObsoleteEditBean}"
			updateOnSelected="form:dataTablePickonversi" />
		
		<wo:selector id="Pic1Option" height="450" width="550"
			title="LOV #{msg.formInternalRegulationObsoletePIC1}" widgetVar="pic1Dialog"
			selectorInfo="#{internalRegulationObsoleteEditBean.selectorUser1}"
			bean="#{internalRegulationObsoleteEditBean}"
			updateOnSelected="form:dataTablePickonversi" />

		<wo:selector id="Pic2Option" height="450" width="550"
			title="LOV #{msg.formInternalRegulationObsoletePIC2}" widgetVar="pic2Dialog"
			selectorInfo="#{internalRegulationObsoleteEditBean.selectorUser2}"
			bean="#{internalRegulationObsoleteEditBean}"
			updateOnSelected="form:dataTablePickonversi" />
			
		<wo:selector id="Pic3Option" height="450" width="550"
			title="LOV #{msg.formInternalRegulationObsoletePIC3}" widgetVar="pic3Dialog"
			selectorInfo="#{internalRegulationObsoleteEditBean.selectorUser3}"
			bean="#{internalRegulationObsoleteEditBean}"
			updateOnSelected="form:dataTablePickonversi" />
			
		<wo:selector id="Pic2OptionIrg" height="450" width="550"
			title="LOV #{msg.formInternalRegulationObsoletePIC2}" 
			widgetVar="pic2DialogIrg"
			selectorInfo="#{internalRegulationObsoleteEditBean.selectorIrg2}"
			bean="#{internalRegulationObsoleteEditBean}"
			updateOnSelected="form:dataTablePicIrg" />
			
	</ui:define>
</ui:composition>
