<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
			.ui-widget-content .ui-inputfield {
			    font-weight: normal;
			    height: 38px;
			    margin-left: 200px;
    			margin-top: -37px;
			}
			
			.ui-chips-container {
		     width:100%!important;
		     background-color: rgba(245, 131, 34, 0.25);
		     }
			
		</style>
	</ui:define>

	<ui:define name="menuName">
		<h:outputText value="#{msg.formAboutUsTitle}" />
	</ui:define>

	<ui:define name="content">
	<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-aboutUs">
					<h:outputText value="#{msg.formAboutUsTitle}" />
				</h3>
			</div>
			<div class="box-body">
			<p:growl id="messages" rendered="true" />
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="name"><p:outputLabel
									value="#{msg.formAboutUsName}" for="name" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="name" value="#{aboutUsEditBean.aboutUs.ourName}"  required="true" requiredMessage="#{msg.formAboutUsName} #{msg.validateRequired}"/>
							<p:message for="name"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="position"><p:outputLabel
									value="#{msg.formAboutUsPosition}" for="position" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="position" value="#{aboutUsEditBean.aboutUs.ourJob}"  required="true" requiredMessage="#{msg.formAboutUsPosition} #{msg.validateRequired}"/>
							<p:message for="position"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="control-label tl-label" tl="email"><p:outputLabel
									value="#{msg.formAboutUsEmail}" for="email" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="email" value="#{aboutUsEditBean.aboutUs.email}"  required="true" requiredMessage="#{msg.formAboutUsEmail} #{msg.validateRequired}"/>
							<p:message for="email"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group ">
							<label class="control-label tl-label" tl="ext"><p:outputLabel
									value="#{msg.formAboutUsExt}" for="ext" /></label>								
							<p:inputText style="width:100%" styleClass="form-control" id="ext" value="#{aboutUsEditBean.aboutUs.ext}"  />
							<p:message for="ext"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group ">
							<label for="puk" class="control-label tl-label"><h:outputText
									value="#{msg.formAboutUsPUK}" /> 
								<p:commandLink 
									process="@this"
									onstart="pukDialog.show();">
									<span class="input-group-btn fa fa-search btn btn-link"></span>
								</p:commandLink>
								<p:commandLink immediate="true"
									actionListener="#{aboutUsEditBean.clearPuk}"
									update="form:puk">
									<span class="input-group-btn fa fa-trash btn btn-link"></span>	
								</p:commandLink>
							</label>							
							<p:inputText style="width:100%" styleClass="form-control" id="puk" value="#{aboutUsEditBean.aboutUs.puk.ourName}"  />
						</div>
					</div>
					
					
					
					<div class="col-lg-12">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUpload" update="attachment"></p:remoteCommand>
							<label class="tl-label"><h:outputText
										value="#{msg.formAboutUsPhoto}"/>
								<br/>
								<h:outputText style="color: #dd4b39" value="#{msg.textUploadPhoto}"/>
							</label>
							<p:fileUpload fileUploadListener="#{aboutUsEditBean.handleFileUpload}" 
									oncomplete="onCompleteUpload()"
									value="aboutUsEditBean.uploadFiles"
									mode="advanced" auto="true" dragDropSupport="false" multiple="false"
									sizeLimit="#{aboutUsEditBean.standardAttachmentSize}"
									update="msgs" />
									<p:dataList value="#{aboutUsEditBean.uploadFiles}" 
									emptyMessage=""
									var="vo" id="attachment" rowIndexVar="index">
										<table>
									    	<tr>
									    	<td style="width:80%">
									        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{aboutUsEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
									        </td>
									        <td>
									        	<p:commandLink  immediate="true" actionListener="#{aboutUsEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_DOCUMENT')}" update="attachment">#{msg.buttonDelete}</p:commandLink>
									        </td>
								        	</tr>
								        </table>
									</p:dataList>
	
						</div>		
					</div>
					
					
				</div>
			</div>

			<div class="box-footer">
				<h:commandButton value="#{msg.buttonSave}" type="submit"
					styleClass="btn btn-primary pull-left"
					actionListener="#{aboutUsEditBean.save()}"></h:commandButton>
				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{aboutUsEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>

			</div>
		</div>
		
		<wo:selector id="pukDialog2" height="450" width="550"
			title="PUK" widgetVar="pukDialog2"
			selectorInfo="#{aboutUsEditBean.selectorPUK}"
			bean="#{aboutUsEditBean}"
			updateOnSelected="form:puk" />
			
		<wo:selector id="pukDialog" height="450" width="550"
			title="PUK" widgetVar="pukDialog"
			selectorInfo="#{aboutUsEditBean.selectorPUK}"
			bean="#{aboutUsEditBean}"
			updateOnSelected="form:puk" />
			
	</ui:define>
</ui:composition>
