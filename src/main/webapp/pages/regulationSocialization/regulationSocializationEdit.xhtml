
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="head">
		<style>
			.form-control[readonly]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			 td.optionDisabled .ui-chkbox{
				display: none;
			}
			.form-control-datepicker-wrap input.hasDatepicker {
			    font-family: 'Montserrat';
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
			    box-shadow: none;
			}
		</style>
	</ui:define>
	
	<ui:define name="menuName">
		<h:outputText value="#{msg.formRegulationSocializationTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label">
					<h:outputText value="#{msg.formRegulationSocializationTitle}" />
				</h3>
			</div>
			<div class="box-body">
				<div class="row">
					<div class="col-lg-12">
						<div class="form-group required">
							<label for="jenis_ketentuan" class="control-label tl-label"><p:outputLabel
									for="regulationSocializationProv"
									value="#{msg.formRegulationSocializationProvType}" /></label>
							<h:selectOneMenu id="regulationSocializationProv" required="true"
								requiredMessage="#{msg.formRegulationSocializationProvType} #{msg.validateRequired}"
								styleClass="form-control s2 regulationSocializationProv"
								value="#{regulationSocializationEditBean.socializationTmp.jenisKetentuan.parameterDtlCode}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{regulationSocializationEditBean.provTypes}" />
								<p:ajax event="change" update="form:dataTable"
									listener="#{regulationSocializationEditBean.onChangeJenisKetentuan}" />
							</h:selectOneMenu>
							<p:message for="regulationSocializationProv" />
						</div>
					</div>

					<h3>
						<h:outputText value="#{msg.formRegulationSocializationRegTitle}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNew()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRow()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTable" var="data"
									value="#{regulationSocializationEditBean.tableModel}"
									selection="#{regulationSocializationEditBean.selectedData}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />
									
									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />
									
									<p:column headerText="#{msg.formRegulationSocializationDocNo}"
										width="200">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentNo}" readonly="true" />
									</p:column>
									
									<p:column
										headerText="#{msg.formRegulationSocializationLinkJudul}"
										width="300">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														id="regulationSocializationLink" required="true"
														requiredMessage="#{msg.formRegulationSocializationLinkJudul} #{msg.validateRequired}"
														styleClass="form-control temp-no-peraturan form-required"
														value="#{data.regulation.name}" readonly="true" /> <p:message
														for="regulationSocializationLink" /></td>
												<td style="width: 20%"><p:commandLink
														onclick="$('.hdnParamJudulPeraturanOption').val($('.regulationSocializationProv').val());jdlPeraturanDialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regulationSocializationEditBean.indexDtl}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>

									</p:column>
									
									<p:column headerText="#{msg.formRegulationSocializationNote}"
										style="width:300px;">										
										<p:dataList value="#{data.regulation.regulationTrackRecords}"
											emptyMessage=""
											var="dtl2" >#{dtl2.trackNote}</p:dataList>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationRegulationType}"
										width="250">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentType.documentType}"
											readonly="true" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationPublishedDate}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.publishedDate!=null?regulationSocializationEditBean.sdf.format(data.regulation.publishedDate):''}"
											readonly="true" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationEffectiveDate}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.effectiveDate!=null?regulationSocializationEditBean.sdf.format(data.regulation.effectiveDate):''}"
											readonly="true" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationExpiredDate}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.expiredDate!=null?regulationSocializationEditBean.sdf.format(data.regulation.expiredDate):''}"
											readonly="true" />
									</p:column>
									
									<p:column
										headerText="#{msg.formRegulationSocializationRegulationCategory}"
										width="250">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentCategory.documentCategory}"
											readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formRegulationSocializationRegulationTopic}"
										width="250">
										<h:inputText styleClass="form-control"
											value="#{data.regulation.documentTopic.documentTopic}"
											readonly="true" />
									</p:column>
									
								</p:dataTable>
							</div>
						</div>
					</div>
					
					&nbsp;
					<h3>
						<h:outputText
							value="#{msg.formRegulationSocializationPICCompliance}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNewCompliance()">
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRowCompliance()">
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableCompliance" var="data"
									value="#{regulationSocializationEditBean.tableModelCompliance}"
									selection="#{regulationSocializationEditBean.selectedDataCompliance}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox" >
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />
									
									<p:column selectionMode="multiple"
										style="text-align:center; width:40px;" />

									<p:column headerText="#{msg.formRegulationSocializationNIK}"
										width="150">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control temp-no-peraturan"
														value="#{data.user.nik}" readonly="true" /></td>
												<td style="width: 20%"><p:commandLink
														onclick="picComplianceDialog.show()" process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regulationSocializationEditBean.indexDtlCompliance}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>

									</p:column>

									<p:column headerText="#{msg.formRegulationSocializationName}"
										width="200">
										<h:inputText styleClass="form-control"
											value="#{data.user.name}" readonly="true" />
									</p:column>

									<p:column headerText="#{msg.formRegulationSocializationEmail}"
										width="150">
										<h:inputText styleClass="form-control"
											value="#{data.user.email}" readonly="true" />
									</p:column>


								</p:dataTable>
							</div>
						</div>
					</div>

					<div class="col-lg-12">
						<div class="form-group required">
							<label for="followUp" class="control-label tl-label" tl=""><p:outputLabel
									for="regulationSocializationFollow"
									value="#{msg.formRegulationSocializationFollowup}" /></label>
							<h:selectOneMenu id="regulationSocializationFollow"
								required="true"
								requiredMessage="#{msg.formRegulationSocializationFollowup} #{msg.validateRequired}"
								styleClass="form-control s2"
								disabled="#{regulationSocializationEditBean.disabledFollowUpStatus}"
								value="#{regulationSocializationEditBean.socializationTmp.followUp}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{regulationSocializationEditBean.followUps}" />
								<p:ajax event="change" 
									update="form:panelReminder form:panelPICAndWorkUnit form:panelReminder" 
									listener="#{regulationSocializationEditBean.onChangeFollowupStatus}" />
							</h:selectOneMenu>
							<p:message for="regulationSocializationFollow" />
						</div>
					</div>
					<div class="col-lg-12">
						<div class="form-group">
							<label for="jenis_ketentuan" class="control-label tl-label" tl=""><h:outputText
									value="#{msg.formRegulationSocializationNote}" /></label>
							<p:inputTextarea styleClass="form-control"
								value="#{regulationSocializationEditBean.socializationTmp.notes}"
								maxlength="5000"></p:inputTextarea>
						</div>
					</div>

					
					<h:panelGroup id="panelPICAndWorkUnit">
					<h3>
						<h:outputText
							value="#{msg.formRegulationSocializationPICAndWorkUnit}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">
								&nbsp;
								<div class="box-tools">
									<ul class="no-margin no-padding">
										<li><p:commandLink onclick="onAddNewFollowup()" 
												>
												<i class="fa fa-plus"></i>
											</p:commandLink></li>
										<li><p:commandLink onclick="onDeleteRowFollowup()"
												>
												<i class="fa fa-trash"></i>
											</p:commandLink></li>
									</ul>
								</div>
							</h4>
							<div class="table-wrapper table-responsive">
								<p:dataTable id="dataTableFollowup" var="data"
									value="#{regulationSocializationEditBean.tableModelFollowup}"
									selection="#{regulationSocializationEditBean.selectedDataFollowup}"
									rowKey="#{data.sequence}" rowIndexVar="statIndex" rowSelectMode="checkbox">
									
									<p:ajax event="rowSelectCheckbox" process="@this" />
									<p:ajax event="rowUnselectCheckbox" process="@this" />
									<p:ajax event="toggleSelect" process="@this" />								
									
									<p:column selectionMode="multiple" 
										styleClass="#{!data.isEditableTemp ? 'optionDisabled':''}"										
										style="text-align:center; width:40px;" />
									
									<p:column
										headerText="#{msg.formRegulationSocializationNote}"
										width="150">
										<p:inputTextarea styleClass="form-control"
											value="#{data.notes}"
											maxlength="5000">
											<p:ajax event="change" />
										</p:inputTextarea>
									</p:column>
									
									<p:column
										headerText="#{msg.formRegulationSocializationDivision}"
										width="200">
										
										<h:selectOneMenu styleClass="form-control s2 divisionCc#{statIndex}"
											disabled="#{!data.isEditableTemp}"
											value="#{data.divisionId}">
											<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
											<f:selectItems
												value="#{regulationSocializationEditBean.divisions}" />
											<p:ajax event="change" update="form:panelPICAndWorkUnit"
												listener="#{regulationSocializationEditBean.onChangeDivision(statIndex)}"
												 />
										</h:selectOneMenu>


									</p:column>
									
									
									<p:column headerText="#{msg.formRegulationSocializationPIC1}"
										width="250">
										<table>
											<tr>
												<td style="width: 80%"><h:inputText
														styleClass="form-control user1#{statIndex}"
														id="userName1#{statIndex}" value="#{data.user1.name}"
														readonly="true" /></td>
												<td style="width: 20%"><p:commandLink 
														rendered="#{data.isEditableTemp}"
														onstart="$('.hdnParamEmailCc1Option').val($('.divisionCc#{statIndex}').val());pic1Dialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regulationSocializationEditBean.indexDtlFollowup}"
															value="#{statIndex}" />

													</p:commandLink></td>
											</tr>
										</table>
									</p:column>

									<p:column headerText="#{msg.formRegulationSocializationPIC2}"
										width="250">
										<table>
											<tr>
												<td style="width: 70%">
													<h:inputText
														styleClass="form-control user2" value="#{data.user2.name}"
														readonly="true" /></td>
												<td style="width: 15%">
													<p:commandLink
														rendered="#{data.isEditableTemp}"
														onstart="$('.hdnParamEmailCc2Option').val($('.divisionCc#{statIndex}').val());pic2Dialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regulationSocializationEditBean.indexDtlFollowup}"
															value="#{statIndex}" />
													</p:commandLink>
												</td>
												<td style="width: 15%">	
													<p:commandLink 
														rendered="#{data.isEditableTemp}"
														immediate="true"
														style="float:left;margin-left:-10px;"												
														actionListener="#{regulationSocializationEditBean.clearPicDetail2(statIndex)}"
														update="dataTableFollowup">
														<span class="input-group-btn fa fa-trash btn btn-link"></span>															
													</p:commandLink>													
												</td>
											</tr>
										</table>
									</p:column>

									<p:column headerText="#{msg.formRegulationSocializationPIC3}"
										width="250">
										<table>
											<tr>
												<td style="width: 70%"><h:inputText
														styleClass="form-control user3" value="#{data.user3.name}"
														readonly="true" /></td>
												<td style="width: 15%">
													<p:commandLink
														rendered="#{data.isEditableTemp}"
														onstart="$('.hdnParamEmailCc3Option').val($('.divisionCc#{statIndex}').val());pic3Dialog.show();"
														process="@this">
														<i class="fa fa-search ico-lg"></i>
														<f:setPropertyActionListener
															target="#{regulationSocializationEditBean.indexDtlFollowup}"
															value="#{statIndex}" />
													</p:commandLink>
												</td>
												<td style="width: 15%">	
													<p:commandLink 
														rendered="#{data.isEditableTemp}"
														immediate="true"
														style="float:left;margin-left:-10px;"												
														actionListener="#{regulationSocializationEditBean.clearPicDetail3(statIndex)}"
														update="dataTableFollowup">
														<span class="input-group-btn fa fa-trash btn btn-link"></span>															
													</p:commandLink>													
												</td>
											</tr>
										</table>
									</p:column>
									<p:column
										headerText="#{msg.formRegulationSocializationTargetDate}"
										width="150">
										<p:calendar maxlength="11" style="width:100px" value="#{data.targetDate}" 
											styleClass="form-control-datepicker-wrap"
											autocomplete="off"
											disabled="#{'Y' ne regulationSocializationEditBean.socializationTmp.followUp}"
											pattern="dd MMM yyyy" locale="en" >
											<f:attribute name="seq" value="#{data.sequence}" />
											<f:attribute name="rowIdx" value="#{statIndex}" />
											<p:ajax event="dateSelect" 
												listener="#{regulationSocializationEditBean.onTargetDateChange}" 
												/>
										</p:calendar>
									</p:column>
									<p:column rendered="#{regulationSocializationEditBean.socializationTmp.lastUpdateBy ne null
										and regulationSocializationEditBean.socializationTmp.lastUpdateBy ne ''}"
										headerText="#{msg.formRegulationSocializationRescheduleReason}"
										width="150">
										<p:inputTextarea
											id="rescheduleReason" 
											styleClass="form-control"
											value="#{data.rescheduleReason}"
											maxlength="500"></p:inputTextarea>
									</p:column>
									<p:column
										headerText="#{msg.formRegulationSocializationEmailDate}"
										width="150">
										<p:dataList value="#{data.socializationPICFollowupEmailTmps}"
											emptyMessage=""
											var="dtl">#{dtl.emailDate!=null?regulationSocializationEditBean.sdf.format(dtl.emailDate):''}</p:dataList>
									</p:column>
									
								</p:dataTable>
							</div>
						</div>
					</div>
					</h:panelGroup>

					<div class="col-lg-12" style="margin-top:15px;">
						<div class="form-group">
							
							<p:remoteCommand name="onCompleteUpload" update="attachment"></p:remoteCommand>
							<label class="tl-label">
								<h:outputText value="#{msg.formRegulationSocializationAttachment}"/>
								<br/>
								<h:outputText style="color: #dd4b39" value="#{regulationSocializationEditBean.textWarningUpload}"/>
							</label>
							<p:fileUpload fileUploadListener="#{regulationSocializationEditBean.handleFileUpload}"
									oncomplete="onCompleteUpload()"
									value="regulationSocializationEditBean.uploadFiles"
									mode="advanced" auto="true" dragDropSupport="false" multiple="true"
									sizeLimit="#{regulationSocializationEditBean.standardAttachmentSize}"
									update="msgs" />
									<p:dataList value="#{regulationSocializationEditBean.uploadFiles}" 
									emptyMessage=""
									var="vo" id="attachment" rowIndexVar="index">
										<table>
									    	<tr>
									    	<td style="width:80%">
									        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{regulationSocializationEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
									        </td>
									        <td>
									        	<p:commandLink  immediate="true" actionListener="#{regulationSocializationEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_DOCUMENT')}" update="attachment">#{msg.buttonDelete}</p:commandLink>
									        </td>
								        	</tr>
								        </table>
									</p:dataList>
	
						</div>		
					</div>
					
					
					<h:panelGroup id="panelReminder">
					<div class="col-lg-12" style="margin-top:15px;">
						<div class="form-group #{'Y' eq regulationSocializationEditBean.socializationTmp.followUp? 'required':''}">
							<label class="control-label tl-label" tl=""><p:outputLabel
									for="#{'Y' eq regulationSocializationEditBean.socializationTmp.followUp? 'regulationsocializationReminder':''}"
									value="#{msg.formRegulationSocializationReminderType}" /></label>
							<h:selectOneMenu id="regulationsocializationReminder"
								disabled="#{'Y' ne regulationSocializationEditBean.socializationTmp.followUp}"
								required="#{'Y' eq regulationSocializationEditBean.socializationTmp.followUp}" 
								styleClass="form-control s2"
								value="#{regulationSocializationEditBean.counterTypeId}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems
									value="#{regulationSocializationEditBean.counterTypes}" />
							</h:selectOneMenu>
							<p:message for="regulationsocializationReminder" />
						</div>
					</div>
					</h:panelGroup>

					<h3>
						<h:outputText
							value="#{msg.formRegulationSocializationStatusConfirmation}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-rekam-jejak">
							<h4 class="sub-header">&nbsp;</h4>
							<div class="top-scroller">
							    <div class="div-wrapper">
							    </div>
							</div>
							<div class="table-wrapper table-responsive linked-to-top-scroller">
								<p:dataTable id="dataTableStatus" var="vo"
									value="#{regulationSocializationEditBean.tableStatus}"
									rowIndexVar="statIndex">

									<p:column
										headerText="#{msg.formRegulationSocializationConfirmationEvidence}"
										width="150">
										<p:dataList
											value="#{vo.socializationPICFollowupAttachmentTrcs}"
											emptyMessage=""
											var="dtl">
											<p:commandLink title="#{dtl.fileSizeKB} KB" ajax="false"
												actionListener="#{regulationSocializationEditBean.downloadFile(dtl.fileId,dtl.attachmentFile,null)}"
												target="_blank">#{dtl.attachmentFile}</p:commandLink>
										</p:dataList>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationFollowupStatus}"
										width="150">
										<h:outputLabel value="#{vo.followupStatus}" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationConfirmation}"
										width="150">
										<h:outputLabel value="#{vo.followupBy}" />
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationConfirmationDate}"
										width="150">
										<h:outputLabel value="#{vo.confirmationDate}">
											<f:convertDateTime
												pattern="#{regulationSocializationEditBean.inputDateFormat}"
												locale="#{regulationSocializationEditBean.inputDateLocale}">
											</f:convertDateTime>
										</h:outputLabel>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationFollowupDate}"
										width="150">
										<h:outputLabel value="#{vo.followupDate}">
											<f:convertDateTime
												pattern="#{regulationSocializationEditBean.inputDateFormat}"
												locale="#{regulationSocializationEditBean.inputDateLocale}">
											</f:convertDateTime>
										</h:outputLabel>
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationInformation}"
										width="150">
										<h:outputLabel value="#{vo.followupNote}" /> 
									</p:column>

									<p:column
										headerText="#{msg.formRegulationSocializationFullfilmentOfFollowupDate}"
