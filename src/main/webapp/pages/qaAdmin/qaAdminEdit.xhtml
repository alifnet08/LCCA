<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<ui:define name="menuName">
		<h:outputText value="#{msg.formQAAdminTitle}" />
	</ui:define>
	
	<ui:define name="head">
	<style>
		.ui-chips-container {
	     width:100%!important;
	     background-color: rgba(245, 131, 34, 0.25);
	     }
     </style>
	</ui:define>
	
	<ui:define name="content">
		<!-- required to enable selectbooleanchekcbox -->
		<p:remoteCommand autoRun="true" oncomplete="initSelect2()"
			update="form:dataListPublishAttachment publishQA" immediate="true"/>
	
		<p:growl id="msgs" rendered="true" />
		<div class="box box-solid">
			<div class="box-header with-border">
				<h3 class="box-title tl-label" tl="new-master-QAAdmin">
					<h:outputText value="#{msg.formQATitle}" />
				</h3>
			</div>
			
			<div class="box-body">
				<p:growl id="messages" rendered="true" />
				<div class="row">
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="ticketNo">
								<p:outputLabel value="#{msg.formQATicketNo}" for="ticketNo" />
							</label>
							<p:inputText autocomplete="off" style="width:100%"
								styleClass="form-control" id="ticketNo"
								value="#{qaAdminEditBean.qa.ticketNo}"
								required="true" disabled="true"
								requiredMessage="#{msg.formQATicketNo} #{msg.validateRequired}" />
							<p:message for="ticketNo"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="sender">
								<p:outputLabel value="#{msg.formQASender}" for="sender" />
							</label>
							<p:inputText autocomplete="off" style="width:100%"
								styleClass="form-control" id="sender"
								value="#{qaAdminEditBean.qa.qUser.name}"
								required="true" disabled="true"
								requiredMessage="#{msg.formQASender} #{msg.validateRequired}" />
							<p:message for="sender"/>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group required">
							<label class="tl-label" tl="category">
								<p:outputLabel value="#{msg.formQACategory}" />
							</label>
							<h:selectOneMenu id="category" styleClass="form-control s2"
								value="#{qaAdminEditBean.category}">
								<f:selectItem itemLabel="#{msg.choose}" itemValue="" />
								<f:selectItems value="#{qaAdminEditBean.categoryTypes}" />
							</h:selectOneMenu>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="title">
								<p:outputLabel value="#{msg.formQAAdminSearchTitle}" />
							</label>
							<p:inputText autocomplete="off" style="width:100%"
								styleClass="form-control" id="title" disabled="true"
								value="#{qaAdminEditBean.qa.qTitle}"/>
						</div>
					</div>
					
					<div class ="col-lg-12">
						<div class="form-group">
							<label>
								<p:outputLabel value="#{msg.formQAAdminPublishAttachment}" />
							</label>
							
							<p:dataList id="dataListPublishAttachment" value="#{qaAdminEditBean.qa.qaAttachmentList}" 
									emptyMessage="No Attachment" var="data" varStatus="status" rowIndexVar="index">
								<table class="ui-panelgrid" >
									<tr>
										<td>
											<p:commandLink title="#{data.getFileSizeKB()} KB"
													style="color:#F3750B;" ajax="false" 
													immediate="true" target="_blank"
													actionListener="#{qaAdminEditBean.downloadFile(data.fileId,data.attachmentFile,null)}">
												#{data.attachmentFile}	
											</p:commandLink>
											<p:selectBooleanCheckbox id="publishAttachment" value="#{data.boolPublishTemp}">
												<p:ajax event="change" update="form:dataListPublishAttachment"
														listener="#{qaAdminEditBean.onChangePubAttachCheckbox(index)}" />
											</p:selectBooleanCheckbox>
										</td>
									</tr>
								</table>	
							</p:dataList>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label>
								<p:outputLabel value="#{msg.formQAAdminPublishQA}" style="margin-right:10px;"/>
							</label>
							<p:selectBooleanCheckbox id="publishQA" value="#{qaAdminEditBean.qa.isPublishTemp}">
								<p:ajax partialSubmit="true" listener="#{qaAdminEditBean.onChangePubQACheckbox()}"/>
							</p:selectBooleanCheckbox>
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="question">
								<p:outputLabel value="#{msg.formQAQuestion}" />
							</label>
							<p:textEditor id="question" styleClass="form-control" disabled="true"
								value="#{qaAdminEditBean.qa.question}" height="150"/>
						</div>
					</div>
						
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="keyword">
								<p:outputLabel value="#{msg.formQAKeyword}"/>
							</label>
							<p:inputText autocomplete="off" style="width:100%"
								styleClass="form-control" id="keyword"
								value="#{qaAdminEditBean.keyword}" />
						</div>
					</div>
					
					<div class="col-lg-12">
						<div class="form-group">
							<label class="tl-label" tl="answer">
								<p:outputLabel value="#{msg.formQAAnswer}" for="answer" />
							</label>
							<p:textEditor id="answer" styleClass="form-control"
								maxlength="4000"
								requiredMessage="#{msg.formQAAnswer} #{validateRequired}"
								value="#{qaAdminEditBean.qa.answer}" height="150" />
							<p:message for="answer"/>
						</div>
					</div>
					
					<p:outputPanel rendered="#{qaAdminEditBean.qa.answer2Filled}">
						<div class="col-lg-12">
							<div class="form-group">
								<p:textEditor id="answer2" styleClass="form-control"
									maxlength="4000"
									requiredMessage="#{msg.formQAAnswer} #{validateRequired}"
									value="#{qaAdminEditBean.qa.answer2}" height="150" />
								<p:message for="answer2"/>
							</div>
						</div>
					</p:outputPanel>
					<p:outputPanel rendered="#{qaAdminEditBean.qa.answer3Filled}">
						<div class="col-lg-12">
							<div class="form-group" >
								<p:textEditor id="answer3" styleClass="form-control"
									maxlength="4000"
									requiredMessage="#{msg.formQAAnswer} #{validateRequired}"
									value="#{qaAdminEditBean.qa.answer3}" height="150" />
								<p:message for="answer3"/>
							</div>
						</div>
					</p:outputPanel>
				</div>
				
				<div class="box-footer">
					<h:commandButton value="#{msg.buttonSave}" type="submit"
						styleClass="btn btn-primary pull-left"
						actionListener="#{qaAdminEditBean.save()}">
					</h:commandButton>
					<h:commandLink value="#{msg.buttonCancel}"
						actionListener="#{qaAdminEditBean.cancel()}" immediate="true"
						styleClass="btn btn-default pull-right tl-label">
					</h:commandLink>
				</div>
				
			</div>
		</div>
	</ui:define>
</ui:composition>
