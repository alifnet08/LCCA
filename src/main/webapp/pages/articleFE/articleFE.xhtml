<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="../templates/templateFrontEnd.xhtml">


	<ui:define name="content">

		<div class="row brdcrumb">
			<nav class="navbar navbar-expand-sm bg-light navbar-light w-100">
			<div class=" navbar-collapse " id="collapsibleNavbar">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link" href="/compliance/pages/dashboard/dashboardFrontEnd.faces">BERANDA</a>
						<a class="nav-link"><i
							class="fa fa-sm fa-bold fa-chevron-right"
							style="margin-top: -5px; color: #FFC600;"></i></a> <a
						class="nav-link disabled" href="#">ARTIKEL</a></li>
				</ul>
			</div>
			</nav>
		</div>

		<div class="container-fluid faq-content">
			<div class="sidebar-title font-weight-bold">Artikel</div>
			<div style="font-size: 14px; color: #7D7D7D;"></div>
			<h:form styleClass="wo-search-form">
				<p:remoteCommand name="onSearch" process="@this dataList searchVal searchStatus"
					update="dataList searchVal searchStatus" action="#{articleFEBean.search()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onClickPage" process="@this dataList searchVal searchStatus"
					update="dataList searchVal searchStatus" action="#{articleFEBean.searchDataPrevNext()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onPrev" process="@this dataList searchVal searchStatus"
					update="dataList searchVal searchStatus" action="#{articleFEBean.prev()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<p:remoteCommand name="onNext" process="@this dataList searchVal searchStatus"
					update="dataList searchVal searchStatus" action="#{articleFEBean.next()}"
					onstart="PF('statusDialog').show()"
					onsuccess="PF('statusDialog').hide();"></p:remoteCommand>
				<h:inputHidden  id="pageSelected" value="#{articleFEBean.first}"></h:inputHidden>
				<h:inputHidden id="totalPage" value="#{articleFEBean.totalPage}"></h:inputHidden>

				<div class="row">
					<div class="col-12 col-lg-6 form-group">
						<p:selectOneMenu id="searchStatus" widgetVar="selectType" styleClass="form-control select-status"
						onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"
							value="#{articleFEBean.articleType}">
							<f:selectItem itemLabel="Pilih" itemValue="" />
							<f:selectItems value="#{articleFEBean.articleTypeList}" />
						</p:selectOneMenu>
					</div>
					<div class="col-12 col-lg-6 search-bar form-group">
						<!-- <input id="searchVal" class="form-control cari-input" type="search"
							placeholder="CARI ARTIKEL . . ." aria-label="Search" /> -->
						<p:inputText widgetVar="searchVal" id="searchVal" styleClass="form-control cari-input"  value="#{articleFEBean.searchVal}"
							placeholder="CARI ARTIKEL . . ." aria-label="Search"
							onchange="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></p:inputText>
						<div class="input-group-append">
							<i
								class=" fa fa-lg fa-search input-group-text d-flex align-items-center"
								onclick="onSearch([{name: 'PAGE_SELECTED', value:'0'}])"></i>
						</div>
					</div>
				</div>

			</h:form>
			
			<h:panelGroup id="dataList">
				<h:form>
					<div class="table-responsive">
						<table class="table table-hover wo-table" id="tableInternal">
							<tbody>
								<ui:repeat value="#{articleFEBean.listData}" var="vo">
									<tr class="#{vo.isAccess == 0? 'unread':''}">
										<td class="col-9"><p:link 
												outcome="#{articleFEBean.getNavigateView()}" type="submit"
												ajax="false" styleClass="text-mb-g5">
												<f:param name="first" value="#{articleFEBean.firstTemp}" /> 
												<f:param name="token" value="#{articleFEBean.toEncrypt(vo.articleId)}" />
												<span class="td-header text-mb-secondary">#{vo.articleTitleIn}</span><br />
												<span class="td-detail text-mb-g4">#{vo.author}. </span> <span
												class="td-detail text-mb-g4">Tanggal Terbit :
													#{vo.publishDateStr}</span>
										</p:link></td>

										<td class="col-1"><p:link id="view"
												outcome="#{articleFEBean.getNavigateView()}" type="submit"
												ajax="false" styleClass="text-mb-g5">
												<f:param name="first" value="#{articleFEBean.firstTemp}" />
												<f:param name="token" value="#{articleFEBean.toEncrypt(vo.articleId)}" />
												<i class="fas fa-external-link-alt"></i>
										</p:link></td>
									</tr>
								</ui:repeat>
								<tr style="#{(articleFEBean.rowCount eq 0)? '' : 'display:none'}" class="first-row">
									<td>#{msg.textNodata}</td>
								</tr>
							</tbody>
						</table>
					</div>
					<script>
					/*$( document ).ready(function() {
						var data = $('.totalPageTxt').text();
						$('li').removeClass('active'); $( '.row-'+data ).addClass( 'active' );
						});*/
					</script>
				</h:form>
				<nav aria-label="Page navigation" style="#{(articleFEBean.rowCount gt 0)? '' : 'display:none'}">
				<ul class="pagination justify-content-center">
					<li class="page-item"><a class="page-link" href="#"
						aria-label="Previous"> <i class="fa fa-chevron-left"
							onclick="onPrev()"></i>
							<span class="sr-only">Previous</span>
					</a></li>
					<ui:repeat value="#{articleFEBean.totalPageList}" var="row">
						<li class="page-item row-#{row-1}"><a class="page-link"
							onclick="onClickPage([{name: 'PAGE_SELECTED', value:'#{row-1}'}]);">#{row}</a></li>
					</ui:repeat>

					<li class="page-item"><a class="page-link" href="#"
						aria-label="Next"> <i class="fa fa-chevron-right"
							onclick="onNext()"></i>
							<span class="sr-only">Next</span>
					</a></li>
				</ul>
				</nav>
			</h:panelGroup>
		</div>

	</ui:define>
</ui:composition>
