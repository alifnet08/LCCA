<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:wo="http://java.sun.com/jsf/composite/wo"
	template="../templates/template.xhtml">

	<f:event listener="#{trcFineEditBean.redirectCurrentPage}" type="preRenderView" />
	<ui:define name="head">
		<style>
			.ui-panelgrid tr, .ui-panelgrid td {
				border: 0 !important;
			}
			.form-control[disabled]{
			    font-family: 'Montserrat';
			    font-size: 13px;
			    color: #444444;
			}
			.ui-inputfield, .ui-widget-content .ui-inputfield{
				box-shadow: none;
			}
		</style>
	</ui:define>
	<ui:define name="menuName">
		<h:outputText value="#{msg.formTrcFineTitle}" />
	</ui:define>

	<ui:define name="content">
		<p:messages id="messagesView" showDetail="summary" 
			/>
		
		<p:growl id="messages" />
		
		<div class="box box-solid">
			<div class="box-body">
				<div class="row">
					
					<h3>
						<h:outputText
							value="#{msg.formTmpFineFollowupStatus}" />
					</h3>
					
					<h:panelGroup >
					
						<div class="col-lg-12">
							<div class="form-group">
								<p:remoteCommand name="onCompleteUpload" update="evidenceList"></p:remoteCommand>
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdPicConfirmationEvidence}"/>
									<br/>
									<h:outputText style="color: #dd4b39" value="#{trcFineEditBean.textWarningUpload}"/>
								</label>
								<p:fileUpload fileUploadListener="#{trcFineEditBean.handleFileUploadEvidence}"
									oncomplete="onCompleteUpload()"
									value="trcFineEditBean.uploadedFilesEvidence"
									mode="advanced" auto="true" dragDropSupport="false" multiple="true"
									sizeLimit="#{trcFineEditBean.standardAttachmentSize}"
									update="messages" rendered="#{trcFineEditBean.viewOnly eq 'N'}"/>
								<p:dataList value="#{trcFineEditBean.uploadedFilesEvidence}" 
									emptyMessage=""
									var="vo" id="evidenceList" rowIndexVar="index">
									<table>
								    	<tr>
								    	<td style="width:80%">
								        	<p:commandLink title="#{vo.fileSizeKB} KB" ajax="false" immediate="true" actionListener="#{trcFineEditBean.downloadFile(vo.fileId,vo.fileName,null)}" target="_blank">#{vo.fileName}</p:commandLink>
								        </td>
								        <td>
								        	<p:commandLink  immediate="true" actionListener="#{trcFineEditBean.deleteAttachment(vo.fileId,index,'UPLOAD_TYPE_EVIDENCE')}" update="evidenceList" rendered="#{trcFineEditBean.viewOnly eq 'N'}">#{msg.buttonDelete}</p:commandLink>
								        </td>
							        	</tr>
							        </table>
								</p:dataList>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group required">
								<label id="followupDate" class="control-label tl-label" ><p:outputLabel
										value="#{msg.formTmpRmdFollowupDate}" /></label>
								<p:calendar styleClass="form-control-datepicker-wrap"
									value="#{trcFineEditBean.trcFine.followupDate}"
									autocomplete="off" maxlength="11" disabled="#{trcFineEditBean.viewOnly eq 'Y'}"
									pattern="#{trcFineEditBean.inputDateFormat}"
									locale="#{trcFineEditBean.inputDateLocale}"></p:calendar>
							</div>
						</div>
						<div class="col-lg-12">
							<div class="form-group">
								<label class="tl-label"><h:outputText
										value="#{msg.formTmpRmdInformation}" /></label>
								<p:inputText styleClass="form-control" autocomplete="off" maxlength="1000"
									disabled="#{trcFineEditBean.viewOnly eq 'Y'}"
									value="#{trcFineEditBean.trcFine.followupNote}"></p:inputText>
							</div>
						</div>
					</h:panelGroup>
					
					
					<h:outputText value="&#160;" />
					<h3>
						<h:outputText
							value="#{msg.formTmpFineConfirmationStatus}" />
					</h3>
					<div class="col-lg-12">
						<div id="mp-confirmation-status">
							<div class="table-wrapper table-responsive">
								<p:dataTable id="tableConfirmation" var="vo"
									value="#{trcFineEditBean.trcFineList}"
									rowIndexVar="statIndex" style="width:100%;">
									<p:column
										headerText="#{msg.formTmpFineComplianceCheckerStatus}"
										style="width:150px;text-align:center;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceStatus.name}" title="#{vo.complianceStatus.name}"/>												
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpFineComplianceCheckerNote}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceNote}" title="#{vo.complianceNote}"/>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpFineComplianceCheckerDate}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceDate}" >
													<f:convertDateTime
														pattern="#{trcFineEditBean.inputDateFormat}"
														locale="#{trcFineEditBean.inputDateLocale}">
													</f:convertDateTime>
												</h:outputText>
											</div>
										</div>
									</p:column>
									<p:column
										headerText="#{msg.formTmpFineComplianceCheckerBy}"
										style="width:150px;">
										<div class="form-group">
											<div class="input-group">
												<h:outputText value="#{vo.complianceBy.name}" title="#{vo.complianceBy.name}"/>
											</div>
										</div>
									</p:column>
								</p:dataTable>
							</div>
						</div>
					</div>
					
					

				</div>
			</div>

			<div class="box-footer">
				
				<p:remoteCommand
					action="#{trcFineEditBean.onAddNewPicAttendance}" immediate="true"
					name="onAddNewPicAttendance" ></p:remoteCommand>
				<p:remoteCommand
					action="#{trcFineEditBean.onDeleteRowPicAttendance}" immediate="true"
					name="onDeleteRowPicAttendance" ></p:remoteCommand>
			
				<p:commandButton value="#{msg.buttonSave}" update="messages"
					styleClass="btn btn-primary pull-left" rendered="#{trcFineEditBean.viewOnly eq 'N'}"
					actionListener="#{trcFineEditBean.save()}"></p:commandButton>

				<h:commandLink value="#{msg.buttonCancel}"
					actionListener="#{trcFineEditBean.cancel()}" immediate="true"
					styleClass="btn btn-default pull-right tl-label"></h:commandLink>
			</div>
		</div>

	<wo:selector id="PicAttendanceOptionNew" height="450" width="550"
			title="LOV #{msg.formTmpFinePICAttendance}"
			widgetVar="picAttendanceNewDialog"
			selectorInfo="#{trcFineEditBean.selectorPicAttendance}"
			bean="#{trcFineEditBean}"
			updateOnSelected="" />
	<wo:selector id="PicAttendanceOption" height="450" width="550"
			title="LOV #{msg.formTmpFinePICAttendance}"
			widgetVar="picAttendanceDialog"
			selectorInfo="#{trcFineEditBean.selectorPicAttendance}"
			bean="#{trcFineEditBean}"
			updateOnSelected="" />

	</ui:define>
</ui:composition>
